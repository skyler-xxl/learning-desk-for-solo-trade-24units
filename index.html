    "personal/course/lessons/L13-核对图纸版本并交接技术问题.md": "# L13 核对图纸版本并交接技术问题\n\n模块：M4 技术与报价｜建议：35 分钟｜前置：L12｜交付物：O13 技术评估交接单\n\n学习目标：收到版本不一致的图纸时，能说清“现在按哪份评估、是谁确认的、还有哪几个问题要交给技术人员”。\n\n本课做到这里就够了：练会核对和交接资料，不要求自己判断所有尺寸、公差和加工可行性。\n\n原图依据：客户提供二维/三维资料、检查图纸、技术要求来源与专业反馈。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 6.3、6.5 节。材料：[S3—S4](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n准备把资料发给工厂前，先确认接手人能知道评估哪一份。列出文件标识、二维/三维类型、来源和版本；没有提供的信息就写未提供。遇到冲突，先向客户确认，不能只选看起来更新的那个文件。\n\n确认后的版本要连同确认依据一起记下。比如“客户在 S4 说明以 B 版二维、三维为准”。这样以后看到旧文件，还能分清它只是历史资料，还是当前评估依据。\n\n交接时再写清希望技术回答什么：哪里还缺要求、哪些地方需要澄清、下一步能评估到什么程度。检查时间可以先由自己安排；技术人员何时答复，要另外确认。\n\n## 2. 案例拆解\n\nS3 的 2D-A 与 3D-B 有冲突。到 S4，客户说明以 B 版二维与三维为准，版本问题有了新依据，但不代表技术条件全部解决。关键位置与表面处理仍有待澄清内容。\n\n交接应保留这次变化：“客户已确认 B 版；原 A 版不再作为当前评估基准；请按 B 版列出关键问题与评估条件。”仅写“按最新图做”缺少可核对的指向。\n\n## 3. 照着做一次\n\n先看 S3，再看 S4，完成 **O13 技术评估交接单**：\n\n1. 列出 S3 的版本冲突，随后记录 S4 对当前 B 版的确认。保留旧 A 版的历史状态，不把它继续列为当前基准。\n2. 写出已知要求与三个给技术人员的问题。问题要指向待评估内容；案例没有实际图纸，不补造尺寸或声称已检查附件。\n3. 写明交给哪个角色，希望他返回什么说明，自己准备何时检查进度。技术回复时间未约定就明确写未约定。\n4. 最后用一句话概括交接：“请按……资料，先确认……，并列出……”。\n\n用到真实工作时：把“按最新图做”改成能找到具体资料及确认记录的表达。技术人员看到后应能分清这是评估任务还是已确认的执行要求。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n可以记录：“S3 出现二维 A、三维 B 的冲突；S4 客户确认以 B 版二维、三维为准，旧 A 版保留为历史资料。”收到时间等未提供的信息，不补造。\n\n三个问题可分别问：B 版关键位置还需客户澄清什么；表面处理还缺哪些可供评估的验收信息；现有资料能评估到哪一步、还需补哪些输入。案例没有实际图纸，不能附上自行编造的尺寸。\n\n交接句可写：“请按客户在 S4 确认的 B 版资料继续评估，先列关键要求和表面处理的待澄清内容。”再补上技术接手角色和自己的检查安排；对方答复时间未约定就照实记录。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 能解释为何当前按 B 版评估，依据来自 S4 客户确认，而不是只看文件名。\n- [ ] 三个技术问题说清想得到什么答复，没有编造尺寸或替技术人员写结论。\n- [ ] 交接单有接手角色、期待的反馈和自己的检查安排，未约定的时间没有写成承诺。\n\n## 6. 下次不看笔记再试一次\n\n文件名出现“最新版”，客户却没说明修改内容。你会先核对哪两件事，再决定怎样交给工厂？\n\n[上一课](L12-把询盘整理成可推进的项目.md) · [目录](../README.md) · [下一课](L14-读懂材料工艺质量问题的用途.md)\n",
    "personal/course/lessons/L14-读懂材料工艺质量问题的用途.md": "# L14 读懂材料工艺质量问题的用途\n\n模块：M4 技术与报价｜建议：40 分钟｜前置：L13｜交付物：O14 技术问题与负责方清单\n\n学习目标：遇到材料、结构、工艺、表面处理和检验这些词时，能知道“这关系到哪个问题、该找谁确认、需要拿到怎样的答复”。\n\n本课做到这里就够了：先学会问对问题、传准要求，不要求背技术参数或替工程师设计加工方案。\n\n原图依据：材料、结构、表面处理、加工工艺及过往质量问题分析。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 6.5 节。材料：[S3—S4](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n你暂时看不懂所有专业词，也可以先把问题送到正确的人手里。关键是别只问“能不能做”，而要说清哪个要求已知、哪里还不清楚，以及需要对方给你什么说明。\n\n| 看见哪类内容 | 先问清什么 | 想拿到的答复 |\n| --- | --- | --- |\n| 材料 | 客户指定了什么，是否还有缺项 | 明确要求，或需客户补充的问题 |\n| 结构与关键要求 | 哪个位置影响装配或使用，依据在哪份资料 | 技术人员按版本指出具体问题 |\n| 工艺 | 工厂准备怎样满足要求，有无要讨论的方案 | 经评估的方案及所需条件 |\n| 表面处理 | 外观或功能要求、怎样验收是否清楚 | 客户要求与仍需澄清的内容 |\n| 检验与质量 | 按什么判断合格、需要什么记录 | 相关方确认的验收要求 |\n\n拿到“建议换材料”时，还要问建议理由、影响以及谁来批准。建议是供讨论的，不会因为业务员抄进表格就变成客户已经同意的要求。\n\n## 2. 案例拆解\n\nS4 的材料已经明确到 6061-T6，但本课不推导它的性能是否满足用途。关键位置与表面处理仍有问题，应请技术列清影响，并通过客户确认要求。\n\n如果工厂建议替代材料或结构，你需记录建议、依据、影响与需谁确认。客户尚未同意时，不能悄悄把建议变成新的技术要求。\n\n## 3. 照着做一次\n\n按 S3—S4 完成 **O14 技术问题与负责方清单**：\n\n1. 按上表五类各写一行：“本案例已知/未知什么—我怎样提问—问哪个角色—需要什么答复”。\n2. 材料行可从 S4 已确认的 6061-T6 写起；其余没有答案的事项就留作问题，不填写“符合”来凑齐。\n3. 选两行，用日常语言向自己解释：“如果不问清，会让下一步哪件事没法判断？”\n4. 改写“工厂有设备，所以这个项目一定能做”，说明还要取得谁的项目评估。\n\n用到真实工作时：把不懂的技术词连同客户原要求、文件位置交给技术人员，请他说明影响。先保证信息准确，再逐步积累专业知识。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n材料行可写：“客户已在 S4 指定 6061-T6；请技术人员结合 B 版要求确认还缺哪些信息。”结构行请技术人员指出关键位置要澄清什么，并通过客户确认；工艺行请工厂提出评估结论和所需条件。\n\n表面处理行问客户怎样验收，并请工厂说明哪些信息影响评估；检验行请相关技术或质量人员确认按什么要求检查、需要哪些记录。每行都以拿到可用答复为结束点，而不是以填满“符合”为结束点。\n\n例如，不知道怎样验收外观，就难以判断双方说的“黑色合格”是否是一回事。有设备也不能替代这些具体要求的评估。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 五类各有一个针对本案例的问题、负责角色和希望取得的答复。\n- [ ] 至少能用自己的话说明两类问题为什么要问，已知要求、工厂建议和待确认内容分得开。\n- [ ] 没有自行补技术参数或保证可加工；能指出应由谁结合具体要求作判断。\n\n## 6. 下次不看笔记再试一次\n\n客户说“按常规标准做”。写一句向客户澄清验收要求的话，再写一句请工厂说明需要哪些依据的话。\n\n[上一课](L13-核对图纸版本并交接技术问题.md) · [目录](../README.md) · [下一课](L15-确认数量交期包装和验收条件.md)\n",
    "personal/course/lessons/L15-确认数量交期包装和验收条件.md": "# L15 确认数量交期包装和验收条件\n\n模块：M4 技术与报价｜建议：35 分钟｜前置：L14｜交付物：O15 商务与交付条件清单\n\n学习目标：客户说“四周内收到”、工厂说“15 个工作日”时，能发现两者还不能直接画等号，并列出答复前要问清的条件。\n\n本课做到这里就够了：把数量、生产、收货、包装运输、验收和付款分开记清；条件不足时先说明缺什么。\n\n原图依据：数量、交期、包装运输、验收一致性与报价条件。辅助阅读：[业务员操作清单](../../../crm/业务管理系统理解与团队落地手册.md)第 3.2、4.2 节。材料：[S3—S4](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n数量先分清本次正在评估多少、后续只是可能多少。本案例的 100 件是当前评估数量，500 件是预测，两者都不能仅凭询价认定已正式下单。没拿到新的数量方案，也不能自行套一个折扣。\n\n交期先看起点和终点：“条件齐备后生产完成”和“客户收到货”中间还隔着确认、排产和运输安排。工作日、自然日也要分清。没有真实日期和所需条件时，先问清楚，再算是否赶得上。\n\n包装运输、验收、付款也会影响方案。每项用“知道什么—缺什么—问谁”记录即可。看到一笔包装费用，不等于包装方式、运输责任和验收要求都已经约定。\n\n## 2. 案例拆解\n\n本次评估数量是 100 件；500 件是预测，工厂未报价。工厂说“条件齐备后暂估 15 个工作日”，客户说“四周内收到”，二者还不能直接判定兼容。\n\n需确认条件齐备的含义、排产、实际收货日期与地点、运输时间及验收条件。不要为了先回答客户而将这些缺口合成一个确定交期。\n\n## 3. 照着做一次\n\n用 S3—S4 完成 **O15 商务与交付条件清单**：\n\n1. 分数量、生产、收货、包装运输、验收、付款六行，填已知内容、待确认问题、要找谁、答案会影响什么。\n2. 把“15 个工作日”和“四周内收到”放在一起，至少指出三处还不能直接比较的地方。\n3. 给客户写三句话：“已了解你希望……”“目前还需确认……”“我准备先……再反馈……”。保留等待工厂与客户确认的事项。\n\n用到真实工作时：收到“交期多少天”这类问题，先确定对方问的是生产完成还是收到货；不要把工厂的一句估计直接转成自己的到货承诺。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n数量写本次评估 100、未来预测 500；生产写条件齐备后暂估 15 个工作日；收货仍缺准确日期、地点及起算说明。包装有费用数字，但具体方式和运输仍需确认；付款、验收也未完整约定。\n\n至少有三处不能直接比较：生产完成和收到货的终点不同；工作日与自然时间单位不同；起算条件、排产或运输时间没有明确。此时不能计算一个保证到货日。\n\n客户说明可写：“已了解您希望四周内收到。目前还需明确收货日期地点，并核对工厂起算条件、排产和运输安排。我会先协调这些信息，再反馈可确认的交付方案。”\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 六类条件都有记录，100 件写为本次评估、500 件写为预测，没有自定批量价格。\n- [ ] 能指出生产与收货的终点、工作日与自然日、起算或运输等至少三处待澄清内容。\n- [ ] 客户说明说清缺什么、准备找谁确认，没有在资料不足时保证具体到货日。\n\n## 6. 下次不看笔记再试一次\n\n有人只发来“交期 15 天”。你先问哪三件事，才能知道它是否满足客户要的时间？\n\n[上一课](L14-读懂材料工艺质量问题的用途.md) · [目录](../README.md) · [下一课](L16-形成并检查一份报价方案.md)\n",
    "personal/course/lessons/L16-形成并检查一份报价方案.md": "# L16 形成并检查一份报价方案\n\n模块：M4 技术与报价｜建议：45 分钟｜前置：L13—L15｜交付物：O16 报价核对稿\n\n学习目标：准备把一份报价发给客户前，能查出“金额有没有算错、费用有没有重复或漏说、哪些条件还不能承诺”。\n\n本课做到这里就够了：完成一次报价检查，并把能算出的金额与仍待确认的条件分开；这次练习稿不当作正式报价发送。\n\n原图依据：报价条件、成本分析、报价明细、附加信息与反馈。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 6.6 节。材料：[S4](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n检查报价时分三遍。第一遍看对象：什么零件、哪个版本、多少件、什么币种。第二遍算钱：单价乘数量，单列费用有没有重复，未计的费用有没有说清。第三遍看条件：技术、生产与收货、付款、验收等是否已有依据。\n\n把内部测算和给客户看的价格分开写。知道内部有准备费，不代表对外需要再单列一次；如果单价已经包含它，又加一遍就重复了。内部已列成本与客户金额的差额，也未必就是最终能留下的钱。\n\n金额正确不等于可以正式承诺。技术尚未确认、运费未计、交期仍是估计时，要在检查稿里保留这些状态，并明确需要找谁补齐。\n\n## 2. 案例拆解\n\nS4 内部已列费用：38 × 100 + 600 + 200 = **4,600 元**。客户方案草稿：48 × 100 + 200 = **5,000 元**。单价 48 已纳入准备等因素，不能又另加 600 元变成 5,600 元。\n\n两者差额是 400 元，但尚有未计费用和条件，不能直接称为最终净利润。工厂也未提供 500 件方案，因此不能把同一单价自动用于未来数量。\n\n## 3. 照着做一次\n\n用 S4 和 O13—O15 完成 **O16 报价核对稿**：\n\n1. 分别写内部已列费用算式、客户方案算式。解释为什么客户方案不应再加一次 600 元准备费。\n2. 给客户方案写清：零件、B 版、100 件、人民币单价和合计、已列包装费、运费和税费未计。\n3. 列至少五项待确认条件，每项标要找谁、影响报价里的哪句话。回看 O13—O15，把技术和交付的未解决问题一起带过来。\n4. 写一句检查结论：“算术上……；要作为正式报价，还需……”。再解释两组金额的差额为什么不能直接叫净利润。\n\n用到真实工作时：按这三遍顺序检查每次报价。数量或图纸变了，回到条件重新核对，不只改数字和文件名。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n两组算式是 38 × 100 + 600 + 200 = 4,600 元，以及 48 × 100 + 200 = 5,000 元。客户单价已经纳入准备等因素，再加 600 元会重复。400 元差额尚未扣除未列费用，不能当最终净利润。\n\n待确认清单可写：关键位置和加工条件找客户技术人员及工厂；表面处理验收找客户相关人员；生产周期和排产找工厂；收货地点与要求找客户；运输、税费、付款和有效期找相应负责方。谁尚未明确，就先列待确认角色，不能填默认值。\n\n检查结论示例：“给定算术得到 5,000 元，运费、税费未计。技术要求、最终交付、付款和验收等还需确认，目前作为内部核对及条件讨论稿。”B 版和 100 件是这个算式对应的条件，变化后要重核。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 写对 4,600 元与 5,000 元两组算式，能指出重复加 600 元的问题，并解释 400 元差额的局限。\n- [ ] 客户方案的对象和费用范围清楚，至少五项待确认条件分别写了确认方和影响。\n- [ ] 把 O13—O15 中未解决的技术、交付问题带入检查结论，没有将讨论稿写成已批准正式报价。\n\n## 6. 下次不看笔记再试一次\n\n客户把数量改为 500 件，问能否沿用原单价。你在回答前要重新核对哪三类信息？\n\n[上一课](L15-确认数量交期包装和验收条件.md) · [目录](../README.md) · [下一课](L17-把技术结论反馈给客户.md)\n",
    "personal/course/lessons/L17-把技术结论反馈给客户.md": "# L17 把技术结论反馈给客户\n\n模块：M5 推进与衔接｜建议：35 分钟｜前置：L16｜交付物：O17 技术反馈与变更记录\n\n学习目标：工厂说某处要改、客户又发来新图时，能讲清“问题是什么、还缺什么说明、谁需要确认、哪些旧结论要重新检查”。\n\n本课做到这里就够了：先把技术意见整理成客户能回应的话，保留未确认的状态；具体修改方案由技术人员提供。\n\n原图依据：给客户的报价反馈、制造可行性分析、材料/结构/公差建议。辅助阅读：[原图解读](../../PDF原图解读与文档校准.md)的三种反馈方向。材料：[S4、S6](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n工厂发来“这里建议改一下”，先别只转发这句话。向技术人员确认：指哪一版的哪个位置，原要求有什么问题，建议是什么，可能影响什么。信息还没齐，就先说明正在补充，而不是自己补一个尺寸让消息看起来完整。\n\n给客户的反馈要让他知道需要回答什么。如果已有具体建议，请他确认要求或方案；如果只有方向，没有方案细节，先补技术说明。收到消息、愿意讨论、正式确认采用，是不同的状态。\n\n客户发了新版，也要核对它改了哪里、是否解决原问题、价格和交期会不会受影响。把旧版、工厂建议、客户回复、新版分别留下，未来才能解释为什么改、按什么继续评估。\n\n## 2. 案例拆解\n\nS6 只有“可提出另一种结构方案供评估”，没有具体替代尺寸。你应请技术补齐可供客户判断的说明，不能自己编一个数值发给客户。\n\n客户又发来 C 版，需要与前一版核对变化。即使客户说“可以先试”，也不能推定工厂已确认 C 版可行，或原 B 版价格仍有效。\n\n## 3. 照着做一次\n\n用 S4、S6 完成 **O17 技术反馈与变更记录**：\n\n1. 先列出技术说明里还缺什么，例如具体问题位置、建议细节和影响。案例没提供的尺寸保持空缺。\n2. 写一条给客户的反馈草稿，说明目前确认到哪一步、正在补充什么、希望对方确认什么。不要提不存在的方案附件。\n3. 用五行记下：原 B 版依据、工厂建议、仍缺的说明、客户实际回复、新 C 版待重评事项。\n4. 给 C 版写三个检查方向：技术、价格、交期分别需要谁重新确认。不要把“可以先试”改写为“全部批准”。\n\n用到真实工作时：每次改图都留下变更来由和确认状态。你自己也应能分清，正在讨论的建议和已经确定采用的要求是哪一项。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n还需请技术补齐具体问题位置、建议细节及影响。客户反馈草稿可写：“B 版有一项要求仍需澄清，我们正请技术完善具体说明及方案影响；希望先与您确认相关要求，再讨论是否采用替代方案。”\n\n收到 C 版后另记：“新 C 版已收到，和 B 版的差异待核实，尚未完成技术、价格和交期重评。”不要把前面的工厂建议与后来 C 版自动认作同一项已获批准的修改。\n\n可以先协调技术核对差异，报价人员根据确定要求重算，工厂再核对排产与生产时间。客户“可以先试”仍不能替代这些结论。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 能说出技术反馈还缺哪些说明，草稿没有自行补造尺寸、结论或方案附件。\n- [ ] 记录里分得清 B 版、工厂建议、客户回复和 C 版，未把收到或讨论写成已批准。\n- [ ] C 版对技术、价格、交期的影响都有重新确认安排。\n\n## 6. 下次不看笔记再试一次\n\n客户回“收到，我看看”。你现在可以更新什么状态，还不能更新成什么状态？接下来保留或确认哪条记录？\n\n[上一课](L16-形成并检查一份报价方案.md) · [目录](../README.md) · [下一课](L18-安排报价后的有效跟进.md)\n",
    "personal/course/lessons/L18-安排报价后的有效跟进.md": "# L18 安排报价后的有效跟进\n\n模块：M5 推进与衔接｜建议：35 分钟｜前置：L17｜交付物：O18 两种状态的跟进方案\n\n学习目标：报价发出后暂时没有结果时，能判断“现在值得联系吗、这次要确认什么、对方回复或没回复后分别怎么做”。\n\n本课做到这里就够了：为两种情况各准备一次有目的的跟进，不要求靠固定天数催出订单。\n\n原图依据：客户沟通、购买信号、反馈与行动计划。辅助阅读：[业务员操作清单](../../../crm/业务管理系统理解与团队落地手册.md)第 3.4 节。材料：[S5](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n准备跟进前，先看最后一条已知信息：对方收到资料了吗？有没有说什么时候评估？你有没有答应补什么？这些问题决定下一条消息该问什么，也决定现在是否适合联系。\n\n已约定评估时间时，可以围绕评估所需资料和后续安排准备；还不知道是否收到时，先确认接收。两种情况都写成“考虑得怎样了”，容易让消息与客户当前任务脱节。\n\n你的检查时间是自己的安排，客户的回复时间要有实际约定。“没有回”目前只是一项事实，不能直接写成嫌贵、没兴趣或丢单。记下状态，再决定补充、等待、延后或暂停，并尊重对方表达的联系偏好。\n\n## 2. 案例拆解\n\n情形一：客户说下周二内部评估。周二前可确认是否需要补充资料；评估后按实际约定询问尚存问题。自己的检查日期不能写成客户承诺一定反馈的日期。\n\n情形二：方案发出后没有确认收到，也没有评估时间。可以先核实资料是否送达及是否需要补充内容，再判断下一步，而不是先要求给下单结论。\n\n## 3. 照着做一次\n\n用 S5 的独立情形和本课例子完成 **O18 两种状态的跟进方案**：\n\n1. 分别写“客户说下周二评估”“未确认收到、也没约评估时间”的已知事实和最想确认的问题。\n2. 每种写一条跟进草稿，再写何时考虑联系、为什么。练习自定的检查时间注明“我的计划”，不写成对方承诺。\n3. 对每种情况补三种后续：客户提出具体问题、客户说延期、仍无回复。每种各写一个下一步，允许选择等待或暂停。\n4. 读两条草稿：如果只换个日期就完全一样，检查是否真的围绕不同的问题。\n\n用到真实工作时：打开上一条回复，先补全“我这次联系是为了确认……”。知道目的后，再决定发不发、何时发、说什么。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n已约定评估的草稿可围绕：“为配合下周二的评估，想确认是否还需要补充相关资料。”是否此时联系，要结合已有安排和材料状态；如果已经备齐，也可以先等待到合适的检查时间。\n\n未确认收到时可写：“想确认前次资料是否送达；如需补充便于评估的内容，请告知。”此时先解决接收问题，没有依据就不问“为什么还不下单”。\n\n后续有具体问题，就整理并答复；明确延期，就更新安排；仍没回复，就保留未知原因，再决定等待、适当确认或暂停。每种选择写明理由，自己的检查日不要写成对方承诺日。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 两种情形的跟进目的和消息不同，分别针对评估安排和是否收到。\n- [ ] 时间安排有理由，自己的检查计划与客户实际约定分开，没有提前判定评估结果。\n- [ ] 两种情形都写了三种回复状态的下一步；未回复时没有编造客户动机。\n\n## 6. 下次不看笔记再试一次\n\n客户已说下周二评估，今天是周一。你是先准备补充材料、现在联系还是等待？选一个，并说明什么信息会让你改变安排。\n\n[上一课](L17-把技术结论反馈给客户.md) · [目录](../README.md) · [下一课](L19-处理价格异议与有条件谈判.md)\n",
    "personal/course/lessons/L19-处理价格异议与有条件谈判.md": "# L19 处理价格异议与有条件谈判\n\n模块：M5 推进与衔接｜建议：40 分钟｜前置：L18｜交付物：O19 异议分析与谈判准备\n\n学习目标：客户说“你太贵了”时，能先问清他在比较什么，再说明哪些调整可以请内部评估，哪些价格或交期还不能答应。\n\n本课做到这里就够了：先写好核实问题和回应草稿，不要求当场降价、送样或谈成订单。\n\n原图依据：谈判、价值销售、报价策略及促销构思。辅助阅读：[速查表](../../../crm/三层理解与运用速查表.md)第 7 节。材料：[S4—S5](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n先把“贵”的原话记下，再看对方比较的是不是同一件事：相同图纸、材料要求、数量、费用范围和交期吗？客户可能最在意总支出，也可能最在意何时收到，先问清才能决定查什么。\n\n准备两个可以讨论的方向，并写明要找谁评估、需要什么条件。比如按真实数量重新测算，或重新核对交付安排。讨论方向并不代表你已经有权给折扣，也不能靠悄悄改要求来降低数字。\n\n免费样品也是一个带成本和条件的方案。先弄清样品要验证什么、谁承担费用、怎样验收、何时交付，再判断是否适合当前合作。原图列出促销办法，是供分析的选择。\n\n## 2. 案例拆解\n\n客户说“比另一家大约高 8%”，但比较口径未知。先了解差异与最关注的问题，再准备方案。客户还提出 20 个自然日内收到，时间要求可能同样关键。\n\n若机械把 5,000 元降 8%，会得到 4,600 元，恰等于本例已列内部费用，尚未覆盖未列费用。这个算式只说明盲目让价的问题，不能据此反推出竞争对手价格，因为比较基数不同且原话只是“大约”。\n\n## 3. 照着做一次\n\n用 S4—S5 完成 **O19 异议分析与谈判准备**：\n\n1. 抄下客户关于价格和 20 个自然日收货的原话，列三个需要核对的比较问题。\n2. 写两个可请内部评估的调整方向，每个注明找谁、需要什么条件；再写目前不能直接答应的内容。\n3. 算 5,000 元降低 8% 后是多少，解释它与已列内部费用的关系，以及为什么不能据此认定竞争对手价格。\n4. 写一条回应草稿，先承接关注点，再提出核实安排。最后为“免费样品”列至少三类讨论前需要确认的条件。\n\n用到真实工作时：先弄清客户想解决的具体问题，再回内部核算。未经确认的降价或到货日，不放进答复当成已经可执行的方案。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n三个比较问题可围绕：是否为同一版本和数量；包装、运输等费用范围是否一致；技术要求与收货条件是否相同。先理解客户最想解决的差异，不要求对方提供他人的保密报价文件。\n\n调整方向可请工厂按确认数量重测，或核对交付安排是否有其他可行选择。回应可写：“了解您同时关注价格和 20 个自然日收货。想先确认比较范围及收货要求，我会据此复核费用和交付条件，再反馈可讨论的方案。”\n\n5,000 × 92% = 4,600 元，只说明机械降价后等于本例已列费用，尚有未列支出；不能用这个数认定对手价格。免费样品应核实成本承担、样品要求与验收、运输时间等条件，不能先承诺免费再倒推。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 三个比较问题能帮助核对相同条件，回应同时关注价格和收货要求。\n- [ ] 两个调整方向各有确认方及所需条件，没有擅自承诺降价、改技术要求或 20 天到货。\n- [ ] 算出降价后 4,600 元并解释其局限；免费样品至少列出三类需要核实的条件。\n\n## 6. 下次不看笔记再试一次\n\n两个客户都说贵：一个没看见单列费用，一个急着赶项目节点。你分别先确认什么？为什么下一步可能不同？\n\n[上一课](L18-安排报价后的有效跟进.md) · [目录](../README.md) · [下一课](L20-衔接样品和订单前的确认.md)\n",
    "personal/course/lessons/L20-衔接样品和订单前的确认.md": "# L20 衔接样品和订单前的确认\n\n模块：M5 推进与衔接｜建议：40 分钟｜前置：L17—L19｜交付物：O20 试单交接与待确认事项\n\n学习目标：客户说“先做一批试试”时，能分清哪些只是意向、哪些已经确认，并列出交给工厂前还缺的条件。\n\n本课做到这里就够了：先完成一份清楚的试单准备记录；当前练习条件不足，不把记录当成开工指令。\n\n原图依据：购买承诺、图纸要求、数量、交期、验收与报价条件。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 6.6—6.8 节。材料：[S6](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n听到“可以先试”时，先保留这句话表达的意向，再核对技术、数量、价格和交付条件确认到哪一步。愿意尝试，不会自动补齐新图纸评估、付款和验收要求。\n\n试单还要知道准备验证什么：装配、功能、外观，还是别的内容？由谁判断、按什么要求给反馈？不知道就写成问题。试单之后可能有下一批，也要等新的确认，不能把预测量算作现成订单。\n\n把有关条件放到同一页，检查是不是同一个版本、同一次数量和同一套费用范围。旧报价与新图纸混在一起时，先写清哪些内容要重评，再安排确认。\n\n## 2. 案例拆解\n\nS6 中客户表示 100 件可先试，却要求按 C 版重新确认。C 版变化未核实，技术、价格、交期和部分商务条件未定，因此当前可以做准备与澄清，不能把 B 版报价和 C 版图纸混合作为明确执行依据。\n\n对工厂的交接应清楚标出“待评估/待确认”，不要只转发一句“客户同意了，开工”。\n\n## 3. 照着做一次\n\n用 S6 和 O17—O19 完成 **O20 试单交接与待确认事项**：\n\n1. 一页写清：项目与试单目的、C 版资料、100 件意向、技术评估、价格范围、付款、生产与收货、包装运输、验收和联系人。\n2. 每项标“已知什么—还缺什么—找谁确认”。B 版报价若被提及，注明不能直接视为 C 版价格。\n3. 列当前可安排的三件事，再列仍不能认定已完成的两件事。\n4. 对照 O17—O19，检查变更、20 个自然日的期望和价格反馈有没有被漏掉或误写成已同意的条件。\n\n用到真实工作时：交给工厂前先读一遍这一页，确认接手人看得出哪些是评估任务、哪些有明确确认依据。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n记录可写：“客户有 100 件试单意向，要求按 C 版重新确认；装配验证用途已知，具体验收仍待确认；C 版技术、价格与交期尚未完成重评。”数量意向和执行确认分开写。\n\n当前可安排三件事：核对 C/B 差异；请工厂重评技术与费用时间；向客户澄清付款、验收等未决条件。仍不能认定 C 版技术已获接受，也不能认定原价格和交期继续成立。\n\n回看前课，客户提出过的价格比较和 20 个自然日收货仍只是需要处理的信息。如果后续改变，应记录新的确认依据，不能无声地变成工厂承诺。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 能把试单意向、技术评估、商务确认分别说明，预测 500 件没有变成已确认数量。\n- [ ] 交接页的版本与价格、交期状态对应，待确认事项和负责角色看得见。\n- [ ] 列出三件可做和两件未完成的事，保留本模块变更与谈判信息，没有下未经确认的生产指令。\n\n## 6. 下次不看笔记再试一次\n\n客户说“和上次一样，再做一批”。除数量外，你还会核对哪三类内容，才能知道旧条件是否适用？\n\n[上一课](L19-处理价格异议与有条件谈判.md) · [目录](../README.md) · [下一课](L21-从成单丢单中分析原因.md)\n",
    "personal/course/lessons/L21-从成单丢单中分析原因.md": "# L21 从成单丢单中分析原因\n\n模块：M6 复盘与运用｜建议：35 分钟｜前置：L20｜交付物：O21 结果复盘\n\n学习目标：一单成交或没成交后，能说出“结果有什么证据、原因知道多少、下次具体保留或改变哪一个动作”。\n\n本课做到这里就够了：先从案例里找出一条能改进自己工作的办法，不要求凭一单总结所有客户的规律。\n\n原图依据：报价结果、成单/丢单、GRAI 与 KISS 复盘。辅助阅读：[案例填写示例](../../../crm/真实客户案例填写示例.md)第 9—10 节。材料：[S7-A、S7-B](../案例包.md)，两种结局分别分析。\n\n## 1. 先把问题想清楚\n\n先写“本来想做到什么”和“后来实际怎样”，再讨论原因。客户明确说了什么、记录中发生了什么、你猜测什么，分开写。这样能避免把一个完整故事误当成完整证据。\n\n成交时不必把一切归功于自己的某句话；丢单时也不必立刻认定是价格或个人能力。客户给出的理由可以作为重要信息，但没有解释的部分仍要保留未知。\n\n最后只选一个值得保留的动作、一个值得改进的动作。把“提高专业度”换成“下次客户说四周收货时，先问具体日期、地点和起算条件”。做完后能看见是否更早发现时间冲突，比写一句口号有用。\n\n## 2. 案例拆解\n\nS7-A 客户表示版本与问题说明清楚，是愿意试单的重要原因。这支持保留清晰反馈的做法，但不证明价格、其他供应商或关系因素完全无关。\n\nS7-B 客户说明本地供应方交付更符合计划，记录又显示早期没有问清时间。可以总结“下次更早确认刚性收货要求”，不能因此断言所有本地供应商都更快。\n\n## 3. 照着做一次\n\n把 S7-A、S7-B 当作两个不同结局，分别完成 **O21 结果复盘**：\n\n1. 各写原目标、实际结果，以及支持结果的客户回复或记录。\n2. 各写一句“目前有依据的原因是……”和一句“仍不知道的是……”，不把两种结局拼在一起。\n3. 各选一个保留动作、一个改进动作。每个补全：“下次遇到……时，我会……；做完后检查……”。\n4. 把“客户只看价格”“我讲清版本所以一定成交”等概括改成与给定证据相符的话。\n\n用到真实工作时：即使客户没说明原因，也能先检查自己的记录、答复和遗漏。暂时没有真实成单或丢单，就用这两个模拟分支练习。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\nA 结局有 100 件试单和客户关于版本说明的反馈，可以支持“清楚解释问题是客户提到的重要原因”。保留动作可写：“下次改图时，继续按版本列明问题和确认状态。”其他因素影响多大，仍不知道。\n\nB 结局的依据是客户表示本地供应方交付更符合计划，以及自己早期未问清时间的记录。改进动作可写：“下次客户提出收货期限时，先明确日期、地点和起算条件；详细报价前检查是否已有无法满足的时间要求。”\n\n每个分支还需按自己的分析补上另一项保留或改进动作。检查办法可以是下次记录是否更早暴露时间冲突，不必承诺这种改进一定让客户下单。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 两个结局分别记录了目标和结果依据，没有合并成同一项目经历。\n- [ ] 每个原因判断都能指向客户说法或过程记录，并留下一项仍不知道的内容。\n- [ ] 保留和改进动作都写清何时使用、具体做什么、做完检查什么，没有用空泛口号代替。\n\n## 6. 下次不看笔记再试一次\n\n客户只说“暂时不做了”，没解释原因。你可以复查自己的哪两件事？哪些客户动机现在还不能写成结论？\n\n[上一课](L20-衔接样品和订单前的确认.md) · [目录](../README.md) · [下一课](L22-把资料和经验变成可复用知识.md)\n",
    "personal/course/lessons/L22-把资料和经验变成可复用知识.md": "# L22 把资料和经验变成可复用知识\n\n模块：M6 复盘与运用｜建议：30 分钟｜前置：L21｜交付物：O22 一张知识卡\n\n学习目标：学到一个方法或经历一次问题后，能留下一张以后找得到、看得懂、知道什么时候用的笔记。\n\n本课做到这里就够了：先做一张能指导下一次动作的知识卡，不要求把所有资料重新整理成大型知识库。\n\n原图依据：DIKW 知识管理、原始数据、信息、知识与判断。辅助阅读：[个人自测](../../../crm/个人理解练习与掌握自测.md)第 5 节。材料：自己的 O21 与[案例包 S7](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n一份资料被收藏了，不代表下次会用。试着把一条经验写成：“遇到……时，先做……，因为这次……”。再保留原记录位置，方便回来核对它是怎样得出的。\n\n原图的 DIKW 可以理解成四步：留下原始记录，整理发生的情境，提出经验，再判断新情境是否适用。先会做这四件事，比先背字母更有帮助。\n\n给经验再加一句“这个办法不能保证什么”或“什么时候不用重复做”。例如问清收货日期能帮助发现冲突，却不能解决所有产能问题。以后发现不适用，就补上新条件，别把一次经历写成普遍规则。\n\n## 2. 案例拆解\n\n原始记录：“客户希望四周内收到”；整理信息：“没有明确起算点、地点及刚性程度”；经验假设：“早期区分生产与收货时间，有助于更早发现安排冲突”。\n\n适用边界：它帮助澄清信息，但不保证解决产能或运输限制，也不保证取得订单。下一次通过是否更早识别冲突来检验。\n\n## 3. 照着做一次\n\n从 O21 选一个动作，完成 **O22 一张知识卡**：\n\n1. 标题写成以后会搜索的问题，例如“客户说四周收货，先确认什么”。\n2. 按七行写：原始证据及位置、当时情境、得到的经验、何时可用、不能保证什么、下次具体动作、怎么检查是否有帮助。\n3. 再写一个不能直接照搬的情况，并说明应该怎样调整。\n4. 合上原案例，只看知识卡，检查自己是否能说出下一次具体要问的话；若仍只有“重视交期”，继续改细。\n\n用到真实工作时：先从最常忘的一件事开始。以后遇到相似情况，打开这一张就能用，同时仍能回到原记录核对。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n知识卡标题：“客户说四周内收到，先问什么。”原始依据指向 S3 的原话和 S7-B 的复盘；当时缺少起算点和刚性程度等信息。\n\n经验可写：“收货表达模糊时，先确认日期、地点、起算条件，再与生产安排比较。”下次触发时直接使用这些问题，检查是否在详细报价前发现时间冲突。局限是澄清信息不等于解决产能或运输问题。\n\n不适合原样照搬的情况：客户已经把这些条件写清。此时先核对和评估能否满足，而不是把同样问题再问一遍。只有一个案例支持时，可标为“待验证经验”。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 笔记能找到原始案例依据，并说清当时为什么产生这条经验。\n- [ ] 写了适用情况、局限和一个不宜照搬的情形，没有把一次经历变成普遍定律。\n- [ ] 只看知识卡就能说出下一次具体动作，并知道怎样检查它是否有帮助。\n\n## 6. 下次不看笔记再试一次\n\n客户已经明确给出收货日期、地点和起算条件，你还照抄原卡的所有补问吗？说出保留哪一步、调整哪一步。\n\n[上一课](L21-从成单丢单中分析原因.md) · [目录](../README.md) · [下一课](L23-安排个人目标与每日动作.md)\n",
    "personal/course/lessons/L23-安排个人目标与每日动作.md": "# L23 安排个人目标与每日动作\n\n模块：M6 复盘与运用｜建议：35 分钟｜前置：L22｜交付物：O23 一周个人工作计划\n\n学习目标：一天事情很多时，能排出“今天先做哪几件、每件做到什么算完成、等别人回复时还能做什么”。\n\n本课做到这里就够了：先排一份做得完的日计划和三个周目标，不以客户必须回复或下单作为自己当天完成的标准。\n\n原图依据：个人目标、行动计划、任务分解、时间安排和复盘。辅助阅读：[每周业务检查表](../../../crm/每周业务检查表.md)第 3、5 节，改为个人自问使用。\n\n## 1. 先把问题想清楚\n\n先把任务改写成有结束点的动作。“找客户”可写成“完成一家企业的事实、匹配理由和待查问题”；“学习资料”可写成“做完 L01 的九句话”。这样你知道什么时候算完成，也更容易估计所需时间。\n\n再区分自己能安排的工作与需要等人的结果。你可以准备问题、发出确认、查看回复，但不能让客户按你的日程下单。等待时保留检查时间，同时准备一项不依赖这条回复的工作。\n\n排顺序时先看已作出的承诺和当前卡点，再给持续开发、学习留时间。某件事做起来舒服，不代表它最值得先做；已经没有时间的事，就说明推迟什么，而不是压缩估计假装都能完成。\n\n## 2. 案例拆解\n\n新增独立模拟情境：今天可用 180 分钟，有四项任务。已答应客户今天整理技术问题约需 40 分钟；联系工厂核实约需 30 分钟；筛选新线索约需 70 分钟；美化公司介绍约需 120 分钟。这些仅是本题给定估计。\n\n总量超过可用时间。可以优先履行承诺和核实卡点，再安排线索任务或其一部分，给信息变化留余地；美化资料若不影响当日任务，可另排。不能通过把任务时间写短来假装全部能完成。\n\n## 3. 照着做一次\n\n完成 **O23 一周个人工作计划**：\n\n1. 按你当前“消化资料、寻找客户”的阶段写三个周目标，每个配具体任务、为什么做、计划时间、是否要等人、完成后留下什么。数量由自己设定，注明是个人计划。\n2. 另做下面这个有在谈项目的独立练习：一天只有 180 分钟，按本课案例的 40、30、70、120 分钟四项任务排一次顺序，写出延后哪项及理由。不要把这组情境当成你已经有的真实客户。\n3. 为“工厂到检查时间还没回复”写一个等待处理动作和一个可先做的替代任务。\n4. 检查计划里有没有“客户必须回”“今天必须成交”，改成自己能完成的动作与独立记录的结果。\n\n用到真实工作时：每天先选出最需要完成的几件事，结束时看具体产物和卡点。当前可把本课程的一课练习本身安排成一件任务。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n当前阶段的周目标可以是：完成一课并改好作业；用两家模拟企业练匹配判断；从自己的资料中列出三个供应能力待核实问题。数量和时间是练习安排，可以按实际精力调整。每个目标都留下具体文字，不要求本周一定得到客户回复。\n\n180 分钟独立练习中，可安排 40 分钟完成已承诺的技术问题整理、30 分钟联系工厂核实、70 分钟筛选线索，留下 40 分钟处理回复或变化；120 分钟的资料美化另排。不同顺序也可以，但要说明依赖和承诺如何处理。\n\n工厂没回复时，记录仍缺的结论，按已有约定向客户说明当前情况，再做不依赖该结论的线索或资料任务。不能把“联系工厂核实用了 30 分钟”写成“工厂已给出结论”。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 三个周目标贴合当前学习和找客户阶段，每个都能说清具体任务、安排和完成后留下什么。\n- [ ] 独立情境中的任务总时间不超过 180 分钟，写明推迟哪项、为什么，没有随意缩短题目估时。\n- [ ] 对未回复有检查、沟通或调整动作，也有能先做的替代任务，没有把他人的结果当作自己可保证的完成项。\n\n## 6. 下次不看笔记再试一次\n\n今天没收到任何客户回复，但你完成了调查和补问草稿。哪些工作已经完成，哪些结果仍在等待，明天先检查什么？\n\n[上一课](L22-把资料和经验变成可复用知识.md) · [目录](../README.md) · [下一课](L24-完成一次独立业务分析.md)\n",
    "personal/course/lessons/L24-完成一次独立业务分析.md": "# L24 完成一次独立业务分析\n\n模块：M6 复盘与运用｜建议：90 分钟｜前置：L01—L23｜交付物：O24 综合业务分析包\n\n学习目标：遇到一个没练过的客户和询盘时，能独立说清“值不值得继续了解、先问什么、找谁评估、现在怎么回复、下一步做什么”；条件变化后能改对自己的记录。\n\n本课做到这里就够了：完成一份可解释的模拟处理稿，并找出、改正自己的遗漏；不要求给条件不足的项目硬报价格或作交期承诺。\n\n依据：综合运用原图的匹配、角色、需求、技术协同、报价条件、反馈与复盘。材料：[案例包 S8](../案例包.md)。本课不照搬 A 客户的结论；先独立作答，再看参考。\n\n## 1. 先把自己放进这个场景\n\n今天收到一条陌生询盘：客户要不锈钢外壳，希望月底收到，还要求今天给价格。你目前掌握的只是铝件资源，条件也不完整。现在先决定怎样处理这条消息，再逐步检查自己有没有遗漏。\n\n只读案例包 S8，已知供应条件回看 S0。先合上本课参考，用前面练过的方法动手。遇到不知道的地方，写清缺什么、找谁问；不需要为了让稿子完整而猜出一个答案。\n\n七项练习可以连续写在一份文档里，不需要七张表。每项都围绕一个实际问题，最后检查它们有没有互相矛盾。\n\n## 2. 照着处理这条询盘\n\n把处理稿存为 **O24 综合业务分析包**。建议按顺序回答以下七个问题；前五项完成后才打开变化卡。\n\n1. **这家公司值得继续了解吗？约 10 分钟。** 写“我看到……，所以值得核实……”。接着指出我方哪项资源还没证据支持。既不要见到询盘就认定能做，也不要因为未知就直接放弃。\n2. **不同问题分别找谁？约 5 分钟。** 写清许先生、陈女士和质量角色目前负责什么；列出尚不清楚由谁确认的决定。\n3. **先问什么、交给工厂什么？约 15 分钟。** 先复述已知要求，再选三个优先补问，各说明用途。最后写给工厂的评估任务，标出当前 R1 资料及信息缺口。\n4. **现在怎样回复客户？约 10 分钟。** 写一条草稿，说清已收到什么、为什么还需确认、自己准备怎么推进。说明今天能先做的事，不能凭空补一个价格或保证月底到货。\n5. **这份金额有没有问题？约 10 分钟。** 单独检查 S8 最后一段的算术材料，写正确合计、错误位置和未计费用，再说明它为什么不能用来报这个不锈钢项目。\n6. **收到变化后改哪里？约 15 分钟。** 打开变化卡，至少找出四处需要更新或重评的内容。保留原判断，在旁边写新信息及影响，避免只替换版本号和数量。\n7. **明天怎样接着做？约 10 分钟。** 列下一步找谁、处理什么、自己何时检查。再指出一种你容易犯的错误，写成“下次遇到……先……”的提醒，并说清适用条件。\n\n最后预留约 15 分钟，用下面的检查表给自己评分并修订。可以分两次完成；重点是判断清楚，不是赶在规定分钟内交卷。\n\n<details><summary>完成前五项后，再打开变化卡</summary>\n\n新增模拟信息：许先生发来 R2 版三维资料，说“数量可能改为 100 件，最终由采购确认，外观要求稍后补充”。R2 与 R1 的差异还未列出，具体收货日期和材料要求仍没有补齐。\n\n请标出至少四处需要更新或重新确认的内容。不要删除原记录后假装一开始就已知道 R2 或 100 件。\n\n</details>\n\n## 3. 参考思路与错误定位\n\n<details><summary>全部作答后展开参考</summary>\n\n**客户与能力：**公开信息和回复支持进一步了解，但我方已确认的是 S0 的铝件项目评估资源，尚未确认该不锈钢外壳能力。需要核实工厂是否匹配；若不匹配，可如实说明或另评估合适资源，不硬接。\n\n**角色与阶段：**许先生是项目工程师，陈女士负责采购，质量人员可能参与验收。当前是需求与可行性评估，不能写成订单批准。\n\n**补问：**可优先问材料要求、关键尺寸/图纸资料、准确收货日期与地点；外观要求同样重要，应请相关方说明怎样判定“不能有明显划痕”。三个问题的选择可不同，但要说明影响，不重复把未知当成已知。\n\n**交接：**初始基准为已收到的 R1；只有三维资料且关键要求不全。工厂已经说今天可以列问题，价格和交期不能确定。可以把“整理并反馈问题”作为自己的计划，不能改写成今天一定正式报价。\n\n**回应示例：**“已收到外壳资料，了解本次先评估 30 件及月底收货的期望。为确认可行性，需要补充材料要求、关键尺寸/相关图纸、外观验收口径和具体收货日期地点。我会先协调技术整理问题，价格与交期将在必要条件确认后反馈。”实际使用时按你已能做到的回复时间补充安排。\n\n**算术：**60 × 30 + 120 = 1,920 元，原合计漏了包装费；运费未计。该组数据是独立核对题，与 S8 无关联，不能给不锈钢项目报 1,920 元。\n\n**变化：**R2 差异待核实、数量 100 仍属可能且需采购确认、外观标准待补、技术/成本/交期均需评估影响。保留 R1 和 30 件的历史状态，不把“最新文件名”视为完整确认。\n\n**复盘：**例如记录“收到新材料或新版本时，不沿用旧项目的能力与报价结论”；适用范围是提醒重新核实，不能证明新项目一定不能做。\n\n</details>\n\n## 4. 评分方法\n\n每个维度四个检查点，每满足一点记 1 分，总分 20 分。先自己核对，也可以将作业交给助手或有经验的人点评。\n\n| 维度 | 四个得分点 |\n| --- | --- |\n| 客户与证据 | 事实和推测分开；指出不锈钢能力未确认；不把询盘等同订单；角色信息有依据 |\n| 需求与技术 | 资料基准明确；识别关键缺口；补问说明用途；技术任务与确认方明确 |\n| 沟通与行动 | 回应不空泛；不虚构价格交期；个人安排与他人承诺分开；有下一步检查动作 |\n| 报价核对 | 合计 1,920 正确；指出包装遗漏；标明运费未计；没有把独立算术数据用于 S8 |\n| 变化与复盘 | 识别 R2 需核对；数量可能性保留；重评影响范围完整；经验带有证据与边界 |\n\n本次练习以 **至少 16 分，且无下列关键错误** 为达标：编造已确认的加工能力；承诺未经确认的价格或交期；混用独立算术材料报价；将未确认版本和条件当成可执行生产要求。出现关键错误时，先修改相关判断，再重评。\n\n这是课程练习标准，不是职业资格或真实业务能力认证。\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 七项练习都有内容，自己能解释依据在哪里、缺什么；没有把旧铝件经验或独立算术数据套给新项目。\n- [ ] 按五个方面至少得到 16/20 分，检查后写出改了哪处、为什么；若无需修改，说明重点复核了什么。\n- [ ] 没有第 4 节列出的关键错误，并能解释自己的下一步为什么合理；参考答案措辞不同也能说明理由。\n\n## 6. 下次不看笔记再试一次\n\n隔一段时间，只读 S8，重新说出“哪项能力未知、先问哪三个问题、现在怎样回复”。再对照第一次作业，看看这次是否更能解释为什么这样做，而不只是记住参考句子。\n\n将来收到真实询盘时，从这七个问题里选当前需要处理的部分。先用真实资料核实；模拟题中能答对，只代表你已能练习这套判断方法。\n\n[上一课](L23-安排个人目标与每日动作.md) · [返回完整课程](../README.md)\n",
    "crm/三层理解与运用速查表.md": "# 三层理解与运用速查表\n\n## 1. 一句话主线\n\n```text\n客户是谁 -> 需求是什么 -> 我们能不能做 -> 怎么报价 -> 客户怎么反馈 -> 成没成交 -> 为什么\n```\n\n## 2. 三层框架\n\n| 层次 | 解决的问题 | 你要问什么 | 输出 |\n| --- | --- | --- | --- |\n| 业务逻辑 | 为什么做 | 客户是谁？需求是什么？我们凭什么赢？为什么成或丢？ | 判断 |\n| 系统流程 | 怎么流转 | 当前在哪一步？下一步是谁做？卡在哪里？ | 状态 |\n| 日常动作 | 今天做什么 | 要补什么资料？谁负责？什么时候完成？ | 动作 |\n\n## 3. 业务逻辑：8 个必问问题\n\n1. 客户是谁？\n2. 客户为什么需要我们？\n3. 客户真实需求是什么？\n4. 谁决定采购？\n5. 我们凭什么能赢？\n6. 报价依据是什么？\n7. 客户为什么成交或不成交？\n8. 这次经验以后能不能复用？\n\n## 4. 系统流程：9 个节点\n\n```text\n客户建档 -> 背景调查 -> 需求/询价 -> 商机立项 -> 技术评审 -> 报价 -> 跟进谈判 -> 成单/丢单 -> 复盘沉淀\n```\n\n## 5. 日常动作：不同角色每天看什么\n\n| 角色 | 每天必须看 |\n| --- | --- |\n| 业务员 | 新客户、活跃商机、缺失资料、报价反馈、下一步动作 |\n| 业务经理 | 重点商机、待评审、待报价、逾期跟进、审批事项 |\n| 技术/报价 | 待评审任务、资料缺口、技术风险、成本依据、报价条件 |\n| 负责人 | 报价效率、报价转化、卡点、成单/丢单原因、团队执行纪律 |\n\n## 6. 第一阶段 6 条纪律\n\n1. 新客户必须建档。\n2. 活跃商机必须有下一步动作和时间。\n3. 询价资料缺失必须标记。\n4. 正式报价前必须技术评审。\n5. 报价发出后必须记录客户反馈。\n6. 成单/丢单必须写原因。\n\n## 7. 看到这些话，立刻追问\n\n### “客户有兴趣”\n\n追问：\n\n- 对什么有兴趣？\n- 谁说的？\n- 这个人是不是关键人？\n- 客户现在最关心什么？\n- 下一步动作是什么？\n\n### “客户嫌贵”\n\n追问：\n\n- 贵多少？\n- 跟谁比？\n- 客户目标价是多少？\n- 我们的材料、工艺、质量、交期差异讲清了吗？\n- 是否需要二次报价或替代方案？\n\n### “资料不完整”\n\n追问：\n\n- 缺什么？\n- 缺失资料影响成本、交期、质量还是可行性？\n- 谁去补问？\n- 什么时候补齐？\n\n### “报价发了”\n\n追问：\n\n- 哪个版本？\n- 什么时间发的？\n- 报价依据是什么？\n- 客户确认收到吗？\n- 下次什么时候跟进？\n\n## 8. 周会只看 6 件事\n\n1. 新增客户。\n2. 重点商机。\n3. 资料缺失。\n4. 技术评审。\n5. 报价反馈。\n6. 成单/丢单复盘。\n\n## 9. 合格表达模板\n\n不合格：\n\n```text\n客户有兴趣，等回复。\n```\n\n合格：\n\n```text\n客户采购经理 John 确认 5000 件 CNC 铝件需求，缺年度用量和目标交期。Tina 6 月 21 日前补问，补齐后提交技术评审。\n```\n\n不合格：\n\n```text\n客户嫌贵。\n```\n\n合格：\n\n```text\nV1 报价 1200 美元已于 6 月 18 日发送。客户反馈价格比本地供应商高约 8%，但认可交期。报价工程师 6 月 22 日前准备材料替代方案和 V2 报价。\n```\n\n",
    "personal/course/案例包.md": "# 贯穿课程的模拟案例包\n\n所有公司、人员、网页摘述、报价、技术与交付条件均为教学虚构。币种统一为人民币，便于先理解业务与算术；不代表真实外贸报价、市场价格或可执行条件。这里没有实际图纸，图纸内容均以文字条件模拟。\n\n每个阶段只使用当时已经出现的信息。后续信息不能倒填为前期已经知道的事实。S7-A 与 S7-B 是互斥结局，不能同时套到一笔订单上。\n\n## S0：你的起点——用于 L01—L04\n\n你是个人外贸从业者，希望从精密制造方向开展业务。模拟条件如下：\n\n- 协作工厂甲愿意接收铝制零件、小批量项目资料，逐项目评估。\n- 你已获得两项资料的对外使用授权：一份匿名加工案例、一份对应样件的检验报告。\n- 工厂有一位技术联系人、一位报价联系人；本练习只确认了对接关系，没有确认所有图纸都能做。\n- 每个新项目的公差、工艺、检验、产能和交期仍需确认；未验证任何特定行业资质。\n- 你能负责整理资料和协调答复；还没有一组足以证明长期交付表现的真实订单数据。\n\n潜在线索：\n\n| 代号 | 虚构企业 | 模拟公开信息 | 尚未知道 |\n| --- | --- | --- | --- |\n| A | 星桥自动化 | 展示定制自动化设备研发、装配和新设备介绍 | 是否外协零件、谁负责、是否接受新供应方 |\n| B | 远海设备贸易 | 介绍整机代理销售与售后，规模较大 | 是否自己设计制造或采购定制零件 |\n| C | 精研器械研发 | 展示精密仪器开发，提及供应商评估程序 | 零件类型、评估要求、我方是否匹配 |\n\n## S1：用于练习调查的补充信息——用于 L05—L08\n\nA 的网站资料页展示设备设计与装配，联系页设有公开业务咨询入口；一则新闻提及新设备研发。没有明示当前零件外协采购需求。\n\nB 的产品页主要列出代理品牌和售后服务。C 的供应商说明表示“提交资料后由相关人员评估”，没有明确这意味着获得订单。\n\n你还得到一条未经核实的二手消息：“A 最近订单很多，肯定缺供应商。”这条消息不能与官网内容视为同等证据。\n\n## S2：第一次回复——用于 L07—L10\n\nA 的林女士回复：“我负责机械外协采购。我们正在做一款设备验证，暂时没有最终采购数量，可以先发相关加工和检验资料。技术要求由周工程师看，质量资料有需要再请吴女士参与。”\n\n目前只确认了林女士的自述及这次回复；没有订单、价格承诺或已通过供应商评估的结论。\n\n## S3：初始询盘——用于 L11—L15\n\n林女士又发来：“铝支架先按 100 件看一下价格，黑色阳极氧化，最好四周内能收到，后面可能有 500 件。附件是 2D-A 和 3D-B，尽快回复。”\n\n模拟附件信息：\n\n- 二维图名显示 A 版；三维文件名显示 B 版，没有书面说明以哪个版本为准。\n- 材料只在消息中写“铝”，没有明确牌号和状态。\n- 二维图出现一个关键孔位要求，具体能否加工及如何检验尚待评估。\n- 黑色阳极氧化尚无颜色、膜厚或验收口径确认。\n- “四周内收到”的目的地、起算点、是否刚性均未知。\n- “以后可能 500 件”是潜在需求，没有承诺下单。\n\n## S4：部分澄清与内部测算——用于 L13—L17\n\n客户补充：使用 B 版二维与三维资料，材料为 6061-T6，本次评估数量 100 件；500 件只是后续预测。用途是设备装配验证。关键位置以 B 版标注为准。表面处理验收细节仍需继续确认。\n\n工厂的模拟回复：\n\n- 技术人员可继续按 B 版评估；对关键位置提出一项待澄清问题，并未给出无条件承接结论。\n- 生产周期暂估为条件齐备后 15 个工作日，起算条件、排产与最终交期仍需确认。\n- 以下仅供练习内部测算，未包含运输、税费及其他未列支出：加工等费用 38 元/件 × 100 件，一次准备费用 600 元，本批包装 200 元。\n- 500 件没有取得工厂报价，不得按 100 件价格自行推算。\n\n为练习算术，另设一份对客户的**方案草稿**：100 件，单价 48 元；本批包装费单列 200 元；运费、税费未计。单价已纳入本次方案的一次准备等因素，不重复另加 600 元。付款、验收、运输及最终交期等仍待确认，不能将草稿当成已批准的正式报价。\n\n## S5：报价讨论中的反馈——用于 L16—L19\n\n客户看过方案草稿后说：“比另一家大约高 8%。另外，我们希望 20 个自然日内收到零件。”\n\n尚未知道另一家对比的是哪个版本、数量、费用范围、表面处理或交期条件。客户也没有给出比较报价的完整内容。\n\n另一种跟进练习情形：客户说将在下周二内部评估。周二之前未回复，不代表项目取消。此情形与价格反馈练习分别使用。\n\n## S6：变更与试单意向——用于 L17—L20\n\n技术人员提出：“B 版某处要求需要与客户澄清，可提出另一种结构方案供其评估；没有客户确认不能自行采用。”本练习不提供替代尺寸，业务员不能补造数值。\n\n客户后来表示：“100 件可以先试，但请按新发的 C 版重新确认。”C 版与 B 版有哪些变化未列清楚；技术、价格和交期尚未完成重确认。付款与表面处理验收条件仍未确定。\n\n“可以先试”表达意向；不能据此把 B 版报价、C 版图纸和未确认交期拼成一份生产指令。\n\n## S7-A：成交方向的复盘材料——用于 L21\n\n仅在这个分支，假定后续 C 版、技术要求、报价和交付条件均完成了书面确认，客户决定下 100 件试单。客户说：“这次愿意试，主要因为你们把版本问题和需要确认的地方讲得比较清楚。”这是一条客户反馈，不能直接推断它是唯一成交原因。\n\n## S7-B：丢单方向的复盘材料——用于 L21\n\n仅在这个分支，客户书面表示：“本项目选择了本地供应方，主要是交付时间更符合计划。”你回看记录发现，最初只记录了“四周”，没有及时确认收货起算点及是否为刚性要求。\n\n这支持“交期是客户说明的主要选择原因”；不支持推断对手全部价格、实际利润或客户以后都不会合作。\n\n## S8：结课陌生案例——只在 L24 使用\n\n青禾检测设备（虚构）展示检测仪器研发。你通过公开联系入口得到回复：“我是项目工程师许先生，正在评估一个不锈钢外壳，先做 30 件，后续量不确定。附件只有三维 R1 版，某个表面不能有明显划痕，希望月底前收到，请今天给价格。采购由陈女士负责，质量验收会请同事参与。”\n\n已知供应资源仍只有 S0 的已确认范围；不能假设工厂甲已经有该不锈钢外壳的相应经验。内部报价联系人回复：“要先看材料要求、外观标准、图纸细节及排产，今天能先列问题，价格和交期尚不能确定。”\n\n未提供：具体材料牌号、完整尺寸和关键要求、外观验收方式、准确收货日期与地点、正式数量承诺、付款条件。没有可用于计算该项目价格的有效成本数据。\n\n用于结课算术题的独立报价检查材料，与此不锈钢项目**无关联**：某草稿写单价 60 元 × 30 件、包装 120 元，合计却写 1,800 元；运费未计。你需指出问题，不能把这份数据用于 S8 项目报价。\n",
    "personal/course/README.md": "# 精密制造外贸 SOLO 完整学习课程\n\n适用对象：正在找客户、希望先消化业务导图的新手个人外贸从业者。\n\n本课程包含 **6 个模块、24 篇完整课文**。每课从一个你可能遇到的业务问题开始，写清学完能做什么、先做到什么程度，再提供讲解、案例、分步练习、参考思路和三条自检。课文编号为 L01—L24，练习结果编号为 O01—O24，便于以后找回。\n\n## 学完能够做到什么\n\n遇到一家企业，你能解释为什么值得继续了解；收到回复，你知道该向谁问什么；拿到询盘，你能整理要求、核对资料并请工厂评估；准备报价或跟进时，你能检查条件，选出有用的下一步。技术、价格、产能等结论仍需取得实际负责方的确认。\n\n课程完整覆盖个人业务主线。原图中的招聘、组织架构与团队绩效不列为必修；CRM 建设不纳入本课程。渠道实操、具体工艺、地区法律及产品标准没有被原图充分展开，课程不把它们补写成未经验证的操作规则。\n\n## 怎么学\n\n1. 先看[案例包](案例包.md)的使用说明与 S0；各课只读取指定阶段，后续答案暂时不看。\n2. 打开一课，先读“学习目标”和“本课做到这里就够了”。用自己的话说出这一课要解决的具体问题。\n3. 读讲解和案例，再按“照着做一次”逐步写下作业。无需专用表格，普通文档或纸笔即可；数字、时间或网址没提供时标注未知。\n4. 做完才展开参考思路，逐条检查“做到这些，就完成了本课”。三条都能在自己的作业里找到依据，才算本课练习完成；缺哪项就改哪项。\n5. 下次学习前，用两分钟回答上一课的复习题。能解释理由比复述原句更重要；不要求和参考答案用相同措辞。\n\n你目前还在找客户，可以把 L01—L08 优先对应到身边的企业资料。L09—L20 先用模拟材料练消息、询盘和报价，等实际遇到时再换成真实资料。L21—L24 用来练总结、安排自己的工作，以及独立处理新情况。\n\n每课的辅助阅读是遇到问题时的查阅入口，**不用先读完全部衍生文档才能开始**。先完成课文中的小练习；想进一步理解某个词或流程，再带着具体问题回看原资料。\n\n建议 L01—L12 先顺序完成，再学 L13—L24。每次一课，也可以把一课分两次完成。普通课约 30—45 分钟，结课综合练习约 90 分钟，总计约 **15 小时 10 分钟**。这是阅读与练习的安排估计，不含真实市场调查、沟通等待或订单执行时间；不要求连续 24 天完成。\n\n## 开始前：用五分钟看清资料关系\n\n原 PDF 把业务开发、客户理解、项目需求、制造技术、报价复盘与部门管理放在同一幅图里。现有《结构化需求》等文件又把其中内容整理成流程、字段和团队执行方法。本课程从个人业务使用顺序重新编排，不以背完整张图为目标。\n\n学习时区分三件事：原图提出了什么问题；衍生文档怎样组织这些内容；你在当前案例中如何判断。遇到“必须”“固定天数”或具体公司的操作办法时，先理解其用途和条件。完整说明见[原图解读](../PDF原图解读与文档校准.md)。\n\n## 模块一：明确能力与客户方向\n\n| 编号 | 完整课文 | 这一课学完能做什么 |\n| --- | --- | --- |\n| L01 | [从精密制造能力到目标客户](lessons/L01-从精密制造能力到目标客户.md) | 看到一家企业时，能说出“为什么可能适合我、依据是什么、还需要验证什么”。 |\n| L02 | [梳理供应资源与承诺边界](lessons/L02-梳理供应资源与承诺边界.md) | 客户问“你能做什么”时，能说清自己能负责什么、合作工厂确认过什么、哪些事情要看过具体要求才能答复。 |\n| L03 | [把能力变成客户听得懂的价值](lessons/L03-把能力变成客户听得懂的价值.md) | 介绍自己的资源时，能让对方听懂“你可能在哪件事上帮到我、拿什么说明、还需要了解什么”。 |\n| L04 | [建立目标客户画像与筛选依据](lessons/L04-建立目标客户画像与筛选依据.md) | 同时看到几家企业时，能决定先了解哪家，并说出“我看中了什么、先查什么、什么新信息会让我改主意”。 |\n\n## 模块二：找到线索并理解客户\n\n| 编号 | 完整课文 | 这一课学完能做什么 |\n| --- | --- | --- |\n| L05 | [选择开发渠道与寻找线索](lessons/L05-选择开发渠道与寻找线索.md) | 准备开始找客户时，能说出“我要找什么样的企业、先从哪里找、找到后看什么决定留下”。 |\n| L06 | [做有目的的客户背景调查](lessons/L06-做有目的的客户背景调查.md) | 查过一家企业后，能用一页说清“它做什么、我为什么想继续了解、哪些信息靠得住、下一步查什么”。 |\n| L07 | [识别联系人与采购角色](lessons/L07-识别联系人与采购角色.md) | 收到一位联系人的回复时，能分清“这件事该问他什么、哪些问题要请谁参与、哪些决定还不知道由谁拍板”。 |\n| L08 | [区分采购阶段与销售进度](lessons/L08-区分采购阶段与销售进度.md) | 发过资料或收到客户回复后，能说清“我做完了什么、客户正在考虑什么、下一步做哪件事才有帮助”。 |\n\n## 模块三：沟通、信任与需求\n\n| 编号 | 完整课文 | 这一课学完能做什么 |\n| --- | --- | --- |\n| L09 | [写清第一次接触的目的](lessons/L09-写清第一次接触的目的.md) | 准备第一次联系一家企业时，能写清“为什么找你、我可能帮上什么、这次只想请你回答哪一个问题”。 |\n| L10 | [用真实资料建立专业信任](lessons/L10-用真实资料建立专业信任.md) | 客户让你发资料或问“你能做好吗”时，能选出相关资料，并说清“它能说明什么、我的项目还要确认什么”。 |\n| L11 | [倾听和补问真实需求](lessons/L11-倾听和补问真实需求.md) | 收到一句简短询盘时，能先复述客户已经说清的内容，再问出最影响当前判断的三个问题，并说明为什么问。 |\n| L12 | [把询盘整理成可推进的项目](lessons/L12-把询盘整理成可推进的项目.md) | 面对几段聊天、几份资料时，能整理出“这是什么项目、现在卡在哪里、下一步找谁做什么”，让自己第二天能接着推进。 |\n\n## 模块四：技术协同与报价\n\n| 编号 | 完整课文 | 这一课学完能做什么 |\n| --- | --- | --- |\n| L13 | [核对图纸版本并交接技术问题](lessons/L13-核对图纸版本并交接技术问题.md) | 收到版本不一致的图纸时，能说清“现在按哪份评估、是谁确认的、还有哪几个问题要交给技术人员”。 |\n| L14 | [读懂材料工艺质量问题的用途](lessons/L14-读懂材料工艺质量问题的用途.md) | 遇到材料、结构、工艺、表面处理和检验这些词时，能知道“这关系到哪个问题、该找谁确认、需要拿到怎样的答复”。 |\n| L15 | [确认数量交期包装和验收条件](lessons/L15-确认数量交期包装和验收条件.md) | 客户说“四周内收到”、工厂说“15 个工作日”时，能发现两者还不能直接画等号，并列出答复前要问清的条件。 |\n| L16 | [形成并检查一份报价方案](lessons/L16-形成并检查一份报价方案.md) | 准备把一份报价发给客户前，能查出“金额有没有算错、费用有没有重复或漏说、哪些条件还不能承诺”。 |\n\n## 模块五：反馈、谈判与订单衔接\n\n| 编号 | 完整课文 | 这一课学完能做什么 |\n| --- | --- | --- |\n| L17 | [把技术结论反馈给客户](lessons/L17-把技术结论反馈给客户.md) | 工厂说某处要改、客户又发来新图时，能讲清“问题是什么、还缺什么说明、谁需要确认、哪些旧结论要重新检查”。 |\n| L18 | [安排报价后的有效跟进](lessons/L18-安排报价后的有效跟进.md) | 报价发出后暂时没有结果时，能判断“现在值得联系吗、这次要确认什么、对方回复或没回复后分别怎么做”。 |\n| L19 | [处理价格异议与有条件谈判](lessons/L19-处理价格异议与有条件谈判.md) | 客户说“你太贵了”时，能先问清他在比较什么，再说明哪些调整可以请内部评估，哪些价格或交期还不能答应。 |\n| L20 | [衔接样品和订单前的确认](lessons/L20-衔接样品和订单前的确认.md) | 客户说“先做一批试试”时，能分清哪些只是意向、哪些已经确认，并列出交给工厂前还缺的条件。 |\n\n## 模块六：复盘、知识与独立运用\n\n| 编号 | 完整课文 | 这一课学完能做什么 |\n| --- | --- | --- |\n| L21 | [从成单丢单中分析原因](lessons/L21-从成单丢单中分析原因.md) | 一单成交或没成交后，能说出“结果有什么证据、原因知道多少、下次具体保留或改变哪一个动作”。 |\n| L22 | [把资料和经验变成可复用知识](lessons/L22-把资料和经验变成可复用知识.md) | 学到一个方法或经历一次问题后，能留下一张以后找得到、看得懂、知道什么时候用的笔记。 |\n| L23 | [安排个人目标与每日动作](lessons/L23-安排个人目标与每日动作.md) | 一天事情很多时，能排出“今天先做哪几件、每件做到什么算完成、等别人回复时还能做什么”。 |\n| L24 | [完成一次独立业务分析](lessons/L24-完成一次独立业务分析.md) | 遇到一个没练过的客户和询盘时，能独立说清“值不值得继续了解、先问什么、找谁评估、现在怎么回复、下一步做什么”；条件变化后能改对自己的记录。 |\n\n## 作业与参考答案怎样使用\n\n每课“参考思路”解释判断依据，不要求措辞完全相同。涉及多个合理选择时，只要说明事实、条件和取舍即可。练习中新增的数字、时间与技术条件必须注明为假设，不能伪装成案例已知信息。\n\n每课留下的作业，能让明天的自己知道“看到了什么、为什么这样判断、还要确认什么、接下来做什么”即可。模拟练习的完成，看你能否作出这些判断；不以客户回复、选定行业或拿到订单作为完成条件。\n\n## 来源与边界\n\n- [原始 PDF](../../reference/业务管理系统导图.pdf)是内容起点；[核对报告](../PDF原图解读与文档校准.md)说明原图与衍生文档的区别。\n- [案例包](案例包.md)、讲解、练习与达标标准为本次教学编排。例中企业、人员、条件和价格全部是虚构训练材料。\n- [课程来源与覆盖说明](课程来源与覆盖说明.md)列出各模块对应原图的位置、衍生资料及未展开的范围。\n- 当前版本为 1.1：24 课已按具体业务情境重写目标、讲解、分步练习和自检，并更新参考思路与总览。不包含学习者完成记录，也不预设你已掌握任何一课。\n",
    "crm/业务管理系统结构化需求.md": "# 业务管理系统结构化需求\n\n## 1. 文档目的\n\n本文基于《业务管理系统导图.pdf》整理，将原导图中的业务部管理、业务开发、客户背景调查、销售推进、报价、技术评审、复盘和知识管理内容，转化为可用于产品设计、系统开发和流程落地的结构化需求。\n\n本文不是最终 UI 原型，也不是数据库详细设计，而是业务需求到系统需求之间的中间版本，用于统一业务边界、角色、流程、模块、字段、状态和指标口径。\n\n## 2. 系统定位\n\n业务管理系统的核心目标是帮助业务团队完成从客户发现到报价成交、从项目复盘到知识沉淀的闭环管理。\n\n系统应覆盖以下主链路：\n\n```text\n客户建档 -> 客户背景调查 -> 需求/询价 -> 商机立项 -> 技术评审 -> 报价 -> 谈判跟进 -> 成单/丢单 -> 复盘沉淀\n```\n\n系统的重点不是单纯记录客户信息，而是把业务判断、技术判断、报价依据、跟进动作和复盘结果沉淀为可追踪、可复用、可分析的数据资产。\n\n## 3. 适用业务场景\n\n### 3.1 主要场景\n\n- 制造业、零件加工、定制产品、非标件、项目型销售。\n- 客户提供 2D/3D 图纸、样品、规格、材料或加工需求后，业务、技术、报价团队共同完成评估和报价。\n- 销售过程需要识别客户背景、关键人、采购流程、预算、竞争对手、项目真实性和合作风险。\n- 报价不是简单填价格，而是需要结合材料、工艺、数量、MOQ、交期、质量要求、包装运输、利润和风险综合判断。\n\n### 3.2 暂不覆盖场景\n\n- 完整 ERP 生产排产。\n- 财务总账、库存核算、采购付款等财务系统。\n- 车间 MES 过程管理。\n- 复杂 HR 招聘系统。\n\n这些能力可作为后续集成或二期扩展，不纳入第一阶段核心范围。\n\n## 4. 用户角色\n\n| 角色 | 主要职责 | 关键权限 |\n| --- | --- | --- |\n| 销售/业务员 | 开发客户、录入客户信息、跟进商机、发起询价和报价、维护沟通记录 | 新建客户、商机、询价；查看本人客户；提交报价申请；维护跟进 |\n| 业务经理 | 管理团队目标、审核重点客户和重点报价、查看团队数据 | 查看团队客户和商机；审批报价；分配负责人；查看报表 |\n| 报价工程师 | 根据客户需求、图纸、材料、工艺、数量和交期形成报价 | 查看报价资料；填写成本、工艺、报价明细；输出报价单 |\n| 技术/工艺工程师 | 评估图纸、结构、材料、工艺、质量风险和 DFM 建议 | 填写技术评审；提交工艺建议；标记风险 |\n| 采购/供应链 | 提供材料、外协、供应商价格和交期支持 | 维护供应商报价、材料价格、外协价格、交期 |\n| 财务/成本 | 审核成本、利润、税费、付款条件和价格合规性 | 查看报价成本；审核利润率和付款条件 |\n| 总经理/老板 | 查看关键客户、重点商机、报价转化、团队绩效和经营指标 | 全局查看；高权限审批；查看经营报表 |\n| 系统管理员 | 管理用户、角色、字典、审批流和基础配置 | 系统配置、权限配置、数据字典配置 |\n\n## 5. 核心业务对象\n\n| 对象 | 说明 | 关键关联 |\n| --- | --- | --- |\n| 客户 | 企业客户、潜在客户、历史客户 | 联系人、行业、商机、询价、报价、订单 |\n| 联系人/关键人 | 客户组织内的决策者、使用者、影响者、采购、技术等 | 客户、沟通记录、决策链 |\n| 商机 | 一个可跟进的销售机会或项目机会 | 客户、需求、询价、报价、跟进、竞争分析 |\n| 需求/询价 | 客户明确或隐含的产品、加工、服务需求 | 商机、图纸、技术评审、报价 |\n| 技术评审 | 对需求、图纸、材料、结构、工艺、质量和风险的判断 | 询价、报价、DFM 反馈 |\n| 报价 | 面向客户的价格方案和商务条件 | 询价、成本明细、审批、报价单、反馈 |\n| 跟进记录 | 销售过程中的电话、微信、邮件、会议、拜访记录 | 客户、联系人、商机、报价 |\n| 合同/NDA | 合作前后的法律和保密文件 | 客户、商机、报价、订单 |\n| 复盘 | 成单、丢单、报价失败、客户反馈的经验沉淀 | 商机、报价、客户、知识库 |\n| 知识条目 | 可复用的经验、案例、行业信息、报价经验 | 客户类型、行业、材料、工艺、案例 |\n\n## 6. 业务主流程\n\n### 6.1 客户建档\n\n目标：建立统一客户档案，避免客户信息散落在个人微信、表格和聊天记录中。\n\n流程：\n\n1. 销售新建客户。\n2. 填写基础信息：公司名称、国家/地区、地址、官网、行业、主营产品、规模、来源。\n3. 填写客户类型：潜在客户、目标客户、询价客户、成交客户、重点客户、沉睡客户。\n4. 录入联系人和关键人。\n5. 业务经理可分配客户负责人和协同人员。\n\n输出：\n\n- 客户档案。\n- 客户负责人。\n- 客户初始评级。\n\n### 6.2 客户背景调查\n\n目标：判断客户是否值得投入资源，识别客户需求、采购能力、决策链和风险。\n\n调查维度：\n\n- 官方信息：官网、新闻、政府报告、行业报告、认证资质。\n- 行业信息：行业趋势、客户所在领域、需求变化、痛点。\n- 公司信息：成立时间、注册资本、主营产品、规模、风险、可控能力。\n- 组织架构：CEO、CTO、采购、项目、质量、设计、工程等角色。\n- 关键人：权责、关注点、需求、痛点、影响力。\n- 采购流程：发现需求、内部酝酿、采购设计、评估比较、购买承诺、使用维护。\n\n状态：\n\n```text\n未调查 -> 调查中 -> 待补充 -> 已完成 -> 已归档\n```\n\n输出：\n\n- 客户背景调查表。\n- 客户价值判断。\n- 是否进入商机跟进的建议。\n\n### 6.3 需求/询价管理\n\n目标：把客户的模糊需求转化为可评估、可报价、可执行的结构化需求。\n\n需求来源：\n\n- 客户主动询价。\n- 销售挖掘需求。\n- 老客户复购。\n- 展会、官网、广告、社媒、转介绍。\n\n需求字段：\n\n- 产品名称/项目名称。\n- 应用场景。\n- 使用环境：室内、户外、泡油、运水、传运、撞击、耐高温、防漏水、防静电、硬度等。\n- 所属设备：航空、医疗、汽车、电子设备、自动化设备、内部结构件、主要装配件、重要传动件等。\n- 功能与效果：装配、拉位、夹紧、传动、紧配、松配、顺滑等。\n- 图纸/资料：2D、3D、样品、规格书、图片、视频。\n- 材料要求。\n- 表面处理要求。\n- 数量、MOQ、年度需求、月度需求、分批需求。\n- 质量标准和验收标准。\n- 交期要求。\n- 预算范围。\n- 付款条件。\n\n状态：\n\n```text\n草稿 -> 待补充资料 -> 待技术评审 -> 技术评审中 -> 可报价 -> 暂不报价 -> 已关闭\n```\n\n### 6.4 商机管理\n\n目标：将客户需求转化为可跟进的销售机会，并持续管理下一步动作。\n\n商机阶段：\n\n```text\n线索 -> 已识别需求 -> 已确认项目 -> 技术评审 -> 报价中 -> 谈判中 -> 成交 -> 丢单 -> 搁置\n```\n\n商机评估维度：\n\n- 客户是否真实。\n- 项目是否真实。\n- 是否有明确需求。\n- 是否有预算。\n- 是否有决策人。\n- 是否有明确交期。\n- 是否存在竞争对手。\n- 我方是否有技术/成本/交付优势。\n- 是否符合公司目标客户定位。\n\n关键动作：\n\n- 记录每次沟通。\n- 设置下一步跟进时间。\n- 标记关键人态度。\n- 维护竞争对手与客户关注点。\n- 生成报价申请。\n\n### 6.5 技术评审/DFM\n\n目标：在报价前识别技术可行性、加工难度、材料风险、质量风险和成本影响。\n\n评审维度：\n\n- 图纸完整性：2D/3D 是否齐全，尺寸、公差、材料、表面处理是否明确。\n- 材料分析：金属、塑料、复合材料、替代材料、国产/进口材料。\n- 结构分析：几何形状、复杂度、公差、装夹、定位、刀具路径、加工稳定性。\n- 工艺分析：CNC、车削、铣削、钻孔、钣金、成型、热处理、表面处理等。\n- 表面处理：氧化、喷涂、电镀、抛光、喷砂、防腐、防水、防火等。\n- 质量风险：验收标准、检测方式、关键尺寸、长期使用可靠性。\n- 交付风险：交期、外协、物料、设备产能。\n- DFM 建议：结构优化、材料替代、工艺替代、降低成本、提升良率。\n\n状态：\n\n```text\n待评审 -> 评审中 -> 需客户补充 -> 需内部确认 -> 可报价 -> 有风险可报价 -> 不建议报价\n```\n\n输出：\n\n- 技术评审结论。\n- DFM 建议。\n- 风险等级。\n- 报价输入条件。\n\n### 6.6 报价管理\n\n目标：形成可追溯、可审批、可复用的报价过程。\n\n报价前置条件：\n\n- 客户信息完整。\n- 需求资料完整。\n- NDA 或保密要求已确认。\n- 图纸/技术资料已归档。\n- 技术评审已完成。\n- 数量、MOQ、交期、付款条件已明确或已标记不确定项。\n\n报价构成：\n\n- 材料成本。\n- 加工成本。\n- 表面处理成本。\n- 外协成本。\n- 检测成本。\n- 包装成本。\n- 运输成本。\n- 管理成本。\n- 税费。\n- 利润率。\n- 风险预留。\n\n报价状态：\n\n```text\n草稿 -> 待技术输入 -> 待成本核算 -> 待业务确认 -> 待审批 -> 已批准 -> 已发送客户 -> 客户反馈中 -> 已成交 -> 已丢单 -> 已作废\n```\n\n审批规则建议：\n\n- 利润率低于阈值时，必须业务经理审批。\n- 金额超过阈值时，必须总经理审批。\n- 交期明显压缩时，必须生产/供应链确认。\n- 付款条件异常时，必须财务确认。\n- 有重大技术风险时，必须技术负责人确认。\n\n### 6.7 谈判跟进\n\n目标：将报价后的客户反馈、价格谈判、条件调整和推进动作结构化。\n\n跟进内容：\n\n- 客户是否收到报价。\n- 客户对价格、交期、质量、付款、样品、MOQ 的反馈。\n- 竞争对手报价情况。\n- 是否需要重新报价。\n- 是否需要提供样品、资料、案例或技术解释。\n- 下一步行动和时间。\n\n状态：\n\n```text\n已报价 -> 已读/已确认 -> 等待客户反馈 -> 议价中 -> 方案调整 -> 二次报价 -> 成交 -> 丢单 -> 长期跟进\n```\n\n### 6.8 成单/丢单复盘\n\n目标：把结果转化为经验，提升报价转化率和团队判断能力。\n\n成单复盘：\n\n- 客户成交原因。\n- 我方优势。\n- 关键推动动作。\n- 报价和谈判经验。\n- 可复用案例。\n\n丢单复盘：\n\n- 丢单原因：价格、交期、质量、竞争对手、客户预算、需求变化、关系、技术能力、付款条件等。\n- 是否可挽回。\n- 后续跟进策略。\n- 内部需要改进的环节。\n\n复盘方法：\n\n- GRAI：Goal、Result、Analysis、Insight。\n- KISS：Keep、Improve、Start、Stop。\n- ORID：Objective、Reflective、Interpretive、Decisional。\n\n输出：\n\n- 复盘记录。\n- 知识库条目。\n- 客户标签更新。\n- 报价策略更新。\n\n## 7. 功能模块拆分\n\n### 7.1 客户中心\n\n功能：\n\n- 客户新增、编辑、合并、归档。\n- 客户标签。\n- 客户评级。\n- 客户背景调查。\n- 联系人/关键人管理。\n- 客户组织架构。\n- 客户历史商机、报价、订单、复盘记录。\n\n### 7.2 商机中心\n\n功能：\n\n- 商机创建。\n- 商机阶段管理。\n- 商机评分。\n- 竞争对手记录。\n- 下一步行动。\n- 跟进提醒。\n- 商机转询价/报价。\n\n### 7.3 询价中心\n\n功能：\n\n- 询价单创建。\n- 图纸和附件管理。\n- 需求字段结构化。\n- 资料完整性检查。\n- 提交技术评审。\n- 询价关闭和归档。\n\n### 7.4 技术评审中心\n\n功能：\n\n- 技术评审任务分配。\n- 图纸评审。\n- 材料、工艺、结构、质量、交期风险记录。\n- DFM 建议。\n- 技术结论。\n- 评审版本记录。\n\n### 7.5 报价中心\n\n功能：\n\n- 报价申请。\n- 报价成本明细。\n- 报价版本管理。\n- 报价审批。\n- 报价单生成。\n- 报价发送记录。\n- 报价反馈。\n- 重新报价。\n\n### 7.6 合同/NDA 管理\n\n功能：\n\n- NDA 上传与状态管理。\n- 合同文件管理。\n- 合同关键条款记录。\n- 付款条件记录。\n- 法务/财务审核记录。\n\n### 7.7 跟进与任务中心\n\n功能：\n\n- 电话、微信、邮件、会议、拜访记录。\n- 下一步动作。\n- 跟进提醒。\n- 逾期提醒。\n- WBS 任务拆解。\n- 团队协同任务。\n\n### 7.8 报表中心\n\n功能：\n\n- 客户数、有效客户数、重点客户数。\n- 商机数量、商机金额、阶段分布。\n- 报价数量、报价金额、报价及时率、报价转化率。\n- 成单金额、丢单金额、丢单原因分析。\n- 销售个人和团队绩效。\n- 行业、客户、材料、工艺维度分析。\n\n### 7.9 知识库\n\n功能：\n\n- 成功案例。\n- 失败案例。\n- 报价经验。\n- 客户类型经验。\n- 行业信息。\n- 材料/工艺知识。\n- 常见问题与标准回复。\n\n### 7.10 系统配置\n\n功能：\n\n- 用户与角色。\n- 权限配置。\n- 数据字典。\n- 审批流配置。\n- 报价模板。\n- 客户标签。\n- 商机阶段。\n- 风险等级。\n\n## 8. 核心字段建议\n\n### 8.1 客户字段\n\n| 字段 | 类型 | 必填 | 说明 |\n| --- | --- | --- | --- |\n| 客户名称 | 文本 | 是 | 企业名称 |\n| 客户简称 | 文本 | 否 | 便于内部识别 |\n| 国家/地区 | 选择 | 是 | 客户所在地 |\n| 行业 | 选择 | 是 | 所属行业 |\n| 官网 | URL | 否 | 官方信息来源 |\n| 客户来源 | 选择 | 是 | 展会、官网、转介绍、开发等 |\n| 客户等级 | 选择 | 否 | A/B/C 或重点/普通 |\n| 客户状态 | 选择 | 是 | 潜在、跟进、成交、沉睡、黑名单 |\n| 负责人 | 用户 | 是 | 主业务员 |\n| 协同人员 | 用户多选 | 否 | 技术、报价、经理等 |\n| 风险标签 | 多选 | 否 | 信用、付款、质量、交期等 |\n\n### 8.2 商机字段\n\n| 字段 | 类型 | 必填 | 说明 |\n| --- | --- | --- | --- |\n| 商机名称 | 文本 | 是 | 项目或需求名称 |\n| 客户 | 关联 | 是 | 所属客户 |\n| 商机阶段 | 选择 | 是 | 线索到成交/丢单 |\n| 预计金额 | 数值 | 否 | 预估订单金额 |\n| 成交概率 | 百分比 | 否 | 阶段或人工判断 |\n| 预计成交日期 | 日期 | 否 | 销售预测 |\n| 客户预算 | 文本/数值 | 否 | 已知预算 |\n| 竞争对手 | 文本/关联 | 否 | 竞争情况 |\n| 下一步动作 | 文本 | 是 | 明确下一步 |\n| 下次跟进时间 | 日期时间 | 是 | 跟进提醒 |\n\n### 8.3 询价字段\n\n| 字段 | 类型 | 必填 | 说明 |\n| --- | --- | --- | --- |\n| 询价编号 | 自动编号 | 是 | 系统生成 |\n| 产品/项目名称 | 文本 | 是 | 客户需求名称 |\n| 图纸附件 | 文件 | 视情况 | 2D/3D/样品资料 |\n| 材料要求 | 文本 | 否 | 客户指定材料 |\n| 工艺要求 | 文本 | 否 | 客户指定工艺 |\n| 表面处理 | 文本 | 否 | 氧化、喷涂、电镀等 |\n| 数量 | 数值 | 是 | 报价数量 |\n| 年度需求 | 数值 | 否 | 年度预测 |\n| MOQ | 数值 | 否 | 最小起订量 |\n| 交期要求 | 日期/文本 | 否 | 客户期望交付 |\n| 质量标准 | 文本 | 否 | 验收或检测要求 |\n| 付款条件 | 文本 | 否 | 账期、预付等 |\n\n### 8.4 技术评审字段\n\n| 字段 | 类型 | 必填 | 说明 |\n| --- | --- | --- | --- |\n| 图纸完整性 | 选择 | 是 | 完整/缺失/需确认 |\n| 材料可行性 | 选择 | 是 | 可行/替代/风险/不可行 |\n| 工艺路线 | 文本 | 是 | 主要加工方式 |\n| 结构复杂度 | 选择 | 是 | 低/中/高 |\n| 关键尺寸 | 文本 | 否 | 重点公差或关键点 |\n| 质量风险 | 选择 | 是 | 低/中/高 |\n| 交付风险 | 选择 | 是 | 低/中/高 |\n| DFM 建议 | 长文本 | 否 | 给客户或内部的优化建议 |\n| 评审结论 | 选择 | 是 | 可报价/有风险/不建议 |\n\n### 8.5 报价字段\n\n| 字段 | 类型 | 必填 | 说明 |\n| --- | --- | --- | --- |\n| 报价编号 | 自动编号 | 是 | 系统生成 |\n| 报价版本 | 文本 | 是 | V1/V2/V3 |\n| 客户 | 关联 | 是 | 所属客户 |\n| 询价 | 关联 | 是 | 来源询价 |\n| 材料成本 | 金额 | 是 | 成本项 |\n| 加工成本 | 金额 | 是 | 成本项 |\n| 表面处理成本 | 金额 | 否 | 成本项 |\n| 外协成本 | 金额 | 否 | 成本项 |\n| 包装运输 | 金额 | 否 | 成本项 |\n| 税费 | 金额/比例 | 否 | 成本项 |\n| 利润率 | 百分比 | 是 | 报价审核关键项 |\n| 报价单价 | 金额 | 是 | 给客户价格 |\n| 报价总额 | 金额 | 是 | 总价 |\n| 报价有效期 | 日期 | 是 | 过期需重报 |\n| 报价状态 | 选择 | 是 | 报价流转状态 |\n\n## 9. 状态流转汇总\n\n### 9.1 客户状态\n\n```text\n潜在客户 -> 目标客户 -> 跟进中 -> 已询价 -> 已成交 -> 复购客户\n                         -> 沉睡客户\n                         -> 无效客户\n                         -> 黑名单\n```\n\n### 9.2 商机状态\n\n```text\n线索 -> 已识别需求 -> 已确认项目 -> 技术评审 -> 报价中 -> 谈判中 -> 成交\n                                                        -> 丢单\n                                                        -> 搁置\n```\n\n### 9.3 报价状态\n\n```text\n草稿 -> 待技术输入 -> 待成本核算 -> 待业务确认 -> 待审批 -> 已批准 -> 已发送客户\n                                                                    -> 已作废\n已发送客户 -> 客户反馈中 -> 二次报价 -> 已成交\n                         -> 已丢单\n                         -> 长期跟进\n```\n\n## 10. 报表指标口径\n\n| 指标 | 公式/口径 | 用途 |\n| --- | --- | --- |\n| 报价及时率 | 按要求时间完成报价数 / 应完成报价数 | 衡量报价响应效率 |\n| 报价转化率 | 成交报价数 / 已发送报价数 | 衡量报价质量和销售转化 |\n| 商机转化率 | 成交商机数 / 有效商机数 | 衡量商机质量 |\n| 客户激活率 | 有有效跟进客户数 / 总客户数 | 衡量客户维护 |\n| 丢单率 | 丢单商机数 / 已关闭商机数 | 衡量竞争和内部问题 |\n| 平均报价周期 | 报价发送时间 - 询价创建时间 | 衡量跨部门协同效率 |\n| 平均技术评审周期 | 技术评审完成时间 - 技术评审提交时间 | 衡量技术支持效率 |\n| 毛利率 | (报价金额 - 成本金额) / 报价金额 | 衡量报价利润 |\n| 复盘完成率 | 已复盘关闭商机数 / 应复盘关闭商机数 | 衡量知识沉淀 |\n\n## 11. MVP 范围建议\n\n### 11.1 第一阶段：打通主流程\n\n目标：先解决客户、询价、技术评审、报价和跟进的闭环。\n\n必做模块：\n\n- 客户中心。\n- 联系人/关键人管理。\n- 商机中心。\n- 询价中心。\n- 技术评审。\n- 报价中心。\n- 跟进记录。\n- 基础报表。\n\n暂缓模块：\n\n- 招聘培训。\n- 复杂知识库。\n- 完整合同管理。\n- 复杂绩效管理。\n- ERP/MES/财务深度集成。\n\n### 11.2 第二阶段：强化审批和复盘\n\n目标：提升报价质量、复盘能力和管理可控性。\n\n建设内容：\n\n- 报价审批流。\n- 利润率和价格权限控制。\n- 成单/丢单复盘。\n- 报价版本对比。\n- 知识库沉淀。\n- 团队绩效报表。\n\n### 11.3 第三阶段：数据化经营\n\n目标：用数据支持客户选择、资源分配和经营决策。\n\n建设内容：\n\n- 客户评分模型。\n- 商机预测。\n- 行业/材料/工艺报价分析。\n- 销售漏斗。\n- DIKW 知识管理。\n- 与 ERP、MES、财务系统集成。\n\n## 12. 关键风险与待确认问题\n\n### 12.1 关键风险\n\n- 导图中方法论内容较多，若全部照搬到系统，会导致表单过重、用户不愿填写。\n- 报价涉及跨部门协同，如果没有明确责任人和 SLA，系统只会记录问题，不能解决效率问题。\n- 报价成本和利润属于敏感数据，权限设计必须谨慎。\n- 客户资料、图纸和 NDA 涉及保密，需考虑附件权限和操作日志。\n- 不同产品/工艺的报价字段差异较大，需要保留配置能力。\n\n### 12.2 待确认问题\n\n1. 当前团队规模是多少？销售、报价、技术、采购分别有几人？\n2. 报价现在由谁主导？销售、报价工程师还是老板？\n3. 是否已有 ERP、CRM、财务或生产系统？\n4. 报价单目前用 Excel、Word 还是其他软件生成？\n5. 是否需要中英文报价单？\n6. 是否需要客户门户，让客户在线提交询价和查看报价？\n7. 价格、成本、利润分别哪些角色可见？\n8. 报价审批阈值如何设置？按金额、利润率、客户等级还是项目风险？\n9. 成交后是否要继续管理订单、交期、发货、收款和售后？\n10. 第一阶段更优先解决“客户跟进混乱”还是“报价效率低”？\n\n## 13. 推荐落地顺序\n\n1. 先做客户、联系人、商机、询价和报价的最小闭环。\n2. 再把技术评审和报价成本明细做深。\n3. 接着加入审批、权限和报表。\n4. 最后沉淀知识库、复盘模型和经营分析。\n\n推荐第一版产品目标：\n\n```text\n任何一个客户询价，都能在系统里看到：\n客户是谁 -> 需求是什么 -> 谁负责 -> 技术怎么评 -> 报价怎么算 -> 报价发没发 -> 客户怎么反馈 -> 最后成没成 -> 为什么\n```\n\n",
    "crm/业务管理系统理解与团队落地手册.md": "# 业务管理系统理解与团队落地手册\n\n## 1. 使用目标\n\n本文用于帮助负责人自己理解《业务管理系统结构化需求》，并带团队在日常业务中用起来。\n\n落地目标不是让团队背概念，而是让团队形成统一的业务语言、统一的推进流程和统一的记录习惯。\n\n核心要求：\n\n```text\n每一个客户、每一次询价、每一份报价、每一个结果，都能说清楚：背景、需求、判断、动作、结果、复盘。\n```\n\n## 2. 三层理解框架\n\n### 2.1 第一层：业务逻辑\n\n业务逻辑回答的是“为什么要这样做”。\n\n一句话理解：\n\n```text\n业务的本质是识别有价值的客户，理解真实需求，提供可信方案，获得合理利润，并持续沉淀经验。\n```\n\n业务逻辑拆成 8 个问题：\n\n1. 客户是谁？\n2. 客户为什么需要我们？\n3. 客户真实需求是什么？\n4. 谁决定采购？\n5. 我们凭什么能赢？\n6. 报价依据是什么？\n7. 客户为什么成交或不成交？\n8. 这次经验以后能不能复用？\n\n负责人理解要求：\n\n- 不只看“客户问了什么”，还要看“客户为什么问”。\n- 不只看“能不能报价”，还要看“报价是否有依据”。\n- 不只看“有没有成交”，还要看“成交或丢单原因能否复用”。\n\n团队训练方式：\n\n- 每天选 1 个客户，让业务员用 3 分钟讲清楚客户背景、需求、下一步动作。\n- 每周选 1 个报价，让销售、技术、报价一起复盘报价依据是否充分。\n- 每月选 1 个成单和 1 个丢单案例，沉淀为团队案例。\n\n### 2.2 第二层：系统流程\n\n系统流程回答的是“业务在系统里怎么走”。\n\n主流程：\n\n```text\n客户建档 -> 背景调查 -> 需求/询价 -> 商机立项 -> 技术评审 -> 报价 -> 跟进谈判 -> 成单/丢单 -> 复盘沉淀\n```\n\n流程理解要点：\n\n| 环节 | 核心问题 | 产出 |\n| --- | --- | --- |\n| 客户建档 | 这个客户是谁，是否值得跟进？ | 客户档案 |\n| 背景调查 | 客户背景、行业、关键人、采购流程是否清楚？ | 背景调查表 |\n| 需求/询价 | 客户到底要什么，资料是否完整？ | 询价单 |\n| 商机立项 | 这个机会是否真实，是否值得投入？ | 商机记录 |\n| 技术评审 | 能不能做，难点和风险是什么？ | 技术评审结论 |\n| 报价 | 价格怎么算，利润和风险是否合理？ | 报价单 |\n| 跟进谈判 | 客户反馈是什么，下一步动作是什么？ | 跟进记录 |\n| 成单/丢单 | 结果是什么，原因是什么？ | 结果记录 |\n| 复盘沉淀 | 这次经验能否复用？ | 复盘/知识条目 |\n\n流程管理原则：\n\n- 没有客户档案，不进入正式商机。\n- 没有清楚需求，不进入技术评审。\n- 没有技术评审，不做正式报价。\n- 没有报价反馈，不关闭商机。\n- 没有成单/丢单原因，不算完成。\n\n### 2.3 第三层：日常动作\n\n日常动作回答的是“今天具体要做什么”。\n\n业务员每日动作：\n\n- 更新当天客户跟进记录。\n- 为每个活跃商机写清楚下一步动作和时间。\n- 对新询价补齐客户、需求、图纸、数量、交期、质量要求。\n- 对已发报价记录客户反馈。\n- 对逾期未跟进客户做处理。\n\n业务经理每日动作：\n\n- 查看新增客户和新增商机。\n- 检查重点商机是否有下一步动作。\n- 检查待报价、待技术评审、待客户反馈事项。\n- 处理需要审批或协调的问题。\n\n技术/报价人员每日动作：\n\n- 查看待评审、待报价任务。\n- 标记资料缺失项。\n- 输出技术风险、工艺建议、报价条件。\n- 对高风险报价提出内部提醒。\n\n## 3. 业务员操作清单\n\n### 3.1 新客户第一次录入\n\n必须填写：\n\n- 客户名称。\n- 国家/地区。\n- 行业。\n- 客户来源。\n- 主营产品或应用领域。\n- 联系人姓名和职位。\n- 当前需求或潜在需求。\n- 负责人。\n- 下一步动作。\n\n建议补充：\n\n- 官网。\n- 公司规模。\n- 认证资质。\n- 关键人判断。\n- 采购角色。\n- 竞争对手。\n- 客户等级。\n\n合格标准：\n\n```text\n别人接手这个客户时，能在 3 分钟内知道客户是谁、做什么、为什么值得跟、下一步该做什么。\n```\n\n### 3.2 收到客户询价\n\n先问 10 个问题：\n\n1. 客户要做什么产品或零件？\n2. 用在什么行业、设备或场景？\n3. 有没有 2D/3D 图纸、样品或规格书？\n4. 材料是否指定？\n5. 表面处理是否指定？\n6. 数量是多少？是否有年度/月度需求？\n7. 交期要求是什么？\n8. 质量或验收标准是什么？\n9. 预算或目标价是否明确？\n10. 这次询价是真实项目、比价、测试供应商，还是收集信息？\n\n资料不完整时，不要直接丢给报价。先标记缺失项，并向客户补问。\n\n### 3.3 商机推进\n\n每个活跃商机必须有：\n\n- 当前阶段。\n- 负责人。\n- 客户关键人。\n- 客户需求。\n- 预计金额。\n- 成交概率。\n- 下一步动作。\n- 下次跟进时间。\n\n不合格商机示例：\n\n```text\n客户有兴趣，等回复。\n```\n\n合格商机示例：\n\n```text\n客户采购经理 John 已确认 5000 件 CNC 铝件需求，等技术确认公差和表面处理成本；6 月 20 日前给 V1 报价，下一步由 Tina 向客户补问年度用量和目标交期。\n```\n\n### 3.4 报价后跟进\n\n报价发出后必须记录：\n\n- 报价发送时间。\n- 报价版本。\n- 报价金额。\n- 客户是否确认收到。\n- 客户反馈点：价格、交期、质量、付款、MOQ、样品、技术问题。\n- 是否需要二次报价。\n- 下一步动作和时间。\n\n跟进节奏建议：\n\n- 报价当天确认客户是否收到。\n- 2 个工作日内追问初步反馈。\n- 5 个工作日内判断是否进入议价、补资料或长期跟进。\n- 超过 14 天无反馈，标记为低活跃或长期跟进。\n\n## 4. 技术/报价操作清单\n\n### 4.1 技术评审\n\n技术评审必须回答：\n\n- 图纸是否完整？\n- 材料是否可行？\n- 工艺路线是什么？\n- 结构复杂度如何？\n- 关键尺寸和公差在哪里？\n- 是否需要特殊设备、刀具、夹具或外协？\n- 质量风险是什么？\n- 交期风险是什么？\n- 是否有 DFM 建议？\n- 是否建议报价？\n\n评审结论只能选：\n\n```text\n可报价 / 有风险可报价 / 需客户补充 / 暂不建议报价 / 不可报价\n```\n\n### 4.2 报价分析\n\n报价必须至少包含：\n\n- 材料成本。\n- 加工成本。\n- 表面处理成本。\n- 外协成本。\n- 包装运输成本。\n- 税费。\n- 利润率。\n- 风险预留。\n- 报价有效期。\n- 交期。\n- MOQ。\n- 付款条件。\n\n报价前检查：\n\n- 是否有客户和商机来源？\n- 是否有关联询价？\n- 是否有技术评审？\n- 是否有成本明细？\n- 是否有利润率？\n- 是否需要审批？\n\n## 5. 管理者检查清单\n\n### 5.1 每日 15 分钟检查\n\n每天只看 5 件事：\n\n1. 今天新增了哪些客户？\n2. 哪些商机没有下一步动作？\n3. 哪些询价卡在资料缺失？\n4. 哪些报价卡在技术、成本或审批？\n5. 哪些报价发出后没有客户反馈？\n\n### 5.2 每周业务会\n\n会议时间建议 45-60 分钟。\n\n固定议程：\n\n1. 本周新增客户和重点客户。\n2. 本周新增询价和重点商机。\n3. 待技术评审和待报价问题。\n4. 已报价客户反馈。\n5. 成交/丢单案例。\n6. 下周重点动作。\n\n会议要求：\n\n- 不讨论空泛感觉，只讨论客户、需求、报价、动作、结果。\n- 每个重点商机必须明确负责人、动作和时间。\n- 会议结束后，系统里的下一步动作必须更新。\n\n### 5.3 每月复盘会\n\n固定复盘：\n\n- 成交最多的客户类型。\n- 丢单最多的原因。\n- 报价转化率。\n- 报价及时率。\n- 技术评审瓶颈。\n- 哪些经验可以沉淀为模板。\n\n复盘输出：\n\n- 1 个成功案例。\n- 1 个失败案例。\n- 1 条报价策略调整。\n- 1 条客户开发方向调整。\n- 1 条内部流程改进。\n\n## 6. 常用模板\n\n### 6.1 客户背景说明模板\n\n```text\n客户名称：\n国家/地区：\n行业/应用：\n主营产品：\n客户来源：\n客户当前需求：\n关键联系人：\n决策链判断：\n客户价值判断：\n主要风险：\n下一步动作：\n负责人：\n下次跟进时间：\n```\n\n### 6.2 询价信息模板\n\n```text\n客户：\n产品/零件名称：\n使用场景：\n图纸/资料：\n材料：\n表面处理：\n数量：\n年度/月度需求：\nMOQ：\n交期：\n质量标准：\n付款条件：\n客户目标价/预算：\n缺失资料：\n是否提交技术评审：\n```\n\n### 6.3 技术评审模板\n\n```text\n图纸完整性：\n材料可行性：\n建议材料/替代材料：\n工艺路线：\n结构复杂度：\n关键尺寸/公差：\n质量风险：\n交付风险：\n是否需要外协：\n是否需要样品：\nDFM 建议：\n评审结论：\n评审人：\n完成时间：\n```\n\n### 6.4 报价复盘模板\n\n```text\n客户：\n商机/询价：\n报价版本：\n报价金额：\n客户反馈：\n最终结果：成交 / 丢单 / 长期跟进\n成交原因：\n丢单原因：\n我们做对了什么：\n我们做错了什么：\n下次如何改进：\n可沉淀经验：\n```\n\n## 7. 30 天落地计划\n\n### 第 1 周：统一语言\n\n目标：团队理解主流程和 5 个核心对象。\n\n动作：\n\n- 组织 1 次 60 分钟培训，讲清楚主流程。\n- 让每个人用自己的客户案例套一遍流程。\n- 明确客户、商机、询价、技术评审、报价的定义。\n- 选 3 个真实客户作为试点。\n\n验收：\n\n- 每个人能说清楚主流程。\n- 试点客户完成客户档案和商机记录。\n\n### 第 2 周：规范记录\n\n目标：让团队开始按模板记录客户、询价和跟进。\n\n动作：\n\n- 使用客户背景说明模板。\n- 使用询价信息模板。\n- 每天检查活跃商机下一步动作。\n- 发现资料不完整时，统一标记缺失项。\n\n验收：\n\n- 试点客户的资料完整度提升。\n- 所有活跃商机都有下一步动作和时间。\n\n### 第 3 周：打通报价\n\n目标：让技术评审和报价过程结构化。\n\n动作：\n\n- 使用技术评审模板。\n- 报价前必须有关联客户、商机、询价和技术评审。\n- 报价后必须记录客户反馈。\n- 选 2 个报价做内部复盘。\n\n验收：\n\n- 报价依据能被追溯。\n- 报价卡点能被看见。\n\n### 第 4 周：复盘和固化\n\n目标：形成团队固定节奏。\n\n动作：\n\n- 开一次月度复盘会。\n- 复盘至少 1 个成单和 1 个丢单。\n- 提炼 3 条可复用经验。\n- 确定下月要优化的 1 个流程问题。\n\n验收：\n\n- 团队有固定周会和复盘机制。\n- 有可复用案例进入知识库。\n\n## 8. 负责人掌握标准\n\n你自己理解到位的标准：\n\n- 能用 3 分钟讲清楚系统主流程。\n- 能判断一个客户档案是否合格。\n- 能判断一个询价是否可以进入技术评审。\n- 能判断一份报价是否有依据。\n- 能追问业务员下一步动作是否清楚。\n- 能组织一次成单/丢单复盘。\n\n你带团队用起来的标准：\n\n- 团队说客户时，不再只说“客户有兴趣”，而是说清楚客户、需求、关键人、预算、下一步。\n- 团队报报价时，不再只说“价格发了”，而是说清楚报价依据、利润、风险、反馈。\n- 团队复盘时，不再只说“价格高了”，而是能分析客户、竞争、技术、交期、关系、策略等原因。\n- 业务信息不再只留在个人聊天记录里，而是沉淀到统一记录中。\n\n## 9. 最小执行纪律\n\n第一阶段只抓 6 条纪律：\n\n1. 新客户必须建档。\n2. 活跃商机必须有下一步动作和时间。\n3. 询价资料缺失必须标记。\n4. 正式报价前必须技术评审。\n5. 报价发出后必须记录客户反馈。\n6. 成单/丢单必须写原因。\n\n这 6 条执行稳定后，再逐步引入审批、报表、知识库和绩效管理。\n\n",
    "personal/PDF原图解读与文档校准.md": "# PDF 原图解读与文档校准：精密制造外贸 SOLO 版\n\n适用背景：个人做精密制造外贸，目前找客户；先理解资料，再逐步练习业务。暂不建设 CRM，也不学习团队组织管理。\n\n原始资料：[业务管理系统导图.pdf](../reference/业务管理系统导图.pdf)。文件只有 1 页，是一幅长图，中心标题为“业务部管理系统”。本次核对了整图主干及下文涉及的重点分支；本报告是解读与对照，不是逐字转写或技术标准校审。\n\n文中明确区分三种内容：**原图内容**、**现有文档的整理**、**针对你当前阶段的学习建议**。精密制造案例为教学举例，不代表已经验证的客户或供应能力。\n\n## 1. 为什么读起来密集\n\n原图把不同用途的内容放在同一张图里：人员与部门管理、客户开发、客户采购心理与角色、项目需求、制造技术、报价、复盘，以及若干销售观点和促销办法。\n\n它不是按新手学习顺序写成的教材。“系统”在这张图中包含业务管理方法，不能仅按软件系统来理解。\n\n可见的一级分支共 13 个：招聘、业务部管理、业务开发、客户背景调查、了解项目背景、报价、组织架构，以及组合促销、指定促销、附加值促销、另类促销、纪念式促销、名义主题促销。以下按用途归为六组，方便阅读；这是学习分组，不改变原图层级。\n\n| 分组 | 原图在讲什么 | 对你的当前用途 |\n| --- | --- | --- |\n| 人员与组织 | 招聘、部门管理、组织架构 | 暂放后面；个人目标与工作计划可留下 |\n| 业务开发 | 开发工具、开发信、电话、社媒、线下、业务支持、商业逻辑、客户原则 | 现在重点理解：通过什么方式，让哪些人认识你，以及你能提供什么价值 |\n| 客户背景调查 | 行业、公司、组织角色、联系、关系、匹配度、供应资源 | 现在重点理解：谁可能匹配、找谁交流、依据是什么 |\n| 了解项目背景 | 需求、采购过程、零件用途、项目目的、预算及专业服务等 | 先理解“为什么买”；详细询价问题留到出现项目时使用 |\n| 报价 | 报价条件、分析、策略、技术反馈、结果复盘、知识积累 | 先看整体关系；工艺与成本细节按项目学习 |\n| 六类促销 | 不同的促销构思 | 当前不必逐项学；未来按客户采购方式、产品和自身条件筛选 |\n\n图像定位：[整图缩略图](../verification/pdf-source/page-01-overview.png)、[中心与左侧分支](../verification/pdf-source/root-branches.png)、[业务开发放大图](../verification/pdf-source/development.png)。\n\n## 2. 对你有用的主线，要从“匹配”开始\n\n**我能协调什么可靠能力 → 哪类客户可能需要 → 找到相关的人 → 弄清需求与采购阶段 → 提供合适的方案 → 获得反馈并改进判断。**\n\n这是针对你当前阶段重排的学习顺序。现有文档里的“客户建档 → 询价 → 技术评审 → 报价”可以帮助管理已经进入视野的项目，但还需要前面的客户选择和匹配判断。\n\n“精密制造”目前只是一个方向。逐步理解原图时，要把它具体到：某类零件或应用、可对接的加工与检验能力、适合的客户场景，以及仍需验证的条件。现在不要求一次确定最终细分市场。\n\n## 3. 先理解这五块\n\n### 第一块：业务开发——渠道、对象、价值要连起来\n\n**原图内容：**开发信、电话、社媒、线下等渠道，与业务支持、商业逻辑、客户原则并列出现；原图还提到价值主张、资源配置和竞争分析。\n\n**白话解释：**“在哪里联系客户”和“为什么值得联系这位客户”是两个问题。工具帮你接触人，匹配判断帮助你决定说什么。\n\n**精密制造例子：**同样介绍加工服务，面对新设备研发团队，可以先了解其样件开发与供应评估需求；面对已有成熟采购体系的企业，可以先了解供应商进入条件。这是可检验的沟通假设，不能仅凭行业名称认定对方正在采购。\n\n**你现在要会：**用一句话说出“我想接触哪类客户，依据是什么，希望验证什么”。原图列出了渠道，但没有展开成完整的渠道操作教程。\n\n### 第二块：客户背景调查——为判断收集信息\n\n**原图内容：**行业匹配、我方定位、供应链与技术/服务团队、公司信息、角色权责、关注点和痛点。它还给出“找到目标客户 → 找到关键人 → 了解需求 → 建立信任……”的总结。\n\n**白话解释：**公司介绍是原材料，你需要从中形成一个有依据、可以继续验证的判断。\n\n**精密制造例子：**“官网展示自动化设备”是已观察到的内容；“它可能需要定制零件”是推测；“它正在外包采购我能提供的零件”仍待确认。三句话的确定程度不同。\n\n**你现在要会：**分别写出事实、推测、待确认问题，而不是搜到一家企业就把它认定为有效采购机会。\n\n### 第三块：角色与采购过程——客户内部怎样形成购买决定\n\n**原图内容：**设计师、项目工程师、品质工程师、采购工程师等角色；“客户采购流程表”列出发现需求、内部酝酿、采购设计、评估比较、购买承诺、使用维护。\n\n**白话解释：**你的销售进度和客户内部的采购进度需要分别理解。你已经介绍了产品，不代表对方已经决定购买；对方索取资料，也可能仍在评估供应商。\n\n| 对方角色 | 可以了解的内容举例 | 不要直接假定 |\n| --- | --- | --- |\n| 采购 | 供应商评估方式、报价比较条件、采购安排 | 采购一定能独立决定所有技术与质量条件 |\n| 工程/设计 | 零件用途、关键要求、设计是否确定、需要哪些技术资料 | 工程师认可就等于订单获批 |\n| 质量 | 验收要求、检验资料、供应商质量要求 | 只要价格合适就能通过质量评估 |\n\n上表是将原图角色观点用于个人业务的教学解释，实际职责以客户说明为准。\n\n**你现在要会：**先确认联系人的职责和当前任务，再决定问什么。客户尚无明确项目时，不强行套用整套询价清单。\n\n图像定位：[客户调查、采购过程与需求放大图](../verification/pdf-source/customer-and-buying.png)。\n\n### 第四块：项目背景——从“是什么零件”走向“为什么需要它”\n\n**原图内容：**零件使用环境、所属设备、功能与效果、重点管控位置、所处阶段、其他要求、过往问题，以及开展项目的目的。\n\n**白话解释：**客户报出材料和数量之后，你还要理解影响这次交付的要求。知道用途有助于提出问题，但不代表你可以自行推定公差、材料或验收标准。\n\n**精密制造例子：**同样是一件铝制支架，用途、装配关系、外观要求与交付阶段不同，需要确认的问题可能不同。把这些条件记录下来，再向工厂或技术人员取得结论。\n\n**你现在要会：**知道这些问题为什么存在。正式询盘出现后，再围绕影响当前判断的项目逐步补问。\n\n图像定位：[项目背景放大图](../verification/pdf-source/project-context.png)。\n\n### 第五块：报价反馈——分清三个方向\n\n原图“报价”分支很大，其中“报价反馈”包含技术要求、材料、结构、表面处理、数量、工艺、交期、包装、过往质量经验，以及给客户的反馈和内部复盘。\n\n| 方向 | 具体意思 | 教学举例 |\n| --- | --- | --- |\n| 我方向客户反馈 | 说明对需求的理解、待确认问题、制造可行性与方案条件 | 工厂提出某处要求需要澄清，由你连同依据发给客户确认 |\n| 客户向我方反馈 | 客户对价格、方案或条件的反应 | 客户反馈交期不符合计划，需进一步确认实际时间要求 |\n| 我方内部复盘 | 分析这次判断、报价和沟通的结果 | 是早期没有问清时间，还是实际供应能力无法满足 |\n\n现有文件较常把“报价反馈”用于第二种意思。阅读原图时，需要保留第一种和第三种意思；技术评审与技术反馈也不能被“发一个价格”代替。\n\n原图举出更改公差、结构、材料等反馈例子。对个人业务员，学习点是“有依据地提出并请求确认”，不能照抄某个数值、擅自修改要求或承诺能够加工。\n\n图像定位：[报价条件放大图](../verification/pdf-source/quote-conditions.png)、[报价反馈与复盘放大图](../verification/pdf-source/last-bottom.png)。\n\n## 4. 与现有文档核对后的六处校准\n\n| 内容 | 原图与现有文档的关系 | 你应怎样读 |\n| --- | --- | --- |\n| 文档目的 | 原图混合经营、开发、技术和管理经验；《结构化需求》开头明确将它转成产品设计、系统开发和流程落地材料 | 该文件是一次用途转换，不能视为原图逐字说明 |\n| 找客户 | 原图明确列出开发渠道、匹配、价值主张、联系和信任；衍生材料较多用建档字段、商机状态承接 | 当前学习应补回“为什么选这类客户、为什么联系他” |\n| 采购过程 | 《结构化需求》第 6.2 节保留了采购阶段名称，但后续操作重心在我方流程 | 另练客户内部采购进度与我方动作的对应关系 |\n| 报价反馈 | 原图含大量我方技术分析、对客户反馈及复盘；《实施总清单》等较常用它指已报价后的客户反馈 | 使用时明确谁向谁反馈，不把几个概念混在一起 |\n| 执行规则 | 30 天试点、验收比例、固定跟进天数等出现在衍生材料中 | 属于现有文档的执行设计；本次未在原图重点核对分支找到对应固定要求，不能标成原图原话或普遍规则 |\n| 练习案例 | Northstar 等示例文件已明确说明客户为虚拟 | 用来学表达与分析，不当作实际价格、加工能力或真实交易证据 |\n\n保留这些文档作为各自用途的资料，不需要全部重写。个人阅读时，先以本报告恢复原图语境，再按问题查原有文档。\n\n## 5. 原图里的哪些内容先不照搬\n\n这张图的每个句子不具有同样的性质。读的时候可以标四类：业务问题、经验观点、企业规则、需要专业确认的技术内容。\n\n- **销售观点与性格分类**：原图有六个销售思考观点，以及猫头鹰、老虎等沟通分类。可用来提醒自己观察交流偏好；原图没有给出足以把这些分类、绝对化判断或百分比当作普遍定律的证据。\n- **企业经营策略**：新客户引流报价、促销、免费打样等属于可选策略。你是否使用，要根据自己的成本、客户与合作条件决定。\n- **企业操作要求**：原图出现数量对应的生产资料要求、包装重量条件等。它们带有具体业务做法的语境，不自动成为你所有订单的规则。\n- **技术和合同内容**：当前学习先识别“需要确认的问题与负责方”。本报告没有验证原图中的材料、表面处理示例或合同表述是否适用于某个实际订单。\n\n同样，先前衍生文件中的“必须”“不得”“多少天”等，是给某种流程设定的执行要求。学习时先问它要防止什么问题，再判断你的实际业务怎么落地。\n\n## 6. 现在的阅读次序\n\n| 顺序 | 主题 | 学完能回答 |\n| --- | --- | --- |\n| 1 | 自己的能力与目标客户匹配 | 为什么这类客户值得我了解？哪些只是推测？ |\n| 2 | 联系人角色与采购过程 | 对方负责什么，现在在解决什么问题？ |\n| 3 | 需求与项目背景 | 客户说的要求背后，有什么用途和限制需确认？ |\n| 4 | 信任与专业价值 | 我能提供哪些真实资料或确认过的帮助？ |\n| 5 | 询盘、技术反馈与报价 | 已知条件是什么，谁来确认可行性和价格？ |\n| 6 | 跟进、结果与复盘 | 哪些判断被证实，下一次应改变什么？ |\n\n现在重点消化前四项，第五项先建立认识。复盘从第一次客户判断就能开始，不用等成交。\n\n完整课程已扩充为 [6 个模块、24 课](course/README.md)，从[第一课](course/lessons/L01-从精密制造能力到目标客户.md)开始。各课均含正文、案例、练习、参考思路和达标标准。\n\n## 7. 本次核对范围\n\n- 已保存原始 PDF 副本，保留桌面原文件；所有来源链接指向项目内副本。\n- 用分段放大图核对主干、重点节点和上文结论；原 PDF 无可提取文本层，机器识别有较多错字，未把识别结果当作准确转写。\n- 未逐字校审全部技术细节，也未进行外部法规、材料性能、行业标准或市场数据验证。\n- 本次没有把原图中的待办、观点或命令式表述当作用户要求执行的动作。\n",
    "crm/真实客户信息采集问卷.md": "# 真实客户信息采集问卷\n\n## 1. 使用目的\n\n这份问卷用于让业务员快速提交 3-5 个真实客户信息。\n\n可以直接复制到微信、邮件或在线表单中使用。收集后，再整理进：\n\n- [真实客户信息采集表.csv](./真实客户信息采集表.csv)\n- [团队试点客户台账模板.csv](./团队试点客户台账模板.csv)\n\n## 2. 给业务员的说明\n\n请每人选择 3 个正在跟进、最近询价、已报价或有代表性的客户填写。\n\n不要只写“有兴趣”“等回复”“客户嫌贵”。每个客户必须写清：\n\n```text\n客户是谁，需求是什么，现在卡在哪里，下一步谁在什么时候前做什么。\n```\n\n## 3. 单个客户填写模板\n\n请复制下面模板，每个客户填写一份。\n\n```text\n客户名称：\n国家/地区：\n行业/应用：\n客户来源：\n负责人：\n联系人/角色：\n\n一、业务逻辑\n1. 客户当前需求是什么？\n2. 客户为什么需要这个产品/服务？\n3. 客户最关注什么？价格、交期、质量、技术、付款、服务还是其他？\n4. 谁是决策人？谁是影响人？\n5. 我们凭什么可能赢？\n6. 当前最大风险是什么？\n\n二、系统流程\n1. 当前流程节点是哪一个？\n   客户建档 / 背景调查 / 需求询价 / 商机立项 / 技术评审 / 报价 / 跟进谈判 / 成单丢单 / 复盘沉淀\n2. 客户已经提供了哪些资料？\n3. 还缺哪些资料？\n4. 是否已经技术评审？结论是什么？\n5. 是否已经报价？报价版本和金额是多少？\n6. 客户已经反馈了什么？\n\n三、日常动作\n1. 当前最大卡点是什么？\n2. 下一步具体动作是什么？\n3. 下一步负责人是谁？\n4. 截止日期是什么？\n5. 完成标准是什么？\n\n备注：\n```\n\n## 4. 合格填写示例\n\n```text\n客户名称：Northstar Automation Inc.\n国家/地区：美国\n行业/应用：自动化设备\n客户来源：官网询盘\n负责人：Tina\n联系人/角色：John/采购经理，Anna/项目工程师\n\n一、业务逻辑\n1. 客户当前需求是什么？\n客户需要 500 件 CNC 铝件试产，测试通过后可能进入月度 3000-5000 件量产。\n\n2. 客户为什么需要这个产品/服务？\n客户现有本地供应商价格高、交期慢，正在寻找亚洲供应商。\n\n3. 客户最关注什么？\n第一关注交期和稳定质量，第二关注价格。\n\n4. 谁是决策人？谁是影响人？\nJohn 负责采购筛选和价格谈判，Anna 影响技术认可，运营经理可能最终批准。\n\n5. 我们凭什么可能赢？\n我们有类似 CNC 铝件加工经验，可提供 DFM 建议，交期比本地供应商短。\n\n6. 当前最大风险是什么？\n关键孔位 0.02mm 公差需要技术确认稳定加工能力。\n\n二、系统流程\n1. 当前流程节点是哪一个？\n技术评审。\n\n2. 客户已经提供了哪些资料？\n3D 图、PDF 图纸、材料要求。\n\n3. 还缺哪些资料？\n年度用量、目标交期、目标价、阳极氧化膜厚。\n\n4. 是否已经技术评审？结论是什么？\n正在评审，Chen 6 月 20 日前给结论。\n\n5. 是否已经报价？报价版本和金额是多少？\n未报价，等技术评审和缺失资料补齐。\n\n6. 客户已经反馈了什么？\n客户希望尽快获得试产和量产阶梯报价。\n\n三、日常动作\n1. 当前最大卡点是什么？\n资料不完整，关键公差风险未确认。\n\n2. 下一步具体动作是什么？\nTina 补问年度用量、目标交期、目标价和阳极氧化膜厚；Chen 完成关键公差评审。\n\n3. 下一步负责人是谁？\nTina、Chen。\n\n4. 截止日期是什么？\nTina 2026-06-21，Chen 2026-06-20。\n\n5. 完成标准是什么？\n客户回复缺失资料；技术给出可报价/有风险可报价/不建议报价结论。\n\n备注：\n适合沉淀为自动化设备 CNC 铝件阶梯报价案例。\n```\n\n## 5. 收集后处理\n\n负责人或业务经理收到问卷后：\n\n1. 把基础字段填入 [真实客户信息采集表.csv](./真实客户信息采集表.csv)。\n2. 选择 3-5 个最有代表性的客户进入 [团队试点客户台账模板.csv](./团队试点客户台账模板.csv)。\n3. 选 1 个客户填写 [真实客户案例卡模板.md](./真实客户案例卡模板.md)。\n4. 用 [每周业务检查表.md](./每周业务检查表.md) 开第一次检查会。\n\n",
    "personal/个人客户推进卡.md": "# 个人客户推进卡\n\n一个客户的一个项目使用一张卡。可以复制下面内容到自己的笔记中；首次只填六项，详细信息在发生相应业务时再补。不知道的写“待确认”，模拟案例标注“练习”。\n\n## 首次填写：六项就够\n\n| 项目 | 我的记录 |\n| --- | --- |\n| 1. 客户与项目是谁 | 公司/联系人/角色/项目名称；未确认的信息注明 |\n| 2. 已知需求与证据 | 客户说了什么、提供了什么；记录日期及邮件/文件位置 |\n| 3. 当前阶段 | 开发了解 / 需求确认 / 内部评估 / 报价准备 / 报价后跟进 / 结果确认 |\n| 4. 当前最大卡点 | 缺什么、影响什么；事实和推测分开 |\n| 5. 下一步动作 | 向谁确认什么、自己何时完成；需同事支持则注明接手人 |\n| 6. 完成标准与检查时间 | 怎样算该动作完成；何时检查是否收到回复 |\n\n不要把“已发补问消息”和“资料已补齐”混为一项完成状态。前者是你的动作，后者还需要对方回复并确认。\n\n## 有询盘后再补\n\n- 产品/零件及用途：\n- 图纸、规格或样品位置与版本：\n- 本次数量：\n- 材料及关键要求：\n- 表面处理/验收要求（适用时）：\n- 期望报价时间、期望收货时间：\n- 影响本次评估的缺失信息：\n- 内部接手人、待回答的问题及约定回复时间：\n- 内部结论、确认人、确认日期和适用条件：\n\n## 有报价后再补\n\n- 报价版本、发送日期、对应产品/图纸版本及数量：\n- 金额与币种、费用范围：\n- 交期及起算条件、有效期、付款条件：\n- 条件依据和内部确认人：\n- 客户是否收到、预计评估时间：\n- 客户原话与反馈日期：\n- 我的判断及依据（尚未核实的标注“待确认”）：\n- 下一步及日期：\n\n## 每次沟通追加一条\n\n| 日期 | 新增事实或客户原话 | 我的判断与待确认问题 | 下一步及日期 |\n| --- | --- | --- | --- |\n|  |  |  |  |\n\n## 每周只写四句话\n\n- 这周新增了什么可靠信息：\n- 最关键的问题解决了没有，证据是什么：\n- 下次我会怎样改进自己的动作：\n- 下周最重要的一步及日期：\n\n结果尚未确认时写“跟进中”或“待确认”，不要编造成单、丢单原因。\n\n返回：[个人上手指南](README.md)。本卡简化自[真实客户信息采集问卷](../crm/真实客户信息采集问卷.md)和[真实客户案例卡模板](../crm/真实客户案例卡模板.md)。\n",
    "crm/真实客户案例填写示例.md": "# 真实客户案例填写示例\n\n## 1. 示例用途\n\n这份示例用于告诉团队：什么叫“讲清楚客户、需求、流程和动作”。\n\n示例客户为虚拟客户，但场景按制造业零件加工报价设计，可作为填写台账、案例卡和周会汇报的参考标准。\n\n## 2. 客户背景\n\n```text\n客户名称：Northstar Automation Inc.\n客户国家/地区：美国\n行业/应用：自动化设备\n客户来源：官网询盘\n负责人：Tina\n协同人员：报价工程师 Alex、技术工程师 Chen\n当前客户阶段：询价客户\n当前商机阶段：技术评审\n填写日期：2026-06-18\n```\n\n## 3. 第一层：业务逻辑示例\n\n| 问题 | 示例回答 |\n| --- | --- |\n| 客户是谁？ | 美国自动化设备公司，主营小型装配线设备，官网询盘进入。联系人 John 是采购经理，Anna 是项目工程师。 |\n| 客户为什么需要我们？ | 客户正在为新设备寻找 CNC 铝件供应商，现有本地供应商价格高、交期慢，希望找亚洲供应商做小批量试产和后续量产。 |\n| 客户真实需求是什么？ | 先做 500 件 CNC 铝件试产，通过装配测试后进入月度 3000-5000 件量产。当前需求包括 CNC 加工、阳极氧化、关键孔位公差控制。 |\n| 谁决定采购？ | 采购经理 John 负责供应商筛选和价格谈判，项目工程师 Anna 影响技术认可，最终采购批准可能由运营经理确认。 |\n| 谁影响采购？ | Anna 影响技术可行性和样品认可；质量经理可能影响最终量产导入。 |\n| 客户最关注什么？ | 第一关注交期和稳定质量，第二关注价格。客户愿意为稳定交付接受略高价格。 |\n| 我们凭什么能赢？ | 我方有类似 CNC 铝件加工经验，可提供 DFM 建议，交期比客户本地供应商短，支持小批量试产和后续量产阶梯报价。 |\n| 主要竞争对手是谁？ | 客户本地供应商和一家中国供应商。客户反馈本地供应商价格高，中国供应商回复慢。 |\n| 目前最大风险是什么？ | 客户图纸中关键孔位公差 0.02mm，需要技术确认稳定加工能力；客户还未提供年度预测和目标交期。 |\n| 这次经验以后能不能复用？ | 可以沉淀为“自动化设备 CNC 铝件询价检查清单”和“试产到量产阶梯报价模板”。 |\n\n业务逻辑一句话总结：\n\n```text\n这是一个有真实项目和后续量产潜力的自动化设备客户，当前关键在于补齐年度用量和目标交期，并确认 0.02mm 关键孔位公差是否可稳定加工，再基于试产和量产做阶梯报价。\n```\n\n## 4. 第二层：系统流程示例\n\n| 流程节点 | 当前状态 | 证据/说明 |\n| --- | --- | --- |\n| 客户建档 | 已完成 | 已录入客户名称、官网、国家、行业、来源、负责人。 |\n| 背景调查 | 进行中 | 已确认主营自动化设备，待补公司规模和采购流程。 |\n| 需求/询价 | 进行中 | 已收到 3D 图和 PDF 图纸，缺年度用量、目标交期、目标价。 |\n| 商机立项 | 已完成 | 建立“CNC 铝件试产与量产项目”，负责人 Tina。 |\n| 技术评审 | 进行中 | 技术工程师 Chen 正在评估关键孔位公差和阳极氧化要求。 |\n| 报价 | 未开始 | 等技术评审和年度用量补充后报价。 |\n| 跟进谈判 | 未开始 | 尚未报价。 |\n| 成单/丢单 | 未开始 | 当前跟进中。 |\n| 复盘沉淀 | 未开始 | 后续根据成单/丢单结果复盘。 |\n\n当前卡点：\n\n```text\n1. 客户缺年度用量、目标交期、目标价。\n2. 关键孔位 0.02mm 公差需要技术确认。\n3. 阳极氧化颜色和膜厚要求未明确。\n```\n\n卡点类型：\n\n```text\n需求不清 / 图纸资料 / 技术风险 / 成本核算\n```\n\n## 5. 第三层：日常动作示例\n\n| 下一步动作 | 负责人 | 截止时间 | 完成标准 |\n| --- | --- | --- | --- |\n| 向客户补问年度用量、目标交期、目标价、阳极氧化颜色和膜厚要求 | Tina | 2026-06-21 | 客户邮件或聊天中明确回复，并更新询价资料 |\n| 评估关键孔位 0.02mm 公差是否可稳定加工 | Chen | 2026-06-20 | 输出“可报价/有风险可报价/不建议报价”结论 |\n| 准备试产 500 件和量产 3000/5000 件阶梯报价框架 | Alex | 2026-06-22 | 报价表中包含材料、加工、表面处理、包装、利润和交期 |\n\n## 6. 台账填写示例\n\n```csv\n客户名称,客户国家/地区,行业/应用,客户来源,负责人,联系人/关键人,客户阶段,商机名称,商机阶段,客户需求摘要,资料完整度,缺失资料,是否技术评审,技术评审结论,是否已报价,报价版本,报价金额,报价发送日期,客户反馈,下一步动作,下一步负责人,下次跟进日期,当前卡点,成单/丢单状态,成单/丢单原因,可沉淀经验\nNorthstar Automation Inc.,美国,自动化设备,官网询盘,Tina,John/采购经理;Anna/项目工程师,询价客户,CNC铝件试产与量产项目,技术评审,客户需要500件CNC铝件试产并可能进入月度3000-5000件量产,部分完整,年度用量;目标交期;目标价;阳极氧化膜厚,是,评审中,否,,,,补问年度用量/目标交期/目标价并完成公差评审,Tina,2026-06-21,关键孔位0.02mm公差待确认;资料不完整,跟进中,,自动化设备CNC铝件可沉淀阶梯报价模板\n```\n\n## 7. 周会汇报示例\n\n不合格汇报：\n\n```text\nNorthstar 客户有兴趣，图纸发给技术了，等报价。\n```\n\n合格汇报：\n\n```text\nNorthstar 是美国自动化设备客户，官网询盘进入。当前项目是 CNC 铝件试产和后续量产，已收到 3D 和 PDF 图纸，但缺年度用量、目标交期、目标价和阳极氧化膜厚。\n\n当前流程在“技术评审”，最大卡点是关键孔位 0.02mm 公差是否可稳定加工。Chen 6 月 20 日前给技术结论；Tina 6 月 21 日前补问客户缺失资料；Alex 6 月 22 日前准备 500/3000/5000 件阶梯报价框架。\n```\n\n## 8. 报价后反馈示例\n\n如果 V1 报价发出后客户反馈价格偏高，应这样记录：\n\n```text\nV1 报价于 2026-06-23 发送，500 件单价 4.8 美元，3000 件单价 3.2 美元，5000 件单价 2.9 美元。\n\n客户 2026-06-25 反馈：500 件试产价格可接受，但 5000 件量产价格比目标价高约 8%，希望优化成本。\n\n下一步：Alex 6 月 27 日前评估材料批量采购和装夹优化后的 V2 报价；Chen 6 月 26 日前确认是否可放宽非关键尺寸公差以降低加工时间；Tina 6 月 28 日前向客户解释试产和量产价格差异。\n```\n\n## 9. 成单复盘示例\n\n```text\n结果：成交，客户确认 500 件试产订单。\n\n成交原因：\n1. 技术评审及时，提前指出关键孔位风险并给出控制方案。\n2. 阶梯报价让客户看到了量产降本空间。\n3. 销售跟进及时，客户每个问题都在 1-2 天内得到明确回复。\n\n可复用经验：\n1. 自动化设备客户通常关注交期和稳定质量，不只看最低价。\n2. 对有试产和量产可能的客户，应默认准备阶梯报价。\n3. 对关键公差要提前做 DFM 说明，减少后续质量争议。\n```\n\n## 10. 丢单复盘示例\n\n```text\n结果：丢单，客户选择本地供应商。\n\n丢单原因：\n1. 客户最终要求 7 天内交样，我方最快需要 14 天。\n2. 价格不是主要原因，交期是决定因素。\n3. 我方在前期没有足够早确认客户样品交期的刚性要求。\n\n下次改进：\n1. 收到询价当天必须确认样品交期是否刚性。\n2. 对急单客户，先判断交期可行性，再进入详细报价。\n3. 建立“急单可承接条件”清单。\n```\n\n",
    "crm/个人理解练习与掌握自测.md": "# 个人理解练习与掌握自测\n\n## 1. 使用方式\n\n这份练习用于检验你是否真正理解业务管理系统，而不是只看过文档。\n\n建议用法：\n\n1. 先不看答案，独立回答。\n2. 每题用真实客户或真实报价来回答。\n3. 回答不出来的地方，就是后续要补的业务认知。\n4. 每周做一次，直到能自然地用这套语言分析业务。\n\n## 2. 第一层：业务逻辑自测\n\n### 2.1 一句话复述\n\n请用自己的话复述：\n\n```text\n业务管理系统到底要解决什么问题？\n```\n\n合格答案必须包含：\n\n- 客户。\n- 需求。\n- 报价。\n- 跟进。\n- 结果。\n- 复盘。\n\n不合格答案示例：\n\n```text\n就是记录客户资料。\n```\n\n合格答案示例：\n\n```text\n它不是只记录客户资料，而是把客户从开发、需求、技术评审、报价、跟进到成交或丢单的过程沉淀下来，让团队知道每个机会为什么推进、为什么成交、为什么失败。\n```\n\n### 2.2 八个业务判断问题\n\n任选一个正在跟进的客户，回答下面 8 个问题：\n\n| 问题 | 我的回答 |\n| --- | --- |\n| 客户是谁？ |  |\n| 客户为什么需要我们？ |  |\n| 客户真实需求是什么？ |  |\n| 谁决定采购？ |  |\n| 我们凭什么能赢？ |  |\n| 报价依据是什么？ |  |\n| 客户为什么成交或不成交？ |  |\n| 这次经验以后能不能复用？ |  |\n\n评分：\n\n- 0 分：答不出来。\n- 1 分：只有感觉，没有证据。\n- 2 分：有事实、有判断、有下一步动作。\n\n总分 16 分，达到 12 分以上算基本掌握。\n\n### 2.3 识别伪业务信息\n\n下面这些说法哪些不合格？请写出为什么。\n\n```text\n1. 客户挺有兴趣，等他回复。\n2. 客户嫌贵，应该没戏。\n3. 这个客户很重要，要重点跟。\n4. 图纸已经发给报价了。\n5. 报价发出去了，等客户消息。\n```\n\n参考判断：\n\n- “有兴趣”缺少客户需求、关键人、预算、下一步动作。\n- “嫌贵”缺少客户反馈细节、竞争价格、价值差异、是否可调整方案。\n- “重要”缺少判断依据，如行业、规模、需求、复购潜力、战略价值。\n- “发给报价”缺少资料是否完整、技术评审是否完成、报价条件是否明确。\n- “等客户消息”缺少跟进节奏、责任人、下次动作。\n\n## 3. 第二层：系统流程自测\n\n### 3.1 主流程默写\n\n请默写主流程：\n\n```text\n________ -> ________ -> ________ -> ________ -> ________ -> ________ -> ________ -> ________ -> ________\n```\n\n标准答案：\n\n```text\n客户建档 -> 背景调查 -> 需求/询价 -> 商机立项 -> 技术评审 -> 报价 -> 跟进谈判 -> 成单/丢单 -> 复盘沉淀\n```\n\n### 3.2 流程卡点判断\n\n读下面场景，判断应该卡在哪一步。\n\n#### 场景 A\n\n客户发来 3D 图，但没有材料、数量、交期。\n\n应该卡在：\n\n```text\n需求/询价资料补充\n```\n\n不能直接进入正式报价。\n\n#### 场景 B\n\n销售说客户很急，希望今天报价，但图纸有复杂公差，材料也不确定。\n\n应该卡在：\n\n```text\n技术评审\n```\n\n至少要做最低限度风险判断。\n\n#### 场景 C\n\n报价已经发出 10 天，客户没有回复。\n\n应该卡在：\n\n```text\n跟进谈判/客户反馈\n```\n\n需要记录最后联系时间、追问动作、是否转长期跟进。\n\n#### 场景 D\n\n客户选择了竞争对手，但没人记录原因。\n\n应该卡在：\n\n```text\n丢单复盘\n```\n\n不写原因就不能关闭商机。\n\n### 3.3 角色责任判断\n\n请为下列事项指定主责角色：\n\n| 事项 | 主责角色 |\n| --- | --- |\n| 新建客户档案 |  |\n| 补充客户联系人和关键人 |  |\n| 标记询价资料缺失 |  |\n| 判断材料和工艺可行性 |  |\n| 核算加工成本 |  |\n| 审批低利润报价 |  |\n| 记录客户报价反馈 |  |\n| 组织成单/丢单复盘 |  |\n\n参考答案：\n\n| 事项 | 主责角色 |\n| --- | --- |\n| 新建客户档案 | 销售/业务员 |\n| 补充客户联系人和关键人 | 销售/业务员 |\n| 标记询价资料缺失 | 销售/技术/报价共同，销售主责 |\n| 判断材料和工艺可行性 | 技术/工艺工程师 |\n| 核算加工成本 | 报价工程师 |\n| 审批低利润报价 | 业务经理/总经理 |\n| 记录客户报价反馈 | 销售/业务员 |\n| 组织成单/丢单复盘 | 业务经理 |\n\n## 4. 第三层：日常动作自测\n\n### 4.1 每日动作检查\n\n每天结束前问自己：\n\n| 检查项 | 今天是否做到 |\n| --- | --- |\n| 今天新增客户是否建档？ |  |\n| 活跃商机是否有下一步动作？ |  |\n| 新询价是否标记资料缺失？ |  |\n| 待技术评审是否有人负责？ |  |\n| 已发报价是否记录客户反馈？ |  |\n| 逾期未跟进客户是否处理？ |  |\n\n### 4.2 追问能力练习\n\n当业务员说“客户有兴趣”时，你要追问：\n\n```text\n客户对什么有兴趣？\n谁表达的兴趣？\n这个人是不是决策人？\n客户现在最关心价格、交期、质量还是技术？\n下一步动作是什么？\n什么时候完成？\n```\n\n当业务员说“客户嫌贵”时，你要追问：\n\n```text\n客户说贵多少？\n跟谁比贵？\n客户有没有目标价？\n客户是否理解我们的材料、工艺、质量和交期差异？\n是否有替代方案？\n是否需要二次报价？\n```\n\n当报价人员说“资料不完整”时，你要追问：\n\n```text\n缺什么资料？\n这些资料影响成本、交期、质量还是可行性？\n销售什么时候向客户补问？\n如果客户暂时给不了，是否可以做区间报价或风险报价？\n```\n\n## 5. 真实案例练习\n\n每周选择 1 个真实客户，按下面格式写一页纸。\n\n```text\n客户是谁：\n客户背景：\n客户需求：\n关键人：\n当前阶段：\n资料完整度：\n技术风险：\n报价依据：\n客户反馈：\n下一步动作：\n负责人：\n完成时间：\n可能成交原因：\n可能丢单原因：\n可沉淀经验：\n```\n\n合格标准：\n\n- 不是流水账。\n- 每个判断有事实依据。\n- 下一步动作具体到人和时间。\n- 能看出这个案例对以后有什么用。\n\n## 6. 掌握程度评估\n\n| 等级 | 表现 |\n| --- | --- |\n| 入门 | 能背出主流程，但分析客户时还停留在感觉 |\n| 基本掌握 | 能用客户、需求、技术、报价、反馈、复盘分析一个案例 |\n| 熟练 | 能发现团队记录里的缺口，并追问到下一步动作 |\n| 可带团队 | 能组织周会、复盘会，并把经验沉淀为模板和纪律 |\n\n达到“可带团队”的标准：\n\n- 能讲清楚业务主线。\n- 能判断资料是否完整。\n- 能判断报价是否有依据。\n- 能发现商机是否悬空。\n- 能推动团队形成每周检查和每月复盘。\n\n",
    "crm/每周业务检查表.md": "# 每周业务检查表\n\n## 1. 使用目的\n\n这份检查表用于每周业务会。目标不是汇报流水账，而是检查客户、商机、询价、技术评审、报价和复盘是否在推进。\n\n建议每周固定一次，30-60 分钟。\n\n## 2. 会前准备\n\n业务员会前准备：\n\n- 更新试点客户台账。\n- 每人选 1 个重点客户或重点报价。\n- 写清每个活跃商机的下一步动作。\n\n技术/报价会前准备：\n\n- 更新待技术评审事项。\n- 更新待报价事项。\n- 标记资料缺失和风险。\n\n业务经理会前准备：\n\n- 汇总本周新增客户。\n- 汇总卡点。\n- 选 1 个成单或丢单案例复盘。\n\n## 3. 周会固定议程\n\n| 顺序 | 主题 | 必问问题 | 输出 |\n| --- | --- | --- | --- |\n| 1 | 新增客户 | 本周新增了哪些客户？是否建档？ | 新客户清单 |\n| 2 | 重点商机 | 哪些商机最值得推进？卡在哪里？ | 重点商机动作 |\n| 3 | 资料缺失 | 哪些询价资料不完整？谁去补？ | 补资料任务 |\n| 4 | 技术评审 | 哪些项目待评审？哪些有风险？ | 技术评审结论/任务 |\n| 5 | 报价状态 | 哪些报价待出、已出、需二次报价？ | 报价动作 |\n| 6 | 客户反馈 | 哪些报价无反馈？客户反馈了什么？ | 跟进动作 |\n| 7 | 成单/丢单 | 为什么成？为什么丢？ | 复盘结论 |\n| 8 | 下周动作 | 谁在什么时候前做什么？ | 行动清单 |\n\n## 4. 会议检查表\n\n### 4.1 新增客户\n\n| 客户 | 负责人 | 是否建档 | 客户来源 | 下一步动作 |\n| --- | --- | --- | --- | --- |\n|  |  |  |  |  |\n|  |  |  |  |  |\n\n### 4.2 重点商机\n\n| 客户/商机 | 当前阶段 | 预计金额 | 当前卡点 | 下一步动作 | 负责人 | 截止时间 |\n| --- | --- | --- | --- | --- | --- | --- |\n|  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  |\n\n### 4.3 资料缺失\n\n| 客户/询价 | 缺失资料 | 影响 | 补问负责人 | 截止时间 |\n| --- | --- | --- | --- | --- |\n|  |  | 成本 / 交期 / 质量 / 可行性 |  |  |\n|  |  | 成本 / 交期 / 质量 / 可行性 |  |  |\n\n### 4.4 技术评审\n\n| 客户/项目 | 技术评审状态 | 主要风险 | 评审人 | 截止时间 | 结论 |\n| --- | --- | --- | --- | --- | --- |\n|  | 未开始 / 进行中 / 已完成 |  |  |  |  |\n|  | 未开始 / 进行中 / 已完成 |  |  |  |  |\n\n### 4.5 报价状态\n\n| 客户/项目 | 报价状态 | 报价版本 | 报价金额 | 当前卡点 | 下一步 |\n| --- | --- | --- | --- | --- | --- |\n|  | 待报价 / 已报价 / 需二次报价 |  |  |  |  |\n|  | 待报价 / 已报价 / 需二次报价 |  |  |  |  |\n\n### 4.6 客户反馈\n\n| 客户/报价 | 反馈内容 | 反馈类型 | 是否需二次报价 | 下一步动作 | 截止时间 |\n| --- | --- | --- | --- | --- | --- |\n|  |  | 价格 / 交期 / 质量 / 付款 / MOQ / 技术 | 是 / 否 |  |  |\n|  |  | 价格 / 交期 / 质量 / 付款 / MOQ / 技术 | 是 / 否 |  |  |\n\n### 4.7 成单/丢单复盘\n\n| 客户/项目 | 结果 | 原因 | 可复用经验 | 后续动作 |\n| --- | --- | --- | --- | --- |\n|  | 成单 / 丢单 |  |  |  |\n|  | 成单 / 丢单 |  |  |  |\n\n## 5. 会议结束前必须确认\n\n会议结束前逐条确认：\n\n- 每个重点商机是否有下一步动作？\n- 每个下一步动作是否有负责人？\n- 每个下一步动作是否有截止时间？\n- 哪些事项需要负责人协调？\n- 哪些客户需要进入长期跟进或关闭？\n- 本周是否产生可沉淀案例？\n\n## 6. 不允许的会议结论\n\n下面这些结论不合格：\n\n```text\n继续跟进。\n等客户回复。\n报价尽快出。\n技术再看看。\n客户嫌贵。\n下周再说。\n```\n\n必须改成：\n\n```text\nTina 6 月 21 日前补问客户年度用量和目标交期。\n报价工程师 6 月 22 日前输出 V2 报价和材料替代方案。\n技术工程师 6 月 20 日前确认关键公差是否可加工。\n业务经理 6 月 21 日前审批低利润报价。\n```\n\n## 7. 周会成功标准\n\n一次合格周会必须产出：\n\n1. 本周重点客户清单。\n2. 本周重点商机动作清单。\n3. 待补资料清单。\n4. 待技术评审和待报价清单。\n5. 已报价客户反馈清单。\n6. 至少 1 条成单/丢单复盘结论。\n\n",
    "personal/course/课程来源与覆盖说明.md": "# 课程来源与覆盖说明\n\n主资料：[业务管理系统导图.pdf](../../reference/业务管理系统导图.pdf)。主干核对说明见[原图解读](../PDF原图解读与文档校准.md)。\n\n课程正文里，“原图依据”描述原图节点；“学习目标”“本课做到这里就够了”“讲解”“练习”“完成自检”是教学编排。案例均引用本课程虚构案例包。现有文档是辅助材料，不把其中的管理规则追认为原图原话。\n\n| 模块 | 原图依据 | 主要衍生参考 | 教学增加的内容 |\n| --- | --- | --- | --- |\n| M1 / L01—L04 | 业务开发：价值主张、资源配置；客户调查：匹配、定位、供应资源 | 速查表；结构化需求第 6.1—6.2 节 | 事实与推测区分、能力边界、客户筛选练习 |\n| M2 / L05—L08 | 开发工具与渠道；公司和行业信息；角色权责；客户采购流程表 | 结构化需求第 6.2、6.4 节；信息采集问卷 | 有目的的线索寻找、证据整理、采购进度判断 |\n| M3 / L09—L12 | 建立联系与信任；挖掘需求；了解项目背景 | 业务员操作清单第 3 节；问卷；案例卡 | 中文沟通草稿、需求复述、分批补问 |\n| M4 / L13—L16 | 报价条件；材料、结构、工艺、交期、包装与报价分析 | 结构化需求第 6.3、6.5—6.6 节 | 版本交接、条件检查、模拟报价算术 |\n| M5 / L17—L20 | 给客户的技术反馈；谈判与客户原则；促销构思；报价结果 | 结构化需求第 6.7 节；案例示例第 8 节 | 变更确认、跟进分支、异议与试单交接练习 |\n| M6 / L21—L24 | GRAI、KISS、知识管理、个人目标、任务分解与时间安排 | 个人自测；每周检查表；案例卡 | 个人复盘、知识卡、陌生案例综合评估 |\n\n## 原图一级分支的取舍\n\n- 业务开发、客户背景调查、了解项目背景、报价：作为个人业务主线，贯穿课程。\n- 业务部管理：只取个人目标、行动与资源协调部分，放入 L02、L23。\n- 招聘、组织架构：保留在原始资料中，本课程不展开团队搭建。\n- 六类促销：在 L19 学习“能否适用、成本和条件如何确认”的筛选方法，不要求逐项采用，不把促销作为客户匹配的替代。\n\n## 深度边界\n\n课程教授的是新手业务员如何理解、提问、整理与推进，不授予材料选型、工艺设计或合同审查能力。具体技术判断、地区规定、渠道平台政策、真实市场价格等需在实际任务中另行核实。\n\n原图存在经验口号、性格分类及具体公司的做法。课程取其可用于理解问题的部分，不教没有充分依据的性格断言、固定成交比例或通用订单阈值。\n\n本课程没有新增真实客户调查结果，没有向客户发送消息，也没有把练习成绩记为学习者实际完成情况。\n\n## 本次课程文字修订\n\n1.1 版依据已有案例和来源改写表达，把抽象目标换成“遇到什么情况时，能作出什么判断或动作”，并逐课补充分步练习和真实工作用法。没有增加未经核实的客户事实或技术结论；第一课仍以说明匹配理由和待验证问题为目标。\n",
    "crm/真实客户案例卡模板.md": "# 真实客户案例卡模板\n\n## 1. 使用目的\n\n这张案例卡用于把一个真实客户或一个真实报价，按“三层理解和运用”拆清楚。\n\n每周至少选 1 个客户填写，用于团队周会或个人复盘。\n\n## 2. 基础信息\n\n```text\n客户名称：\n客户国家/地区：\n行业/应用：\n客户来源：\n负责人：\n协同人员：\n当前客户阶段：\n当前商机阶段：\n填写日期：\n```\n\n## 3. 第一层：业务逻辑\n\n业务逻辑要回答：这个客户为什么值得跟，我们凭什么能赢，最后为什么成或丢。\n\n| 问题 | 回答 |\n| --- | --- |\n| 客户是谁？ |  |\n| 客户为什么需要我们？ |  |\n| 客户真实需求是什么？ |  |\n| 谁决定采购？ |  |\n| 谁影响采购？ |  |\n| 客户最关注什么？价格、交期、质量、技术、服务还是关系？ |  |\n| 我们凭什么能赢？ |  |\n| 主要竞争对手是谁？ |  |\n| 目前最大风险是什么？ |  |\n| 这次经验以后能不能复用？ |  |\n\n业务逻辑一句话总结：\n\n```text\n\n```\n\n## 4. 第二层：系统流程\n\n系统流程要回答：这个客户当前在哪一步，卡在哪里，下一步该进入哪个节点。\n\n主流程：\n\n```text\n客户建档 -> 背景调查 -> 需求/询价 -> 商机立项 -> 技术评审 -> 报价 -> 跟进谈判 -> 成单/丢单 -> 复盘沉淀\n```\n\n| 流程节点 | 当前状态 | 证据/说明 |\n| --- | --- | --- |\n| 客户建档 | 未开始 / 进行中 / 已完成 |  |\n| 背景调查 | 未开始 / 进行中 / 已完成 |  |\n| 需求/询价 | 未开始 / 进行中 / 已完成 |  |\n| 商机立项 | 未开始 / 进行中 / 已完成 |  |\n| 技术评审 | 未开始 / 进行中 / 已完成 |  |\n| 报价 | 未开始 / 进行中 / 已完成 |  |\n| 跟进谈判 | 未开始 / 进行中 / 已完成 |  |\n| 成单/丢单 | 未开始 / 进行中 / 已完成 |  |\n| 复盘沉淀 | 未开始 / 进行中 / 已完成 |  |\n\n当前卡点：\n\n```text\n\n```\n\n卡点属于哪一类：\n\n```text\n客户资料 / 需求不清 / 图纸资料 / 技术风险 / 成本核算 / 审批 / 客户反馈 / 竞争对手 / 交期 / 付款 / 其他\n```\n\n## 5. 第三层：日常动作\n\n日常动作要回答：谁在什么时间前做什么。\n\n| 下一步动作 | 负责人 | 截止时间 | 完成标准 |\n| --- | --- | --- | --- |\n|  |  |  |  |\n|  |  |  |  |\n|  |  |  |  |\n\n动作合格标准：\n\n- 不能写“继续跟进”。\n- 必须写清具体动作。\n- 必须有负责人。\n- 必须有日期。\n- 必须能判断是否完成。\n\n合格示例：\n\n```text\nTina 在 2026-06-21 前向客户补问年度用量、目标交期和目标价，并更新询价资料完整度。\n```\n\n## 6. 报价与反馈\n\n如果还没有报价，填写“未报价”并说明原因。\n\n```text\n是否已报价：\n报价版本：\n报价金额：\n报价日期：\n报价依据：\n利润/风险判断：\n客户反馈：\n是否需要二次报价：\n```\n\n## 7. 结果与复盘\n\n```text\n当前结果：跟进中 / 成交 / 丢单 / 长期跟进 / 搁置\n成交原因：\n丢单原因：\n我们做对了什么：\n我们做错了什么：\n下次如何改进：\n可沉淀为模板或知识库的内容：\n```\n\n## 8. 管理者点评\n\n```text\n这张案例卡是否说清了客户？\n是否说清了需求？\n是否说清了当前流程节点？\n是否说清了卡点？\n是否说清了下一步动作？\n是否需要升级协调？\n```\n\n",
    "personal/README.md": "# 个人学习导航\n\n当前背景：精密制造方向的个人外贸（SOLO），正在找客户，先理解并学会运用以 PDF 为原型的资料。\n\n## 正式学习入口\n\n[精密制造外贸 SOLO 完整课程](course/README.md)：6 个模块、24 篇完整课文，每课说明“遇到什么情况、学完能做什么、先做到哪里”，并提供案例、分步练习、参考思路与自检。\n\n全课程建议学习时间约 15 小时 10 分钟，可以按自己的速度分次完成。此前的第一课和粗读安排已扩充为完整课程，后续以 L01—L24 为准。\n\n| 阶段 | 课程 | 重点 |\n| --- | --- | --- |\n| 明确方向 | L01—L04 | 看到企业，知道为什么值得了解、依据是什么 |\n| 了解客户 | L05—L08 | 找到线索后，知道先查什么、该问谁、进展到哪 |\n| 沟通需求 | L09—L12 | 写清来意，听准需求，留下明天能接着用的记录 |\n| 技术报价 | L13—L16 | 核对资料，问清条件，查出报价里的金额与承诺问题 |\n| 推进衔接 | L17—L20 | 遇到改图、未回复、嫌贵和试单意向时，知道下一步 |\n| 独立运用 | L21—L24 | 从结果中改进，安排自己的工作，独立处理新情况 |\n\n## 从哪里开始\n\n1. 阅读[课程使用说明](course/README.md)和[案例包 S0](course/案例包.md)。\n2. 从 [L01](course/lessons/L01-从精密制造能力到目标客户.md)开始，先独立做题，再看参考思路。\n3. 每课留下一份 O 编号作业，对照三条自检修改。先能解释判断和下一步，不以真实客户回复或成单作为完成条件。\n4. 暂无真实客户时使用模拟案例；有真实业务后，再用相同方法验证和调整。\n\n## 需要时再查\n\n- [PDF 原图解读与文档校准](PDF原图解读与文档校准.md)：原图结构、容易混淆的概念与来源区别。\n- [原始 PDF](../reference/业务管理系统导图.pdf)：回看具体节点。\n- [课程来源与覆盖说明](course/课程来源与覆盖说明.md)：课程对应原图的位置与范围。\n- [个人客户推进卡](个人客户推进卡.md)：整理真实或模拟案例时使用。\n- [原有资料目录](../crm/README.md)：需要深入某个业务问题时查阅。\n\n课程中的企业、金额和条件均为教学模拟。完成记录与掌握情况由实际作业决定，本项目没有预设你已完成任何课程。\n",
    "crm/README.md": "# CRM 业务资料\n\n本目录保存 CRM 方案、团队试点材料和客户管理模板；它们是业务参考资料，不是公众号草稿或发布资产。\n\n建议阅读顺序：\n\n1. [关键文档导航-按业务主线](./关键文档导航-按业务主线.md)\n2. [实施总清单](./实施总清单.md)\n3. [业务CRM管理系统建设方案](./业务CRM管理系统建设方案.md)\n4. [落地完成度审计](./落地完成度审计.md)\n\nCRM 前端原型位于原项目的 [crm-mvp](<../../../Tina do the trade/crm-mvp/README.md>)。\n",
    "crm/关键文档导航-按业务主线.md": "# 关键文档导航：按业务主线使用\n\n这份导航只保留短期真正要看的关键文档。先不要试图一次性吸收全部资料。\n\n主线：\n\n```text\n客户是谁 -> 需求是什么 -> 我们能不能做 -> 怎么报价 -> 客户怎么反馈 -> 成没成交 -> 为什么\n```\n\n## 0. 先看这一份\n\n| 目的 | 文档 |\n| --- | --- |\n| 快速建立整体理解 | [三层理解与运用速查表.md](./三层理解与运用速查表.md) |\n| 把业务主线转成 CRM 系统 | [业务CRM管理系统建设方案.md](./业务CRM管理系统建设方案.md) |\n\n先用它记住三层：\n\n```text\n业务逻辑：为什么值得做\n系统流程：现在走到哪一步\n日常动作：谁在什么时候前做什么\n```\n\n## 1. 客户是谁\n\n先回答：\n\n- 客户是哪家公司？\n- 属于什么行业？\n- 谁是联系人？\n- 谁是决策人、影响人、使用人？\n- 这个客户值不值得跟？\n\n用到的文档：\n\n| 用途 | 文档 |\n| --- | --- |\n| 收集真实客户基础信息 | [真实客户信息采集问卷.md](./真实客户信息采集问卷.md) |\n| 批量整理 3-5 个客户 | [真实客户信息采集表.csv](./真实客户信息采集表.csv) |\n| 看一个合格客户案例怎么写 | [真实客户案例填写示例.md](./真实客户案例填写示例.md) |\n\n## 2. 需求是什么\n\n先回答：\n\n- 客户要什么产品或零件？\n- 用在什么场景？\n- 有哪些图纸、样品、规格、材料、数量、交期、质量要求？\n- 还缺什么资料？\n\n用到的文档：\n\n| 用途 | 文档 |\n| --- | --- |\n| 把客户需求转成结构化信息 | [真实客户信息采集问卷.md](./真实客户信息采集问卷.md) |\n| 整理客户、需求、缺失资料、下一步动作 | [团队试点客户台账模板.csv](./团队试点客户台账模板.csv) |\n| 知道台账每列怎么填 | [团队试点客户台账使用说明.md](./团队试点客户台账使用说明.md) |\n\n## 3. 我们能不能做\n\n先回答：\n\n- 图纸和资料是否完整？\n- 材料、结构、工艺是否可行？\n- 质量、交期、成本风险在哪里？\n- 是否可以报价，还是需要客户补资料？\n\n用到的文档：\n\n| 用途 | 文档 |\n| --- | --- |\n| 明确技术/报价角色该做什么 | [团队角色任务卡.md](./团队角色任务卡.md) |\n| 用真实客户案例记录技术判断和卡点 | [真实客户案例卡模板.md](./真实客户案例卡模板.md) |\n| 参考完整填写方式 | [真实客户案例填写示例.md](./真实客户案例填写示例.md) |\n\n## 4. 怎么报价\n\n先回答：\n\n- 报价依据是什么？\n- 材料、加工、表面处理、包装、运输、税费、利润是否清楚？\n- 是否需要阶梯报价？\n- 是否需要审批？\n\n用到的文档：\n\n| 用途 | 文档 |\n| --- | --- |\n| 明确报价工程师责任 | [团队角色任务卡.md](./团队角色任务卡.md) |\n| 记录报价状态、版本、金额和反馈 | [团队试点客户台账模板.csv](./团队试点客户台账模板.csv) |\n| 参考报价后反馈怎么写 | [真实客户案例填写示例.md](./真实客户案例填写示例.md) |\n\n## 5. 客户怎么反馈\n\n先回答：\n\n- 客户是否确认收到报价？\n- 反馈是价格、交期、质量、付款、MOQ、技术，还是其他问题？\n- 是否需要二次报价？\n- 下一步谁负责，什么时候完成？\n\n用到的文档：\n\n| 用途 | 文档 |\n| --- | --- |\n| 追问“客户嫌贵、等回复、报价发了”等模糊表达 | [负责人带教话术与追问库.md](./负责人带教话术与追问库.md) |\n| 周会检查客户反馈和下一步动作 | [每周业务检查表.md](./每周业务检查表.md) |\n| 在台账中记录客户反馈和下一步动作 | [团队试点客户台账模板.csv](./团队试点客户台账模板.csv) |\n\n## 6. 成没成交\n\n先回答：\n\n- 当前结果是跟进中、成交、丢单、长期跟进，还是搁置？\n- 如果成交，客户为什么选我们？\n- 如果丢单，真正丢在哪里？\n\n用到的文档：\n\n| 用途 | 文档 |\n| --- | --- |\n| 记录成单/丢单结果 | [团队试点客户台账模板.csv](./团队试点客户台账模板.csv) |\n| 做周会复盘 | [每周业务检查表.md](./每周业务检查表.md) |\n| 看成单/丢单复盘示例 | [真实客户案例填写示例.md](./真实客户案例填写示例.md) |\n\n## 7. 为什么\n\n先回答：\n\n- 为什么成交？\n- 为什么丢单？\n- 哪个动作有效？\n- 哪个环节发现太晚？\n- 下次如何改进？\n- 这次经验能否复用？\n\n用到的文档：\n\n| 用途 | 文档 |\n| --- | --- |\n| 按三层框架复盘一个客户 | [真实客户案例卡模板.md](./真实客户案例卡模板.md) |\n| 参考完整复盘写法 | [真实客户案例填写示例.md](./真实客户案例填写示例.md) |\n| 判断是否真的用起来 | [团队试点执行验收表.md](./团队试点执行验收表.md) |\n\n## 最小使用顺序\n\n短时间内只看这 6 份：\n\n1. [三层理解与运用速查表.md](./三层理解与运用速查表.md)\n2. [真实客户信息采集问卷.md](./真实客户信息采集问卷.md)\n3. [团队试点客户台账模板.csv](./团队试点客户台账模板.csv)\n4. [团队角色任务卡.md](./团队角色任务卡.md)\n5. [负责人带教话术与追问库.md](./负责人带教话术与追问库.md)\n6. [每周业务检查表.md](./每周业务检查表.md)\n\n第一轮不要看太多。先用 3-5 个真实客户跑通一遍，再回头看其他文档。\n",
    "crm/实施总清单.md": "# 实施总清单\n\n## 1. 使用方式\n\n这是整个资料包的总控清单。真正开始执行时，优先看这一份。\n\n目标：\n\n```text\n用 30 天让团队按“业务逻辑 -> 系统流程 -> 日常动作”管理客户、商机、询价、报价和复盘。\n```\n\n## 2. 启动前 30 分钟\n\n负责人完成：\n\n| 动作 | 使用材料 | 完成标准 |\n| --- | --- | --- |\n| 快速理解主线 | [三层理解与运用速查表.md](./三层理解与运用速查表.md) | 能讲出“客户是谁 -> 需求是什么 -> 怎么报价 -> 为什么成或丢” |\n| 明确角色分工 | [团队角色任务卡.md](./团队角色任务卡.md) | 知道业务员、经理、技术、报价各自负责什么 |\n| 准备资料分发 | [资料分发清单.md](./资料分发清单.md) | 知道启动会只发哪 5 份材料 |\n| 准备启动会 | [启动日操作清单.md](./启动日操作清单.md) | 选好 3-5 个真实客户示例 |\n| 准备样例 | [真实客户案例填写示例.md](./真实客户案例填写示例.md) | 能给团队展示合格填写标准 |\n\n## 3. 启动当天\n\n按顺序执行：\n\n1. 讲主线：客户是谁 -> 需求是什么 -> 我们能不能做 -> 怎么报价 -> 客户怎么反馈 -> 成没成交 -> 为什么。\n2. 讲三层框架：业务逻辑、系统流程、日常动作。\n3. 宣布 6 条最小纪律。\n4. 现场演示 1 个真实客户。\n5. 每个业务员确定 3 个试点客户。\n6. 确定第一次检查时间。\n\n使用材料：\n\n- [第一次团队培训方案.md](./第一次团队培训方案.md)\n- [启动日操作清单.md](./启动日操作清单.md)\n- [团队角色任务卡.md](./团队角色任务卡.md)\n- [负责人带教话术与追问库.md](./负责人带教话术与追问库.md)\n\n启动当天必须产出：\n\n- 试点客户清单。\n- 每个客户的负责人。\n- 第一个案例卡。\n- 第一次检查时间。\n\n## 4. 第 1-3 天\n\n业务员完成：\n\n- 每人填写 3 个试点客户。\n- 每个活跃商机写清下一步动作和时间。\n- 对资料缺失的询价标记缺什么。\n\n技术/报价完成：\n\n- 对待报价项目补技术评审或报价依据。\n- 标记材料、工艺、质量、交期风险。\n\n业务经理完成：\n\n- 检查台账是否填写。\n- 追问模糊表达。\n- 确认每个重点商机都有负责人和时间。\n\n使用材料：\n\n- [团队试点客户台账模板.csv](./团队试点客户台账模板.csv)\n- [团队试点客户台账使用说明.md](./团队试点客户台账使用说明.md)\n- [真实客户案例卡模板.md](./真实客户案例卡模板.md)\n- [真实客户案例填写示例.md](./真实客户案例填写示例.md)\n\n## 5. 第 7 天检查\n\n检查重点：\n\n| 检查项 | 合格标准 |\n| --- | --- |\n| 客户建档 | 试点客户 100% 建档 |\n| 下一步动作 | 活跃商机 100% 有动作、负责人、日期 |\n| 资料缺失 | 缺失资料 100% 标记 |\n| 技术评审 | 待报价项目有评审状态 |\n| 报价反馈 | 已报价项目有客户反馈或跟进计划 |\n\n使用材料：\n\n- [每周业务检查表.md](./每周业务检查表.md)\n- [团队试点执行验收表.md](./团队试点执行验收表.md)\n- [30天试点跟踪看板模板.csv](./30天试点跟踪看板模板.csv)\n\n## 6. 第 14 天检查\n\n检查重点：\n\n- 团队是否能用三层框架汇报客户。\n- 技术评审是否在报价前发生。\n- 报价是否有关联客户、询价、技术评审和版本。\n- 客户反馈是否被记录。\n- 是否已经形成至少 1 个案例卡。\n\n纠偏重点：\n\n- 把“客户有兴趣”改成客户、需求、关键人、下一步。\n- 把“客户嫌贵”改成贵多少、跟谁比、怎么调整。\n- 把“等客户回复”改成最后联系时间、下次跟进时间。\n\n## 7. 第 30 天验收\n\n用 [团队试点执行验收表.md](./团队试点执行验收表.md) 判断当前状态：\n\n```text\n未启动 / 已启动 / 基本用起来 / 稳定用起来\n```\n\n达到“基本用起来”的标准：\n\n- 客户、商机、询价、报价、反馈已有记录。\n- 周会能检查动作和卡点。\n- 业务员能讲清客户、需求和下一步。\n- 技术/报价能讲清评审结论和报价依据。\n- 成单/丢单能写原因。\n\n达到“稳定用起来”的标准：\n\n- 团队能持续按三层框架分析业务。\n- 每周能沉淀至少 1 个案例。\n- 报价和客户跟进比以前更可追溯。\n- 管理者能通过台账和看板发现卡点。\n\n如需判断当前整体完成度，使用：\n\n- [落地完成度审计.md](./落地完成度审计.md)\n\n## 8. 每周固定动作\n\n| 角色 | 每周动作 |\n| --- | --- |\n| 业务员 | 更新客户、商机、询价、报价反馈 |\n| 技术/报价 | 更新评审结论、报价依据、风险说明 |\n| 业务经理 | 开周会、检查卡点、推动动作 |\n| 负责人 | 看 30 天看板、守住 6 条纪律、推动复盘 |\n\n## 9. 只守住这 6 条\n\n第一阶段不要扩散，先守住：\n\n1. 新客户必须建档。\n2. 活跃商机必须有下一步动作和时间。\n3. 询价资料缺失必须标记。\n4. 正式报价前必须技术评审。\n5. 报价发出后必须记录客户反馈。\n6. 成单/丢单必须写原因。\n\n## 10. 当前最小下一步\n\n如果现在就要开始，只做这 3 件事：\n\n1. 选 3-5 个真实客户，并先用 [真实客户信息采集问卷.md](./真实客户信息采集问卷.md) 或 [真实客户信息采集表.csv](./真实客户信息采集表.csv) 收集信息。\n2. 把采集内容整理进 [团队试点客户台账模板.csv](./团队试点客户台账模板.csv)。\n3. 用 [每周业务检查表.md](./每周业务检查表.md) 开第一次 30 分钟检查会。\n",
    "crm/业务CRM管理系统建设方案.md": "﻿# 业务 CRM 管理系统建设方案\n\n## 1. 系统目标\n\n这套 CRM 不是通用客户通讯录，也不是简单销售漏斗。它要服务当前业务的真实工作方式：\n\n```text\n客户是谁 -> 需求是什么 -> 我们能不能做 -> 怎么报价 -> 客户怎么反馈 -> 成没成交 -> 为什么\n```\n\n系统目标：\n\n1. 把客户、询价、报价、跟进、复盘从个人微信、表格和记忆中沉淀到统一系统。\n2. 让每个业务机会都能看到当前阶段、卡点、负责人和下一步动作。\n3. 让报价前的资料完整度、技术评审、成本依据和风险判断可追溯。\n4. 让成交和丢单都能复盘，形成可复用经验。\n5. 让负责人用数据看见团队执行，而不是只听口头汇报。\n\n## 2. 第一版产品原则\n\n第一版 CRM 必须轻，不要一开始做成复杂 ERP。\n\n### 2.1 必须做到\n\n- 新客户能建档。\n- 客户联系人和关键人能记录。\n- 询价需求能结构化。\n- 缺失资料能标记。\n- 商机阶段能推进。\n- 技术评审能记录结论。\n- 报价能记录版本、金额、状态和反馈。\n- 每个活跃商机必须有下一步动作。\n- 成交/丢单必须写原因。\n- 管理者能看基础报表。\n\n### 2.2 暂时不做\n\n- 完整生产排产。\n- 仓库库存。\n- 财务总账。\n- 复杂 HR 招聘。\n- 客户自助门户。\n- 复杂自动化营销。\n\n这些可以二期再做，第一期先解决业务跟进和报价闭环。\n\n## 3. 核心用户角色\n\n| 角色 | 主要使用场景 | 核心权限 |\n| --- | --- | --- |\n| 业务员 | 建客户、跟商机、收询价、发报价、记反馈 | 管理本人客户、商机、询价、跟进 |\n| 业务经理 | 看团队客户和商机、检查卡点、审批重点报价 | 查看团队数据、分配负责人、审核报价 |\n| 技术/工艺 | 做技术评审、判断材料工艺风险、给 DFM 建议 | 查看询价资料、填写技术评审 |\n| 报价工程师 | 核算成本、出报价、维护报价版本 | 填写报价成本和报价方案 |\n| 负责人/老板 | 看关键客户、报价转化、团队执行、经营风险 | 全局查看、审批高风险/低利润报价 |\n| 管理员 | 用户、权限、字段、字典、流程配置 | 系统配置 |\n\n## 4. 系统主流程\n\n```text\n客户建档\n  -> 背景调查\n  -> 需求/询价\n  -> 商机立项\n  -> 技术评审\n  -> 报价\n  -> 客户反馈/谈判\n  -> 成交/丢单\n  -> 复盘沉淀\n```\n\n每个环节必须有一个明确产出：\n\n| 环节 | 产出 |\n| --- | --- |\n| 客户建档 | 客户档案 |\n| 背景调查 | 客户价值和风险判断 |\n| 需求/询价 | 询价单和缺失资料清单 |\n| 商机立项 | 商机阶段、负责人、下一步动作 |\n| 技术评审 | 可报价/有风险/需补资料/不建议报价 |\n| 报价 | 报价版本、金额、有效期、风险说明 |\n| 客户反馈 | 反馈类型、二次报价需求、下一步动作 |\n| 成交/丢单 | 结果和原因 |\n| 复盘沉淀 | 案例、经验、改进动作 |\n\n## 5. 第一版功能模块\n\n### 5.1 工作台\n\n业务员打开系统后，第一屏只看今天要处理的事。\n\n功能：\n\n- 我的待跟进客户。\n- 我的活跃商机。\n- 待补资料询价。\n- 待客户反馈报价。\n- 逾期未跟进提醒。\n- 本周成交/丢单提醒。\n\n关键字段：\n\n- 事项类型。\n- 客户/商机。\n- 当前状态。\n- 下一步动作。\n- 截止时间。\n- 负责人。\n\n### 5.2 客户中心\n\n解决“客户是谁”。\n\n功能：\n\n- 客户新增、编辑、归档。\n- 联系人和关键人管理。\n- 客户标签和等级。\n- 客户来源记录。\n- 客户背景调查。\n- 客户历史商机、询价、报价、跟进、复盘。\n\n客户核心字段：\n\n| 字段 | 必填 | 说明 |\n| --- | --- | --- |\n| 客户名称 | 是 | 公司名称 |\n| 国家/地区 | 是 | 客户所在地 |\n| 行业/应用 | 是 | 自动化、医疗、汽车、电子等 |\n| 客户来源 | 是 | 官网、展会、开发、转介绍、老客户 |\n| 客户状态 | 是 | 潜在、目标、询价、成交、沉睡、无效 |\n| 负责人 | 是 | 主业务员 |\n| 联系人/角色 | 是 | 采购、技术、老板、项目、质量等 |\n| 客户当前需求 | 否 | 一句话描述 |\n| 客户价值判断 | 否 | 是否值得投入 |\n| 风险标签 | 否 | 信用、付款、交期、技术、质量 |\n\n### 5.3 商机中心\n\n解决“这个机会现在走到哪一步”。\n\n功能：\n\n- 商机创建。\n- 阶段推进。\n- 下一步动作管理。\n- 竞争对手记录。\n- 商机金额和成交概率。\n- 商机关闭和复盘。\n\n商机阶段：\n\n```text\n线索 -> 已识别需求 -> 已确认项目 -> 技术评审 -> 报价中 -> 谈判中 -> 成交 / 丢单 / 搁置 / 长期跟进\n```\n\n商机核心字段：\n\n| 字段 | 必填 | 说明 |\n| --- | --- | --- |\n| 商机名称 | 是 | 项目名称 |\n| 所属客户 | 是 | 关联客户 |\n| 当前阶段 | 是 | 商机阶段 |\n| 客户需求摘要 | 是 | 客户要什么 |\n| 预计金额 | 否 | 预估价值 |\n| 成交概率 | 否 | 阶段或人工判断 |\n| 当前卡点 | 是 | 资料、技术、报价、客户反馈等 |\n| 下一步动作 | 是 | 具体动作 |\n| 下一步负责人 | 是 | 谁负责 |\n| 下次跟进日期 | 是 | 什么时候 |\n\n### 5.4 询价/需求中心\n\n解决“需求是什么”。\n\n功能：\n\n- 询价录入。\n- 图纸/资料附件。\n- 资料完整度检查。\n- 缺失资料标记。\n- 提交技术评审。\n\n询价核心字段：\n\n| 字段 | 必填 | 说明 |\n| --- | --- | --- |\n| 询价编号 | 是 | 系统自动生成 |\n| 所属客户 | 是 | 关联客户 |\n| 所属商机 | 是 | 关联商机 |\n| 产品/零件名称 | 是 | 客户需求名称 |\n| 应用场景 | 否 | 用在哪里 |\n| 图纸/资料 | 否 | 2D、3D、样品、规格书 |\n| 材料要求 | 否 | 客户指定材料 |\n| 表面处理 | 否 | 氧化、电镀、喷涂等 |\n| 数量 | 是 | 报价数量 |\n| 年度/月度需求 | 否 | 后续潜力 |\n| 交期要求 | 否 | 客户期望 |\n| 质量标准 | 否 | 验收要求 |\n| 缺失资料 | 是 | 没有则填“无” |\n| 资料完整度 | 是 | 完整/部分完整/缺失严重 |\n\n### 5.5 技术评审中心\n\n解决“我们能不能做”。\n\n功能：\n\n- 技术评审任务。\n- 图纸完整性检查。\n- 材料、结构、工艺、质量、交期风险记录。\n- DFM 建议。\n- 评审结论。\n\n技术评审结论：\n\n```text\n可报价 / 有风险可报价 / 需客户补充 / 暂不建议报价 / 不可报价\n```\n\n评审核心字段：\n\n| 字段 | 必填 | 说明 |\n| --- | --- | --- |\n| 关联询价 | 是 | 来源询价 |\n| 评审人 | 是 | 技术负责人 |\n| 图纸完整性 | 是 | 完整/缺失/需确认 |\n| 材料可行性 | 是 | 可行/替代/风险/不可行 |\n| 工艺路线 | 是 | CNC、车削、铣削等 |\n| 关键尺寸/公差 | 否 | 重点风险 |\n| 质量风险 | 是 | 低/中/高 |\n| 交期风险 | 是 | 低/中/高 |\n| DFM 建议 | 否 | 优化建议 |\n| 评审结论 | 是 | 结论枚举 |\n| 完成时间 | 是 | 用于评审周期统计 |\n\n### 5.6 报价中心\n\n解决“怎么报价”。\n\n功能：\n\n- 报价申请。\n- 报价成本明细。\n- 报价版本管理。\n- 报价审批。\n- 报价发送记录。\n- 客户反馈记录。\n- 二次报价。\n\n报价状态：\n\n```text\n草稿 -> 待技术输入 -> 待成本核算 -> 待业务确认 -> 待审批 -> 已批准 -> 已发送客户 -> 客户反馈中 -> 成交 / 丢单 / 作废\n```\n\n报价核心字段：\n\n| 字段 | 必填 | 说明 |\n| --- | --- | --- |\n| 报价编号 | 是 | 系统自动生成 |\n| 报价版本 | 是 | V1/V2/V3 |\n| 关联客户 | 是 | 客户 |\n| 关联询价 | 是 | 询价 |\n| 材料成本 | 是 | 成本项 |\n| 加工成本 | 是 | 成本项 |\n| 表面处理成本 | 否 | 成本项 |\n| 外协/包装/运输 | 否 | 成本项 |\n| 利润率 | 是 | 敏感字段，需权限控制 |\n
