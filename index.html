  return '<details class="english-pair"' + (shown ? ' open' : '') + '><summary class="english-toggle">' + icon('languages', 13) +
    '本段英文' + icon('chevron-down', 12) + '</summary>' + body + '</details>';
}
function miniMD(text) {
  var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
  var h = '', i = 0;
  if (lines.length && lines[0].charAt(0) === '|') {
    var rows = [];
    while (i < lines.length && lines[i].charAt(0) === '|') {
      var cells = lines[i].split('|').slice(1, -1).map(function (x) { return x.trim(); });
      if (!cells.every(function (x) { return /^[-: ]+$/.test(x); })) rows.push(cells);
      i++;
    }
    h += '<table><thead><tr>' + (rows[0] || []).map(function (c) { return '<th>' + inlineMD(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.slice(1).map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inlineMD(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
  }
  if (i < lines.length) h += lines.slice(i).map(function (l) { return '<p>' + inlineMD(l) + '</p>'; }).join('');
  return h;
}
function markdownHTML(text, translations, expanded) {
  var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
  var out = '', idx = 0;
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (l.charAt(0) === '<' && l.indexOf('<details>') === 0) {
      var m = l.match(/<summary>(.*?)<\/summary>/);
      var title = m ? m[1] : '参考思路';
      var start = i + 1;
      while (++i < lines.length && lines[i].indexOf('</details>') < 0) {}
      out += '<details class="reference-details"><summary>' + esc(title) + '</summary>' +
        markdownHTML(lines.slice(start, i).join('\n'), translations ? translations.slice(start, i) : null, expanded) + '</details>';
      continue;
    }
    if (l.charAt(0) === '|') {
      var t = [];
      while (i < lines.length && lines[i].charAt(0) === '|') {
        var cells = lines[i].split('|').slice(1, -1).map(function (x) { return x.trim(); });
        if (!cells.every(function (x) { return /^[-: ]+$/.test(x); })) t.push(cells);
        i++;
      }
      i--;
      out += '<div class="reading-paragraph"><div class="table-scroll"><table><thead><tr>' +
        (t[0] || []).map(function (c) { return '<th>' + inlineMD(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        t.slice(1).map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inlineMD(c) + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table></div>';
      var en = translations && translations[idx];
      if (en) out += englishBlockHTML(en, false, expanded);
      out += '</div>'; idx++; continue;
    }
    var node;
    if (/^### /.test(l)) node = '<h4>' + inlineMD(l.slice(4)) + '</h4>';
    else if (/^## /.test(l)) node = '<h3>' + inlineMD(l.slice(3)) + '</h3>';
    else if (/^# /.test(l)) node = '<h2>' + inlineMD(l.slice(2)) + '</h2>';
    else if (/^- \[ \]/.test(l)) node = '<p class="reading-check"><span class="empty-square"></span>' + inlineMD(l.slice(5).trim()) + '</p>';
    else if (/^(\d+\.|[-*]) /.test(l)) node = '<p class="reading-list">' + inlineMD(l) + '</p>';
    else node = '<p>' + inlineMD(l) + '</p>';
    out += '<div class="reading-paragraph">' + node;
    var en2 = translations && translations[idx];
    if (en2) out += englishBlockHTML(en2, idx === 0 || idx === 2 || idx === 3, expanded);
    out += '</div>'; idx++;
  }
  return out;
}

function toast(msg) {

  clearTimeout(root._t);

function celebrate() {
  var root = pick('#confetti-root');
  var colors = ['#6944ed', '#a045e8', '#dc8b18', '#278d83', '#e05d62', '#4684bf'];
  var html = '';
  for (var i = 0; i < 42; i++) {
    html += '<span class="confetti-piece" style="left:' + Math.round(Math.random() * 100) + '%;background:' + colors[i % colors.length] + ';animation-delay:' + (Math.random() * 0.6).toFixed(2) + 's"></span>';
  }

function setTab(t) { if (APP.tab === t) return; speechStop(); APP.tab = t; try { localStorage.setItem(LS.prefs, JSON.stringify({ tab: t })); } catch (e) {} render(); }

function collectGoalForm() { var g = {}; pickAll('[data-gf]').forEach(function (el) { g[el.getAttribute('data-gf')] = el.value; }); return g; }

function generateReport(week) {
  var records = APP.snap.records, goals = APP.snap.goals, today = todayCN();
  var end = week === monday(today) ? today : addDays(week, 6);
  var prevS = addDays(week, -7), prevE = addDays(end, -7);
  var lines = ['周报 ' + week + ' — ' + end, '对比 ' + prevS + ' — ' + prevE, ''];
  goals.forEach(function (g) {
    var a = weekStats(records.filter(function (r) { return r.goal_id === g.id; }), week, end);
    var p = weekStats(records.filter(function (r) { return r.goal_id === g.id; }), prevS, prevE);
    var course = courseOf(g.course_id) || {};
    lines.push((course.unit || '') + (course.title || '') + '：+' + fmt(a.quantity) + ' ' + g.unit + ' · ' + a.days + ' 天 · ' + fmt(a.minutes) + ' 分钟（上期 ' + fmt(p.quantity) + ' · ' + p.days + ' 天 · ' + fmt(p.minutes) + ' 分钟）');
  });
  var wt = weekStats(records, week, end), wp = weekStats(records, prevS, prevE);
  lines.push('', '本期合计：' + wt.days + ' 个打卡日 · ' + fmt(wt.minutes) + ' 分钟（' + delta(wt.days, wp.days, '天') + '；' + delta(wt.minutes, wp.minutes, '分钟') + '）');
  var eng = records.filter(function (r) { return r.day >= week && r.day <= end && r.english_sentence && r.english_sentence.trim(); });
  if (eng.length) { lines.push('', '本周英语积累：'); eng.forEach(function (r) { lines.push('- ' + r.day + '：' + r.english_sentence); }); }
  var savedReview = APP.snap.reviews.find(function(r) { return r.week_start === week; }) || {};
  var review = Object.assign({}, savedReview, (APP.reviewDraft || {})[week] || {});
  [['保持','keep'],['问题','problem'],['尝试','attempt'],['下周预案','next_plan']].forEach(function(field) { lines.push('', field[0] + '：', review[field[1]] || '尚未填写'); });
  return lines.join('\n');
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast('已复制'); }, function () { toast('复制失败，请长按选择复制'); });
  } else { toast('复制失败，请长按选择复制'); }
}
function handleUpload(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { APP.formError = '单张图片不能超过 5MB。'; renderModals(); return; }
  var reader = new FileReader(), draft = APP.logDraft;
  APP.uploading = (APP.uploading || 0) + 1;
  function uploadDone() { APP.uploading = Math.max(0, (APP.uploading || 0) - 1); }
  reader.onerror = function() { uploadDone(); APP.formError = '图片读取失败，请重新选择。'; renderModals(); };
  reader.onload = function () {
    var id = uid();
    imagePut(id, reader.result).then(function () {
      if (!APP.logDraft || APP.logDraft !== draft || APP.logDraft.images.length >= 3) return;
      APP.logDraft.images.push(id); APP.formError = ''; renderModals();
    }, function () { APP.formError = '图片保存失败，请重试。'; renderModals(); }).finally(uploadDone);
  };
  reader.readAsDataURL(file);
}

  if (res && res.error) { APP.formError = res.error; renderModals(); return; }
  APP.goalDraft = null; render(); toast(cloudSavedMessage('学习目标已保存'));
}
async function submitLog(e) {
  e.preventDefault();

  var v = collectLogForm();

  var goalId = APP.logDraft.goal_id, before = goalById(goalId), beforeRemain = before ? goalMetric(before).remaining : 0;
  var res = await mutate('checkin', Object.assign({}, APP.logDraft, v, { quantity: Number(v.quantity), minutes: v.minutes === '' ? null : Number(v.minutes) }));
  if (res && res.error) { APP.formError = res.error; renderModals(); return; }
  APP.logDraft = null; render();
  var rec = APP.snap.records.find(function (r) { return r.id === res.id; });
  if (beforeRemain > 0 && goalById(goalId) && goalMetric(goalById(goalId)).remaining === 0) { celebrate(); toast(cloudSavedMessage('目标达成！已提交成果')); }
  else toast(cloudSavedMessage('已提交成果并打卡'));

document.addEventListener('click', async function (e) {
  var el = e.target;
  if (el.getAttribute && el.getAttribute('data-slot') === 'dialog-overlay') { closeModals(); return; }
  var hit;
  if ((hit = el.closest('[data-copy]'))) { copyText(hit.getAttribute('data-copy')); return; }
  if ((hit = el.closest('[data-speak]'))) { var box = hit.closest('.read-aloud'); speechStart({ id: uid(), label: box.getAttribute('data-read-label') || '朗读', text: box.getAttribute('data-read-text'), repeat: hit.getAttribute('data-speak') === 'follow' }); return; }

  if ((hit = el.closest('[data-speech-sample]'))) { speechStart({ id: hit.getAttribute('data-speech-sample-id') || uid(), label: '试听英语音色', text: hit.getAttribute('data-speech-sample'), repeat: false }); return; }
  if ((hit = el.closest('[data-speech-recheck]'))) { speechRefresh(); return; }
  if ((hit = el.closest('[data-speech-stop]'))) { speechStop(); return; }
  if ((hit = el.closest('[data-speech-retry]'))) { speechRetry(); return; }
  if ((hit = el.closest('[data-speech-copy]'))) { copyText(location.href); return; }
  if ((hit = el.closest('[data-link]'))) { followLink(hit.getAttribute('data-link')); return; }
  if ((hit = el.closest('[data-open-img]'))) { e.preventDefault(); var oid = hit.getAttribute('data-open-img'); imageGet(oid).then(function (src) { if (src) { var wdw = window.open('', '_blank'); if (wdw) wdw.document.write('<img src="' + src + '" style="max-width:100%">'); } }); return; }
  var tabBtn = el.closest('[data-tab]');
  if (tabBtn && !tabBtn.hasAttribute('data-act')) { setTab(tabBtn.getAttribute('data-tab')); return; }
  var a = el.closest('[data-act]');
  if (!a) return;
  var act = a.getAttribute('data-act'), id = a.getAttribute('data-id'), unit = a.getAttribute('data-unit'), goal = a.getAttribute('data-goal');
  switch (act) {
    case 'read': showRead(unit); break;
    case 'new-goal': openGoal(null, unit); break;
    case 'edit': openGoal(goalById(goal)); break;
    case 'checkin': openLog(goalById(goal)); break;
    case 'feedback': openFeedback(APP.snap.records.find(function (r) { return r.id === id; })); break;
    case 'del-record': openConfirm('delete_record', id); break;
    case 'del-goal': openConfirm('delete_goal', goal); break;
    case 'confirm': openConfirm(a.getAttribute('data-action'), id); break;
    case 'confirm-do': confirmDo(a.getAttribute('data-action'), id, (pick('[data-cf]') ? pick('[data-cf]').value : '')); break;
    case 'close': closeModals(); break;
    case 'reload': try { await Cloud.sync(true); } catch (err) { toast(err.message); } break;
    case 'lang': APP.readerBilingual = a.getAttribute('data-mono') === '0'; renderModals(); break;
    case 'toggle-expand': APP.readerExpanded = !APP.readerExpanded; renderModals(); break;
    case 'jump': var jt = pick(a.getAttribute('data-to') === 'kit' ? '#reader-kit' : '#reader-body'); if (jt) jt.scrollIntoView({ behavior: 'smooth' }); break;
    case 'save-feedback': saveFeedback(); break;
    case 'rm-img': APP.logDraft.images = APP.logDraft.images.filter(function (x) { return x !== id; }); renderModals(); break;
    case 'week-prev': APP.week = addDays(APP.week || monday(todayCN()), -7); render(); break;
    case 'week-next': var w2 = addDays(APP.week || monday(todayCN()), 7); if (w2 <= monday(todayCN())) { APP.week = w2; render(); } break;
    case 'gen-report': APP.report = generateReport(APP.week || monday(todayCN())); renderModals(); break;
    case 'save-review': var wk2 = a.getAttribute('data-week'); var rres = await mutate('save_review', Object.assign({ week_start: wk2 }, collectReviewForm())); if (rres && rres.error) { toast(rres.error); break; } APP.reviewDirty = APP.reviewDirty || {}; APP.reviewDirty[wk2] = false; render(); toast(cloudSavedMessage('周复盘已保存')); break;
    case 'toggle-window': var wr = await mutate('settings', { forecast_window: forecastWindow() === 14 ? 7 : 14 }); if (wr.error) toast(wr.error); render(); break;
    case 'toggle-related': var i2 = APP.feedbackRelated.indexOf(id); if (i2 >= 0) APP.feedbackRelated.splice(i2, 1); else APP.feedbackRelated.push(id); renderModals(); break;
  }
});

document.addEventListener('change', function (e) { if (e.target.type === 'file' && e.target.hasAttribute('data-lf')) handleUpload(e.target.files[0]); }, true);
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.hasAttribute && el.hasAttribute('data-gf') && APP.goalDraft) APP.goalDraft[el.getAttribute('data-gf')] = el.value;
  if (el.hasAttribute && el.hasAttribute('data-lf') && el.type !== 'file' && APP.logDraft) APP.logDraft[el.getAttribute('data-lf')] = el.value;
  if (el.hasAttribute && el.hasAttribute('data-fb')) {
    if (el.getAttribute('data-fb') === 'discussion') APP.feedbackDiscussion = el.value;
    if (el.getAttribute('data-fb') === 'english_sentence') APP.feedbackEnglish = el.value;
  }
  if (el.hasAttribute && el.hasAttribute('data-review')) {
    var wk = APP.week || monday(todayCN());
    APP.reviewDraft = APP.reviewDraft || {}; APP.reviewDraft[wk] = APP.reviewDraft[wk] || {};
    APP.reviewDraft[wk][el.getAttribute('data-review')] = el.value;
    APP.reviewDirty = APP.reviewDirty || {}; APP.reviewDirty[wk] = true;
  }
});
document.addEventListener('submit', function (e) {
  var f = e.target;
  if (f.getAttribute('data-form') === 'goal') submitGoal(e);
  else if (f.getAttribute('data-form') === 'log') submitLog(e);
});

function boot() {
  APP.snap = loadSnap() || emptySnap();
  var p = parseMaybe(function () { return JSON.parse(localStorage.getItem(LS.prefs) || '{}'); }, {}) || {};
  if (p.tab) APP.tab = p.tab;
  speechInit();
  var hasBinding = !!localStorage.getItem('ldesk.cloud.binding.v1');
  var chain = (!Cloud.session && !hasBinding && !APP.snap.settings.initialized) ? initializeExamples() : Promise.resolve();
  if (hasBinding && !Cloud.session) APP.snap = emptySnap();
  return chain.then(function () { render(); return Cloud.start(); }).catch(function(e) { render(); Cloud.notify('error', '本机初始化失败：' + e.message); toast('初始化失败，请检查浏览器存储权限后刷新。'); });
}

</script>
<script>
// 只填写项目地址与公开的 Publishable key / anon key。禁止填写 service_role 或 Secret key。
// 也可留空，在“我的 → 接通个人云端”中填写，配置仅保存到本机。
window.LEARNING_CLOUD_CONFIG = { url: '', key: '' };

<script>
/* 个人云端连接层：沿用原页面的数据字段和计算，云端保存成功后才更新界面。 */
(function (global) {
  'use strict';
  var CONFIG = 'ldesk.cloud.config.v1', SESSION = 'ldesk.cloud.session.v1';
  var BINDING = 'ldesk.cloud.binding.v1', PENDING = 'ldesk.cloud.pending.v1';
  function read(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (_) { return null; } }
  function write(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
  function copy(value) { return JSON.parse(JSON.stringify(value)); }
  function error(message, code) { var e = new Error(message); e.code = code; return e; }
  var Cloud = global.Cloud = {
    config: read(CONFIG) || global.LEARNING_CLOUD_CONFIG || { url: '', key: '' },
    session: read(SESSION), status: 'local', message: '本机试用 · 尚未连接云端', lastSync: '',
    busy: false, suppressLocalSave: false, legacy: null, refreshPromise: null,
    imageCache: new Map(), imageIndex: [], timer: null, epoch: 0, reading: false,
    configured: function () { return !!(this.config.url && this.config.key); },
    ready: function () { return !!(this.configured() && this.session && this.session.user); },
    hasDraft: function () { return !!(APP.reading || APP.goalDraft || APP.logDraft || APP.feedback || APP.confirm || Object.values(APP.reviewDirty || {}).some(Boolean)); },
    setBusy: function(on) {
      document.querySelectorAll('#modal-root input, #modal-root select, #modal-root textarea, #modal-root button, [data-review], [data-act="save-review"]').forEach(function(el) {
        if(on) { el.dataset.cloudDisabled=String(el.disabled); el.disabled=true; }
        else if(el.dataset.cloudDisabled !== undefined) { el.disabled=el.dataset.cloudDisabled==='true'; delete el.dataset.cloudDisabled; }
      });
    },
    notify: function (status, message) {
      this.status = status; this.message = message;
      if (typeof document === 'undefined') return;
      document.querySelectorAll('[data-cloud-message]').forEach(function (el) { el.textContent = message; });
      document.querySelectorAll('[data-cloud-status]').forEach(function (el) {
        el.className = 'cloud-status ' + (status === 'ok' ? 'good' : status === 'error' ? 'bad' : '');
      });
      document.querySelectorAll('[data-cloud-time]').forEach(function (el) {
        el.textContent = Cloud.lastSync ? '最近成功同步：' + toShanghai(Cloud.lastSync) : '尚未完成云端同步';
      });
    },
    validateConfig: function (url, key) {
      url = String(url || '').trim().replace(/\/+$/, ''); key = String(key || '').trim();
      if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)) throw error('请填写 https://项目编号.supabase.co 格式的项目地址。');
      var anon = false;
      if (key.startsWith('eyJ')) { try { anon = JSON.parse(atob(key.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).role === 'anon'; } catch (_) {} }
      if (!key.startsWith('sb_publishable_') && !anon) throw error('这里只能填写 Publishable key 或 anon public key，不能使用 Secret / service_role 密钥。');
      return { url: url, key: key };
    },
    saveConfig: function (url, key) {
      var next = this.validateConfig(url, key);
      if (read(PENDING) && next.url !== this.config.url) throw error('有一笔待核对的保存，请先同步核对后更改连接。');
      if (this.session && next.url !== this.config.url) throw error('请先退出当前云端账号，再更换项目。');
      write(CONFIG, next); this.config = next; this.epoch++;
      this.notify('local', '项目已配置，请绑定你的个人云端账号。');
    },
    request: async function (path, options, authenticated, retry) {
      options = options || {};
      if (authenticated && !this.ready()) throw error('请先在“我的”绑定云端账号。', 'AUTH');
      if (authenticated) await this.refresh(false);
      var controller = new AbortController(), timer = setTimeout(function () { controller.abort(); }, 20000);
      var headers = Object.assign({ apikey: this.config.key }, options.headers || {});
      if (authenticated) headers.Authorization = 'Bearer ' + this.session.access_token;
      try {
        var response = await fetch(this.config.url + path, Object.assign({}, options, { headers: headers, signal: controller.signal }));
        if (response.status === 401 && authenticated && !retry) { await this.refresh(true); return this.request(path, options, true, true); }
        if (!response.ok) {
          var detail = await response.json().catch(function () { return {}; });
          var e = error(detail.message || detail.msg || detail.error_description || '云端请求失败，请重试。', detail.code || String(response.status));
          e.status = response.status; throw e;
        }
        if (options.blob) return response.blob();
        var text = await response.text(); return text ? JSON.parse(text) : null;
      } catch (e) {
        if (e.name === 'AbortError') throw error('连接超时，保存结果尚未确认。输入保留，请重新同步或重试原操作。', 'UNCERTAIN');
        if (e instanceof TypeError) throw error('网络连接失败，保存结果尚未确认。输入保留，请重试。', 'UNCERTAIN');
        throw e;
      } finally { clearTimeout(timer); }
    },
    refresh: async function (force) {
      if (!this.session) throw error('请重新绑定云端账号。', 'AUTH');
      if (!force && this.session.expires_at * 1000 > Date.now() + 60000) return;
      if (this.refreshPromise) return this.refreshPromise;
      var self = this;
      var run = async function () {
        var latest = read(SESSION);
        if (latest && latest.user.id === self.session.user.id) self.session = latest;
        if (!force && self.session.expires_at * 1000 > Date.now() + 60000) return;
        var next = await self.request('/auth/v1/token?grant_type=refresh_token', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: self.session.refresh_token })
        }, false);
        if (!next.user || next.user.id !== self.session.user.id) throw error('云端账号发生变化，请重新绑定。', 'AUTH');
        next.expires_at = next.expires_at || Math.floor(Date.now() / 1000) + next.expires_in;
        write(SESSION, next); self.session = next;
      };
      this.refreshPromise = (global.navigator && navigator.locks ? navigator.locks.request('learning-cloud-auth', run) : run()).finally(function () { self.refreshPromise = null; });
      return this.refreshPromise;
    },
    signIn: async function (email, password) {
      if (!this.configured()) throw error('请先保存项目地址和公开密钥。');
      if (this.busy) throw error('正在保存，请稍后再试。');
      this.notify('loading', '正在绑定个人云端账号…');
      var session = await this.request('/auth/v1/token?grant_type=password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email.trim(), password: password })
      }, false);
      if (!session.user || !session.access_token) throw error('没有取得有效登录会话。');
      var binding = read(BINDING);
      if (binding && (binding.user !== session.user.id || binding.url !== this.config.url))
        throw error('本机已有另一账号的数据绑定。请使用原账号，其他账号请使用独立浏览器配置。');
      session.expires_at = session.expires_at || Math.floor(Date.now() / 1000) + session.expires_in;
      write(BINDING, { url: this.config.url, user: session.user.id });
      write(SESSION, session); this.session = session; this.imageCache.clear(); this.epoch++;
      APP.snap = read('ldesk.cloud.cache.' + session.user.id) || emptySnap();
      await this.sync(true);
    },
    signOut: async function () {
      if (this.busy || read(PENDING)) throw error('请先完成或核对当前保存，再退出云端。');
      await this.request('/auth/v1/logout?scope=local', { method: 'POST' }, true);
      localStorage.removeItem(SESSION); this.session = null; this.imageCache.clear(); this.epoch++;
      APP.snap = emptySnap(); this.notify('local', '云端已退出；课程仍可阅读。'); render();
    },
    apply: function (snap) {
      APP.snap = snap; this.imageIndex = snap.image_index || [];
      this.lastSync = snap.server_time; APP.lastSync = snap.server_time;
      APP.sync = 'ok'; APP.error = '';
      write(BINDING, { url: this.config.url, user: this.session.user.id });
      try { write('ldesk.cloud.cache.' + this.session.user.id, snap); } catch (_) { /* 云端已保存，缓存满不能把成功误判为失败。 */ }
      this.notify('ok', '云端已保存 · 手机与电脑共用这一份数据');
    },
    rpc: function (name, body) { return this.request('/rest/v1/rpc/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }, true); },
    sync: async function (force) {
      if (this.busy || this.reading) return;
      if (!this.ready()) { this.notify('local', this.configured() ? '项目已配置，尚未绑定云端账号。' : '本机试用 · 尚未连接云端'); return; }
      if (this.hasDraft()) { if(force) throw error('请先保存或关闭正在编辑的表单，再重新同步。'); return; }
      var epoch = this.epoch;
      this.reading = true;
      try {
        this.notify('loading', '正在读取云端记录…');
        var snap = await this.rpc('learning_read');
        if (epoch !== this.epoch || this.busy || this.hasDraft()) return;
        var pending = read(PENDING);
        if (pending) {
          if (pending.user !== this.session.user.id) throw error('待核对保存属于其他账号。');
          if (snap.settings.last_write_id === pending.request) {
            this.queueCleanup(pending.cleanup || []);
            localStorage.removeItem(PENDING);
          } else if (Number(snap.settings.cloud_version) === pending.version) {
            this.notify('error', '上一笔保存尚未确认，可点击“重试待保存操作”。'); this.remote = snap; return;
          } else {
            this.remote = snap; this.notify('error', '另一设备已有更新。待保存内容已保留，请先核对冲突。'); return;
          }
        }
        this.apply(snap); await this.cleanup(); render();
      } catch (e) { this.notify('error', e.message); if (force) throw e; }
      finally { this.reading = false; }
    },
    commit: async function (candidate, action, signature) {
      var pending = read(PENDING);
      if (pending && pending.signature !== signature) throw error('上一笔保存结果待核对。请先在“我的”重试或核对，避免重复提交。');
      if (!pending) {
        var kept = new Set(candidate.records.flatMap(function(r){return JSON.parse(r.images || '[]');}));
        var removed = action === 'clear_all' ? this.imageIndex.map(function(i){return i.id;}) : APP.snap.records.flatMap(function(r){return JSON.parse(r.images || '[]');}).filter(function(id){return !kept.has(id);});
        pending = { user: this.session.user.id, request: crypto.randomUUID(), version: Number(APP.snap.settings.cloud_version || 0), snapshot: candidate, action: action, signature: signature, cleanup: removed };
        write(PENDING, pending);
      }
      return this.sendPending(pending);
    },
    sendPending: async function (pending) {
      if (!pending || pending.user !== this.session.user.id) throw error('没有属于当前账号的待保存操作。');
      this.epoch++;
      this.notify('loading', '正在保存到云端…');
      try {
        var snap = await this.rpc('learning_commit', { p_expected_version: pending.version, p_request_id: pending.request, p_snapshot: pending.snapshot });
        this.queueCleanup(pending.cleanup || []);
        localStorage.removeItem(PENDING); this.apply(snap);
        await this.cleanup();
        return snap;
      } catch (e) {
        if (e.code !== 'UNCERTAIN' && e.code !== '40001' && e.status && e.status < 500) localStorage.removeItem(PENDING);
        this.notify('error', e.message); throw e;
      }
    },
    retry: async function () {
      if (this.busy) return;
      this.busy = true;
      try { await this.sendPending(read(PENDING)); render(); toast('待保存操作已确认完成'); }
      finally { this.busy = false; }
    },
    resolve: async function () {
      var p = read(PENDING); if (!p) return;
      var current = await this.rpc('learning_read');
      if (current.settings.last_write_id === p.request) { this.queueCleanup(p.cleanup || []); localStorage.removeItem(PENDING); this.apply(current); await this.cleanup(); render(); return; }
      if (!confirm('云端与待保存内容存在差异。使用云端最新版本继续？本次未提交内容会保留在本机冲突记录中，当前打开的表单也会保留。')) return;
      write('ldesk.cloud.conflict.' + p.request, p); localStorage.removeItem(PENDING);
      this.apply(current); render(); toast('已读取云端版本，未提交内容保留在冲突记录中');
    },
    upload: async function (id, dataUrl) {
      if (!/^data:image\/(png|jpeg|webp|gif);base64,/.test(dataUrl)) throw error('支持 PNG、JPG、WebP 或 GIF 图片。');
      var parts = dataUrl.split(','), mime = parts[0].slice(5,-7), raw = atob(parts[1]);
      if (!raw.length || raw.length > 5 * 1024 * 1024) throw error('图片须非空且不超过5MB。');
      var bytes = Uint8Array.from(raw, function (c) { return c.charCodeAt(0); });
      var path = this.session.user.id + '/' + id;
      await this.request('/storage/v1/object/learning-images/' + path, { method: 'POST', headers: { 'Content-Type': mime, 'x-upsert': 'true' }, body: bytes }, true);
      await this.request('/rest/v1/learning_images?on_conflict=owner_id,id', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' }, body: JSON.stringify({ owner_id: this.session.user.id, id: id, object_key: path, mime: mime, name: '学习成果图片' }) }, true);
      this.imageCache.set(id, dataUrl);
      if(!this.imageIndex.some(function(i){return i.id===id;})) this.imageIndex.push({id:id,object_key:path});
      return id;
    },
    image: async function (id) {
      if (this.imageCache.has(id)) return this.imageCache.get(id);
      var blob = await this.request('/storage/v1/object/authenticated/learning-images/' + this.session.user.id + '/' + encodeURIComponent(id), { blob: true }, true);
      var src = await new Promise(function (resolve,reject) { var reader = new FileReader(); reader.onload = function () { resolve(reader.result); }; reader.onerror=reject; reader.readAsDataURL(blob); });
      this.imageCache.set(id,src); return src;
    },
    queueCleanup: function(ids) {
      if(!ids.length) return;
      var key='ldesk.cloud.cleanup.'+this.session.user.id;
      write(key,Array.from(new Set((read(key)||[]).concat(ids))));
    },
    cleanup: async function () {
      var key='ldesk.cloud.cleanup.'+this.session.user.id, ids=read(key)||[];
      if(!ids.length) return;
      try {
        var paths=await this.rpc('learning_prune_images',{p_ids:ids});
        if(paths.length) await this.request('/storage/v1/object/learning-images', {method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefixes:paths})},true);
        localStorage.removeItem(key);
        ids.forEach(function(id){Cloud.imageCache.delete(id);});
      } catch(e) { this.notify('error','学习记录已保存；图片清理未完成，请点击“重新同步”重试。'+e.message); }
    },
    importLocal: async function () {
      if (!this.ready()) throw error('请先绑定云端账号。');
      if (APP.snap.goals.length || APP.snap.records.length || APP.snap.reviews.length) throw error('云端已有记录，为避免覆盖，当前只允许向空云端导入。');
      var source = this.legacy || loadSnap();
      if (!source || !Array.isArray(source.goals)) throw error('这台设备没有可导入的原本机记录。');
      if (!confirm('将本机的 ' + source.goals.length + ' 个目标、' + source.records.length + ' 条记录及图片导入当前云端账号？')) return;
      this.busy=true;
      try {
        var candidate=copy(source), ids=new Set();
        candidate.records.forEach(function(r){JSON.parse(r.images||'[]').forEach(function(id){ids.add(id);});});
        for (var id of ids) { var dataUrl=await imageGetLocal(id); if(!dataUrl) throw error('本机缺少图片 '+id+'，已停止导入，原记录没有删除。'); await this.upload(id,dataUrl); }
        await this.commit(candidate,'import','import-local'); render(); toast('本机记录和图片已导入云端');
      } finally { this.busy=false; }
    },
    start: async function () {
      this.legacy=loadSnap();
      if (this.ready()) {
        var cached=read('ldesk.cloud.cache.'+this.session.user.id);
        APP.snap=cached || emptySnap(); render(); await this.sync(false);
      } else { this.notify('local',this.configured()?'尚未绑定云端账号 · 当前为本机试用':'本机试用 · 尚未连接云端'); render(); }
      if(!this.timer) this.timer=setInterval(function(){if(!document.hidden) Cloud.sync(false);},30000);
    }
  };

  global.cloudStatusLabel=function(){return Cloud.status==='ok'?'云端已保存':Cloud.status==='loading'?'正在同步':Cloud.status==='error'?'同步需处理':Cloud.session?'尚未完成同步':'本机试用';};
  global.cloudBannerHTML=function(){
    return '<section class="cloud-banner"><div><strong>'+esc(cloudStatusLabel())+'</strong><p data-cloud-message>'+esc(Cloud.message)+'</p></div><button class="secondary" data-tab="me">'+(Cloud.ready()?'查看同步状态':'接通个人云端')+'</button></section>';
  };
  global.cloudPanelHTML=function(){
    var p=read(PENDING), c=Cloud.config;
    var html='<section class="panel"><h3>'+icon('cloud',20)+' 个人云端</h3><p class="cloud-help">打开页面即可学习与点读；接通 Supabase 后，学习记录与成果图片可在手机和电脑间同步。</p>';
    html+='<div class="cloud-status '+(Cloud.status==='ok'?'good':Cloud.status==='error'?'bad':'')+'" data-cloud-status role="status"><strong data-cloud-message>'+esc(Cloud.message)+'</strong><time data-cloud-time>'+(Cloud.lastSync?'最近成功同步：'+esc(toShanghai(Cloud.lastSync)):'尚未完成云端同步')+'</time></div>';
    if(Cloud.session){
      html+='<p class="cloud-account">已绑定：'+esc(Cloud.session.user.email||'个人账号')+'</p><div class="cloud-actions"><button class="primary" data-cloud="sync">重新同步</button><button class="secondary" data-cloud="import">导入原本机记录</button><button class="secondary" data-cloud="signout">退出云端</button></div>';
      if(p) html+='<div class="cloud-actions"><button class="primary" data-cloud="retry">重试待保存操作</button><button class="secondary" data-cloud="resolve">核对云端冲突</button></div>';
      if(Object.keys(localStorage).some(function(k){return k.startsWith('ldesk.cloud.conflict.');})) html+='<button class="secondary" data-cloud="conflicts">查看保留的冲突内容</button>';
      html+='<button class="secondary" data-cloud="rebind">重新绑定账号</button><p class="cloud-help">打开页面即可进入。云端会话失效时，需要重新绑定。保存失败会保留输入，不会显示为已同步。</p>';

  global.cloudMutation=async function(action,p){
    if(Cloud.busy) return {error:'正在保存，请稍候。'};
    if(!Cloud.session){
      if(read(BINDING)) return {error:'请先重新绑定云端账号再保存。课程仍可阅读。'};
      var previous=APP.snap; APP.snap=copy(previous);
      var local=mutateLocal(action,p);
      if(local && local.error) { APP.snap=previous; Cloud.notify('error',local.error); }
      else Cloud.notify('local','已保存到本机试用空间 · 尚未写入云端');
      return local;
    }
    if(!Cloud.ready()) return {error:'请先连接个人云端。'};
    Cloud.busy=true; Cloud.setBusy(true); var before=APP.snap, candidate, result;
    try{
      var pending=read(PENDING), signature=JSON.stringify({action:action,input:p});
      if(pending){ if(pending.signature!==signature) throw error('上一笔保存待核对，请前往“我的”重试或核对。'); await Cloud.sendPending(pending); return {ok:true,id:p.id}; }
      APP.snap=copy(before); Cloud.suppressLocalSave=true;
      result=mutateLocal(action,p); candidate=APP.snap;
      APP.snap=before; Cloud.suppressLocalSave=false;
      if(result&&result.error) return result;
      await Cloud.commit(candidate,action,signature); return result;
    }catch(e){Cloud.notify('error',e.message);return {error:e.message};}
    finally{Cloud.suppressLocalSave=false;Cloud.busy=false;Cloud.setBusy(false);}
  };
  global.mutate = global.cloudMutation;
  global.cloudSavedMessage=function(text){return Cloud.ready()?text+' · 云端已保存':text+' · 仅本机试用';};
  global.imagePut=function(id,data){if(Cloud.ready())return Cloud.upload(id,data);if(read(BINDING))return Promise.reject(error('请先绑定云端账号再上传图片。'));return imagePutLocal(id,data);};
  global.imageGet=function(id){return Cloud.ready()?Cloud.image(id).catch(function(e){Cloud.notify('error','图片读取失败：'+e.message);return null;}):imageGetLocal(id);};
  global.removeImage=function(id){if(!Cloud.session) removeImageLocal(id);};

  if(typeof document!=='undefined'){
    document.addEventListener('submit',async function(e){
      if(!e.target.matches('[data-form="cloud"]')) return;
      e.preventDefault();var form=e.target,values=new FormData(form),button=form.querySelector('button');button.disabled=true;
      try{Cloud.saveConfig(values.get('url'),values.get('key'));await Cloud.signIn(values.get('email'),values.get('password'));toast('个人云端已接通');}
      catch(err){Cloud.notify('error',err.message);toast(err.message);}finally{var password=form.querySelector('[name="password"]');if(password)password.value='';button.disabled=false;}
    });
    document.addEventListener('click',async function(e){
      var button=e.target.closest('[data-cloud]');if(!button)return;
      button.disabled=true;
      try{switch(button.dataset.cloud){
        case 'sync':await Cloud.sync(true);break;
        case 'retry':await Cloud.retry();break;
        case 'resolve':await Cloud.resolve();break;
        case 'import':await Cloud.importLocal();break;
        case 'signout':await Cloud.signOut();break;
        case 'rebind':if(Cloud.busy)throw error('请等待当前保存完成。');localStorage.removeItem(SESSION);Cloud.session=null;Cloud.epoch++;APP.snap=emptySnap();Cloud.notify('local','请重新绑定原云端账号；待核对内容仍保留。');render();break;
        case 'conflicts':var values=Object.keys(localStorage).filter(function(k){return k.startsWith('ldesk.cloud.conflict.');}).map(read);APP.report=JSON.stringify(values,null,2);renderModals();break;
      }}catch(err){Cloud.notify('error',err.message);toast(err.message);}finally{button.disabled=false;}
    });
    global.addEventListener('online',function(){Cloud.sync(false);});
    global.addEventListener('focus',function(){Cloud.sync(false);});
    document.addEventListener('visibilitychange',function(){
      if(document.hidden){speechStop();}
      else Cloud.sync(false);
    });
  }
})(globalThis);
