| 报价金额 | 是 | 对外价格 |\n| 交期 | 是 | 对外承诺 |\n| MOQ | 否 | 最小起订量 |\n| 付款条件 | 否 | 预付、账期等 |\n| 报价有效期 | 是 | 到期提醒 |\n| 客户反馈 | 否 | 报价后填写 |\n\n### 5.7 跟进中心\n\n解决“客户怎么反馈”。\n\n功能：\n\n- 电话、微信、邮件、会议、拜访记录。\n- 报价后反馈。\n- 下一步动作。\n- 跟进提醒。\n- 逾期提醒。\n\n跟进记录字段：\n\n| 字段 | 必填 | 说明 |\n| --- | --- | --- |\n| 关联客户 | 是 | 客户 |\n| 关联商机 | 否 | 可关联商机 |\n| 跟进方式 | 是 | 电话、微信、邮件、会议、拜访 |\n| 跟进内容 | 是 | 具体沟通内容 |\n| 客户反馈类型 | 否 | 价格、交期、质量、付款、技术等 |\n| 下一步动作 | 是 | 具体动作 |\n| 下一步负责人 | 是 | 负责人 |\n| 下次跟进日期 | 是 | 提醒依据 |\n\n### 5.8 复盘/知识库\n\n解决“成没成交，为什么”。\n\n功能：\n\n- 成单复盘。\n- 丢单复盘。\n- 报价失败复盘。\n- 经验标签。\n- 可复用案例。\n\n复盘字段：\n\n| 字段 | 必填 | 说明 |\n| --- | --- | --- |\n| 关联商机/报价 | 是 | 来源 |\n| 结果 | 是 | 成交/丢单/长期跟进 |\n| 原因分类 | 是 | 价格、交期、质量、技术、关系、付款等 |\n| 具体原因 | 是 | 真实描述 |\n| 做对了什么 | 否 | 成功经验 |\n| 做错了什么 | 否 | 改进点 |\n| 下次动作 | 是 | 改进动作 |\n| 是否沉淀知识库 | 是 | 是/否 |\n\n### 5.9 报表中心\n\n负责人最先只看 8 个指标：\n\n| 指标 | 口径 |\n| --- | --- |\n| 新增客户数 | 本周新增客户 |\n| 活跃商机数 | 未关闭且有下一步动作的商机 |\n| 资料缺失询价数 | 资料完整度非“完整”的询价 |\n| 待技术评审数 | 已提交但未完成评审 |\n| 待报价数 | 可报价但未发送报价 |\n| 已报价未反馈数 | 已发送报价但无客户反馈 |\n| 报价转化率 | 成交报价数 / 已发送报价数 |\n| 丢单原因分布 | 按价格、交期、质量等分类 |\n\n## 6. 第一版页面清单\n\n第一版建议 10 个页面：\n\n1. 工作台。\n2. 客户列表。\n3. 客户详情。\n4. 商机列表。\n5. 商机详情。\n6. 询价列表/详情。\n7. 技术评审列表/详情。\n8. 报价列表/详情。\n9. 跟进记录。\n10. 基础报表。\n\n不要第一版就做太多页面，否则业务员不会用。\n\n## 7. 系统建设步骤\n\n### 第 0 步：确认试点范围\n\n目标：避免一上来全公司铺开。\n\n动作：\n\n- 选 1 个业务小组。\n- 选 3-5 个真实客户。\n- 选 1-2 个真实报价案例。\n- 明确试点周期：建议 30 天。\n\n输出：\n\n- 试点客户清单。\n- 试点人员清单。\n- 试点验收标准。\n\n### 第 1 步：先用表格跑流程\n\n目标：在开发系统前验证流程是否成立。\n\n动作：\n\n- 使用真实客户信息采集问卷。\n- 整理到试点客户台账。\n- 每周用检查表开会。\n- 记录资料缺失、技术评审、报价反馈、成单/丢单原因。\n\n输出：\n\n- 真实数据样本。\n- 字段删减建议。\n- 流程卡点。\n\n### 第 2 步：确定 MVP 字段\n\n目标：避免字段过重。\n\n动作：\n\n- 从试点台账中筛出高频字段。\n- 区分必填、选填、后补字段。\n- 删除业务员不愿填、管理者不看的字段。\n\n输出：\n\n- 客户字段。\n- 商机字段。\n- 询价字段。\n- 技术评审字段。\n- 报价字段。\n- 跟进字段。\n\n### 第 3 步：选择建设方式\n\n三种方式：\n\n| 方式 | 适合情况 | 优点 | 风险 |\n| --- | --- | --- | --- |\n| 表格/飞书/Notion/Airtable | 先跑流程 | 快、便宜、易调整 | 权限和自动化有限 |\n| 低代码系统 | 需要尽快上线内部工具 | 比表格规范，开发快 | 后期复杂逻辑受限 |\n| 定制开发 | 流程稳定且要长期使用 | 可扩展、可集成 | 成本高、周期长 |\n\n建议：\n\n```text\n先用表格/低代码跑 30 天，流程稳定后再决定是否定制开发。\n```\n\n### 第 4 步：搭建 MVP\n\n第一版只做：\n\n- 客户中心。\n- 商机中心。\n- 询价中心。\n- 技术评审。\n- 报价中心。\n- 跟进记录。\n- 基础报表。\n\n验收标准：\n\n- 一个客户从询价到报价反馈能完整记录。\n- 管理者能看到卡点。\n- 业务员愿意每天更新。\n\n### 第 5 步：试运行 30 天\n\n每周检查：\n\n- 客户是否建档。\n- 商机是否有下一步动作。\n- 询价资料缺失是否标记。\n- 报价前是否技术评审。\n- 报价后是否有反馈。\n- 成单/丢单是否写原因。\n\n输出：\n\n- 字段优化。\n- 流程优化。\n- 权限优化。\n- 报表优化。\n\n### 第 6 步：扩大使用\n\n前提：\n\n- 试点小组能持续使用。\n- 业务员没有明显抵触。\n- 管理者能通过系统开会。\n- 报价和跟进信息明显更可追溯。\n\n再推广：\n\n- 第二个业务小组。\n- 更多客户类型。\n- 更复杂报价。\n- 审批和权限。\n\n## 8. 主要阻力在哪里\n\n### 8.1 业务员不愿填\n\n表现：\n\n- 觉得系统增加工作量。\n- 只写“有兴趣”“等回复”。\n- 把系统当成汇报负担。\n\n原因：\n\n- 字段太多。\n- 填了没人看。\n- 填了以后没有帮助自己成交。\n\n应对：\n\n- 第一版只抓 6 条纪律。\n- 工作台只显示业务员今天要做什么。\n- 周会必须基于系统数据，不接受口头替代。\n- 管理者只追问关键字段，不要求一次填全。\n\n### 8.2 资料不完整导致流程卡住\n\n表现：\n\n- 客户发了图纸但缺材料、数量、交期。\n- 销售直接丢给报价。\n- 报价人员反复退回。\n\n原因：\n\n- 没有资料完整度标准。\n- 没有缺失资料字段。\n- 责任人不明确。\n\n应对：\n\n- 询价必须有“资料完整度”和“缺失资料”字段。\n- 缺资料也能建询价，但不能进入正式报价。\n- 缺失资料必须有补问负责人和截止时间。\n\n### 8.3 技术评审不及时\n\n表现：\n\n- 报价卡在技术。\n- 技术只说“再看看”。\n- 销售催报价，技术怕担责。\n\n原因：\n\n- 没有评审结论枚举。\n- 没有 SLA。\n- 风险不能结构化表达。\n\n应对：\n\n- 技术评审结论只能选：可报价、有风险可报价、需客户补充、暂不建议报价、不可报价。\n- 每个评审任务有截止时间。\n- 风险按材料、工艺、结构、质量、交期分类。\n\n### 8.4 报价依据不透明\n\n表现：\n\n- 只看到报价金额，看不到怎么算。\n- 客户嫌贵时不知道怎么调整。\n- 二次报价靠经验。\n\n原因：\n\n- 成本项没有拆。\n- 报价版本没有管理。\n- 客户反馈没有回到报价逻辑。\n\n应对：\n\n- 报价必须有关联询价和技术评审。\n- 报价必须有版本。\n- 至少拆材料、加工、表面处理、包装运输、利润。\n- 客户反馈必须记录反馈类型。\n\n### 8.5 管理者不用系统开会\n\n表现：\n\n- 业务员填了，但会议还是口头汇报。\n- 系统数据没人看。\n- 团队很快放弃。\n\n原因：\n\n- 管理者没有把系统作为唯一事实来源。\n- 没有固定周会检查表。\n\n应对：\n\n- 周会只看系统里的客户、商机、报价和反馈。\n- 没有下一步动作的商机不算有效商机。\n- 每周固定检查逾期事项。\n\n### 8.6 权限和敏感数据\n\n表现：\n\n- 业务员不该看到利润。\n- 报价成本泄露风险。\n- 客户资料和图纸需要保密。\n\n原因：\n\n- 权限没有分层。\n- 附件和成本没有特殊控制。\n\n应对：\n\n- 业务员看客户价，不看完整成本和利润。\n- 报价工程师、经理、负责人看成本和利润。\n- 图纸附件记录上传人、下载人和操作日志。\n- 高风险客户和重要报价限制查看范围。\n\n## 9. MVP 验收标准\n\n第一版 CRM 合格，不看功能多少，只看这些：\n\n1. 新客户能在 3 分钟内建档。\n2. 每个活跃商机都有下一步动作和时间。\n3. 询价能标记资料完整度和缺失资料。\n4. 报价前能看到技术评审结论。\n5. 报价后能记录客户反馈。\n6. 成单/丢单能写原因。\n7. 负责人能看到待跟进、待评审、待报价、已报价未反馈。\n8. 周会能基于系统数据开，而不是靠口头回忆。\n\n## 10. 推荐落地节奏\n\n```text\n第 1 周：用表格跑客户、需求、下一步动作\n第 2 周：加入技术评审和报价状态\n第 3 周：加入报价反馈和二次报价\n第 4 周：加入成单/丢单复盘和基础报表\n第 5-8 周：决定低代码或定制开发\n```\n\n## 11. 当前可立即执行的 3 件事\n\n1. 用 [真实客户信息采集问卷.md](./真实客户信息采集问卷.md) 收集 3-5 个真实客户。\n2. 把客户整理进 [团队试点客户台账模板.csv](./团队试点客户台账模板.csv)。\n3. 用 [每周业务检查表.md](./每周业务检查表.md) 开第一次 30 分钟 CRM 试点检查会。\n\n## 12. 第一版配置参考\n\n如果要开始在表格、低代码工具或定制系统中建模块和字段，直接参考：\n\n- [CRM_MVP配置清单.csv](./CRM_MVP配置清单.csv)\n\n这份清单已经按模块列出对象、字段、字段类型、是否必填、建议选项、主责角色和第一版是否需要。\n\n## 13. 本地原型试用\n\n已经生成一个可直接打开的本地 CRM MVP 原型：\n\n- [CRM 原型页面](<../../../Tina do the trade/crm-mvp/index.html>)\n- [CRM 原型使用说明](<../../../Tina do the trade/crm-mvp/README.md>)\n\n这个原型适合先用 3-5 个真实客户验证流程。它不是正式系统，数据保存在浏览器本地；确认业务字段、页面顺序和周会检查方式可用后，再决定低代码搭建或定制开发。\n如果浏览器不能直接打开本地 HTML，可以在 `crm-mvp` 目录运行 `node dev-server.js`，再访问 `http://127.0.0.1:8765/`。\n\n原型当前已经支持：\n\n- 新增、编辑、删除客户、商机、询价、技术评审、报价、跟进和复盘记录。\n- 工作台查看活跃商机、资料缺失询价和已报价未反馈。\n- 周会检查自动列出缺下一步、资料不完整、报价缺评审、报价后无反馈、成交/丢单无复盘。\n- JSON 导出和导入，用于单机试用阶段的数据备份。\n\n第一轮试用建议只录 3-5 个真实客户。不要先追求权限、自动化、审批和附件，先验证团队能不能稳定做到“有客户、有需求、有评审、有报价、有反馈、有复盘”。\n",
    "crm/落地完成度审计.md": "# 落地完成度审计\n\n## 1. 审计目的\n\n目标是：\n\n```text\n自己理解并带团队用起来，按三个层次理解和运用：业务逻辑、系统流程、日常动作。\n```\n\n这份审计用于判断当前资料包已经支撑到哪一步，以及还需要哪些真实执行证据，才能证明目标真正完成。\n\n## 2. 目标拆解\n\n| 要求 | 具体含义 | 当前状态 |\n| --- | --- | --- |\n| 自己理解 | 负责人能讲清主线、三层框架、客户/商机/报价逻辑 | 已有材料支持，需本人实际自测 |\n| 带团队用起来 | 团队完成启动会、试点客户、周会检查、复盘 | 已有材料支持，需真实团队执行 |\n| 业务逻辑 | 能讲清客户是谁、需求是什么、为什么赢、为什么成或丢 | 已有模板和样例，需真实案例验证 |\n| 系统流程 | 能按客户建档、询价、技术评审、报价、反馈、复盘推进 | 已有流程和台账，需真实台账验证 |\n| 日常动作 | 每个活跃商机有负责人、动作、时间和完成标准 | 已有检查表，需每周执行验证 |\n\n## 3. 当前已完成的支撑材料\n\n### 3.1 理解层\n\n| 能力 | 证据文件 |\n| --- | --- |\n| 理解系统定位和业务对象 | [业务管理系统结构化需求.md](./业务管理系统结构化需求.md) |\n| 理解三层框架 | [三层理解与运用速查表.md](./三层理解与运用速查表.md) |\n| 个人自测和练习 | [个人理解练习与掌握自测.md](./个人理解练习与掌握自测.md) |\n| 查看合格样例 | [真实客户案例填写示例.md](./真实客户案例填写示例.md) |\n\n### 3.2 启动层\n\n| 能力 | 证据文件 |\n| --- | --- |\n| 知道总体怎么做 | [实施总清单.md](./实施总清单.md) |\n| 知道资料怎么分发 | [资料分发清单.md](./资料分发清单.md) |\n| 能开第一次启动会 | [第一次团队培训方案.md](./第一次团队培训方案.md) |\n| 能按当天步骤执行 | [启动日操作清单.md](./启动日操作清单.md) |\n| 能分清角色责任 | [团队角色任务卡.md](./团队角色任务卡.md) |\n\n### 3.3 执行层\n\n| 能力 | 证据文件 |\n| --- | --- |\n| 能填试点客户台账 | [团队试点客户台账模板.csv](./团队试点客户台账模板.csv) |\n| 知道台账怎么填 | [团队试点客户台账使用说明.md](./团队试点客户台账使用说明.md) |\n| 能写客户案例卡 | [真实客户案例卡模板.md](./真实客户案例卡模板.md) |\n| 能开每周业务检查会 | [每周业务检查表.md](./每周业务检查表.md) |\n| 能追问模糊汇报 | [负责人带教话术与追问库.md](./负责人带教话术与追问库.md) |\n\n### 3.4 验收层\n\n| 能力 | 证据文件 |\n| --- | --- |\n| 能按第 7/14/30 天验收 | [团队试点执行验收表.md](./团队试点执行验收表.md) |\n| 能跟踪 30 天指标 | [30天试点跟踪看板模板.csv](./30天试点跟踪看板模板.csv) |\n| 能从入口找到所有材料 | [README.md](./README.md) |\n\n## 4. 仍缺的真实执行证据\n\n当前文档已经能支撑启动和执行，但还不能证明团队已经真正用起来。还缺以下证据：\n\n| 缺失证据 | 为什么需要 | 证明方式 |\n| --- | --- | --- |\n| 3-5 个真实试点客户 | 证明不是只停留在模板 | 台账中出现真实客户记录 |\n| 每个业务员至少 3 个客户 | 证明团队成员参与 | 台账按负责人统计 |\n| 至少 1 次启动会记录 | 证明团队已启动 | 会议纪要或启动当天产出 |\n| 至少 1 次周会检查记录 | 证明进入管理节奏 | 每周业务检查表 |\n| 至少 1 张真实案例卡 | 证明能按三层框架分析客户 | 真实客户案例卡 |\n| 第 7 天验收表 | 证明第一轮执行结果 | 团队试点执行验收表 |\n| 30 天看板更新 | 证明持续执行 | 30 天试点跟踪看板 |\n\n## 5. 完成判定标准\n\n### 5.1 可以判定为“已启动”\n\n满足：\n\n- 已开启动会。\n- 每个业务员已选 3 个试点客户。\n- 台账已有真实客户。\n- 每个试点客户有负责人。\n\n### 5.2 可以判定为“基本用起来”\n\n满足：\n\n- 试点客户 100% 建档。\n- 活跃商机 100% 有下一步动作和时间。\n- 询价资料缺失已标记。\n- 正式报价前有技术评审或风险说明。\n- 已报价客户有反馈或跟进计划。\n- 至少完成 1 次周会检查。\n\n### 5.3 可以判定为“稳定用起来”\n\n满足：\n\n- 连续 4 周使用周会检查表。\n- 每周至少沉淀 1 个案例或复盘。\n- 第 30 天验收达到“基本用起来”以上。\n- 管理者能通过台账和看板发现卡点。\n- 团队汇报从“有兴趣/等回复/嫌贵”变成“客户、需求、流程、动作、时间”。\n\n## 6. 当前审计结论\n\n基于当前文件状态：\n\n```text\n材料准备：已完成\n启动执行：待真实客户试点\n团队用起来：待真实执行证据\n最终目标：未能仅凭文档证明完成\n```\n\n当前最小下一步：\n\n```text\n选 3-5 个真实客户，先填《真实客户信息采集表.csv》，再整理进《团队试点客户台账模板.csv》，并用《每周业务检查表.md》开第一次 30 分钟检查会。\n```\n\n## 7. 给负责人的下一步清单\n\n1. 选出 3-5 个真实客户。\n2. 指定每个客户负责人。\n3. 用 [真实客户信息采集表.csv](./真实客户信息采集表.csv) 收集基础信息。\n4. 用 [团队试点客户台账模板.csv](./团队试点客户台账模板.csv) 填第一版台账。\n5. 选 1 个客户填写 [真实客户案例卡模板.md](./真实客户案例卡模板.md)。\n6. 用 [每周业务检查表.md](./每周业务检查表.md) 开第一次检查会。\n7. 第 7 天用 [团队试点执行验收表.md](./团队试点执行验收表.md) 做第一次验收。\n",
    "crm/团队试点客户台账使用说明.md": "# 团队试点客户台账使用说明\n\n## 1. 台账用途\n\n`团队试点客户台账模板.csv` 用于第一阶段试点，不替代正式系统。\n\n它的作用是帮助团队先养成 6 个基本习惯：\n\n1. 新客户必须建档。\n2. 活跃商机必须有下一步动作和时间。\n3. 询价资料缺失必须标记。\n4. 正式报价前必须技术评审。\n5. 报价发出后必须记录客户反馈。\n6. 成单/丢单必须写原因。\n\n## 2. 填写频率\n\n- 业务员：每天更新自己的客户和商机。\n- 技术/报价：每天更新技术评审和报价状态。\n- 业务经理：每周检查一次完整性。\n\n## 3. 必填字段\n\n第一阶段必须填：\n\n- 客户名称。\n- 客户国家/地区。\n- 行业/应用。\n- 客户来源。\n- 负责人。\n- 联系人/关键人。\n- 客户阶段。\n- 商机名称。\n- 商机阶段。\n- 客户需求摘要。\n- 资料完整度。\n- 缺失资料。\n- 是否技术评审。\n- 是否已报价。\n- 客户反馈。\n- 下一步动作。\n- 下一步负责人。\n- 下次跟进日期。\n- 当前卡点。\n\n## 4. 字段说明\n\n| 字段 | 说明 |\n| --- | --- |\n| 客户名称 | 客户公司名称 |\n| 客户国家/地区 | 客户所在国家或地区 |\n| 行业/应用 | 客户所属行业或产品应用场景 |\n| 客户来源 | 官网、展会、转介绍、主动开发、老客户等 |\n| 负责人 | 主业务负责人 |\n| 联系人/关键人 | 联系人姓名和角色，如采购经理、项目工程师、老板 |\n| 客户阶段 | 潜在客户、目标客户、询价客户、成交客户、沉睡客户 |\n| 商机名称 | 当前销售机会或项目名称 |\n| 商机阶段 | 线索、已识别需求、技术评审、报价中、谈判中、成交、丢单、搁置 |\n| 客户需求摘要 | 一句话说清客户要什么 |\n| 资料完整度 | 完整、部分完整、缺失严重 |\n| 缺失资料 | 缺图纸、材料、数量、交期、质量标准、目标价等 |\n| 是否技术评审 | 是/否 |\n| 技术评审结论 | 可报价、有风险可报价、需客户补充、暂不建议报价、不可报价 |\n| 是否已报价 | 是/否 |\n| 报价版本 | V1、V2、V3 |\n| 报价金额 | 报价总额或关键单价 |\n| 报价发送日期 | 报价发给客户的日期 |\n| 客户反馈 | 客户对价格、交期、质量、付款、MOQ、样品等反馈 |\n| 下一步动作 | 必须具体，例如“补问年度用量”，不能写“继续跟进” |\n| 下一步负责人 | 谁负责完成下一步 |\n| 下次跟进日期 | 具体日期 |\n| 当前卡点 | 阻碍推进的问题 |\n| 成单/丢单状态 | 跟进中、成交、丢单、长期跟进 |\n| 成单/丢单原因 | 关闭商机时必须填写 |\n| 可沉淀经验 | 这次案例可复用的经验 |\n\n## 5. 每周检查方式\n\n业务经理每周检查 5 件事：\n\n1. 有没有客户没有负责人。\n2. 有没有商机没有下一步动作。\n3. 有没有询价资料缺失但没人补问。\n4. 有没有报价前没有技术评审。\n5. 有没有报价后没有客户反馈。\n\n## 6. 不合格写法\n\n不要这样写：\n\n```text\n客户有兴趣\n等客户回复\n继续跟进\n报价已发\n客户嫌贵\n```\n\n要这样写：\n\n```text\n客户采购经理 John 确认 5000 件 CNC 铝件需求，缺年度用量和目标交期，Tina 6 月 21 日前补问。\n\nV1 报价已于 6 月 18 日发送，客户反馈价格偏高，要求解释材料和加工差异；报价工程师 6 月 22 日前准备材料替代方案和二次报价。\n```\n\n",
    "crm/团队角色任务卡.md": "# 团队角色任务卡\n\n## 1. 使用目的\n\n这份任务卡用于分发给团队成员，让每个角色知道自己每天、每周要做什么。\n\n统一原则：\n\n```text\n业务逻辑要讲清，系统流程要走通，日常动作要落到人和时间。\n```\n\n## 2. 业务员任务卡\n\n### 2.1 你负责什么\n\n业务员负责把客户和需求讲清楚，并推动下一步动作。\n\n核心输出：\n\n- 客户档案。\n- 联系人/关键人。\n- 询价资料。\n- 商机阶段。\n- 跟进记录。\n- 客户反馈。\n- 成单/丢单原因。\n\n### 2.2 每天必须做\n\n| 动作 | 合格标准 |\n| --- | --- |\n| 新客户建档 | 当天或次日完成客户名称、来源、行业、联系人、负责人 |\n| 更新活跃商机 | 每个商机有阶段、下一步动作、负责人、日期 |\n| 补问缺失资料 | 明确缺什么、为什么影响报价、什么时候补齐 |\n| 记录客户反馈 | 报价后记录客户对价格、交期、质量、付款、MOQ、技术的反馈 |\n| 处理逾期跟进 | 逾期客户必须更新状态或转长期跟进 |\n\n### 2.3 不能这样汇报\n\n```text\n客户有兴趣。\n客户嫌贵。\n等客户回复。\n继续跟进。\n资料不完整。\n```\n\n### 2.4 必须这样汇报\n\n```text\n客户采购经理 John 确认 5000 件 CNC 铝件需求，缺年度用量和目标交期。Tina 6 月 21 日前补问，补齐后提交技术评审。\n```\n\n## 3. 业务经理任务卡\n\n### 3.1 你负责什么\n\n业务经理负责让团队按流程推进，发现卡点，并把模糊汇报压成明确动作。\n\n核心输出：\n\n- 重点客户清单。\n- 重点商机清单。\n- 卡点清单。\n- 行动清单。\n- 周会检查结果。\n- 成单/丢单复盘。\n\n### 3.2 每天必须看\n\n| 动作 | 合格标准 |\n| --- | --- |\n| 看新增客户 | 新客户有负责人、来源、联系人 |\n| 看重点商机 | 每个重点商机有阶段和下一步动作 |\n| 看待评审 | 待技术评审有负责人和截止时间 |\n| 看待报价 | 待报价有资料完整度和报价负责人 |\n| 看报价反馈 | 已报价客户有反馈或下一次跟进时间 |\n\n### 3.3 每周必须做\n\n- 开一次业务检查会。\n- 选一个真实客户做案例卡。\n- 复盘一个成单或丢单案例。\n- 更新 30 天试点跟踪看板。\n- 检查 6 条纪律是否执行。\n\n### 3.4 关键追问\n\n```text\n这个客户为什么值得做？\n现在卡在哪个流程节点？\n下一步谁做？\n什么时候完成？\n完成标准是什么？\n```\n\n## 4. 技术/工艺工程师任务卡\n\n### 4.1 你负责什么\n\n技术/工艺工程师负责判断能不能做、难在哪里、风险是什么、如何优化。\n\n核心输出：\n\n- 技术评审结论。\n- 材料可行性判断。\n- 工艺路线。\n- 关键尺寸/公差风险。\n- 质量风险。\n- DFM 建议。\n\n### 4.2 每天必须做\n\n| 动作 | 合格标准 |\n| --- | --- |\n| 查看待评审任务 | 每个待评审项目有评审人和截止时间 |\n| 标记资料缺失 | 说明缺失资料影响成本、交期、质量还是可行性 |\n| 输出评审结论 | 可报价 / 有风险可报价 / 需客户补充 / 不建议报价 |\n| 提出 DFM 建议 | 能降低成本、降低风险或提升可制造性的建议 |\n| 说明风险 | 风险必须具体到材料、工艺、结构、质量或交期 |\n\n### 4.3 不能这样写\n\n```text\n技术再看看。\n应该可以做。\n风险不大。\n图纸不完整。\n```\n\n### 4.4 必须这样写\n\n```text\n关键孔位 0.02mm 公差存在稳定加工风险，需要确认检测方式和批量良率。建议先按有风险可报价处理，并向客户确认该孔位是否为装配关键尺寸。\n```\n\n## 5. 报价工程师任务卡\n\n### 5.1 你负责什么\n\n报价工程师负责把客户需求、技术评审和成本核算转成可追溯报价。\n\n核心输出：\n\n- 报价成本明细。\n- 报价版本。\n- 报价有效期。\n- MOQ/阶梯报价。\n- 利润率。\n- 报价风险说明。\n\n### 5.2 每天必须做\n\n| 动作 | 合格标准 |\n| --- | --- |\n| 检查报价前置条件 | 客户、询价、技术评审、数量、材料、交期齐全或已标记缺失 |\n| 核算成本 | 材料、加工、表面处理、外协、包装、运输、税费、利润清楚 |\n| 管理报价版本 | V1/V2/V3 可追溯 |\n| 标记报价风险 | 低利润、急交期、材料波动、技术风险明确 |\n| 支持二次报价 | 根据客户反馈调整材料、工艺、数量或商务条件 |\n\n### 5.3 报价前必须问\n\n```text\n资料完整吗？\n技术评审完成了吗？\n数量和 MOQ 明确吗？\n交期明确吗？\n利润率合理吗？\n是否需要审批？\n```\n\n## 6. 负责人/老板任务卡\n\n### 6.1 你负责什么\n\n负责人负责守住执行纪律，推动团队从“靠感觉”转向“靠事实、流程和动作”。\n\n核心输出：\n\n- 试点方向。\n- 执行纪律。\n- 资源协调。\n- 审批决策。\n- 复盘机制。\n- 经营判断。\n\n### 6.2 每周必须看\n\n| 动作 | 合格标准 |\n| --- | --- |\n| 看 30 天看板 | 建档率、下一步动作覆盖率、技术评审覆盖率、报价反馈记录率 |\n| 看重点商机 | 是否有价值、是否卡住、是否需要协调 |\n| 看报价质量 | 报价是否有依据、利润和风险是否清楚 |\n| 看复盘案例 | 成单/丢单是否有原因和可复用经验 |\n| 看团队纪律 | 6 条纪律是否持续执行 |\n\n### 6.3 负责人底线\n\n```text\n没有负责人，不算有效客户。\n没有下一步动作，不算有效商机。\n没有资料完整度，不进入正式报价。\n没有技术评审，不做高风险报价。\n没有原因，不关闭成单/丢单。\n```\n\n## 7. 角色协作规则\n\n| 场景 | 主责 | 协同 | 输出 |\n| --- | --- | --- | --- |\n| 新客户进入 | 业务员 | 业务经理 | 客户档案 |\n| 客户询价 | 业务员 | 技术/报价 | 询价资料 |\n| 技术评审 | 技术工程师 | 业务员/报价 | 技术评审结论 |\n| 报价核算 | 报价工程师 | 技术/采购/业务 | 报价单 |\n| 报价反馈 | 业务员 | 报价/技术 | 客户反馈和二次报价动作 |\n| 成单/丢单 | 业务经理 | 业务员/技术/报价 | 复盘结论 |\n\n",
    "crm/负责人带教话术与追问库.md": "# 负责人带教话术与追问库\n\n## 1. 使用目的\n\n这份话术库用于你在周会、晨会、一对一辅导、报价评审和复盘时使用。\n\n目标是把团队的模糊表达，压成清楚的三层表达：\n\n```text\n业务逻辑：为什么值得做？\n系统流程：现在走到哪一步？\n日常动作：谁在什么时候前做什么？\n```\n\n## 2. 统一开场话术\n\n### 2.1 启动试点时\n\n```text\n这次试点不是为了增加大家填表负担，而是为了让客户、需求、报价、反馈和复盘能被团队看见。\n\n我们第一阶段只抓 6 件事：客户建档、下一步动作、资料缺失、技术评审、报价反馈、成单丢单原因。\n```\n\n### 2.2 周会开始时\n\n```text\n今天不汇报流水账。我们只看客户、商机、资料缺失、技术评审、报价反馈和成单丢单原因。\n\n每个重点商机最后都要落到一句话：谁在什么时候前做什么。\n```\n\n### 2.3 纠偏时\n\n```text\n这个说法还停留在感觉。我们把它拆成三层：业务逻辑是什么，流程卡在哪一步，下一步动作是谁来做。\n```\n\n## 3. 常见模糊汇报追问\n\n### 3.1 “客户有兴趣”\n\n追问：\n\n- 客户对什么有兴趣？\n- 是谁表达的兴趣？\n- 这个人是决策人、采购、技术、使用者还是影响人？\n- 客户现在最关心价格、交期、质量、技术还是服务？\n- 这个兴趣对应真实项目、比价、供应商储备还是信息收集？\n- 下一步动作是什么？\n\n要求团队改成：\n\n```text\n客户采购经理 John 对 5000 件 CNC 铝件项目有兴趣，目前在比较供应商价格和交期。Tina 6 月 21 日前补问年度用量和目标交期。\n```\n\n### 3.2 “客户嫌贵”\n\n追问：\n\n- 客户说贵多少？\n- 跟哪个供应商或哪个方案比？\n- 客户目标价是多少？\n- 客户是否理解我们的材料、工艺、质量、交期差异？\n- 是价格问题，还是价值没有讲清？\n- 有没有替代材料、替代工艺、阶梯报价或二次报价空间？\n\n要求团队改成：\n\n```text\n客户反馈 V1 报价比本地供应商高约 8%，但认可交期。报价工程师 6 月 22 日前准备材料替代方案和 V2 阶梯报价。\n```\n\n### 3.3 “等客户回复”\n\n追问：\n\n- 上次联系是什么时候？\n- 客户是否确认收到？\n- 我们问了什么问题？\n- 客户为什么还没回复？\n- 下一次联系时间是什么时候？\n- 如果仍无回复，是否转长期跟进或关闭？\n\n要求团队改成：\n\n```text\n6 月 18 日已发送报价并确认客户收到。Tina 6 月 21 日追问价格和交期反馈；若 6 月 25 日仍无回复，转长期跟进。\n```\n\n### 3.4 “资料不完整”\n\n追问：\n\n- 缺什么资料？\n- 缺失资料影响成本、交期、质量还是技术可行性？\n- 哪些是必须补齐，哪些可以先做区间判断？\n- 谁向客户补问？\n- 什么时候补齐？\n\n要求团队改成：\n\n```text\n当前缺年度用量、目标交期和表面处理要求，影响成本核算和工艺判断。Tina 6 月 21 日前向客户补问。\n```\n\n### 3.5 “报价发了”\n\n追问：\n\n- 哪个报价版本？\n- 什么时间发的？\n- 报价依据是什么？\n- 利润和风险是否明确？\n- 客户是否确认收到？\n- 下次跟进时间是什么？\n\n要求团队改成：\n\n```text\nV1 报价已于 6 月 18 日发送，报价依据为材料 6061、CNC 加工、5000 件数量、标准包装。客户已确认收到，6 月 21 日追问反馈。\n```\n\n### 3.6 “技术再看看”\n\n追问：\n\n- 技术要看什么？\n- 是图纸问题、材料问题、工艺问题、质量问题还是交期问题？\n- 评审人是谁？\n- 什么时候给结论？\n- 结论会影响是否报价、报价金额还是交期？\n\n要求团队改成：\n\n```text\n技术需确认关键公差 0.02mm 是否可稳定加工，影响工艺和报价。技术工程师 6 月 20 日前给出可报价/有风险可报价/不建议报价结论。\n```\n\n## 4. 按三层框架带教\n\n### 4.1 业务逻辑层\n\n你要不断追问：\n\n```text\n这个客户为什么值得做？\n这个需求是真需求还是试探？\n客户真正想解决什么问题？\n谁有权决定？\n我们凭什么赢？\n如果输了，可能输在哪里？\n```\n\n带教重点：\n\n- 不接受“感觉重要”。\n- 要求用行业、需求、金额、复购、战略价值、关键人关系等事实支撑判断。\n\n### 4.2 系统流程层\n\n你要不断追问：\n\n```text\n这个客户现在在哪个流程节点？\n上一节点完成了吗？\n下一节点是什么？\n现在卡在哪里？\n卡点属于客户、内部、技术、报价还是审批？\n```\n\n带教重点：\n\n- 不接受商机悬空。\n- 每个商机必须有阶段、卡点和下一步。\n\n### 4.3 日常动作层\n\n你要不断追问：\n\n```text\n下一步具体做什么？\n谁负责？\n什么时候完成？\n完成标准是什么？\n如果没完成，谁来协调？\n```\n\n带教重点：\n\n- 不接受“继续跟进”。\n- 所有动作必须具体到人和时间。\n\n## 5. 报价评审追问\n\n报价前问：\n\n- 客户和商机是否明确？\n- 询价资料是否完整？\n- 技术评审是否完成？\n- 材料、工艺、数量、交期、质量要求是否明确？\n- 报价成本由哪些部分组成？\n- 利润率是否合理？\n- 有哪些风险预留？\n- 是否需要审批？\n\n报价后问：\n\n- 报价是否发送？\n- 客户是否确认收到？\n- 客户反馈了什么？\n- 是否需要二次报价？\n- 下一步谁跟进？\n\n## 6. 成单/丢单复盘追问\n\n### 6.1 成单\n\n追问：\n\n- 客户为什么选择我们？\n- 哪个动作起了关键作用？\n- 报价、交期、质量、技术、关系中哪个因素最重要？\n- 这个案例能复制到哪些客户？\n\n### 6.2 丢单\n\n追问：\n\n- 真正丢在哪里？\n- 是价格、交期、质量、技术、关系、付款还是客户需求变化？\n- 我们在哪一步发现太晚？\n- 下次如何提前识别？\n- 是否还能长期跟进？\n\n不接受的丢单原因：\n\n```text\n客户嫌贵。\n客户没回复。\n客户没有预算。\n竞争对手关系好。\n```\n\n必须进一步拆成：\n\n```text\n贵多少、跟谁比、差异是什么、客户是否理解价值、我们是否有替代方案、下次如何改进。\n```\n\n## 7. 一对一带教流程\n\n每次 20 分钟，按这个顺序：\n\n1. 选 1 个真实客户。\n2. 让业务员用 3 分钟讲客户。\n3. 你按三层框架追问。\n4. 找出最大卡点。\n5. 定 1 个下一步动作。\n6. 约定完成时间。\n\n记录格式：\n\n```text\n客户：\n当前阶段：\n最大卡点：\n下一步动作：\n负责人：\n截止时间：\n下次检查时间：\n```\n\n## 8. 管理者底线\n\n第一阶段你只守住 5 条底线：\n\n1. 没有负责人，不算有效客户。\n2. 没有下一步动作，不算有效商机。\n3. 没有资料完整度，不进入正式报价。\n4. 没有技术评审，不做高风险报价。\n5. 没有原因，不关闭成单/丢单。\n\n",
    "crm/团队试点执行验收表.md": "# 团队试点执行验收表\n\n## 1. 使用目的\n\n这份表用于判断团队是否真的把业务管理方法用起来，而不是只开过培训会、填过几行表。\n\n建议在试点第 7 天、第 14 天、第 30 天各检查一次。\n\n验收围绕三层框架：\n\n```text\n业务逻辑 -> 系统流程 -> 日常动作\n```\n\n## 2. 试点基本信息\n\n```text\n试点周期：\n参与人员：\n试点客户数量：\n试点商机数量：\n负责人：\n检查日期：\n```\n\n## 3. 第一层：业务逻辑验收\n\n目标：团队能不能把客户和业务机会讲清楚。\n\n| 验收项 | 合格标准 | 得分 0/1/2 | 证据 |\n| --- | --- | --- | --- |\n| 客户是谁 | 能说清客户行业、来源、联系人、关键人 |  |  |\n| 需求是什么 | 能说清产品、用途、数量、材料、交期、质量要求 |  |  |\n| 客户为什么需要我们 | 能说清客户痛点、场景或采购动机 |  |  |\n| 谁决定采购 | 能识别决策人、影响人、使用人或采购人 |  |  |\n| 我们凭什么赢 | 能说清技术、价格、交期、质量、服务或关系优势 |  |  |\n| 报价依据是什么 | 能说清成本、利润、风险、工艺、材料、数量依据 |  |  |\n| 为什么成或丢 | 能记录成交/丢单原因，不停留在感觉 |  |  |\n| 经验能否复用 | 能沉淀为案例、话术、报价策略或客户标签 |  |  |\n\n评分说明：\n\n- 0 分：没有记录或说不清。\n- 1 分：有记录，但信息模糊。\n- 2 分：有事实、有判断、有下一步或可复用经验。\n\n业务逻辑小计：\n\n```text\n总分：\n结论：未达标 / 基本达标 / 达标\n```\n\n## 4. 第二层：系统流程验收\n\n目标：客户和商机是否按流程推进，而不是停留在个人聊天和口头汇报。\n\n| 流程节点 | 合格标准 | 是否达标 | 问题 |\n| --- | --- | --- | --- |\n| 客户建档 | 试点客户均有客户名称、来源、负责人、联系人 |  |  |\n| 背景调查 | 重点客户至少有行业、主营产品、关键人、价值判断 |  |  |\n| 需求/询价 | 询价资料完整度已标记，缺失资料已列出 |  |  |\n| 商机立项 | 活跃机会有商机阶段、预计金额或价值判断 |  |  |\n| 技术评审 | 正式报价前有技术评审或风险说明 |  |  |\n| 报价 | 报价有关联客户、询价、版本、金额、日期 |  |  |\n| 跟进谈判 | 报价后有客户反馈和下一步动作 |  |  |\n| 成单/丢单 | 已关闭机会有结果和原因 |  |  |\n| 复盘沉淀 | 至少沉淀 1 个案例或经验 |  |  |\n\n流程验收结论：\n\n```text\n跑通节点：\n卡住节点：\n最需要改进的流程：\n```\n\n## 5. 第三层：日常动作验收\n\n目标：团队是否形成稳定执行动作。\n\n| 日常动作 | 合格标准 | 是否达标 | 证据 |\n| --- | --- | --- | --- |\n| 新客户建档 | 新增客户当天或次日建档 |  |  |\n| 下一步动作 | 活跃商机都有具体动作、负责人、日期 |  |  |\n| 资料缺失标记 | 资料不完整时明确缺什么、谁补、何时补 |  |  |\n| 技术评审跟进 | 待评审任务有负责人和截止时间 |  |  |\n| 报价反馈记录 | 已发报价有客户反馈或无反馈跟进记录 |  |  |\n| 周会检查 | 每周按检查表复盘客户、商机、报价和卡点 |  |  |\n| 成单/丢单复盘 | 关闭机会有原因和改进动作 |  |  |\n\n日常动作验收结论：\n\n```text\n稳定动作：\n不稳定动作：\n下周重点纠偏：\n```\n\n## 6. 关键指标验收\n\n第一阶段不追求复杂指标，只看基础执行数据。\n\n| 指标 | 目标 | 实际 | 是否达标 |\n| --- | --- | --- | --- |\n| 试点客户数 | 每个业务员至少 3 个 |  |  |\n| 客户建档率 | 100% |  |  |\n| 活跃商机下一步动作覆盖率 | 100% |  |  |\n| 询价资料缺失标记率 | 100% |  |  |\n| 正式报价前技术评审覆盖率 | 80% 以上 |  |  |\n| 已报价反馈记录率 | 80% 以上 |  |  |\n| 成单/丢单原因记录率 | 100% |  |  |\n| 每周复盘案例数 | 至少 1 个 |  |  |\n\n## 7. 管理者判断\n\n请负责人回答：\n\n```text\n团队是否能讲清客户？\n团队是否能讲清需求？\n团队是否能讲清当前流程节点？\n团队是否能讲清卡点？\n团队是否能讲清下一步动作？\n报价是否比以前更可追溯？\n客户跟进是否比以前更可控？\n是否已经发现可复用经验？\n```\n\n## 8. 验收结论\n\n选择一个：\n\n```text\n未启动：只开了会，没有真实客户记录。\n已启动：有试点客户和台账，但执行不稳定。\n基本用起来：客户、商机、询价、报价、反馈已有记录，周会能检查动作。\n稳定用起来：团队能持续按三层框架分析业务，并沉淀复盘经验。\n```\n\n当前结论：\n\n```text\n\n```\n\n## 9. 下一步改进\n\n| 问题 | 原因 | 改进动作 | 负责人 | 截止时间 |\n| --- | --- | --- | --- | --- |\n|  |  |  |  |  |\n|  |  |  |  |  |\n|  |  |  |  |  |\n\n",
    "crm/资料分发清单.md": "# 资料分发清单\n\n## 1. 使用目的\n\n这份清单用于启动试点前分发资料，避免团队面对太多文档不知道先看哪一份。\n\n原则：\n\n```text\n负责人看总控，业务员看动作，技术/报价看评审和报价，会议只用检查表。\n```\n\n## 2. 负责人/老板\n\n必看：\n\n- [实施总清单.md](./实施总清单.md)\n- [三层理解与运用速查表.md](./三层理解与运用速查表.md)\n- [负责人带教话术与追问库.md](./负责人带教话术与追问库.md)\n- [团队试点执行验收表.md](./团队试点执行验收表.md)\n- [30天试点跟踪看板模板.csv](./30天试点跟踪看板模板.csv)\n\n使用场景：\n\n- 启动前准备。\n- 周会追问。\n- 第 7/14/30 天验收。\n- 判断团队是否真的用起来。\n\n负责人要产出：\n\n- 试点客户范围。\n- 启动会安排。\n- 每周检查节奏。\n- 30 天验收结论。\n\n## 3. 业务经理\n\n必看：\n\n- [团队角色任务卡.md](./团队角色任务卡.md)\n- [每周业务检查表.md](./每周业务检查表.md)\n- [负责人带教话术与追问库.md](./负责人带教话术与追问库.md)\n- [真实客户案例卡模板.md](./真实客户案例卡模板.md)\n- [真实客户案例填写示例.md](./真实客户案例填写示例.md)\n\n使用场景：\n\n- 每日检查重点商机。\n- 每周业务会。\n- 一对一辅导业务员。\n- 成单/丢单复盘。\n\n业务经理要产出：\n\n- 重点商机清单。\n- 卡点清单。\n- 下一步动作清单。\n- 每周复盘案例。\n\n## 4. 业务员\n\n必看：\n\n- [团队角色任务卡.md](./团队角色任务卡.md)\n- [三层理解与运用速查表.md](./三层理解与运用速查表.md)\n- [团队试点客户台账模板.csv](./团队试点客户台账模板.csv)\n- [团队试点客户台账使用说明.md](./团队试点客户台账使用说明.md)\n- [真实客户案例填写示例.md](./真实客户案例填写示例.md)\n\n使用场景：\n\n- 新客户建档。\n- 客户询价。\n- 报价后跟进。\n- 周会汇报。\n\n业务员要产出：\n\n- 客户档案。\n- 商机下一步动作。\n- 缺失资料清单。\n- 客户反馈记录。\n- 成单/丢单原因。\n\n如果业务员暂时不会填台账，先让他填写：\n\n- [真实客户信息采集问卷.md](./真实客户信息采集问卷.md)\n\n## 5. 技术/工艺工程师\n\n必看：\n\n- [团队角色任务卡.md](./团队角色任务卡.md)\n- [真实客户案例卡模板.md](./真实客户案例卡模板.md)\n- [真实客户案例填写示例.md](./真实客户案例填写示例.md)\n\n使用场景：\n\n- 技术评审。\n- DFM 建议。\n- 风险判断。\n- 报价前支持。\n\n技术/工艺要产出：\n\n- 技术评审结论。\n- 材料和工艺可行性判断。\n- 关键尺寸/质量/交期风险。\n- DFM 建议。\n\n## 6. 报价工程师\n\n必看：\n\n- [团队角色任务卡.md](./团队角色任务卡.md)\n- [团队试点客户台账模板.csv](./团队试点客户台账模板.csv)\n- [真实客户案例填写示例.md](./真实客户案例填写示例.md)\n\n使用场景：\n\n- 报价前资料检查。\n- 成本核算。\n- 报价版本管理。\n- 二次报价。\n\n报价工程师要产出：\n\n- 报价成本明细。\n- 报价版本。\n- 报价风险说明。\n- 利润和审批判断。\n\n## 7. 启动会只发这 5 份\n\n第一次启动会不要一次性发所有材料，建议只发：\n\n1. [实施总清单.md](./实施总清单.md)\n2. [三层理解与运用速查表.md](./三层理解与运用速查表.md)\n3. [团队角色任务卡.md](./团队角色任务卡.md)\n4. [真实客户信息采集问卷.md](./真实客户信息采集问卷.md)\n5. [真实客户案例填写示例.md](./真实客户案例填写示例.md)\n\n其他材料由负责人和业务经理在周会、复盘和验收时使用。\n\n## 8. 第一次周会只用这 3 份\n\n第一次周会建议只用：\n\n1. [每周业务检查表.md](./每周业务检查表.md)\n2. [负责人带教话术与追问库.md](./负责人带教话术与追问库.md)\n3. [团队试点客户台账模板.csv](./团队试点客户台账模板.csv)\n\n会议目标：\n\n- 找出卡点。\n- 明确下一步动作。\n- 更新台账。\n",
    "crm/启动日操作清单.md": "# 启动日操作清单\n\n## 1. 使用目的\n\n这份清单用于正式启动试点当天。你可以按顺序执行，不需要临时设计会议流程。\n\n启动日目标：\n\n```text\n让团队知道为什么做、怎么做、今天要填什么、明天检查什么。\n```\n\n## 2. 启动前准备\n\n负责人提前准备：\n\n- 选 3-5 个真实客户作为示例。\n- 打开 [三层理解与运用速查表.md](./三层理解与运用速查表.md)。\n- 打开 [第一次团队培训方案.md](./第一次团队培训方案.md)。\n- 打开 [团队试点客户台账模板.csv](./团队试点客户台账模板.csv)。\n- 打开 [真实客户案例卡模板.md](./真实客户案例卡模板.md)。\n- 确定每个业务员试点客户数量，建议每人 3 个。\n\n团队提前准备：\n\n- 每个业务员准备 3 个正在跟进的客户。\n- 技术/报价准备 2 个最近处理过的报价案例。\n- 业务经理准备本周重点商机清单。\n\n## 3. 启动当天流程\n\n### 第 1 步：讲清主线，5 分钟\n\n直接讲：\n\n```text\n我们从今天开始，不再只靠聊天记录、个人记忆和感觉推进业务。\n\n以后每个客户都要能讲清楚：\n客户是谁 -> 需求是什么 -> 我们能不能做 -> 怎么报价 -> 客户怎么反馈 -> 成没成交 -> 为什么。\n```\n\n### 第 2 步：讲清三层框架，10 分钟\n\n用下面三句话解释：\n\n```text\n业务逻辑：判断这个客户和机会值不值得做。\n系统流程：判断这个客户现在走到哪一步、卡在哪里。\n日常动作：判断今天谁要做什么、什么时候完成。\n```\n\n现场追问团队：\n\n- 如果客户说有兴趣，我们还要知道什么？\n- 如果客户嫌贵，我们还要知道什么？\n- 如果报价发了，我们还要记录什么？\n\n### 第 3 步：讲清 6 条纪律，5 分钟\n\n明确宣布：\n\n```text\n第一阶段只抓 6 条，不扩散。\n```\n\n6 条纪律：\n\n1. 新客户必须建档。\n2. 活跃商机必须有下一步动作和时间。\n3. 询价资料缺失必须标记。\n4. 正式报价前必须技术评审。\n5. 报价发出后必须记录客户反馈。\n6. 成单/丢单必须写原因。\n\n### 第 4 步：现场演示 1 个客户，15 分钟\n\n选一个真实客户，现场按案例卡讲：\n\n```text\n客户是谁：\n需求是什么：\n当前流程节点：\n卡点是什么：\n下一步动作：\n负责人：\n截止时间：\n```\n\n要求：\n\n- 不要讲太多背景故事。\n- 不要停留在“客户有兴趣”。\n- 必须落到下一步动作。\n\n### 第 5 步：分配试点任务，10 分钟\n\n每个业务员现场确认：\n\n```text\n我要试点的 3 个客户是：\n1.\n2.\n3.\n```\n\n每个客户必须在当天填入台账。\n\n技术/报价确认：\n\n```text\n本周要补技术评审或报价依据的 2 个案例是：\n1.\n2.\n```\n\n### 第 6 步：确定第一次检查时间，5 分钟\n\n明确：\n\n```text\n明天检查台账是否填了。\n第 7 天用《团队试点执行验收表》做第一次验收。\n每周用《每周业务检查表》开会。\n```\n\n## 4. 启动当天必须产出\n\n| 产出 | 标准 |\n| --- | --- |\n| 试点客户清单 | 每个业务员至少 3 个 |\n| 试点负责人 | 每个客户都有负责人 |\n| 台账初始记录 | 至少填客户名称、来源、负责人、需求摘要、下一步动作 |\n| 第一个案例卡 | 现场完成或会后当天完成 |\n| 第一次检查时间 | 明确日期和时间 |\n\n## 5. 当天检查问题\n\n会议结束前问：\n\n1. 每个人是否知道自己要填哪 3 个客户？\n2. 每个试点客户是否有负责人？\n3. 是否知道台账在哪里？\n4. 是否知道下一次检查什么时候？\n5. 是否知道第一阶段只抓哪 6 条纪律？\n\n## 6. 启动失败信号\n\n如果出现下面情况，说明启动没有落地：\n\n- 会后没有指定试点客户。\n- 只讲理念，没有分配动作。\n- 没有确定下一次检查时间。\n- 台账没人负责维护。\n- 团队仍然用“有兴趣、等回复、继续跟进”汇报。\n\n## 7. 启动成功信号\n\n启动当天达到下面标准，就算成功：\n\n- 每个业务员确定了 3 个试点客户。\n- 至少 1 个真实客户被完整讲了一遍。\n- 所有人知道 6 条纪律。\n- 第一次检查时间已经确定。\n- 台账开始填写。\n\n",
    "crm/第一次团队培训方案.md": "# 第一次团队培训方案：把业务管理系统用起来\n\n## 1. 培训目标\n\n让团队在第一次会议后达成三个共识：\n\n1. 业务不是只靠感觉推进，而是按客户、需求、报价、反馈、复盘形成闭环。\n2. 每个客户和商机都必须有清楚的下一步动作。\n3. 第一阶段只执行 6 条最小纪律，不追求一次性做完整系统。\n\n## 2. 参会人员\n\n建议参与：\n\n- 负责人/老板。\n- 业务经理。\n- 销售/业务员。\n- 报价工程师。\n- 技术/工艺工程师。\n- 采购或供应链支持人员。\n\n## 3. 时长安排\n\n总时长：60 分钟。\n\n| 时间 | 内容 | 负责人 |\n| --- | --- | --- |\n| 0-5 分钟 | 说明为什么要做这套业务管理 | 负责人 |\n| 5-15 分钟 | 讲清楚业务主线 | 负责人 |\n| 15-25 分钟 | 讲清楚系统主流程 | 负责人/业务经理 |\n| 25-40 分钟 | 用一个真实客户案例演示 | 业务员 |\n| 40-50 分钟 | 统一 6 条最小执行纪律 | 负责人 |\n| 50-60 分钟 | 指定试点客户和下周动作 | 负责人/业务经理 |\n\n## 4. 开场讲法\n\n可以直接这样说：\n\n```text\n我们做这套东西，不是为了增加大家填表的负担，而是为了让客户、询价、报价、跟进和复盘不再散落在个人微信、脑子和表格里。\n\n以后我们看一个业务机会，不只问有没有报价，也要问：客户是谁、需求清不清楚、技术有没有评审、报价依据是什么、客户反馈是什么、最后为什么成或为什么丢。\n\n第一阶段我们不追求复杂系统，只先把最小闭环跑起来。\n```\n\n## 5. 必讲主线\n\n用这句话贯穿全场：\n\n```text\n客户是谁 -> 需求是什么 -> 我们能不能做 -> 怎么报价 -> 客户怎么反馈 -> 成没成交 -> 为什么\n```\n\n解释方式：\n\n- 客户是谁：不是只有公司名，还包括行业、关键人、采购角色、价值和风险。\n- 需求是什么：不是客户发了图纸就算清楚，还要知道用途、材料、数量、交期、质量要求和预算。\n- 我们能不能做：技术、材料、工艺、质量、交期、成本是否可控。\n- 怎么报价：报价要有成本、利润、风险和商务条件依据。\n- 客户怎么反馈：价格、交期、质量、付款、MOQ、样品、竞争对手分别反馈什么。\n- 成没成交：结果必须进入记录。\n- 为什么：必须沉淀成可复用经验。\n\n## 6. 现场案例练习\n\n选择一个正在跟进或最近报价的真实客户。\n\n现场让业务员回答：\n\n```text\n客户名称：\n客户行业：\n客户来源：\n关键联系人是谁：\n这个客户真实需求是什么：\n客户提供了哪些资料：\n还缺什么资料：\n是否做过技术评审：\n报价依据是什么：\n报价发出了吗：\n客户反馈是什么：\n下一步动作是什么：\n谁负责：\n什么时候完成：\n```\n\n负责人现场判断：\n\n- 如果说不清客户背景，补客户背景调查。\n- 如果说不清需求，补询价信息。\n- 如果说不清技术风险，补技术评审。\n- 如果说不清报价依据，补报价分析。\n- 如果说不清下一步动作，会议现场定动作和时间。\n\n## 7. 第一阶段 6 条纪律\n\n会议必须明确宣布：\n\n1. 新客户必须建档。\n2. 活跃商机必须有下一步动作和时间。\n3. 询价资料缺失必须标记。\n4. 正式报价前必须技术评审。\n5. 报价发出后必须记录客户反馈。\n6. 成单/丢单必须写原因。\n\n建议说法：\n\n```text\n这 6 条不是建议，是第一阶段的执行标准。先不要求大家填很多复杂内容，但这 6 件事必须做到。\n```\n\n## 8. 会后作业\n\n每个业务员会后 3 天内完成：\n\n- 选 3 个正在跟进的客户。\n- 补齐客户基础档案。\n- 为每个客户建立商机或询价记录。\n- 写清楚下一步动作和时间。\n\n技术/报价人员会后 3 天内完成：\n\n- 选 2 个最近报价案例。\n- 补一版技术评审或报价依据说明。\n- 标记资料缺失、工艺风险、报价风险。\n\n业务经理会后 5 天内完成：\n\n- 检查所有试点客户是否有下一步动作。\n- 汇总卡点：客户资料缺失、技术评审慢、报价依据不足、客户反馈缺失。\n- 准备下一次周会。\n\n## 9. 第一周检查表\n\n| 检查项 | 合格标准 | 是否完成 |\n| --- | --- | --- |\n| 试点客户已选定 | 每个业务员至少 3 个 |  |\n| 客户档案已建立 | 公司、行业、来源、联系人、负责人齐全 |  |\n| 活跃商机已记录 | 有阶段、需求、负责人、下一步动作 |  |\n| 新询价已补资料 | 图纸、材料、数量、交期、质量要求已标记 |  |\n| 待报价已评审 | 技术评审结论明确 |  |\n| 已报价有反馈 | 报价版本、发送时间、客户反馈已记录 |  |\n| 下周动作已明确 | 每个重点商机都有动作和时间 |  |\n\n## 10. 第二次周会议程\n\n第二次会议不要重新讲理论，只检查执行。\n\n议程：\n\n1. 上周试点客户完成情况。\n2. 哪些客户资料不完整。\n3. 哪些询价不能报价，原因是什么。\n4. 哪些报价卡住，卡在谁那里。\n5. 哪些客户有反馈，下一步是什么。\n6. 本周要复盘的 1 个成单或丢单案例。\n\n## 11. 常见阻力和处理方式\n\n### 11.1 “填这些太麻烦”\n\n回应：\n\n```text\n第一阶段只填最关键的信息。目标不是填表，而是让别人能接手、管理者能判断、团队能复盘。\n```\n\n### 11.2 “客户还没明确需求，没什么可写”\n\n回应：\n\n```text\n没明确需求也要记录。记录的重点就是：客户现在明确了什么、还缺什么、下一步问什么。\n```\n\n### 11.3 “报价很急，来不及技术评审”\n\n回应：\n\n```text\n越急越要至少做最低限度评审。否则报价没有依据，后面会在价格、交期、质量上出问题。\n```\n\n### 11.4 “客户没反馈”\n\n回应：\n\n```text\n没反馈也是一种状态。要记录最后联系时间、追问动作、是否转长期跟进，不能让商机悬空。\n```\n\n## 12. 第一次培训的成功标准\n\n培训结束后，如果团队能做到以下 4 件事，就算启动成功：\n\n1. 每个人能说出业务主线。\n2. 每个人知道第一阶段 6 条纪律。\n3. 每个业务员选好了试点客户。\n4. 每个试点客户都有明确的下一步动作。\n\n"
  }

      "# L02 Mapping supplier resources and the limits of your commitments",
      "Module M1 · Suggested time: 35 minutes · Prerequisites: L01 · Output: O02 Capabilities and open questions",
      "Learning objective: When a customer asks what you can do, explain what you can take responsibility for, what the partner factory has confirmed, and what requires a review of the specific requirements.",
      "Enough for this lesson: Write a capability introduction you can stand behind. Clearly mark any resources you have not verified as pending confirmation.",
      "Source map: supply network, technical and service teams, resource allocation, and capabilities within our control. Further reading: sections 4 and 6.5 of the structured requirements document. Material: S0.",
      "## 1. Understand the task",
      "A beginner may turn \"I know this factory\" into \"We can make anything.\" Separate your work from the factory's work. You can organize customer requirements, check documents, and coordinate responses. Machining feasibility, inspection methods, prices, and delivery dates require specific answers from the responsible people.",
      "Divide a sheet into three columns: \"What I can handle\", \"What existing documents or replies support\", and \"What must be confirmed for each project.\" Place each sentence of your intended customer introduction into one of them. A sentence that fits nowhere is often vague promotion or an unverified claim.",
      "For example, a sample inspection report shows what was checked on that sample and the results. It cannot guarantee performance against a different drawing. Your introduction should explain the help you can provide and remind you whom to consult next.",
      "## 2. Work through the case",
      "S0 confirms that two documents may be shared externally and identifies the factory contacts. You can say, \"We can share relevant anonymized machining and inspection examples and coordinate a review of new drawings.\" You cannot claim that all precision parts or any tolerance can be handled.",
      "When a customer asks about lead time, you can take responsibility for coordinating the assessment and reporting back promptly. Until the factory checks its schedule, your own response speed cannot substitute for a production commitment.",
      "## 3. Try it yourself",
      "Use S0 to complete **O02 Capabilities and pending-confirmation checklist**:",
      "1. Create six rows: material and parts scope, technical review, inspection, permission to share materials, pricing, and lead time. For each, write what you currently know, the supporting evidence, and whom to ask.",
      "2. Use different marks for your own work, items the factory has answered, and items still requiring project-specific confirmation. If no name is provided, state the role.",
      "3. Rewrite \"We have complete capabilities and can deliver any precision part quickly\" into two or three sentences a customer can understand. Check each sentence against the six rows above.",
      "In real work, first check the factory replies and authorized documents you actually have. If they are missing, write \"To be verified.\" Do not treat the conditions of simulated Factory A as your real resources.",
      "## 4. Reference approach",
      "<details><summary>Open after your own attempt</summary>",
      "A statement supported by S0 can be simple:",
      "| Item | What we can currently say | What to confirm, and with whom |",
      "| --- | --- | --- |",
      "| Material and parts scope | The factory is willing to review information for small-batch aluminum parts | Ask the technical contact whether the specific requirements can be met |",
      "| Technical review | A technical contact is available | Confirm what is missing for this project and when feedback is expected |",
      "| Inspection | A relevant sample report is available for reference | Confirm new-part inspection requirements and capability with the appropriate customer and factory staff |",
      "| Sharing permission | Two documents are authorized for external use | Obtain permission again before using different materials |",
      "| Pricing | A quotation contact is available | Confirm the proposal for the specific revision and quantity with that contact |",
      "| Lead time | No project-specific lead time has been confirmed | Coordinate confirmation of the starting conditions and production schedule |",
      "A capability introduction could read: \"I organize requirements, check documents, and coordinate responses. I can currently arrange evaluations for small-batch aluminum parts and provide authorized machining and inspection examples. Specific machining requirements, pricing, and lead time must be confirmed for each project.\"",
      "If your real resources are more limited than those in the case, describe the actual situation. Identifying what remains unverified is part of the checklist's purpose.",
      "</details>",
      "## 5. Completion checklist",
      "- [ ] All six categories show the current evidence or whom to ask; missing information has not been replaced with \"No problem.\"",
      "- [ ] Your introduction explains both your responsibilities and the conclusions that the factory must confirm.",
      "- [ ] You have not treated one sample report, one contact, or one machine as proof that every project can be accepted.",
      "## 6. Try again without your notes",
      "A customer says, \"This report looks good. Can you guarantee the same for my new part?\" Instead of rushing to answer yes or no, explain which documents you need, whom you will ask, and what you will report back.",

      "# L03 Turning capabilities into value the customer can understand",
      "Module M1 · Suggested time: 30 minutes · Prerequisites: L02 · Output: O03 Evidence-based value statement",
      "Learning objective: When introducing your resources, help the customer understand where you may be useful, what supports your statement, and what you still need to learn.",
      "Enough for this lesson: Write a short, targeted introduction for each of two types of potential customer. Practice clear communication; a complete brochure is not required.",
      "Source map: value proposition, solving customer problems, professional service, and customer principles. Further reading: section 2.1 of the understanding and implementation guide. Material: S0.",
      "## 1. Understand the task",
      "\"I have machining resources\" only describes what you have. A customer can more readily understand, \"If you are evaluating small-batch parts, I can help organize requirements and coordinate factory responses.\" Put your resources into a situation the customer might face to show why your introduction is relevant.",
      "Start with the customer's situation, then describe an action you can take and the evidence you can provide. If you do not know whether the need exists, begin with \"If you are...\" This offers relevant help without inventing a need.",
      "\"Good quality and good service\" is too broad. Replace it with something observable: an authorized example, a clear list of revision questions, or coordinated technical feedback. Your documents and real capabilities must support the extent of your claim.",
      "## 2. Work through the case",
      "For a potential customer involved in equipment validation, you could say, \"If the project requires an evaluation of small-batch aluminum parts, we can organize drawing questions, coordinate a factory review, and provide authorized machining and inspection examples for reference.\"",
      "This does not promise a particular cost reduction or faster service than every other supplier. It describes a specific situation, the work you can do, and available evidence so the customer can assess relevance.",
      "## 3. Try it yourself",
      "Use S0 and O02 to complete **O03 Evidence-based value statement**:",
      "1. Write an introduction to A of no more than 120 Chinese characters, following this order: observed business, possible situation, action you can take, and supporting evidence.",
      "2. Write a separate introduction to C. Consider its supplier evaluation process and leave the unknown parts categories or evaluation requirements as questions.",
      "3. Mark the situation, support, evidence, and conditions to confirm in both paragraphs. Then write one vague promotional sentence you might previously have used and explain why you replaced it.",
      "In real work, improve one sentence from your usual introduction. Ask whether the reader will understand the specific situation in which they can approach you.",
      "## 4. Reference approach",
      "<details><summary>Open after your own attempt</summary>",
      "Example for A: \"I noticed that your company develops and assembles equipment. If you need small-batch aluminum parts evaluated, I can organize drawing questions, coordinate factory responses, and share authorized anonymized machining and inspection examples. Whether the requirements can be met must be assessed for each project.\"",
      "Example for C: \"I noticed your instrument development work and supplier evaluation process. If the evaluation includes small-batch aluminum parts, I can prepare relevant authorized examples. I would first need to understand the parts categories and evaluation requirements to assess the fit.\"",
      "For A, the focus is possible parts evaluation. For C, it is understanding the evaluation requirements first. \"We can deliver any precision part quickly\" lacks evidence and a clear scope, so it cannot replace a description of specific help.",
      "</details>",
      "## 5. Completion checklist",
      "- [ ] Each Chinese introduction to A and C is within 120 characters, and their differences reflect business information rather than just a change of company name.",
      "- [ ] Each introduction includes one specific action you can take and the supporting documents or conditions to confirm.",
      "- [ ] You can turn a claim such as \"Good quality; we can do anything\" into an understandable, evidence-based statement.",
      "## 6. Try again without your notes",
      "Someone asks, \"How can you help me?\" Choose A or C and answer in three sentences. Do not merely list machines, processes, or adjectives.",
      ""

      "# L04 Building a target-customer profile and screening criteria",
      "Module M1 · Suggested time: 40 minutes · Prerequisites: L01, L02, L03 · Output: O04 Three customer categories and verification plan",
      "Learning objective: When reviewing several companies, decide which to explore first and explain what attracted your attention, what to check first, and what new information would change your choice.",
      "Enough for this lesson: Create a set of screening criteria you can revise. You do not need to fix your industry, country, or customer list permanently.",
      "Source map: customer segmentation, industry fit, customer value, and analysis of competition and resources. Further reading: sections 6.2 and 6.4 of the structured requirements document. Material: S0.",
      "## 1. Understand the task",
      "Here, a customer profile means the kind of company you intend to explore first. Describe it in everyday language, such as \"Companies developing equipment whose possible small-batch parts requirements are worth verifying.\" Separate what you have observed from what still needs clarification.",
      "Check three things: whether the business overlaps with your resources, what evidence is available, and which unknown most affects further investment of time. Missing information can remain unknown. Evidence of a mismatch, rather than a lack of information alone, justifies lowering priority.",
      "Ranking helps you decide what to do first; it does not predict who will definitely place an order. Add, \"If I find out..., I will adjust the priority.\" This reminds you to revise your judgment when new information arrives.",
      "## 2. Work through the case",
      "A provisional profile for this case is a company with equipment development activities, possible small-batch parts needs, and willingness to evaluate new suppliers. The first two require more specific verification, while no information is yet available about the third.",
      "Investigate A first; check B's business scope; clarify C's supplier requirements. These can become different verification tasks. Unsupported scores such as 90 or 70 would make uncertain judgments look falsely precise.",
      "## 3. Try it yourself",
      "Use O01 through O03 to complete **O04 Screening and verification plan for three customer types**:",
      "1. In no more than 150 Chinese characters, describe the businesses you currently want to explore. Include at least one clue that can be found in a company description.",
      "2. For A, B, and C, state the current priority, the main question, and where to find the answer or which role to ask. Two companies may share a priority.",
      "3. Identify a specific development that would change the order, such as confirmation of a previously unclear responsibility for purchasing custom parts.",
      "4. Review the first three lessons. Does your customer choice relate to the resources in O02? Does O03 overstate anything? Correct any conflict next to the original statement.",
      "In real work, apply these criteria to every new company before researching it further. Avoid adding a company merely to increase the size of a list if you cannot explain its relevance.",
      "## 4. Reference approach",
      "<details><summary>Open after your own attempt</summary>",
      "An initial screen could be: \"Explore companies developing equipment or instruments where small-batch aluminum-parts needs are worth checking. The actual outsourcing scope and willingness to evaluate new suppliers still need confirmation.\"",
      "For A, first investigate the outsourcing scope using business pages and the appropriate inquiry channel. For B, check whether it purchases custom spare parts before investing time based on size alone. For C, look for parts categories and supplier requirements in its evaluation information.",
      "An example of information that could change the order is: \"B explicitly confirms responsibility for purchasing custom spare parts within my verified resources.\" Reassess rather than defend the original ranking. If O03 turns an unconfirmed capability into a guarantee, revise it to a conditional statement consistent with O02.",
      "</details>",
      "## 5. Completion checklist",
      "- [ ] Your screening criteria describe business characteristics that can be investigated without presenting unknown needs as confirmed.",
      "- [ ] Each company has a key question and a clear approach to finding the answer.",
      "- [ ] You can give an example of information that would change the order and check that your customer choice, capability introduction, and value statement support each other.",
      "## 6. Try again without your notes",
      "Suppose B confirms that it buys custom spare parts itself. How would you revise your original judgment? Identify one judgment to change and one condition that still needs checking.",
      ""

      "## 1. Understand the task",
      "Before searching, turn O04 into a question: \"Where can I find companies doing this kind of business?\" Search results, exhibition directories, industry materials, and public company pages can provide leads. Choose one discovery method and one verification method for each attempt instead of constantly switching channels.",
      "Discovering a company, verifying its business, and finding the appropriate contact channel are three different tasks. Appearing in a directory only means you have found the company. Whether to keep it depends on how its business relates to your resources.",
      "Describe the customer's business in your search approach, for example, \"automation equipment development and assembly companies,\" rather than only \"precision machining customers.\" Add a region if your target area is already clear. Search terms are a starting point; assess each result and check current platform procedures separately.",

      "In S1, A's public business inquiry channel can help identify the appropriate contact direction, and its website can help explain the business. News about new equipment provides a research lead; it does not establish an urgent need for parts.",
      "A secondhand claim that A \"definitely needs suppliers\" has an unknown source and date. Mark it for verification. It can suggest a question, but should not appear in an outreach message as an established fact.",
      "## 3. Try it yourself",
      "Practice using O04 and S1, and complete **O05 Plan for one lead-search exercise**:",
      "1. Describe your target in one sentence, then write two search expressions or directory-search approaches. Explain the type of company you hope to find with each.",
      "2. Choose one discovery source and one verification source, and state what you will examine in each. Also identify where you will look for the company's public business contact channel.",
      "3. Create a sample entry for A: company, source location, observation date, fit-related clue, and question to confirm. Because the case provides no real URL or date, label them \"Simulated material; not provided.\"",
      "4. Write a condition for stopping further list-building, such as finding one company with a specific fit-related clue and then investigating it properly.",
      "In real work, start with a short, focused search and keep only leads you can justify. The exercise itself can be completed with S1, without internet searches or messages.",
      "## 4. Reference approach",
      "<details><summary>Open after your own attempt</summary>",
      "For example, define the target as \"Companies developing and assembling equipment whose custom-parts needs are worth checking.\" Two possible search approaches are \"automation equipment development and assembly companies\" and \"instrument developers' supplier evaluation requirements.\" Then assess whether the results fit your profile.",
      "Discover companies through search results or relevant directories, then verify their business on their official websites and locate public inquiry channels. A's sample entry can state: Company A; source is the simulated website summary in S1; real URL and date not provided; equipment design and assembly observed; outsourcing scope unconfirmed.",
      "A useful stopping condition is, \"After finding one company with a specific fit-related clue and a way to verify it, complete its background brief first.\" This is a practice arrangement, not a daily quota.",

      "## 6. Try again without your notes",
      "You find a company and a piece of expansion news. State one piece of evidence to retain, the kind of page to open next, and one conclusion you cannot yet draw.",

      "Two key unknowns could be whether it purchases relevant outsourced parts and whether it evaluates new supplier resources. First use the public inquiry channel to identify the responsible function. Development news supports investigation, not a guaranteed order next month.",

      "Module M2 · Suggested time: 30 minutes · Prerequisites: L06 · Output: O07 Roles and questions",

      "## 1. Understand the task",
      "A job title does not mean a contact can decide everything. Look in the reply for the person's stated responsibilities, requested documents, and references to colleagues. Leave any unstated approval authority as unknown.",
      "Assign each question to a role that can answer it: purchasing arrangements to purchasing staff, drawing requirements to technical staff, and inspection documents to the relevant quality staff. The actual division of responsibilities must still follow the customer's confirmed arrangement.",
      "Ask your current contact to clarify how to work together. This helps them receive suitable documents for this review and prevents you from guessing the process or repeatedly sending questions to the wrong person.",
      "## 2. Work through the case",
      "In S2, Ms. Lin says she handles outsourced mechanical-parts purchasing; Engineer Zhou reviews technical requirements; Ms. Wu may participate in quality documentation. The final approver is unknown. Ms. Lin's request for documents does not constitute purchasing approval.",
      "Ask Ms. Lin about the scope of the current review. Ask her to coordinate technical clarification with Engineer Zhou, and involve the appropriate quality staff when document requirements need clarification. Match questions to responsibilities instead of assuming one person's answers cover everything.",
      "## 3. Try it yourself",
      "Read the full reply in S2 and complete **O07 Roles and corresponding questions**:",

      "<details><summary>Open after your own attempt</summary>",
      "Ms. Lin handles outsourced mechanical-parts purchasing: ask which supplier-resource documents she wants first and prepare relevant case descriptions. Engineer Zhou reviews technical requirements: ask for confirmation of key information and prepare known requirements and questions. Ms. Wu may handle quality documents: clarify the required scope when needed and prepare the corresponding sample report. None of their final approval authority has been established.",
      "A coordination draft could read: \"To prepare documents for this review, could you confirm which items you would like to see first? How should we coordinate technical and quality questions with the relevant colleagues?\"",

      "# L09 Defining the purpose of the first contact",
      "Module M3 · Suggested time: 35 minutes · Prerequisites: L08 · Output: O09 First-contact message draft",
      "Learning objective: Before contacting a company for the first time, explain why you are reaching out, how you may help, and the one question you want answered.",
      "Enough for this lesson: First prepare two clear Chinese drafts. You do not need to send them, and receiving an inquiry is not a condition for completing this lesson.",
      "Source map: outreach emails, establishing contact, customer concerns, and value proposition. Further reading: the business-development section of the source-map interpretation. Materials: S0–S1. Do not use the later reply in S2 yet.",
      "## 1. Understand the task",
      "Before opening a blank message, write a purpose for yourself: \"This time, I only want to confirm...\" For example, who evaluates outsourced parts or which supplier documents are needed. A clear purpose helps you remove unrelated details.",
      "Write in four steps: the business information you observed, why it relates to you, the help you can support with evidence, and one clear question. The recipient should know how to respond instead of facing a long list of information requests.",
      "First make the business meaning clear in Chinese. You have not yet received S2's reply, so do not address a purchasing manager as though already identified or pretend to know about equipment validation. Before real use, check the wording for the actual language and channel.",
      "## 2. Work through the case",
      "Draft for A: \"I noticed your custom equipment development and assembly business and would like to understand whether your department evaluates related outsourced parts. I can coordinate evaluations of small-batch aluminum parts and have authorized anonymized machining and inspection examples. Which function handles evaluations of these outsourced parts?\"",
      "The draft asks only about the responsible function. The business information and examples explain why the question is relevant. It does not assume A lacks suppliers or request drawings, budget, and annual purchasing volume all at once.",
      "## 3. Try it yourself",
      "Using only S0–S1 and O02, complete **O09 First-contact message drafts**:",
      "1. State one main purpose for A and one for C before writing the messages. For example, identify the responsible function at A and the document requirements for evaluation at C.",
      "2. Write an 80–150-character Chinese draft for each. Begin with the reason for contact, describe relevant support, and end with one easy-to-answer question.",
      "3. Underline the information in O02 that supports each capability statement. Revise sentences you cannot support.",
      "4. Delete or shorten one sentence that does not affect the purpose, and explain what the recipient can still answer. Keep both drafts in your work; sending them is not required.",
      "Before real outreach, check the company facts and contact, then reread the final question. Save multiple requests for drawings, budget, and annual volume for later stages when they are actually needed.",
      "## 4. Reference approach",
      "<details><summary>Open after your own attempt</summary>",
      "A's main question can simply ask which function evaluates relevant outsourced parts. C's can ask which documents are needed first for supplier evaluation. The preceding facts and capability introduction give that one question a reason.",
      "First remove unsupported claims such as \"We heard you have many orders and urgently need us,\" or long process lists unrelated to the purpose. If the reader still understands why you wrote, what you can offer, and what to answer, the draft is clearer.",
      "If a sentence carries necessary information, do not delete it mechanically to meet a word limit. Shorten repetitive adjectives and explain why the essential information remains.",
      "</details>",
      "## 5. Completion checklist",
      "- [ ] A and C each have one clear purpose and one draft ending in a single identifiable question.",
      "- [ ] The contact rationale uses only S0–S1, and capability statements are supported by O02.",
      "- [ ] You can identify the unnecessary text removed; the drafts neither request every project condition at once nor invent later replies.",
      "## 6. Try again without your notes",
      "Keep only the last sentence of your draft. Would the recipient know what to answer? Add back the necessary reason for contact and check that the whole message still serves the same purpose.",

      "# L10 Building professional trust with real evidence",
      "Module M3 · Suggested time: 30 minutes · Prerequisites: L09 · Output: O10 Capability evidence and responses",
      "Learning objective: When asked for documents or whether you can do the work, choose relevant evidence and explain what it shows and what still needs confirmation for the customer's project.",
      "Enough for this lesson: Practice selecting documents, explaining them, and responding to questions. A large brochure or a machining guarantee is not required.",
      "Source map: professional presentation, using documents and data, honoring commitments, and reducing customer uncertainty. Further reading: the business-judgment questions in the quick reference guide. Materials: S0 and S2.",
      "## 1. Understand the task",
      "When a customer asks for documents, first consider what they want to assess. For relevant machining experience, choose a matching case. For inspection methods, use the corresponding sample report. Different documents answer different questions; you need not send every file at once.",
      "Write two statements beside each document: \"This shows...\" and \"This does not yet prove...\" An anonymized case illustrates work performed in that case; a report illustrates inspections of its sample. New-project feasibility must be evaluated against its own drawings and conditions.",
      "A reliable explanation can acknowledge unknowns. Explain what documents exist, what requirements you still need, and whom you will consult. Check permission before sharing externally; S0 authorizes the two documents in this case.",
      "## 2. Work through the case",
      "Ms. Lin wants machining and inspection information. Provide the authorized case and corresponding report from S0, explain their relevance and limits, and ask about any further priorities for the current review.",
      "\"This report proves we have no quality problems on any project\" exceeds the evidence. \"The report shows inspection items and results for this sample; inspection requirements for the new project will be confirmed against its drawings\" retains the correct limits.",
      "## 3. Try it yourself",
      "Use S0 and S2 to complete **O10 Capability evidence and responses to questions**:",
      "1. For the anonymized machining case and corresponding sample report, write four statements: which customer question it addresses, what it shows, what it cannot show, and whether sharing is authorized.",
      "2. Draft a note to accompany the documents explaining the purpose of each. This is a text simulation; do not fabricate reports or attachments.",
      "3. Respond to \"Can you guarantee all critical requirements?\" Acknowledge the concern, explain which specific requirements you need, who will assess them, and how you will report back.",
      "Before sending a real document, identify the customer's question it addresses. Put unsupported capabilities on the evaluation list rather than into promotional claims.",
      "## 4. Reference approach",
      "<details><summary>Open after your own attempt</summary>",
      "The machining case addresses whether there is relevant work to review. The report addresses what was inspected on that sample and how results were recorded. Neither proves every new drawing can be manufactured. S0 confirms sharing permission, but without the real attachment you must not invent report figures.",
      "An accompanying note could read: \"Please find authorized anonymized machining examples and the corresponding sample inspection information for this review. Machining and inspection requirements for a new project still need confirmation against its specific drawings.\"",
      "A response to the guarantee question could be: \"I understand your concern about meeting the critical requirements. Please provide the relevant drawings and requirements. I will coordinate an item-by-item technical review and report back on confirmed conclusions and remaining questions.\" Arranging a review does not guarantee a successful outcome.",
      "</details>",
      "## 5. Completion checklist",
      "- [ ] Each document has a clear purpose, stated limits, and a basis for sharing.",
      "- [ ] The accompanying note helps the customer know what to review without presenting an anonymized case as an endorsement by a named customer.",
      "- [ ] When asked for a guarantee, you can propose obtaining requirements and arranging assessment rather than assuring that every project can meet them.",
      "## 6. Try again without your notes",
      "After reading a sample report, the customer asks about a new part. Respond in three sentences: available evidence, missing information, and how to confirm it next.",

    "lines": [
      "# L14 Understanding the purpose of material, process, and quality questions",
      "Module M4 · Suggested time: 40 minutes · Prerequisites: L13 · Output: O14 Technical questions and responsible parties",
      "Learning objective: When encountering materials, geometry, processes, surface treatment, and inspection, identify the issue involved, whom to ask, and what answer you need.",
      "Enough for this lesson: Learn to ask appropriate questions and pass requirements accurately. Memorizing technical parameters or designing a machining process for the engineer is not required.",
      "Source map: materials, geometry, surface treatment, machining processes, and analysis of past quality issues. Further reading: section 6.5 of the structured requirements document. Materials: S3–S4.",
      "## 1. Understand the task",
      "Even without understanding every technical term, you can route questions to the right person. Instead of only asking \"Can it be made?\", identify the known requirement, the unclear part, and the explanation you need.",
      "| Topic encountered | What to clarify first | Answer needed |",
      "| --- | --- | --- |",
      "| Material | What has the customer specified, and what is missing? | Clear requirements or questions for the customer |",
      "| Geometry and critical requirements | Which location affects assembly or use, and which document supports this? | Specific revision-based questions from technical staff |",
      "| Process | How does the factory propose to meet the requirements, and are options open for discussion? | An evaluated proposal and its conditions |",
      "| Surface treatment | Are appearance, functional needs, and acceptance criteria clear? | Customer requirements and remaining questions |",
      "| Inspection and quality | What defines acceptance, and which records are required? | Acceptance requirements confirmed by the relevant parties |",
      "When you receive a suggestion to change material, ask for the reason, impact, and required approver. A proposal is for discussion; copying it into a salesperson's table does not make it customer-approved.",
      "## 2. Work through the case",
      "S4 specifies 6061-T6, but this lesson does not determine whether its properties suit the application. Critical locations and surface-treatment questions remain; ask technical staff to explain the effects and obtain customer confirmation of requirements.",
      "If the factory proposes alternative material or geometry, record the suggestion, basis, impact, and required confirmation. Do not quietly turn a proposal into a new requirement before the customer agrees.",
      "## 3. Try it yourself",
      "Use S3–S4 to complete **O14 Technical questions and responsible parties**:",
      "1. For each of the five categories above, state what is known or unknown, your question, the role to ask, and the answer needed.",
      "2. Start the material row with S4's confirmed 6061-T6. Leave unanswered items as questions instead of filling them with \"Compliant.\"",
      "3. Choose two rows and explain in everyday language which next-step judgment would be impossible without clarification.",
      "4. Rewrite \"The factory has the machines, so it can definitely do this project,\" identifying whose project-specific evaluation is still needed.",
      "In real work, send unfamiliar terms to technical staff together with the customer's original requirement and file location, and ask them to explain the implications. Preserve accuracy while gradually building technical knowledge.",
      "## 4. Reference approach",
      "<details><summary>Open after your own attempt</summary>",
      "The material row could state: \"The customer specified 6061-T6 in S4. Please identify any further information needed against revision B.\" For geometry, ask technical staff to identify critical questions for customer confirmation. For process, request the factory's evaluated conclusion and necessary conditions.",
      "For surface treatment, ask the customer how acceptance will be assessed and the factory what information affects evaluation. For inspection, ask technical or quality staff which requirements and records apply. A usable answer, not a row filled with \"Compliant,\" is the endpoint.",
      "For example, without appearance acceptance criteria, it is unclear whether both parties mean the same thing by an acceptable black finish. Having equipment does not replace review of these specific requirements.",
      "</details>",
      "## 5. Completion checklist",
      "- [ ] All five categories have a case-specific question, responsible role, and expected answer.",
      "- [ ] You can explain why at least two categories matter and distinguish known requirements, factory suggestions, and pending items.",
      "- [ ] You have not supplied unsupported technical parameters or guaranteed machinability; you can identify who should assess the specific requirements.",
      "## 6. Try again without your notes",
      "The customer says, \"Use the usual standard.\" Write one sentence clarifying acceptance requirements with the customer and another asking the factory which supporting information it needs.",

      "Review a quotation in three passes. First, check what it covers: which part, drawing revision, quantity and currency. Second, check the arithmetic: unit price multiplied by quantity, any duplicated separate charges, and whether excluded costs are clear. Third, check whether technical, production, receipt, payment and acceptance conditions are supported by confirmed information.",

      "## 2. Work through the case",
      "S4 lists internal costs of 38 × 100 + 600 + 200 = **CNY 4,600**. The customer draft is 48 × 100 + 200 = **CNY 5,000**. The unit price of 48 already allows for setup and other factors; adding another 600 would incorrectly raise the total to 5,600.",
      "The difference is 400, but some costs and conditions remain unresolved, so it cannot be called final net profit. The factory has not provided a quotation for 500 pieces, so the same unit price must not automatically be applied to that quantity.",
      "## 3. Try it yourself",
      "Use S4 and O13–O15 to complete **O16: quotation review draft**.",

      "3. List at least five conditions requiring confirmation. For each, identify whom to ask and which statement in the quotation it affects. Bring forward unresolved technical and delivery issues from O13–O15.",
      "4. Write a review conclusion: 'The arithmetic shows ...; before this can become a formal quotation, we still need ...'. Explain why the difference between the two totals cannot simply be called net profit.",

      "The two calculations are 38 × 100 + 600 + 200 = CNY 4,600 and 48 × 100 + 200 = CNY 5,000. The customer unit price already allows for setup and other factors, so adding another 600 duplicates the cost. Unlisted costs have not yet been deducted from the CNY 400 difference; it is not final net profit.",
      "Possible confirmation items: ask the customer's technical team and the factory about critical features and machining conditions; ask the relevant customer contact about surface-treatment acceptance; ask the factory about production time and scheduling; ask the customer about the delivery location and receipt requirements; and ask the responsible parties about transport, taxes, payment and validity. If the person is unknown, record the role to identify rather than filling in default answers.",
      "Example conclusion: 'The given arithmetic produces CNY 5,000, excluding freight and taxes. Technical requirements, final delivery arrangements, payment and acceptance still require confirmation. This is currently an internal review and discussion draft.' Revision B and 100 pieces are the basis of this calculation; changes require another review.",

    self.fail(messages[event.error] || '这次朗读没有完成，请重试或切换音色。', token);
  };
  this.timers.push(setTimeout(function () { self.fail('还没有开始发声，请重试或切换英语音色。', token); }, 8000));
  try { this.synth.speak(utterance); }
  catch (e) { this.fail('浏览器未能开始朗读，请重试。', token); }
};

var _player = null;
function speechInit() {
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
    SPEECH.supported = false; SPEECH.loading = false; return;
  }
  var synth = window.speechSynthesis;
  SPEECH.supported = true;
  _player = new SpeechPlayer(synth, function (t) { return new SpeechSynthesisUtterance(t); }, function (st) {
    SPEECH.state = st; updateSpeechUI();
  });
  speechRefresh();
  synth.addEventListener('voiceschanged', speechRefresh);
  [250, 800, 1800, 3500].forEach(function (ms) { setTimeout(speechRefresh, ms); });
  setTimeout(function () { SPEECH.loading = false; updateSpeechUI(); }, 4000);
  document.addEventListener('visibilitychange', function () { if (document.hidden) speechStop(); });
  window.addEventListener('pagehide', function () { speechStop(); });
}
function speechRefresh() {
  var synth = window.speechSynthesis;
  var list = [];
  try { list = synth.getVoices().filter(function (v) { return /^en(?:[-_]|$)/i.test(v.lang); }); } catch (e) {}
  SPEECH.voices = list;
  if (!list.some(function (v) { return voiceKey(v) === SPEECH.selected; })) {
    SPEECH.selected = list.length ? voiceKey(preferredVoice(list)) : '';

  if (list.length) SPEECH.loading = false;
  updateSpeechUI();
}
function speechStop(id) { if (_player) _player.stop(id); }
function speechRetry() { if (_player) _player.retry(); }
function speechStart(req) {
  if (!_player) return;
  var voice = SPEECH.voices.find(function (v) { return voiceKey(v) === SPEECH.selected; }) || preferredVoice(SPEECH.voices);
  if (!voice) {
    _player.stop();
    SPEECH.state = Object.assign({}, SPEECH.state, {
      phase: 'error', id: req.id, label: req.label,
      message: SPEECH.supported === false ? '当前浏览器没有朗读功能，请使用系统浏览器打开此页面。' : '暂未找到英语音色，请在朗读设置里重新检测，或检查设备的英语语音包。'
    });

  }
  _player.start(req, { voice: voice, rate: SPEECH.rate, gap: SPEECH.gap });
}
function speechSetVoice(k) { speechStop(); SPEECH.selected = k; updateSpeechUI(); }
function speechSetRate(n) { speechStop(); SPEECH.rate = n; updateSpeechUI(); }
function speechSetGap(n) { speechStop(); SPEECH.gap = n; updateSpeechUI(); }

function speechStatusText(st) {

}

var APP = {

function localOwner() {

/* 首次进入：生成 3 个示例目标 + 9 条示例记录（口径同 api/workspace initialize） */
function initializeExamples() {
  if (!APP.snap) return;
  if (APP.snap.settings && APP.snap.settings.initialized) return;
  var today = todayCN(), owner = localOwner();
  var obstacles = ['看到企业资料很多，不知道先看哪里', '担心不懂工艺，不敢向工厂提问', '习惯使用空泛的宣传词'];
  var plans = ['如果它出现，我就先写三句话：事实、可能匹配、待确认。', '如果它出现，我就把不知道的内容列成三个问题。', '如果它出现，我就用一个可展示的案例替换形容词。'];
  var bodies = ['示例：把一家企业的公开事实、匹配推测和待验证问题分开记录。', '示例：区分我能协调的工作与需要工厂确认的能力。', '示例：用具体帮助和获授权的资料解释客户价值。'];
  return sha256hex(owner).then(function (full) {
    var hash = full.slice(0, 24);
    for (var i = 0; i < 3; i++) {
      var gid = 'example-' + hash + '-' + i;
      APP.snap.goals.push({
        id: gid, course_id: 'unit0' + (i + 1), unit: '项', total: i === 2 ? 3 : 6,
        deadline: addDays(today, i === 1 ? -2 : 5 + i), started_on: addDays(today, -6),
        color: COLORS[i], obstacle: obstacles[i], plan: plans[i],
        created_at: nowISO(), updated_at: nowISO(), version: 1, is_example: 1
      });
      var offsets = i === 0 ? [-6, -5, -4, -3, -2] : (i === 1 ? [-6, -5, -4] : [-2]);
      offsets.forEach(function (n) {
        APP.snap.records.push({
          id: gid + '-record' + Math.abs(n), goal_id: gid, day: addDays(today, n),
          quantity: i === 2 ? 3 : 0.5, minutes: n === -5 ? null : 20 + i * 5, kind: '成果记录',
          body: bodies[i], english_sentence: '', link: '', images: '[]', discussion: '', related_ids: '[]',
          is_backfill: n === -4 ? 1 : 0, is_example: 1, created_at: n === -4 ? nowISO() : addDays(today, n) + 'T02:00:00.000Z'
        });
      });
    }
    APP.snap.settings.initialized = 1;
    saveSnap();
  });
}

/* ---- mutate：本地执行各 action，替代服务端 ---- */
function mutateLocal(action, p) {
  p = p || {};
  if (!APP.snap) return { error: '数据尚未就绪。' };
  var today = todayCN(), owner = localOwner();
  var s = APP.snap;
  function goalById(id) { return s.goals.find(function (g) { return g.id === id; }); }
  try {
    if (action === 'initialize') {
      return initializeExamples();
    }
    if (action === 'save_goal') {
      var course = String(p.course_id || '');
      if (!COURSE_UNITS.has(course)) return { error: '请从24课中选择目标名称。' };
      var unit = String(p.unit || '').trim();
      if (!unit) return { error: '请填写单位。' };
      if (unit.length > 20) return { error: '单位最多20个字。' };
      var total = Number(p.total);
      if (!Number.isFinite(total) || total <= 0 || total > 1000000) return { error: '总量应为大于0的数值。' };
      var deadline = p.deadline, start = p.started_on;
      if (!validDay(deadline) || !validDay(start)) return { error: '请选择有效日期。' };
      if (start > deadline || start < '2000-01-01' || deadline > '2100-12-31')
        return { error: '学习开始日期应不晚于截止日期，日期范围为2000—2100年。' };
      if (COLORS.indexOf(p.color) < 0) return { error: '请选择提供的配色。' };
      var obstacle = String(p.obstacle || '').slice(0, 1000), plan = String(p.plan || '').slice(0, 1000);
      var key = p.id || uid();
      var existing = goalById(key);
      if (existing) {
        var earliest = s.records.filter(function (r) { return r.goal_id === key; }).map(function (r) { return r.day; }).sort()[0];
        if (earliest && start > earliest) return { error: '开始日期不能晚于已有学习记录，请保留真实学习日期。' };
        if (existing.course_id !== course && earliest) return { error: '已有记录的目标不能更换课时，可新建另一个目标。' };
        existing.course_id = course; existing.unit = unit; existing.total = total;
        existing.deadline = deadline; existing.started_on = start; existing.color = p.color;
        existing.obstacle = obstacle; existing.plan = plan; existing.is_example = 0;
        existing.version = (existing.version || 1) + 1; existing.updated_at = nowISO();
      } else {
        s.goals.push({
          id: key, course_id: course, unit: unit, total: total, deadline: deadline,
          started_on: start, color: p.color, obstacle: obstacle, plan: plan,
          created_at: nowISO(), updated_at: nowISO(), version: 1, is_example: 0
        });
      }
      saveSnap(); return { ok: true };
    }
    if (action === 'checkin') {
      var cid = p.id || uid(), gid = p.goal_id, d = p.day;
      var quantity = Number(p.quantity);
      var body = String(p.body || '').slice(0, 10000);
      var englishSentence = String(p.english_sentence == null ? '' : p.english_sentence).slice(0, 1000);
      var kind = String(p.kind || '');
      var link = String(p.link || '').slice(0, 2000);
      if (!body.trim()) return { error: '请填写本次学习成果，不能空白打卡。' };
      if (!Number.isFinite(quantity) || quantity <= 0) return { error: '本次完成量应为大于0的数值。' };
      if (KINDS.indexOf(kind) < 0) return { error: '请选择一种成果类型。' };
      if (kind === '发布链接+复盘' && !link) return { error: '请填写发布链接和复盘内容。' };
      if (link && !/^https?:\/\//i.test(link)) return { error: '成果链接须为有效的 http:// 或 https:// 网址。' };
      var minutes = (p.minutes === null || p.minutes === undefined || p.minutes === '') ? null : Number(p.minutes);
      if (minutes !== null && (!Number.isFinite(minutes) || minutes < 0 || minutes > 1440))
        return { error: '分钟数应在0到1440之间，未填写请留空。' };
      if (!validDay(d)) return { error: '请选择有效日期。' };
      var g = goalById(gid);
      if (!g) return { error: '目标已不存在。' };
      if (d > today || d < addDays(today, -6) || d < g.started_on)
        return { error: '只能记录今天或补记最近6天，且不能早于目标开始日期。' };
      if (s.records.some(function (r) { return r.id === cid; })) return { error: '这条记录已存在。' };
      var imgs = Array.isArray(p.images) ? p.images.slice(0, 3) : [];
      s.records.push({
        id: cid, goal_id: gid, day: d, quantity: quantity, minutes: minutes, kind: kind,
        body: body, english_sentence: englishSentence, link: link, images: JSON.stringify(imgs),
        discussion: '', related_ids: '[]', is_backfill: d < today ? 1 : 0, is_example: 0, created_at: nowISO()
      });
      g.is_example = 0; g.updated_at = nowISO();
      saveSnap(); return { ok: true, id: cid };
    }
    if (action === 'delete_goal') {
      var dg = goalById(p.id);
      if (dg) { s.goals = s.goals.filter(function (x) { return x.id !== p.id; }); s.records = s.records.filter(function (r) { return r.goal_id !== p.id; }); saveSnap(); }
      return { ok: true };
    }
    if (action === 'delete_record') {
      s.records = s.records.filter(function (r) { return r.id !== p.id; });
      saveSnap(); return { ok: true };
    }
    if (action === 'save_review') {
      var week = p.week_start;
      if (!validDay(week) || monday(week) !== week || week > monday(today)) return { error: '请选择本周或历史周。' };
      var old = s.reviews.find(function (r) { return r.week_start === week; });
      var fields = [String(p.keep || ''), String(p.problem || ''), String(p.attempt || ''), String(p.next_plan || '')];
      if (old) {
        old.keep = fields[0]; old.problem = fields[1]; old.attempt = fields[2]; old.next_plan = fields[3];
        old.version = (old.version || 1) + 1; old.updated_at = nowISO();
      } else {
        s.reviews.push({ id: uid(), week_start: week, keep: fields[0], problem: fields[1], attempt: fields[2], next_plan: fields[3], version: 1, updated_at: nowISO() });
      }
      saveSnap(); return { ok: true };
    }
    if (action === 'feedback') {
      var rec = s.records.find(function (r) { return r.id === p.id; });
      if (rec) {
        if (p.discussion !== undefined) rec.discussion = String(p.discussion).slice(0, 10000);
        if (p.related_ids !== undefined) rec.related_ids = JSON.stringify(Array.isArray(p.related_ids) ? p.related_ids.slice(0, 10) : []);
        if (p.english_sentence !== undefined) rec.english_sentence = String(p.english_sentence).slice(0, 1000);
        saveSnap();
      }
      return { ok: true };
    }
    if (action === 'settings') {
      var w = Number(p.forecast_window);
      if (w !== 7 && w !== 14) return { error: '只支持近 7 天或近 14 天。' };
      s.settings.forecast_window = w; saveSnap(); return { ok: true };
    }
    if (action === 'clear_examples') {
      s.records = s.records.filter(function (r) { return !r.is_example; });
      var keep = [];
      s.goals.forEach(function (g) {
        if (!g.is_example) { keep.push(g); return; }
        var has = s.records.some(function (r) { return r.goal_id === g.id; });
        if (has) { g.is_example = 0; keep.push(g); }
      });
      s.goals = keep; s.settings.initialized = 1;
      saveSnap(); return { ok: true };
    }
    if (action === 'clear_all') {
      if (String(p.confirm || '') !== '清空') return { error: '请输入“清空”以确认。' };
      var imgs = [];
      s.records.forEach(function (r) { parseMaybe(function () { imgs = imgs.concat(JSON.parse(r.images || '[]')); }, null); });
      imgs.forEach(function (iid) { removeImage(iid); });
      s.goals = []; s.records = []; s.reviews = [];
      s.settings.initialized = 1;
      saveSnap(); return { ok: true };
    }
    return { error: '未知操作。' };
  } catch (e) { return { error: e && e.message ? e.message : '操作失败。' }; }
}

/* ---- 本机图片存储（IndexedDB） ---- */
function idb() {
  return new Promise(function (res, rej) {
    var req = indexedDB.open('ldesk.images', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('img'); };
    req.onsuccess = function () { res(req.result); };
    req.onerror = function () { rej(req.error); };
  });
}
function imagePutLocal(id, dataUrl) {
  return idb().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction('img', 'readwrite');
      tx.objectStore('img').put(dataUrl, id);
      tx.oncomplete = function () { res(); };
      tx.onerror = function () { rej(tx.error); };
    });
  });
}
function imageGetLocal(id) {
  return idb().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction('img', 'readonly');
      var r = tx.objectStore('img').get(id);
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });

function heatmapHTML() {
  var today = todayCN(), records = APP.snap.records;
  var y = today.slice(0, 4), m = today.slice(5, 7);

  var monthDays = parseInt(new Date(dateValue(first)).getUTCMonth() === parseInt(m, 10) - 1 ? new Date(Date.UTC(parseInt(y), parseInt(m, 10), 0)).getUTCDate() : 30, 10);
  var lastDay = new Date(Date.UTC(parseInt(y, 10), parseInt(m, 10), 0)).getUTCDate();
  var counts = {};
  records.forEach(function (r) { counts[r.day] = (counts[r.day] || 0) + 1; });

  ['一', '二', '三', '四', '五', '六', '日'].forEach(function (w) { h += '<span class="hm-head">' + w + '</span>'; });
  for (var i = 0; i < startWd; i++) h += '<span class="hm-cell empty"></span>';

}

function inlineMD(s) {
  var out = esc(s);
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, t, h) { return '<button class="inline-link" data-link="' + h.replace(/^<|>$/g, '') + '">' + t + '</button>'; });
  return out;
}
function englishBlockHTML(text, always, expanded) {
