<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#543bda">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学习管理台">
<title>外贸业务系统学习管理台</title>
<style>
/* 独立页面基础样式，不需要框架、CDN 或构建运行时。 */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { min-width: 0; }
button, input, textarea, select { font: inherit; color: inherit; background: transparent; border-radius: 0; }
button, input[type="submit"] { -webkit-appearance: button; appearance: button; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
strong, b { font-weight: bolder; }
ol, ul { list-style: none; }
table { border-collapse: collapse; border-color: inherit; }
img, svg { display: block; vertical-align: middle; }
img { max-width: 100%; height: auto; }
textarea { resize: vertical; }
code, pre { font-family: Consolas, monospace; font-size: 1em; }
small { font-size: 80%; }
summary { display: list-item; cursor: pointer; }
[hidden] { display: none !important; }


:root, .dark {
  --background: #f5f6fb;
  --foreground: #202844;
  --card: #fff;
  --primary: #6944ed;
  --radius: 1rem;
  color-scheme: light;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: Inter, 'Microsoft YaHei', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
}
button, a, input, textarea {
  touch-action: manipulation;
}
button {
  cursor: pointer;
  font: inherit;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}
button:focus-visible, a:focus-visible {
  outline: 3px solid #ab96fa;
  outline-offset: 3px;
}
svg {
  flex-shrink: 0;
}
h1, h2, h3, p {
  margin: 0;
}
h2 {
  font-size: 24px;
  font-weight: 750;
  line-height: 1.45;
}
h3 {
  font-size: 18px;
  font-weight: 700;
}
.desk-sidebar {
  position: fixed !important;
  left: 0;
  top: 0;
  bottom: 0;
  width: 238px !important;
  padding: 26px 16px;
  border-right: 1px solid #e5e7f0;
  z-index: 25;
  background: white !important;
}
.brand {
  font-size: 18px;
  font-weight: 800;
  display: flex;
  gap: 10px;
  align-items: center;
  white-space: nowrap;
}
.brand svg {
  color: #6c42ec;
  width: 25px;
}
.muted {
  color: #748099;
  font-size: 14px;
}
.navitem {
  width: 100%;
  padding: 14px 16px;
  display: flex;
  gap: 12px;
  align-items: center;
  margin-top: 8px;
  border: 0;
  background: transparent;
  border-radius: 12px;
  text-align: left;
  font-size: 15px;
}
.navitem svg {
  width: 20px;
}
.navitem.selected {
  background: #efebff;
  color: #633be4;
  font-weight: 700;
}
.sidebar-note {
  margin: 30px 10px;
  padding: 20px 0;
  border-top: 1px solid #ececf4;
  font-size: 14px;
  color: #8790a6;
  line-height: 1.9;
}
.desk-main {
  width: calc(100% - 238px);
  margin-left: 238px;
  min-height: 100vh;
  padding-bottom: 40px;
}
.hero {
  background: radial-gradient(circle at 90% 10%, #bc64f433, transparent 45%), linear-gradient(115deg, #543bda, #7835ed 64%, #a045e8);
  padding: 30px 42px;
  color: #fff;
}
.hero h1 {
  font-size: 28px;
  letter-spacing: -0.8px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 4px 0 8px;
}
.hero h1 svg {
  width: 29px;
}
.hero p {
  opacity: 0.9;
  font-size: 15px;
}
.eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.5px;
  opacity: 0.76;
  margin-bottom: 5px;
}
.hero-pills {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.hero-pills span {
  font-size: 14px;
  padding: 5px 13px;
  border: 1px solid #ffffff40;
  border-radius: 30px;
  background: #ffffff16;
}
.main-nav {
  display: none !important;
}
.workspace {
  max-width: 1360px;
  padding: 30px 36px;
  margin: auto;
}
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 22px;
}
.pill {
  border-radius: 25px;
  background: #eee9ff;
  color: #6740d8;
  padding: 5px 11px;
  font-size: 13px;
  white-space: nowrap;
}
.catalog {
  display: block;
  max-width: 1040px;
}
.module {
  background: white;
  border: 1px solid #e9eaf2;
  border-radius: 19px;
  overflow: hidden;
  margin-bottom: 24px;
  box-shadow: 0 4px 16px #28386604;
}
.module-heading {
  display: flex;
  gap: 16px;
  align-items: center;
  padding: 24px;
  background: linear-gradient(100deg, #faf9ff, white);
  border-bottom: 1px solid #ebeaf3;
}
.module-heading > span {
  font-size: 24px;
  font-weight: 800;
  color: #7153e6;
  background: #f0ebff;
  border-radius: 12px;
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
}
.module-heading small {
  font-size: 12px;
  color: #7b7597;
}
.module-heading b {
  margin-left: auto;
  font-size: 13px;
  color: #9b98ac;
  font-weight: 500;
}
.course-row {
  padding: 20px 24px;
  border-bottom: 1px solid #f0f0f6;
}
.course-row:last-child {
  border: 0;
}
.course-title {
  display: flex;
  align-items: baseline;
  gap: 12px;
  font-weight: 650;
  text-align: left;
  font-size: 17px;
  line-height: 1.65;
  width: 100%;
  border: 0;
  background: transparent;
}
.course-title span {
  color: #7250dc;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  font-weight: 650;
}
.course-title svg {
  margin-left: auto;
  width: 17px;
  color: #a9a6bd;
}
.course-title:hover {
  color: #6844e2;
}
.course-row p {
  font-size: 14px;
  color: #68718a;
  line-height: 1.85;
  margin: 8px 0 0 61px;
  max-width: 840px;
}
.row-meta {
  font-size: 12px;
  color: #989fb1;
  margin: 8px 0 0 61px;
}
.reader-modal {
  max-width: 900px !important;
  width: calc(100% - 30px) !important;
  max-height: 90dvh;
  overflow: auto;
  padding: 30px !important;
  background: white;
}
.prose-plain {
  white-space: pre-wrap;
  font-size: 16px;
  line-height: 1.95;
  margin-top: 20px;
}
@media (max-width: 1100px) {
  .desk-sidebar {
    display: none !important;
  }
  .desk-main {
    margin-left: 0;
    width: 100%;
  }
  .main-nav {
    display: flex !important;
    position: sticky;
    top: 0;
    z-index: 20;
    background: #fff !important;
    border-radius: 0 !important;
    width: 100% !important;
    height: 60px !important;
    padding: 8px 24px !important;
    border-bottom: 1px solid #e6e7f1;
  }
  .main-nav button {
    height: 44px !important;
  }
  .workspace {
    padding: 26px;
  }
  .hero {
    padding: 26px;
  }
  .main-nav button[data-active] {
    background: #efebff !important;
    color: #643cea !important;
  }
}
@media (max-width: 640px) {
  .hero {
    padding: 22px 20px;
  }
  .hero h1 {
    font-size: 24px;
  }
  .hero-pills {
    gap: 7px;
    margin-top: 15px;
  }
  .hero-pills span {
    font-size: 12px;
    padding: 4px 9px;
  }
  .workspace {
    padding: 20px 14px 100px;
  }
  .desk-main {
    padding-bottom: 20px;
  }
  .main-nav {
    position: fixed !important;
    top: auto;
    bottom: 0;
    left: 0;
    height: 76px !important;
    padding: 8px 9px calc(8px + env(safe-area-inset-bottom)) !important;
    background: #ececf6ee !important;
    backdrop-filter: blur(16px);
    border: 1px solid #e3e4ef;
    border-radius: 17px 17px 0 0 !important;
  }
  .main-nav button {
    height: 48px !important;
    font-size: 12px !important;
    gap: 5px !important;
    padding: 5px !important;
  }
  .main-nav button svg {
    width: 17px !important;
  }
  .main-nav button[data-active] {
    background: white !important;
    box-shadow: 0 2px 10px #42368712;
  }
  .section-heading h2 {
    font-size: 21px;
  }
  .section-heading .pill {
    display: none;
  }
  .module-heading {
    padding: 19px 18px;
  }
  .module-heading h3 {
    font-size: 17px;
  }
  .course-row {
    padding: 17px 18px;
  }
  .course-title {
    gap: 8px;
    font-size: 16px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .course-title span {
    display: block;
    width: 100%;
    font-size: 13px;
  }
  .course-title svg {
    display: none;
  }
  .course-row p, .row-meta {
    margin-left: 0;
  }
  .reader-modal {
    padding: 23px !important;
  }
  .prose-plain {
    font-size: 15px;
  }
}
.completed-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.completed-actions .secondary {
  min-height: 32px;
  font-size: 12px;
  padding: 6px 9px;
}
.hero {
  position: sticky;
  top: 0;
  z-index: 30;
  box-shadow: 0 2px 16px #35248216;
}
.hero .acknowledgement {
  font-size: 13px;
  opacity: 0.78;
  margin-top: 6px;
}
.hero-pills b {
  font-size: 16px;
  margin: 0 3px;
}
.workspace .eyebrow {
  color: #7b7498;
}
.side-sync {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  background: #f7f6fc;
  margin: auto 10px 0;
  padding: 12px;
  border-radius: 12px;
  color: #72638d;
  font-size: 13px;
}
.course-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
}
.course-bottom .row-meta {
  margin-top: 0;
}
.course-row .scope {
  color: #8b819c;
  font-size: 13px;
}
.text-link {
  color: #6a43de;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 0;
  background: transparent;
  font-size: 14px;
  line-height: 1.6;
  text-decoration: none;
}
.text-link:hover {
  text-decoration: underline;
}
.primary, .secondary, .danger, .danger-outline {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 43px;
  border-radius: 11px;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 650;
  border: 1px solid transparent;
  line-height: 1.5;
  transition: background 0.16s;
}
.primary {
  background: #6944ed;
  color: white;
  box-shadow: 0 3px 9px #633bdd17;
}
.primary:hover {
  background: #5934d5;
}
.secondary {
  background: #f0f1f8;
  color: #515d7a;
  border-color: #e9eaf2;
}
.secondary:hover {
  background: #e7e8f3;
}
.danger {
  background: #cf4156;
  color: white;
}
.danger-outline {
  color: #c23349;
  background: #fff7f7;
  border-color: #f0d5da;
}
.wide {
  width: 100%;
  margin-top: 12px;
}
.panel, .goal-card, .stat-card {
  background: white;
  border: 1px solid #e9ebf2;
  border-radius: 19px;
  box-shadow: 0 3px 13px #20284406;
}
.panel {
  padding: 24px;
  margin-bottom: 24px;
  min-width: 0;
}
.panel h3 {
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel > p {
  margin: 12px 0;
  line-height: 1.85;
  font-size: 14px;
}
.panel > .secondary {
  margin-top: 10px;
  margin-right: 12px;
}
.goal-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
  margin: 20px 0;
}
.goal-card {
  padding: 23px;
  min-width: 0;
  align-self: start;
}
.goal-top {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 9px;
}
.goal-name {
  display: block;
  text-align: left;
  border: 0;
  background: transparent;
  font-size: 16px;
  font-weight: 750;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.goal-name i, .legend i, .week-row i {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-right: 9px;
  flex-shrink: 0;
}
.goal-name:hover {
  color: #6944ed;
}
.icon-actions {
  display: flex;
  gap: 1px;
  margin-left: auto;
  flex-shrink: 0;
}
.icon-actions button {
  background: transparent;
  border: 0;
  color: #8c91a6;
  border-radius: 7px;
  padding: 7px;
}
.icon-actions button:hover {
  color: #6744dd;
  background: #f3f0fd;
}
.goal-objective {
  font-size: 14px;
  line-height: 1.9;
  color: #727b91;
  margin: 12px 0 16px;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 6px;
  background: #f0edf9;
  color: #85739a;
  font-size: 12px;
}
.badge.amber {
  background: #fff0ce;
  color: #a36708;
}
.notice {
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 13px 16px;
  margin: 14px 0;
  font-size: 14px;
  line-height: 1.8;
}
.notice strong {
  font-weight: 650;
}
.notice p {
  font-size: 13px;
  margin-top: 3px;
  line-height: 1.85;
}
.notice.amber {
  background: #fff9eb;
  border-color: #f2dfab;
  color: #926422;
}
.notice.red {
  background: #fff3f5;
  border-color: #f1c9d1;
  color: #b24c5e;
}
.notice.green {
  background: #eefaf4;
  border-color: #bce7d2;
  color: #218268;
  display: flex;
  align-items: center;
  gap: 12px;
}
.notice.compact {
  padding: 9px 12px;
}
.overdue {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  color: #c34d60;
  background: #fff7f8;
  border-radius: 9px;
  padding: 9px 12px;
  font-size: 13px;
  margin: 10px 0;
}
.overdue button {
  color: inherit;
  border: 0;
  background: transparent;
  text-decoration: underline;
  text-underline-offset: 3px;
  font-size: 13px;
}
.goal-progress {
  display: flex;
  align-items: center;
  gap: 22px;
  margin: 23px 0;
}
.ring {
  width: 104px;
  height: 104px;
  position: relative;
  flex-shrink: 0;
}
.ring svg {
  width: 100%;
  height: 100%;
}
.ring > div {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.5;
}
.ring strong {
  font-size: 22px;
  letter-spacing: -0.5px;
}
.ring small {
  font-size: 11px;
  color: #8389a0;
}
.numbers {
  display: grid;
  gap: 9px;
  flex: 1;
  min-width: 0;
}
.numbers > div {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 14px;
  line-height: 1.5;
}
.numbers > div > span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-width: 75px;
  color: #758199;
  font-size: 13px;
}
.numbers b {
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.numbers b small {
  font-weight: 400;
  color: #8792a7;
}
.numbers > div > small {
  font-size: 12px;
}
.good, .success-label {
  color: #18816a;
}
.bad {
  color: #c1435b;
}
.goal-dates {
  display: flex;
  gap: 5px 13px;
  flex-wrap: wrap;
  color: #8a91a3;
  font-size: 12px;
  border-top: 1px dashed #ebeaf3;
  padding-top: 14px;
}
.plan-box {
  background: #f7f5ff;
  border-radius: 10px;
  padding: 12px 14px;
  color: #73638f;
  font-size: 13px;
  line-height: 1.85;
  margin: 17px 0;
}
.plan-box p + p {
  margin-top: 6px;
}
.plan-box strong {
  color: #714ede;
  font-weight: 650;
  margin-right: 5px;
}
.goal-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 20px;
}
.success-label {
  display: flex;
  gap: 5px;
  align-items: center;
  font-size: 14px;
}
.suggestion {
  color: #9993aa;
  font-size: 12px;
  text-align: right;
  margin-top: 8px;
}
.new-goal {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  border: 2px dashed #cfc6f8;
  background: #fbfaff;
  color: #6a43e7;
  border-radius: 17px;
  min-height: 72px;
  font-weight: 650;
  margin: 24px 0 13px;
}
.new-goal:hover {
  background: #f0ebff;
}
.new-goal svg {
  width: 20px;
}
.rule-note {
  font-size: 13px;
  color: #898fa6;
  line-height: 1.9;
  margin: 13px 0 20px;
}
.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}
.stat-card {
  padding: 22px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.stat-card strong {
  font-size: 25px;
  line-height: 1.25;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.stat-card p {
  font-size: 13px;
  color: #7d87a0;
}
.stat-icon {
  border-radius: 12px;
  background: #f0ebff;
  color: #7850f1;
  padding: 11px;
  display: flex;
}
.stat-icon.c1 {
  color: #249482;
  background: #eaf7f3;
}
.stat-icon.c2 {
  color: #da9827;
  background: #fff5e3;
}
.stat-icon.c3 {
  color: #9b53e7;
  background: #f5eafd;
}
.charts-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(270px, 1fr);
  gap: 22px;
  margin-top: 24px;
}
.charts-grid > .panel {
  margin: 0;
}
.chart-scroll {
  overflow-x: auto;
}
.minutes-chart {
  display: block;
  min-width: 650px;
  width: 100%;
}
.minutes-chart text {
  font-size: 12px;
  fill: #9198ac;
}
.legend {
  display: flex;
  gap: 6px 15px;
  flex-wrap: wrap;
  font-size: 12px;
  color: #8a829f;
  margin-top: 8px;
}
.legend i {
  width: 8px;
  height: 8px;
  margin-right: 5px;
}
.empty-chart {
  min-height: 205px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #8d8aa4;
  text-align: center;
  gap: 12px;
  font-size: 14px;
}
.empty-chart svg {
  width: 30px;
  color: #b9abe5;
}
.empty-chart small {
  font-size: 12px;
}
.charts-grid + .panel {
  margin-top: 24px;
}
.heatmap {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 5px;
  margin-bottom: 15px;
}
.heatmap > small {
  text-align: center;
  font-size: 12px;
  padding-bottom: 7px;
  color: #9795ab;
}
.heat-cell {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  border-radius: 7px;
  background: #f4f3f8;
  color: #85849b;
  font-size: 12px;

      "content": "# L01 从精密制造能力到目标客户\n\n模块：M1 能力与方向｜建议：30 分钟｜前置：无｜交付物：O01 客户匹配判断\n\n学习目标：看到一家企业时，能说出“为什么可能适合我、依据是什么、还需要验证什么”。\n\n本课做到这里就够了：先判断它值不值得继续了解，不要求立刻选定行业或发送开发信。\n\n原图依据：业务开发的价值主张、资源配置；客户背景调查的行业匹配、我方定位与供应体系。辅助阅读：[速查表](../../../crm/三层理解与运用速查表.md)第 3 节。练习材料：[案例包 S0](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n打开一家公司的介绍，你最先要回答的是：它做的事情，与你能协调的制造资源有没有交集？先找“它做什么”的原话，再想可能需要什么，最后留下一个需要验证的问题。不要一开始就给它贴上“好客户”的标签。\n\n把笔记写成三句话：“我看到……”“所以我猜它可能……”“但还要确认……”。第一句是资料里能找到的事实；第二句是你的推测；第三句决定下一步查什么。推测可以有价值，只要没有写成已经发生的采购。\n\n比如“有设备研发与装配业务”能支持继续了解零件需求，却还不能证明对方会外包、正在采购或愿意换供应商。你这一课的进步，是能说清为什么值得看下去。\n\n## 2. 案例拆解\n\nS0 中，A 展示设备研发与装配，我方有可对接的小批量铝件资源，两者存在值得验证的交集。但网站没有证明 A 一定外包，也没证明当前需要铝件。\n\nB 规模较大，只看到整机代理和售后介绍。规模本身不能证明与定制零件能力匹配。可以继续调查，但当前支持“优先了解”的证据少于 A。\n\nC 有研发活动，但供应商评估要求不清楚。它也可能匹配，下一步需确认需求范围及进入条件，不能因为信息不全就断言不合适。\n\n## 3. 照着做一次\n\n拿出案例包 S0，只看 A、B、C 的介绍和我方资源。把以下内容存为 **O01 客户匹配判断**：\n\n1. 每家各写三句话：“资料里写了……”“这可能与我的……资源有关”“还需要确认……”。一共九句话即可。\n2. 圈出最想继续了解的一家，用两句话解释：它哪条信息与你的资源有关；为什么暂时排在另外两家前面。\n3. 检查自己有没有写“一定需要”“马上会下单”。有的话，回到材料找依据；找不到就改成推测或问题。\n\n用到真实工作时：打开你手边一家企业的介绍，也先写这三句话。只看到公司规模或漂亮产品图时，可以写“暂时还找不到匹配依据”，再确定要补看哪一页。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n一种够用的写法如下；先读出每行三句话的区别。\n\n| 企业 | 资料里的事实 | 我的推测 | 下一步要验证 |\n| --- | --- | --- | --- |\n| A | 展示设备研发和装配 | 可能涉及与我方铝件评估资源有关的需求 | 是否有相关外协零件需求？ |\n| B | 介绍整机代理和售后 | 可能有备件采购，但现在不能确定 | 是否自行采购定制零件？ |\n| C | 展示仪器研发和供应商评估程序 | 可能需要相关零件，也可能有我方尚未满足的要求 | 采购哪些零件，评估需要哪些条件？ |\n\n选择 A 可以这样解释：“设备研发和装配与定制零件存在值得调查的联系，我方又能协调小批量铝件评估，所以先了解 A 的外协范围。B 的定制零件采购还不明确，C 的零件类别和评估条件也需继续查。”\n\n选择 C 也可能合理，关键是能用材料解释，并留下具体问题。这只是当前练习的顺序，不是判断哪种企业普遍更容易成交。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] A、B、C 各有三句话，能分别指出资料原话、自己的推测、还要确认的问题。\n- [ ] 选出一家继续了解的企业，并能指着它的具体业务信息解释原因。\n- [ ] 没有把可能的零件需求写成现成订单；下一步问题能帮助判断是否匹配。\n\n## 6. 下次不看笔记再试一次\n\n重新看 A 的介绍，不看作业，用一分钟说出“为什么可能适合我、依据是什么、还缺什么”。再解释：即使它值得继续了解，为什么还不能说它现在要买？\n\n[课程目录](../README.md) · [下一课](L02-梳理供应资源与承诺边界.md)\n",

      "content": "# L02 梳理供应资源与承诺边界\n\n模块：M1 能力与方向｜建议：35 分钟｜前置：L01｜交付物：O02 能力与待确认清单\n\n学习目标：客户问“你能做什么”时，能说清自己能负责什么、合作工厂确认过什么、哪些事情要看过具体要求才能答复。\n\n本课做到这里就够了：写出一段自己敢负责的能力介绍；还没有核实的资源，可以明确记为待确认。\n\n原图依据：供应体系、技术/服务团队、资源配置、可控能力。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 4、6.5 节。材料：[S0](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n新手容易把“我认识这家工厂”写成“我们什么都能做”。先把你自己的工作和工厂的工作分开：你可以整理客户要求、核对资料、协调答复；是否能加工、怎样检验、多少钱、何时交货，要有负责人的具体答复。\n\n拿一张纸分三栏：“我能负责”“已有资料或回复支持”“还要按项目确认”。把你准备说给客户听的话逐句放进去。放不进去的，通常是含糊宣传，或者你还没核实的事情。\n\n例如，一份样件报告能让人看到那件样件查了什么、结果怎样。它不能替另一张新图纸作保证。能力介绍应让客户知道你能提供什么帮助，也让你自己知道下一步该找谁。\n\n## 2. 案例拆解\n\nS0 已确认两份资料可对外使用，也确认了工厂对接人。可以说“可提供相关匿名加工与检验案例，并就新图纸组织评估”。不能说“所有精密件都能做”“任意公差都能达到”。\n\n当客户问交期，你可以负责组织并及时反馈评估；在工厂尚未核实排产前，不能用自己的回复速度替代生产承诺。\n\n## 3. 照着做一次\n\n用 S0 完成 **O02 能力与待确认清单**：\n\n1. 按材料/零件范围、技术评估、检验、资料授权、价格、交期列六行。每行写“目前知道什么—依据在哪—还要问谁”。\n2. 用不同标记区分自己的工作、工厂已答复的事项、具体项目仍需确认的事项；没有姓名时写角色即可。\n3. 把“我们拥有完整能力，任何精密件都可快速交付”改成两三句客户能听懂的话。逐句检查是否有上面六行的支持。\n\n用到真实工作时：先查自己已有的工厂回复和获准使用的资料。没有就写“待核实”，不要把模拟工厂甲的条件当成你的真实资源。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\nS0 能支持的写法可以很简单：\n\n| 事项 | 目前能说什么 | 还要确认什么、问谁 |\n| --- | --- | --- |\n| 材料/零件范围 | 工厂愿意接收铝件小批量资料作评估 | 具体要求能否满足，问技术联系人 |\n| 技术评估 | 有技术对接人 | 本项目还缺什么、何时反馈，向技术确认 |\n| 检验 | 有对应样件报告可参考 | 新零件检验要求及能否满足，找客户相关人员和工厂确认 |\n| 资料授权 | 两份资料已获对外使用授权 | 若换成其他资料，重新确认授权 |\n| 价格 | 有报价联系人 | 具体版本和数量的方案，向报价联系人确认 |\n| 交期 | 还没有项目交期结论 | 起算条件与排产，协调工厂相关负责人确认 |\n\n能力介绍可写：“我负责整理要求、核对资料并协调答复。目前可对接小批量铝件项目评估，也有获授权的加工与检验案例供参考。具体加工要求、价格和交期要按项目确认。”\n\n自己的真实资源少于案例时，就按实际情况写。知道还没核实什么，本身就是这份清单的作用。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 六类事项都写出目前依据或要找谁核实，空缺没有被填成“没问题”。\n- [ ] 能力介绍说得出自己负责的工作，也说得出哪些结论要由工厂确认。\n- [ ] 没有把一份样件报告、一个联系人或一种设备说成所有项目都能承接的证明。\n\n## 6. 下次不看笔记再试一次\n\n客户问“这份报告很好，我的新零件也能保证一样吗？”不用“可以”或“不可以”抢答，先说你要收什么资料、找谁确认、再反馈什么。\n\n[上一课](L01-从精密制造能力到目标客户.md) · [目录](../README.md) · [下一课](L03-把能力变成客户听得懂的价值.md)\n",

      "content": "# L03 把能力变成客户听得懂的价值\n\n模块：M1 能力与方向｜建议：30 分钟｜前置：L02｜交付物：O03 有依据的价值说明\n\n学习目标：介绍自己的资源时，能让对方听懂“你可能在哪件事上帮到我、拿什么说明、还需要了解什么”。\n\n本课做到这里就够了：为两类潜在客户各写一小段有针对性的介绍，先练清楚表达，不要求写出完整宣传册。\n\n原图依据：价值主张、解决客户问题、专业服务、客户原则。辅助阅读：[理解与落地手册](../../../crm/业务管理系统理解与团队落地手册.md)第 2.1 节。材料：[S0](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n“我有加工资源”只是说明你有什么。客户更容易理解的是：“如果你正在评估小批量零件，我可以帮你整理要求、协调工厂答复。”把资源放进对方可能遇到的事情里，才知道这段介绍为什么与他有关。\n\n先写客户情境，再写你能做的动作，最后写可提供的依据。还不知道客户是否有这个需要，就用“如果你们正在……”开头。这样既能提出相关帮助，也没有替客户编造需求。\n\n“质量好、服务好”太宽。试着把它换成客户看得见的事情：提供一份获授权案例、把版本问题列清、协调技术回复。说到哪一步，资料和实际能力就要支持到哪一步。\n\n## 2. 案例拆解\n\n面向有设备验证需求的潜在客户，可以表达：“若项目需要小批量铝件评估，我们可以根据图纸整理待确认项，协调工厂评估，并提供获授权的加工与检验案例供参考。”\n\n这里没有保证客户能降本多少，也没有保证比所有供应商快。它说明了具体场景、工作与可提供的证据，客户可以据此判断是否相关。\n\n## 3. 照着做一次\n\n用 S0 和 O02 完成 **O03 有依据的价值说明**：\n\n1. 给 A 写一段不超过 120 字的介绍，按“看到的业务—可能遇到的事—我能做的动作—可提供的依据”组织。\n2. 给 C 另写一段。先考虑它提到的供应商评估，把还不知道的零件类型或评估要求留成问题。\n3. 在两段里标出场景、帮助、证据和待确认条件。再写一句你原本可能使用的空泛宣传语，并说明为什么改掉。\n\n用到真实工作时：先改好你最常说的一句自我介绍。读完后问自己：对方能不能知道，具体发生哪件事时可以找我？\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n给 A 的示例：“看到贵司开展设备研发与装配。如果有小批量铝件需要评估，我可以整理图纸问题、协调工厂答复，并提供获授权的匿名加工和检验案例；具体能否满足要求需按项目确认。”\n\n给 C 的示例：“看到贵司有仪器开发和供应商评估程序。如果评估范围涉及小批量铝件，我可以先按要求准备获授权的相关案例；还需了解零件类型与评估条件，再确认是否匹配。”\n\nA 的重点是可能的零件评估，C 的重点是先了解评估要求。“任何精密件都能快速交付”既缺证据，也没说清适用情况，不能用它替代具体帮助。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] A、C 两段各不超过 120 字，区别来自业务信息，而不是只换公司名。\n- [ ] 每段都写出一个自己能做的具体动作，以及支持它的资料或待确认条件。\n- [ ] 能把一句“质量好、什么都能做”之类的宣传改成有依据、可理解的表达。\n\n## 6. 下次不看笔记再试一次\n\n有人问“你对我有什么帮助？”选 A 或 C，用三句话回答；不要只报设备、工艺名称或形容词。\n\n[上一课](L02-梳理供应资源与承诺边界.md) · [目录](../README.md) · [下一课](L04-建立目标客户画像与筛选依据.md)\n",

      "content": "# L04 建立目标客户画像与筛选依据\n\n模块：M1 能力与方向｜建议：40 分钟｜前置：L01—L03｜交付物：O04 三类客户筛选与验证计划\n\n学习目标：同时看到几家企业时，能决定先了解哪家，并说出“我看中了什么、先查什么、什么新信息会让我改主意”。\n\n本课做到这里就够了：形成一版可以调整的筛选条件，不要求一次定死行业、国家或客户名单。\n\n原图依据：客户细分、行业匹配、客户价值、竞争与资源分析。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 6.2、6.4 节。材料：[S0](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n“客户画像”在这里就是：你准备优先了解什么样的企业。先用一句日常表达写出来，例如“有设备研发活动，值得进一步核实小批量零件需求的企业”。其中哪部分是已看到的，哪部分还要问清楚，要分开。\n\n筛选时看三件事：对方业务与你的资源有没有交集；现在有哪些证据；哪条未知最影响继续投入时间。没查到某条信息，可以先记为未知。只有取得不匹配的证据，才有理由据此降低优先顺序。\n\n排序是为了决定先做哪一步，并不预测谁一定成交。给你的首选加一句：“如果查到……，我就调整顺序。”这能提醒你根据新信息改判断。\n\n## 2. 案例拆解\n\n“有设备研发活动、可能存在小批量零件需求、允许评估新供应方”可作为本案例的候选画像。前两项仍需具体核实，第三项尚无信息。\n\nA 值得优先调查；B 先核对业务范围；C 先核对供应商要求。可以形成不同的验证任务，不必用没有依据的 90 分、70 分把不确定性伪装成精确结论。\n\n## 3. 照着做一次\n\n拿出 O01—O03，完成 **O04 三类客户筛选与验证计划**：\n\n1. 用不超过 150 字写出现在想先了解的企业特征。至少有一条是能从业务介绍中寻找的线索。\n2. 给 A、B、C 各写“目前放在什么位置—最想确认什么—准备到哪里找或向什么角色问”。允许把两家并列。\n3. 写一个会改变排序的具体情况，例如某家原本不明确的定制零件采购职责得到确认。\n4. 回看前三课：选的客户是否与 O02 的资源有关？O03 有没有说过头？发现冲突就在原句旁改正。\n\n用到真实工作时：每次新增一家公司，先用这几条条件判断是否值得继续查。不要为了凑名单而收进完全说不出理由的企业。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n初步筛选条件可写：“先了解有设备研发或仪器开发业务、值得核实小批量铝件需求的企业；实际外协范围、是否评估新供应方仍需确认。”\n\nA 先查外协范围，可从业务页面与合适的咨询方向继续核实；B 先查是否采购定制备件，避免只因规模大就投入大量时间；C 先查零件类别和供应商要求，可从其评估说明寻找线索。\n\n可能改变排序的信息是：“B 明确确认负责定制备件采购，范围与我的已核实资源相符。”此时值得重新比较，而不是坚持最初排序。回看 O03，若把待确认能力写成保证，就按 O02 改回有条件的表述。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 筛选条件写的是能查找的业务特征，没有把未知需求写成已确定。\n- [ ] 三家各有一条最重要的待确认问题，并写清准备怎么找答案。\n- [ ] 能举出改变排序的新信息，并检查客户选择、能力介绍和价值说明是否相互支持。\n\n## 6. 下次不看笔记再试一次\n\n假如 B 确认自己采购定制备件，你会怎样调整原先判断？说出要改变的一项判断，以及仍需核实的一项条件。\n\n[上一课](L03-把能力变成客户听得懂的价值.md) · [目录](../README.md) · [下一课](L05-选择开发渠道与寻找线索.md)\n",

      "content": "# L05 选择开发渠道与寻找线索\n\n模块：M2 线索与客户｜建议：35 分钟｜前置：L04｜交付物：O05 一次线索寻找方案\n\n学习目标：准备开始找客户时，能说出“我要找什么样的企业、先从哪里找、找到后看什么决定留下”。\n\n本课做到这里就够了：先设计并演练一次有目的的寻找过程，不要求收集大量名单或立即联系。\n\n原图依据：业务开发中的开发工具、开发信、电话、社媒、线下和平台。辅助阅读：[原图解读](../../PDF原图解读与文档校准.md)第 3 节。材料：[S0—S1](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n开始搜索前，先把 O04 变成一个问题：“哪里能找到做这类业务的企业？”可以从搜索结果、展会目录、行业资料或企业公开页面获得线索，但每次先选一种发现方式，再选一种核实方式，避免不停换渠道。\n\n发现企业、核实业务、找到合适联系入口，是三步不同的工作。出现在某份目录里，只说明你找到了它；要不要留下，仍要看业务介绍是否与你的资源相关。\n\n写搜索思路时，用你要找的客户业务来描述，例如“自动化设备研发与装配企业”，而不是只写“精密加工客户”。目标地区已明确时再加地区。搜索词只是起点，结果仍需逐个判断；真实平台的具体操作另按当时情况核对。\n\n## 2. 案例拆解\n\nS1 中 A 的公开业务入口可用于确认联系方向，网站资料页可用于了解业务。网站发布新设备新闻，只能形成调查线索，不能直接认定公司急需零件。\n\n二手消息说 A“肯定缺供应商”，其来源和时效未知，应放入待核实项。它可以提示一个问题，但不适合直接写进开发消息作为既定事实。\n\n## 3. 照着做一次\n\n用 O04 和 S1 演练，完成 **O05 一次线索寻找方案**：\n\n1. 写一句寻找对象，再写两种搜索表达或目录查找思路；每种说明希望看到什么类型的企业。\n2. 选一个发现入口和一个核实入口，分别写准备看什么。再指出在哪里寻找对方公开的业务联系入口。\n3. 用 A 做一条示范记录：公司、来源位置、观察日期、看到的匹配线索、还要确认的问题。案例没有真实网址和日期，直接标“模拟材料，未提供”。\n4. 写一句停止继续搜名单的条件，例如已经找到一家有具体匹配线索的企业，接下来先把它查清楚。\n\n用到真实工作时：可以先做一次短时间的小范围搜索，只留下能说清理由的线索。练习本身用 S1 即可完成，不需要联网或发送消息。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n例如，寻找对象写“有设备研发与装配业务、值得核实定制零件需求的企业”。两种寻找思路可以是“自动化设备研发装配企业”和“仪器开发企业供应商评估说明”，再判断搜到的企业是否与你的画像相符。\n\n可从搜索结果或相关目录发现企业，再到企业官网核实业务，并查看公开业务咨询入口。A 的示范记录写：公司 A；来源为 S1 模拟官网摘述；真实链接和日期未提供；有设备设计装配信息；外协范围待确认。\n\n停止无目的扩充名单的条件可以是：“找到一个有具体匹配线索、且有进一步核实入口的对象后，先完成它的背景简报。”这是一种练习安排，不是每天必须找到多少家的规定。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 寻找对象与 O04 对得上，两种搜索思路都说明了想找哪类企业。\n- [ ] 能分别指出在哪里发现公司、核实业务、寻找公开联系入口。\n- [ ] A 的记录有匹配理由和待查问题；缺失网址、日期没有编造，并知道何时转入进一步调查。\n\n## 6. 下次不看笔记再试一次\n\n你搜到一家公司和一条扩张新闻。现在先留下哪条依据、再打开哪类页面、还不能下什么结论？各说一句。\n\n[上一课](L04-建立目标客户画像与筛选依据.md) · [目录](../README.md) · [下一课](L06-做有目的的客户背景调查.md)\n",

      "content": "# L06 做有目的的客户背景调查\n\n模块：M2 线索与客户｜建议：35 分钟｜前置：L05｜交付物：O06 客户背景简报\n\n学习目标：查过一家企业后，能用一页说清“它做什么、我为什么想继续了解、哪些信息靠得住、下一步查什么”。\n\n本课做到这里就够了：让这一页帮助你作出一个下一步决定，不要求把企业所有背景查全。\n\n原图依据：官方信息、行业信息、公司信息、业务范围与客户需求。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 6.2 节。材料：[S1](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n客户背景调查不是把公司介绍抄一遍。你现在最需要知道的是：它做什么，这与你有什么关系，值得继续查还是先放下。每准备记一条信息，都问自己“这条信息会改变我的哪个判断？”\n\n记录时把原话和自己的解释分开，再写来源与看到的时间。官网内容可以说明企业如何介绍自己；联系人回复可以说明他这次说了什么；二手消息则需要另找依据。三者不要抄进同一栏后都变成“已证实”。\n\n遇到互相矛盾的信息，先保留两种说法与时间，再判断该向谁核实。写“暂时不知道”比补一段看起来完整的故事更能帮助下一步行动。\n\n## 2. 案例拆解\n\nA 的资料可整理为：“网站展示设备研发与装配；有新设备介绍；存在公开业务咨询入口。外协采购范围未明。”据此，初步判断是值得进一步了解。\n\n“订单多所以一定缺供应商”来自二手消息，不能成为确定需求。可以转化为更中性的验证问题：是否有外协零件需求，以及是否接受新供应资源评估。\n\n## 3. 照着做一次\n\n只用 S1，为 A 写 **O06 客户背景简报**，控制在一页：\n\n1. 用两句话说明公司做什么、为什么与你可能相关。\n2. 选三条观察到的信息，各写原意、来源类型、你据此能判断什么。材料未给日期或链接时标明未提供。\n3. 列最重要的两个未知，并选一个先核实，说明去看哪类资料或找哪个职责方向。\n4. 改写“公司有研发新闻，因此下个月一定会下单”，保留其中能被材料支持的部分。\n\n用到真实工作时：再次打开这份记录，你应能直接接着查，而不用从头重读所有页面。存网址是为了找回依据，不是为了让简报显得丰富。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\nA 的简报可先写：“企业公开介绍设备设计与装配，可能与我方协调的零件评估资源有关，值得继续核实外协范围。”\n\n三条观察可分别选：网站业务介绍、新设备研发新闻、公开业务咨询入口。来源都保留为 S1 的模拟公开信息，不补真实网址和日期。二手消息“订单多，肯定缺供应商”另列待核实，不把它改写成需求。\n\n两个重要未知可以是“是否采购相关外协零件”“是否接受新供应资源评估”。下一步先从公开业务入口确认负责方向。“有研发新闻”可以支持继续调查，不能支持“下个月一定下单”。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 一页里看得出 A 做什么、为什么值得继续了解，三条观察都标了来源。\n- [ ] 没有把“订单很多”的二手消息或研发新闻写成已经确认的采购计划。\n- [ ] 列出两个关键未知，并明确选了一个下一步调查动作及其理由。\n\n## 6. 下次不看笔记再试一次\n\n合上简报，用一分钟介绍 A。说到“我觉得它可能……”时，接着说出依据和仍需核实的地方。\n\n[上一课](L05-选择开发渠道与寻找线索.md) · [目录](../README.md) · [下一课](L07-识别联系人与采购角色.md)\n",

      "content": "# L07 识别联系人与采购角色\n\n模块：M2 线索与客户｜建议：30 分钟｜前置：L06｜交付物：O07 角色与问题对应表\n\n学习目标：收到一位联系人的回复时，能分清“这件事该问他什么、哪些问题要请谁参与、哪些决定还不知道由谁拍板”。\n\n本课做到这里就够了：先理清当前这次沟通涉及的几个人，不要求画完整组织架构或马上找到最高负责人。\n\n原图依据：角色权责、关注点、决策者、影响者、使用者，以及工程和采购等岗位。辅助阅读：[信息采集问卷](../../../crm/真实客户信息采集问卷.md)第 3 节。材料：[S2](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n联系人有岗位名称，不代表他能替所有人作决定。先从这次回复里找：他自述负责什么，希望收到什么资料，哪些问题提到了其他同事。暂时没提到的批准权限，就保留未知。\n\n接下来把问题分给能回答它的角色：采购安排问负责采购的人，图纸要求请技术人员确认，检验资料请相关质量人员说明。实际分工仍以对方确认的安排为准。\n\n你可以请当前联系人帮助明确协作方式。这样能让他拿到适合本轮评估的资料，也避免自己猜流程、反复把同一个问题发给不合适的人。\n\n## 2. 案例拆解\n\nS2 中林女士自述负责机械外协采购；周工程师看技术要求；吴女士可能参与质量资料。最终批准人仍未知，不能因林女士要求发资料就认定她已经批准采购。\n\n可以向林女士确认本轮希望评估哪些内容；技术问题请她协调周工程师确认；质量资料范围有需要时再请相关人员说明。问题应对应职责，避免所有事项都问同一个人并假定其回答覆盖全部。\n\n## 3. 照着做一次\n\n读 S2 的完整回复，完成 **O07 角色与问题对应表**：\n\n1. 给林女士、周工程师、吴女士各写一行：“目前知道他/她负责什么—哪些权限还不知道”。\n2. 每人配一个适合的问题和一项准备提供的资料；没有现成资料时写“需整理”或“待取得”，不写成已经备齐。\n3. 写一句发给林女士的协作确认草稿，让她能告诉你技术和质量问题怎样对接。只写草稿。\n\n用到真实工作时：每收到新回复，先更新这一行职责。对方要求发资料时，问清本轮看什么，别直接把“愿意评估”理解成“已经批准”。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n林女士负责机械外协采购，可以问“本轮想先看哪些供应资源资料”，准备相关案例说明；周工程师看技术要求，可以请其确认关键资料，准备已知要求和问题清单；吴女士可能参与质量资料，可以在需要时确认资料范围，准备对应样件报告。三人的最终批准权限均未确定。\n\n协作消息可写：“为按本轮评估重点准备资料，想请您确认优先需要哪些内容；技术和质量问题我们应按什么方式与相关同事对接？”\n\n这里是在请林女士说明协作安排。并未假设你已经可以直接联系其他两人，也没有把索要资料理解成采购批准。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 三个人的已知职责来自 S2，最终批准权限没有凭岗位名称猜定。\n- [ ] 每人对应的问题和准备材料能帮助其处理当前职责范围内的事。\n- [ ] 协作确认消息能让林女士说明如何对接，没有把索要资料说成已经采购。\n\n## 6. 下次不看笔记再试一次\n\n周工程师说技术方案看起来可以，你还不能据此认定哪些事情已完成？说两件，并分别指出要找谁确认。\n\n[上一课](L06-做有目的的客户背景调查.md) · [目录](../README.md) · [下一课](L08-区分采购阶段与销售进度.md)\n",

      "content": "# L08 区分采购阶段与销售进度\n\n模块：M2 线索与客户｜建议：40 分钟｜前置：L05—L07｜交付物：O08 采购阶段判断与下一步\n\n学习目标：发过资料或收到客户回复后，能说清“我做完了什么、客户正在考虑什么、下一步做哪件事才有帮助”。\n\n本课做到这里就够了：用现有回复描述进度即可，不要求给每个客户套上精确阶段标签或判断成交概率。\n\n原图依据：客户采购流程表——发现需求、内部酝酿、采购设计、评估比较、购买承诺、使用维护。辅助阅读：[原图解读](../../PDF原图解读与文档校准.md)第 3 节。材料：[S1—S2](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n“我已发资料”说明你的动作完成了；“客户决定采购”需要对方的明确依据。把这两件事分开，才能避免忙了很多天后，以为客户已经走到了你期待的位置。\n\n看客户回复时，找他正在处理的具体问题：先看供应资源、确认技术、讨论数量，还是安排内部评估？原图的采购流程可以提醒你提问，但现实中这些事情可能交叉，也可能因改图退回重评。\n\n下一步围绕尚未解决的问题来定。客户想先看案例，你先确认和准备相关资料；数量未定，就了解本轮按什么数量评估。消息发了几次，不是采购进度的证据。\n\n## 2. 案例拆解\n\n林女士要求先看案例和检验资料，说明愿意做初步评估。她同时说没有最终数量，因此不能把它写成订单确认。\n\n我方可以记录“准备并发送相关资料”；客户侧记录“供应资源/项目初步评估，具体采购阶段待进一步确认”。阶段不够明确时，允许保留这种描述，不必强塞一个精确标签。\n\n## 3. 照着做一次\n\n完成 **O08 采购阶段判断与下一步**：\n\n1. 对“要求发资料”“技术认可但数量未定”“通知内部评估日期”三种练习情形，各写四句：“我方已知动作是……”“客户可能在处理……”“仍不知道……”“下一步准备……”。\n2. 情形没有说明你已经做过的动作时，写“未提供”，把准备做的事另写为计划。\n3. 拿 O05—O07，用两分钟介绍 A：从哪得到线索、谁回复了什么、现在缺什么、为什么选这个下一步。最后回看是否把推测说成了事实。\n\n用到真实工作时：每次跟进前先补全“这条消息想帮助确认……”；答不出来，就先重新看客户上一条回复。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n“要求发资料”：客户愿意先看相关内容；我方是否已发送要看实际记录。还不知道评估结果，下一步是确认要看什么并准备资料。\n\n“技术认可但数量未定”：某项技术问题有了答复，采购条件还未完整。先明确认可的是哪个要求，再了解本轮数量如何确定。“通知内部评估日期”：知道了对方的一项安排，仍不知道结果，可按安排准备所需材料。\n\n两分钟介绍可以按“从哪里看到 A—林女士说了什么—当前还缺什么—为什么先做这一步”组织。缺失的我方动作写未提供，不能用“我已发资料”给故事补进度。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 三种情形都把自己的动作、客户正在处理的事和仍未知的内容分开。\n- [ ] 下一步能对应当前缺口，没有因为发过资料或技术认可就直接认定成交。\n- [ ] 两分钟介绍能连起线索来源、联系人回复和下一步理由，缺失信息没有补造。\n\n## 6. 下次不看笔记再试一次\n\n你已发三次资料，客户只说“会内部看一下”。现在你知道什么、还不知道什么、下一条消息准备确认什么？\n\n[上一课](L07-识别联系人与采购角色.md) · [目录](../README.md) · [下一课](L09-写清第一次接触的目的.md)\n",
      "scope": "用现有回复描述进度即可，不要求给每个客户套上精确阶段标签或判断成交概率。",

      "content": "# L09 写清第一次接触的目的\n\n模块：M3 沟通与需求｜建议：35 分钟｜前置：L08｜交付物：O09 首次接触消息草稿\n\n学习目标：准备第一次联系一家企业时，能写清“为什么找你、我可能帮上什么、这次只想请你回答哪一个问题”。\n\n本课做到这里就够了：先写出两条能说明来意的中文草稿，不要求立即发送，也不把拿到询盘当成本课完成条件。\n\n原图依据：开发信、建立联系、客户关注点与价值主张。辅助阅读：[原图解读](../../PDF原图解读与文档校准.md)的业务开发部分。材料：[S0—S1](../案例包.md)，本课先不用 S2 的后续回复。\n\n## 1. 先把问题想清楚\n\n打开空白消息框前，先写一句给自己看的目的：“这次我只想确认……”。例如确认外协零件由哪个职责方向评估，或确认供应商资料需要准备什么。目的越清楚，越容易删掉与这次联系无关的介绍。\n\n消息可以按四步写：看到对方哪条业务信息；这为什么与你有关；你能提供什么有依据的帮助；请对方回答一个明确问题。读完最后一句，对方应知道怎样回复，而不是面对一长串索取资料的要求。\n\n先用中文把业务意思写顺。此时尚未收到 S2 的回复，不能提前称呼已知采购负责人或假装知道对方正在做设备验证。后续真实使用，再按实际语言和渠道检查措辞。\n\n## 2. 案例拆解\n\n对 A 的草稿：“看到贵司介绍定制设备研发与装配业务，想了解相关外协零件是否由贵部门评估。我目前可协调小批量铝件项目评估，并有获授权的匿名加工与检验案例。请问贵司相关外协零件由哪个职责方向负责评估？”\n\n这条草稿只请对方回答负责方向；相关业务与案例说明是提出这个问题的理由。没有假定 A 正在缺供应商，也没有一次要求对方交出图纸、预算和全年采购量。\n\n## 3. 照着做一次\n\n只用 S0—S1 和 O02，完成 **O09 首次接触消息草稿**：\n\n1. 分别给 A、C 写一个主要目的，先不写正文。比如 A 确认负责方向，C 确认资料评估要求。\n2. 各写一条 80—150 字的中文草稿。开头说联系依据，中间说相关帮助，结尾保留一个容易回答的问题。\n3. 划出支撑能力说明的 O02 内容；找不到支持的句子先改掉。\n4. 删除或缩短一句不影响来意的话，说明删掉后对方仍能回答什么问题。两条草稿都保留在作业里，无需发送。\n\n用到真实工作时：先检查公司事实和联系对象，再读一遍最后一句。把“请给图纸、预算、全年采购量”这类多重请求拆到后续真正需要时。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\nA 的主要问题可以只问“相关外协零件由哪个职责方向负责评估”；C 可以只问“供应商资料评估需要先准备哪些内容”。前面的公司事实和能力介绍，都是为了让这一个问题有来由。\n\n删除内容时，优先找“听说你们订单很多所以急需我们”这类无依据判断，或与当前目标无关的长篇工艺清单。删掉后，对方仍知道为什么收到消息、你能提供什么和该答什么，草稿就更清楚了。\n\n如果一句话已经承担必要说明，不必为了满足字数机械删掉。可以缩短重复形容词，并说明为什么保留核心信息。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] A、C 各有一个明确目的和一条草稿，结尾能看出希望对方回答的一个问题。\n- [ ] 联系依据只用 S0—S1 已有信息，能力说明能在 O02 找到支持。\n- [ ] 能说明删掉哪句多余介绍；草稿没有一次索取完整项目条件，也没有虚构后续回复。\n\n## 6. 下次不看笔记再试一次\n\n把草稿只留最后一句：别人知道要回答什么吗？再加回必要的联系理由，看看整条消息是否仍围绕同一个目的。\n\n[上一课](L08-区分采购阶段与销售进度.md) · [目录](../README.md) · [下一课](L10-用真实资料建立专业信任.md)\n",

      "content": "# L10 用真实资料建立专业信任\n\n模块：M3 沟通与需求｜建议：30 分钟｜前置：L09｜交付物：O10 能力证明与问题回应\n\n学习目标：客户让你发资料或问“你能做好吗”时，能选出相关资料，并说清“它能说明什么、我的项目还要确认什么”。\n\n本课做到这里就够了：练会配资料、写说明和回应问题；先不用制作厚宣传册，也不要求作出加工保证。\n\n原图依据：专业形象、以文件和数据说话、遵守承诺、降低客户疑虑。辅助阅读：[速查表](../../../crm/三层理解与运用速查表.md)的业务判断问题。材料：[S0、S2](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n客户想看资料，先问自己他准备判断什么。想看相关加工经历，就找对应案例；想了解怎样检查，就找与样件对应的检验报告。两份资料回答的问题可能不同，不必把所有文件一次发过去。\n\n在每份资料旁写两句：“这能说明……”“但还不能证明……”。匿名案例可以展示案例中做过的工作；报告可以展示对应样件的检查内容。新项目能否满足要求，还要结合它自己的图纸和条件评估。\n\n可靠的说明不需要把未知藏起来。可以告诉客户已经有什么资料、还需收什么要求、会找谁确认。对外使用前也要知道资料是否获准分享；本案例 S0 已给出两份资料的授权。\n\n## 2. 案例拆解\n\n林女士想看加工和检验资料。你可先提供 S0 的授权案例及对应报告，并说明资料与本次需求的相关性和限制，再询问本轮还有哪些评估重点。\n\n“这份报告证明我们所有项目都没有质量问题”超出了材料范围；“报告展示该样件的检验项目和结果，新项目将根据图纸确认检验要求”则保留了正确边界。\n\n## 3. 照着做一次\n\n用 S0、S2 完成 **O10 能力证明与问题回应**：\n\n1. 给匿名加工案例、对应样件检验报告各写四句：“想回答客户什么问题—资料能说明什么—还说明不了什么—是否获准分享”。\n2. 写一条随资料附上的说明，点明两份资料分别用来参考什么。材料只作文字模拟，不需要伪造报告或附件。\n3. 再回应：“你们能保证所有关键要求吗？”先承接客户关心的问题，再说明需要哪些具体要求、由谁评估、将怎样反馈。\n\n用到真实工作时：发送一份资料前，先确认它对应本次客户的哪个问题。没有证据的能力，写进待评估事项，而不是补进宣传句。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n加工案例可回答“有没有相关工作可参考”；对应报告可回答“这件样件检查了什么、结果怎样记录”。两者都不能证明所有新图纸都能做。S0 已说明获准使用；你尚未看到真实附件，不能补写报告里的具体数字。\n\n随附说明可写：“以下为获授权的匿名加工案例及对应样件检验资料，供本轮评估参考。新项目仍需按具体图纸确认加工和检验要求。”\n\n保证问题可回应：“理解您关心关键要求能否落实。请提供对应图纸和要求，我会协调技术人员逐项评估，再反馈已经确认的结论和仍需澄清的内容。”这里没有把组织评估写成保证通过。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 两份资料各有明确用途，并同时说清能说明什么、不能证明什么和分享依据。\n- [ ] 随附说明能帮助客户知道先看什么，没有把匿名案例写成品牌客户背书。\n- [ ] 面对保证问题，能提出取得要求和组织评估的下一步，没有直接保证所有项目都满足。\n\n## 6. 下次不看笔记再试一次\n\n客户看完样件报告，问新零件是否也可以。用三句话答复：已有依据是什么、还缺什么、下一步怎么确认。\n\n[上一课](L09-写清第一次接触的目的.md) · [目录](../README.md) · [下一课](L11-倾听和补问真实需求.md)\n",

      "content": "# L11 倾听和补问真实需求\n\n模块：M3 沟通与需求｜建议：35 分钟｜前置：L10｜交付物：O11 需求摘要与三项补问\n\n学习目标：收到一句简短询盘时，能先复述客户已经说清的内容，再问出最影响当前判断的三个问题，并说明为什么问。\n\n本课做到这里就够了：先把需求听准、问清重点，不要求一次问完所有条件或马上给出价格。\n\n原图依据：挖掘需求、仔细聆听、问题引导、项目背景与零件用途。辅助阅读：[业务员操作清单](../../../crm/业务管理系统理解与团队落地手册.md)第 3.2 节。材料：[S3](../案例包.md)，暂不读取 S4 的澄清结果。\n\n## 1. 先把问题想清楚\n\n拿到询盘先做“原话整理”，暂时不急着答。把产品、数量、要求、时间分别圈出来，再保留“可能”“最好”这类词。它们决定了这句话是确定要求、期望还是预测。\n\n然后找三种问题：没说清的，例如只写“铝”；互相冲突的，例如二维和三维版本不同；容易误解的，例如“四周内收到”从何时起算、到哪里。不要重复问材料里已经明确写出的数量。\n\n优先问什么，取决于答案会影响哪个决定。可以用“为了……，请确认……”组织问题。如果自己还不知道某项技术信息会影响什么，先请技术人员说明，不假装已经懂得全部图纸。\n\n## 2. 案例拆解\n\nS3 已知本次先看 100 件，黑色阳极氧化，希望四周内收到，可能有后续 500 件。版本冲突、材料牌号与收货条件尚未明确。\n\n“尽快回复”可能指报价时间，不等于交货期限；“可能 500 件”不等于确定批量。应保留客户原话，并把这两类时间、两种数量分别记录。\n\n## 3. 照着做一次\n\n只读 S3，先不要看 S4。完成 **O11 需求摘要与三项补问**：\n\n1. 用不超过 120 字复述询盘，保留本次 100 件、未来可能 500 件和希望四周收到之间的区别。\n2. 列三个优先问题。每个写两句：“我准备这样问……”“得到答案后，可以帮助判断……”。\n3. 再记两项后续要向客户或技术方确认的内容，不必塞进第一条消息。\n4. 对照 S3 检查：是否把未知材料写成了具体牌号？是否自己选了图纸版本？有就退回待确认。\n\n用到真实工作时：先把客户原话留下，再发出简短补问。客户答“还没定”也有用，你就知道当前不能按确定条件往下传。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n摘要示例：“客户希望先按 100 件铝支架看价格，要求黑色阳极氧化，最好四周内收到，后续可能有 500 件。收到的二维为 A、三维为 B，当前版本和具体材料要求未明确。”\n\n前三问可以这样写：“为了按同一套资料评估，请确认以哪个版本为准”；“为了核实材料条件，请说明材料牌号和状态要求”；“为了判断时间是否可行，请明确期望收货日期、地点和起算条件”。\n\n后续可继续核实关键位置的技术及检验要求、表面处理验收细节。你选择不同的优先顺序也可以，但要说清当前为什么更需要那个答案；不要把 S4 已给出的 6061-T6 倒填回本课。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 摘要没有漏掉本次数量、后续预测与收货期望之间的区别，也没使用 S4 的后续答案。\n- [ ] 三个问题都写成客户或技术人员能回答的句子，并各自解释要解决什么判断。\n- [ ] 另列两项后续核实内容；版本冲突、模糊条件没有被自己补成答案。\n\n## 6. 下次不看笔记再试一次\n\n客户说“和上次一样，尽快做”。先复述你实际知道的内容，再提出三个补问，不把“上次”直接当成本次全部条件。\n\n[上一课](L10-用真实资料建立专业信任.md) · [目录](../README.md) · [下一课](L12-把询盘整理成可推进的项目.md)\n",
      "scope": "先把需求听准、问清重点，不要求一次问完所有条件或马上给出价格。",

      "content": "# L12 把询盘整理成可推进的项目\n\n模块：M3 沟通与需求｜建议：40 分钟｜前置：L09—L11｜交付物：O12 项目摘要与行动安排\n\n学习目标：面对几段聊天、几份资料时，能整理出“这是什么项目、现在卡在哪里、下一步找谁做什么”，让自己第二天能接着推进。\n\n本课做到这里就够了：先做一页能接着用的记录和三条行动，不要求填写完整系统字段，也不把询盘认定为订单。\n\n原图依据：了解项目背景、订单/项目真实性、行动计划与任务责任。辅助阅读：[信息采集问卷](../../../crm/真实客户信息采集问卷.md)、[个人客户推进卡](../../个人客户推进卡.md)。材料：[S2—S3](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n聊天记录保存了发生过什么，却不一定告诉你明天做什么。把它压成一页：客户与联系人、在评估的零件、已知数量和要求、收到的资料、最影响下一步的缺口。以后先看这一页，再按需要找原记录。\n\n动作要写成能开始做的句子。“跟进客户”可以改成“把版本冲突整理成一个问题，请林女士协调确认”。再写自己的计划时间，以及做完后留下什么，例如问题草稿、已发记录或收到的回复。\n\n把“我发出问题”和“对方给出答案”分开。你能安排前者，后者要如实记录。如果还在等，就给自己留一个检查时间和未回复时的下一步，而不是把计划日期当成对方承诺。\n\n## 2. 案例拆解\n\n可以记录“设备验证用铝支架，先评估 100 件；版本和材料等条件待确认；林女士负责采购沟通，技术问题由周工程师参与”。\n\n“继续跟进”不能指导明天做什么。改成“在自行计划的时间前发出版本确认问题；到检查时间核对回复，仍未得到答案则记录并决定下一步”。计划日期需标为你的安排，而非客户承诺。\n\n## 3. 照着做一次\n\n用 S2—S3 和 O11 完成 **O12 项目摘要与行动安排**：\n\n1. 写一页摘要：客户和角色、零件与本次评估数量、已收到的资料、已知要求、关键缺口、当前在做什么。未来 500 件单独写为预测。\n2. 列三条行动，每条写“找谁—具体问/做什么—自己计划何时做—做完后留下什么”。至少一条找客户，一条找工厂或技术人员。\n3. 给一条等待答复的行动补上：“到我的检查时间仍没回复，我先……”。\n4. 回看 O09—O11，找一处容易混淆的地方并写清：比如“已发案例”不等于“项目已获批准”。\n\n用到真实工作时：每天结束前更新这一页的下一步。第二天只看行动句，就应知道先打开哪份资料、联系谁、处理哪个问题。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n摘要中可以写：“A 的林女士就设备验证相关铝支架询价，先按 100 件评估，后续 500 件只是可能；版本和材料待确认，技术由周工程师参与。”资料依据指向 S2—S3，而不是把它写成订单。\n\n三条行动示例：向林女士提出版本确认问题；把已知要求交技术人员请其列资料缺口；到自己安排的检查时间查看回复、更新摘要。计划时间由自己设定并注明。记录“问题已发出”，仍可同时保留“版本尚未解决”。\n\n等不到答复时，可以先检查有没有遗漏附件说明、整理可独立处理的资料，再决定后续联系。不要把“明天收到客户答案”当成自己一定能完成的动作。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 只读这一页，就能说出评估什么、有哪些人参与、当前缺哪条重要信息；预测数量没有写成订单。\n- [ ] 三条行动都能直接开始做，自己的时间安排与客户或工厂的承诺分开。\n- [ ] 有未回复时的处理办法，并指出、修正了一处本模块容易混淆的判断。\n\n## 6. 下次不看笔记再试一次\n\n把“明天继续跟进”改成一条具体行动。再分别说出，什么记录能证明问题发出了，什么记录能证明问题已解决。\n\n[上一课](L11-倾听和补问真实需求.md) · [目录](../README.md) · [下一课](L13-核对图纸版本并交接技术问题.md)\n",

      "content": "# L13 核对图纸版本并交接技术问题\n\n模块：M4 技术与报价｜建议：35 分钟｜前置：L12｜交付物：O13 技术评估交接单\n\n学习目标：收到版本不一致的图纸时，能说清“现在按哪份评估、是谁确认的、还有哪几个问题要交给技术人员”。\n\n本课做到这里就够了：练会核对和交接资料，不要求自己判断所有尺寸、公差和加工可行性。\n\n原图依据：客户提供二维/三维资料、检查图纸、技术要求来源与专业反馈。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 6.3、6.5 节。材料：[S3—S4](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n准备把资料发给工厂前，先确认接手人能知道评估哪一份。列出文件标识、二维/三维类型、来源和版本；没有提供的信息就写未提供。遇到冲突，先向客户确认，不能只选看起来更新的那个文件。\n\n确认后的版本要连同确认依据一起记下。比如“客户在 S4 说明以 B 版二维、三维为准”。这样以后看到旧文件，还能分清它只是历史资料，还是当前评估依据。\n\n交接时再写清希望技术回答什么：哪里还缺要求、哪些地方需要澄清、下一步能评估到什么程度。检查时间可以先由自己安排；技术人员何时答复，要另外确认。\n\n## 2. 案例拆解\n\nS3 的 2D-A 与 3D-B 有冲突。到 S4，客户说明以 B 版二维与三维为准，版本问题有了新依据，但不代表技术条件全部解决。关键位置与表面处理仍有待澄清内容。\n\n交接应保留这次变化：“客户已确认 B 版；原 A 版不再作为当前评估基准；请按 B 版列出关键问题与评估条件。”仅写“按最新图做”缺少可核对的指向。\n\n## 3. 照着做一次\n\n先看 S3，再看 S4，完成 **O13 技术评估交接单**：\n\n1. 列出 S3 的版本冲突，随后记录 S4 对当前 B 版的确认。保留旧 A 版的历史状态，不把它继续列为当前基准。\n2. 写出已知要求与三个给技术人员的问题。问题要指向待评估内容；案例没有实际图纸，不补造尺寸或声称已检查附件。\n3. 写明交给哪个角色，希望他返回什么说明，自己准备何时检查进度。技术回复时间未约定就明确写未约定。\n4. 最后用一句话概括交接：“请按……资料，先确认……，并列出……”。\n\n用到真实工作时：把“按最新图做”改成能找到具体资料及确认记录的表达。技术人员看到后应能分清这是评估任务还是已确认的执行要求。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n可以记录：“S3 出现二维 A、三维 B 的冲突；S4 客户确认以 B 版二维、三维为准，旧 A 版保留为历史资料。”收到时间等未提供的信息，不补造。\n\n三个问题可分别问：B 版关键位置还需客户澄清什么；表面处理还缺哪些可供评估的验收信息；现有资料能评估到哪一步、还需补哪些输入。案例没有实际图纸，不能附上自行编造的尺寸。\n\n交接句可写：“请按客户在 S4 确认的 B 版资料继续评估，先列关键要求和表面处理的待澄清内容。”再补上技术接手角色和自己的检查安排；对方答复时间未约定就照实记录。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 能解释为何当前按 B 版评估，依据来自 S4 客户确认，而不是只看文件名。\n- [ ] 三个技术问题说清想得到什么答复，没有编造尺寸或替技术人员写结论。\n- [ ] 交接单有接手角色、期待的反馈和自己的检查安排，未约定的时间没有写成承诺。\n\n## 6. 下次不看笔记再试一次\n\n文件名出现“最新版”，客户却没说明修改内容。你会先核对哪两件事，再决定怎样交给工厂？\n\n[上一课](L12-把询盘整理成可推进的项目.md) · [目录](../README.md) · [下一课](L14-读懂材料工艺质量问题的用途.md)\n",

      "content": "# L14 读懂材料工艺质量问题的用途\n\n模块：M4 技术与报价｜建议：40 分钟｜前置：L13｜交付物：O14 技术问题与负责方清单\n\n学习目标：遇到材料、结构、工艺、表面处理和检验这些词时，能知道“这关系到哪个问题、该找谁确认、需要拿到怎样的答复”。\n\n本课做到这里就够了：先学会问对问题、传准要求，不要求背技术参数或替工程师设计加工方案。\n\n原图依据：材料、结构、表面处理、加工工艺及过往质量问题分析。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 6.5 节。材料：[S3—S4](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n你暂时看不懂所有专业词，也可以先把问题送到正确的人手里。关键是别只问“能不能做”，而要说清哪个要求已知、哪里还不清楚，以及需要对方给你什么说明。\n\n| 看见哪类内容 | 先问清什么 | 想拿到的答复 |\n| --- | --- | --- |\n| 材料 | 客户指定了什么，是否还有缺项 | 明确要求，或需客户补充的问题 |\n| 结构与关键要求 | 哪个位置影响装配或使用，依据在哪份资料 | 技术人员按版本指出具体问题 |\n| 工艺 | 工厂准备怎样满足要求，有无要讨论的方案 | 经评估的方案及所需条件 |\n| 表面处理 | 外观或功能要求、怎样验收是否清楚 | 客户要求与仍需澄清的内容 |\n| 检验与质量 | 按什么判断合格、需要什么记录 | 相关方确认的验收要求 |\n\n拿到“建议换材料”时，还要问建议理由、影响以及谁来批准。建议是供讨论的，不会因为业务员抄进表格就变成客户已经同意的要求。\n\n## 2. 案例拆解\n\nS4 的材料已经明确到 6061-T6，但本课不推导它的性能是否满足用途。关键位置与表面处理仍有问题，应请技术列清影响，并通过客户确认要求。\n\n如果工厂建议替代材料或结构，你需记录建议、依据、影响与需谁确认。客户尚未同意时，不能悄悄把建议变成新的技术要求。\n\n## 3. 照着做一次\n\n按 S3—S4 完成 **O14 技术问题与负责方清单**：\n\n1. 按上表五类各写一行：“本案例已知/未知什么—我怎样提问—问哪个角色—需要什么答复”。\n2. 材料行可从 S4 已确认的 6061-T6 写起；其余没有答案的事项就留作问题，不填写“符合”来凑齐。\n3. 选两行，用日常语言向自己解释：“如果不问清，会让下一步哪件事没法判断？”\n4. 改写“工厂有设备，所以这个项目一定能做”，说明还要取得谁的项目评估。\n\n用到真实工作时：把不懂的技术词连同客户原要求、文件位置交给技术人员，请他说明影响。先保证信息准确，再逐步积累专业知识。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n材料行可写：“客户已在 S4 指定 6061-T6；请技术人员结合 B 版要求确认还缺哪些信息。”结构行请技术人员指出关键位置要澄清什么，并通过客户确认；工艺行请工厂提出评估结论和所需条件。\n\n表面处理行问客户怎样验收，并请工厂说明哪些信息影响评估；检验行请相关技术或质量人员确认按什么要求检查、需要哪些记录。每行都以拿到可用答复为结束点，而不是以填满“符合”为结束点。\n\n例如，不知道怎样验收外观，就难以判断双方说的“黑色合格”是否是一回事。有设备也不能替代这些具体要求的评估。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 五类各有一个针对本案例的问题、负责角色和希望取得的答复。\n- [ ] 至少能用自己的话说明两类问题为什么要问，已知要求、工厂建议和待确认内容分得开。\n- [ ] 没有自行补技术参数或保证可加工；能指出应由谁结合具体要求作判断。\n\n## 6. 下次不看笔记再试一次\n\n客户说“按常规标准做”。写一句向客户澄清验收要求的话，再写一句请工厂说明需要哪些依据的话。\n\n[上一课](L13-核对图纸版本并交接技术问题.md) · [目录](../README.md) · [下一课](L15-确认数量交期包装和验收条件.md)\n",

      "content": "# L15 确认数量交期包装和验收条件\n\n模块：M4 技术与报价｜建议：35 分钟｜前置：L14｜交付物：O15 商务与交付条件清单\n\n学习目标：客户说“四周内收到”、工厂说“15 个工作日”时，能发现两者还不能直接画等号，并列出答复前要问清的条件。\n\n本课做到这里就够了：把数量、生产、收货、包装运输、验收和付款分开记清；条件不足时先说明缺什么。\n\n原图依据：数量、交期、包装运输、验收一致性与报价条件。辅助阅读：[业务员操作清单](../../../crm/业务管理系统理解与团队落地手册.md)第 3.2、4.2 节。材料：[S3—S4](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n数量先分清本次正在评估多少、后续只是可能多少。本案例的 100 件是当前评估数量，500 件是预测，两者都不能仅凭询价认定已正式下单。没拿到新的数量方案，也不能自行套一个折扣。\n\n交期先看起点和终点：“条件齐备后生产完成”和“客户收到货”中间还隔着确认、排产和运输安排。工作日、自然日也要分清。没有真实日期和所需条件时，先问清楚，再算是否赶得上。\n\n包装运输、验收、付款也会影响方案。每项用“知道什么—缺什么—问谁”记录即可。看到一笔包装费用，不等于包装方式、运输责任和验收要求都已经约定。\n\n## 2. 案例拆解\n\n本次评估数量是 100 件；500 件是预测，工厂未报价。工厂说“条件齐备后暂估 15 个工作日”，客户说“四周内收到”，二者还不能直接判定兼容。\n\n需确认条件齐备的含义、排产、实际收货日期与地点、运输时间及验收条件。不要为了先回答客户而将这些缺口合成一个确定交期。\n\n## 3. 照着做一次\n\n用 S3—S4 完成 **O15 商务与交付条件清单**：\n\n1. 分数量、生产、收货、包装运输、验收、付款六行，填已知内容、待确认问题、要找谁、答案会影响什么。\n2. 把“15 个工作日”和“四周内收到”放在一起，至少指出三处还不能直接比较的地方。\n3. 给客户写三句话：“已了解你希望……”“目前还需确认……”“我准备先……再反馈……”。保留等待工厂与客户确认的事项。\n\n用到真实工作时：收到“交期多少天”这类问题，先确定对方问的是生产完成还是收到货；不要把工厂的一句估计直接转成自己的到货承诺。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n数量写本次评估 100、未来预测 500；生产写条件齐备后暂估 15 个工作日；收货仍缺准确日期、地点及起算说明。包装有费用数字，但具体方式和运输仍需确认；付款、验收也未完整约定。\n\n至少有三处不能直接比较：生产完成和收到货的终点不同；工作日与自然时间单位不同；起算条件、排产或运输时间没有明确。此时不能计算一个保证到货日。\n\n客户说明可写：“已了解您希望四周内收到。目前还需明确收货日期地点，并核对工厂起算条件、排产和运输安排。我会先协调这些信息，再反馈可确认的交付方案。”\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 六类条件都有记录，100 件写为本次评估、500 件写为预测，没有自定批量价格。\n- [ ] 能指出生产与收货的终点、工作日与自然日、起算或运输等至少三处待澄清内容。\n- [ ] 客户说明说清缺什么、准备找谁确认，没有在资料不足时保证具体到货日。\n\n## 6. 下次不看笔记再试一次\n\n有人只发来“交期 15 天”。你先问哪三件事，才能知道它是否满足客户要的时间？\n\n[上一课](L14-读懂材料工艺质量问题的用途.md) · [目录](../README.md) · [下一课](L16-形成并检查一份报价方案.md)\n",

      "content": "# L16 形成并检查一份报价方案\n\n模块：M4 技术与报价｜建议：45 分钟｜前置：L13—L15｜交付物：O16 报价核对稿\n\n学习目标：准备把一份报价发给客户前，能查出“金额有没有算错、费用有没有重复或漏说、哪些条件还不能承诺”。\n\n本课做到这里就够了：完成一次报价检查，并把能算出的金额与仍待确认的条件分开；这次练习稿不当作正式报价发送。\n\n原图依据：报价条件、成本分析、报价明细、附加信息与反馈。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 6.6 节。材料：[S4](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n检查报价时分三遍。第一遍看对象：什么零件、哪个版本、多少件、什么币种。第二遍算钱：单价乘数量，单列费用有没有重复，未计的费用有没有说清。第三遍看条件：技术、生产与收货、付款、验收等是否已有依据。\n\n把内部测算和给客户看的价格分开写。知道内部有准备费，不代表对外需要再单列一次；如果单价已经包含它，又加一遍就重复了。内部已列成本与客户金额的差额，也未必就是最终能留下的钱。\n\n金额正确不等于可以正式承诺。技术尚未确认、运费未计、交期仍是估计时，要在检查稿里保留这些状态，并明确需要找谁补齐。\n\n## 2. 案例拆解\n\nS4 内部已列费用：38 × 100 + 600 + 200 = **4,600 元**。客户方案草稿：48 × 100 + 200 = **5,000 元**。单价 48 已纳入准备等因素，不能又另加 600 元变成 5,600 元。\n\n两者差额是 400 元，但尚有未计费用和条件，不能直接称为最终净利润。工厂也未提供 500 件方案，因此不能把同一单价自动用于未来数量。\n\n## 3. 照着做一次\n\n用 S4 和 O13—O15 完成 **O16 报价核对稿**：\n\n1. 分别写内部已列费用算式、客户方案算式。解释为什么客户方案不应再加一次 600 元准备费。\n2. 给客户方案写清：零件、B 版、100 件、人民币单价和合计、已列包装费、运费和税费未计。\n3. 列至少五项待确认条件，每项标要找谁、影响报价里的哪句话。回看 O13—O15，把技术和交付的未解决问题一起带过来。\n4. 写一句检查结论：“算术上……；要作为正式报价，还需……”。再解释两组金额的差额为什么不能直接叫净利润。\n\n用到真实工作时：按这三遍顺序检查每次报价。数量或图纸变了，回到条件重新核对，不只改数字和文件名。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n两组算式是 38 × 100 + 600 + 200 = 4,600 元，以及 48 × 100 + 200 = 5,000 元。客户单价已经纳入准备等因素，再加 600 元会重复。400 元差额尚未扣除未列费用，不能当最终净利润。\n\n待确认清单可写：关键位置和加工条件找客户技术人员及工厂；表面处理验收找客户相关人员；生产周期和排产找工厂；收货地点与要求找客户；运输、税费、付款和有效期找相应负责方。谁尚未明确，就先列待确认角色，不能填默认值。\n\n检查结论示例：“给定算术得到 5,000 元，运费、税费未计。技术要求、最终交付、付款和验收等还需确认，目前作为内部核对及条件讨论稿。”B 版和 100 件是这个算式对应的条件，变化后要重核。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 写对 4,600 元与 5,000 元两组算式，能指出重复加 600 元的问题，并解释 400 元差额的局限。\n- [ ] 客户方案的对象和费用范围清楚，至少五项待确认条件分别写了确认方和影响。\n- [ ] 把 O13—O15 中未解决的技术、交付问题带入检查结论，没有将讨论稿写成已批准正式报价。\n\n## 6. 下次不看笔记再试一次\n\n客户把数量改为 500 件，问能否沿用原单价。你在回答前要重新核对哪三类信息？\n\n[上一课](L15-确认数量交期包装和验收条件.md) · [目录](../README.md) · [下一课](L17-把技术结论反馈给客户.md)\n",

      "content": "# L17 把技术结论反馈给客户\n\n模块：M5 推进与衔接｜建议：35 分钟｜前置：L16｜交付物：O17 技术反馈与变更记录\n\n学习目标：工厂说某处要改、客户又发来新图时，能讲清“问题是什么、还缺什么说明、谁需要确认、哪些旧结论要重新检查”。\n\n本课做到这里就够了：先把技术意见整理成客户能回应的话，保留未确认的状态；具体修改方案由技术人员提供。\n\n原图依据：给客户的报价反馈、制造可行性分析、材料/结构/公差建议。辅助阅读：[原图解读](../../PDF原图解读与文档校准.md)的三种反馈方向。材料：[S4、S6](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n工厂发来“这里建议改一下”，先别只转发这句话。向技术人员确认：指哪一版的哪个位置，原要求有什么问题，建议是什么，可能影响什么。信息还没齐，就先说明正在补充，而不是自己补一个尺寸让消息看起来完整。\n\n给客户的反馈要让他知道需要回答什么。如果已有具体建议，请他确认要求或方案；如果只有方向，没有方案细节，先补技术说明。收到消息、愿意讨论、正式确认采用，是不同的状态。\n\n客户发了新版，也要核对它改了哪里、是否解决原问题、价格和交期会不会受影响。把旧版、工厂建议、客户回复、新版分别留下，未来才能解释为什么改、按什么继续评估。\n\n## 2. 案例拆解\n\nS6 只有“可提出另一种结构方案供评估”，没有具体替代尺寸。你应请技术补齐可供客户判断的说明，不能自己编一个数值发给客户。\n\n客户又发来 C 版，需要与前一版核对变化。即使客户说“可以先试”，也不能推定工厂已确认 C 版可行，或原 B 版价格仍有效。\n\n## 3. 照着做一次\n\n用 S4、S6 完成 **O17 技术反馈与变更记录**：\n\n1. 先列出技术说明里还缺什么，例如具体问题位置、建议细节和影响。案例没提供的尺寸保持空缺。\n2. 写一条给客户的反馈草稿，说明目前确认到哪一步、正在补充什么、希望对方确认什么。不要提不存在的方案附件。\n3. 用五行记下：原 B 版依据、工厂建议、仍缺的说明、客户实际回复、新 C 版待重评事项。\n4. 给 C 版写三个检查方向：技术、价格、交期分别需要谁重新确认。不要把“可以先试”改写为“全部批准”。\n\n用到真实工作时：每次改图都留下变更来由和确认状态。你自己也应能分清，正在讨论的建议和已经确定采用的要求是哪一项。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n还需请技术补齐具体问题位置、建议细节及影响。客户反馈草稿可写：“B 版有一项要求仍需澄清，我们正请技术完善具体说明及方案影响；希望先与您确认相关要求，再讨论是否采用替代方案。”\n\n收到 C 版后另记：“新 C 版已收到，和 B 版的差异待核实，尚未完成技术、价格和交期重评。”不要把前面的工厂建议与后来 C 版自动认作同一项已获批准的修改。\n\n可以先协调技术核对差异，报价人员根据确定要求重算，工厂再核对排产与生产时间。客户“可以先试”仍不能替代这些结论。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 能说出技术反馈还缺哪些说明，草稿没有自行补造尺寸、结论或方案附件。\n- [ ] 记录里分得清 B 版、工厂建议、客户回复和 C 版，未把收到或讨论写成已批准。\n- [ ] C 版对技术、价格、交期的影响都有重新确认安排。\n\n## 6. 下次不看笔记再试一次\n\n客户回“收到，我看看”。你现在可以更新什么状态，还不能更新成什么状态？接下来保留或确认哪条记录？\n\n[上一课](L16-形成并检查一份报价方案.md) · [目录](../README.md) · [下一课](L18-安排报价后的有效跟进.md)\n",

      "content": "# L18 安排报价后的有效跟进\n\n模块：M5 推进与衔接｜建议：35 分钟｜前置：L17｜交付物：O18 两种状态的跟进方案\n\n学习目标：报价发出后暂时没有结果时，能判断“现在值得联系吗、这次要确认什么、对方回复或没回复后分别怎么做”。\n\n本课做到这里就够了：为两种情况各准备一次有目的的跟进，不要求靠固定天数催出订单。\n\n原图依据：客户沟通、购买信号、反馈与行动计划。辅助阅读：[业务员操作清单](../../../crm/业务管理系统理解与团队落地手册.md)第 3.4 节。材料：[S5](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n准备跟进前，先看最后一条已知信息：对方收到资料了吗？有没有说什么时候评估？你有没有答应补什么？这些问题决定下一条消息该问什么，也决定现在是否适合联系。\n\n已约定评估时间时，可以围绕评估所需资料和后续安排准备；还不知道是否收到时，先确认接收。两种情况都写成“考虑得怎样了”，容易让消息与客户当前任务脱节。\n\n你的检查时间是自己的安排，客户的回复时间要有实际约定。“没有回”目前只是一项事实，不能直接写成嫌贵、没兴趣或丢单。记下状态，再决定补充、等待、延后或暂停，并尊重对方表达的联系偏好。\n\n## 2. 案例拆解\n\n情形一：客户说下周二内部评估。周二前可确认是否需要补充资料；评估后按实际约定询问尚存问题。自己的检查日期不能写成客户承诺一定反馈的日期。\n\n情形二：方案发出后没有确认收到，也没有评估时间。可以先核实资料是否送达及是否需要补充内容，再判断下一步，而不是先要求给下单结论。\n\n## 3. 照着做一次\n\n用 S5 的独立情形和本课例子完成 **O18 两种状态的跟进方案**：\n\n1. 分别写“客户说下周二评估”“未确认收到、也没约评估时间”的已知事实和最想确认的问题。\n2. 每种写一条跟进草稿，再写何时考虑联系、为什么。练习自定的检查时间注明“我的计划”，不写成对方承诺。\n3. 对每种情况补三种后续：客户提出具体问题、客户说延期、仍无回复。每种各写一个下一步，允许选择等待或暂停。\n4. 读两条草稿：如果只换个日期就完全一样，检查是否真的围绕不同的问题。\n\n用到真实工作时：打开上一条回复，先补全“我这次联系是为了确认……”。知道目的后，再决定发不发、何时发、说什么。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n已约定评估的草稿可围绕：“为配合下周二的评估，想确认是否还需要补充相关资料。”是否此时联系，要结合已有安排和材料状态；如果已经备齐，也可以先等待到合适的检查时间。\n\n未确认收到时可写：“想确认前次资料是否送达；如需补充便于评估的内容，请告知。”此时先解决接收问题，没有依据就不问“为什么还不下单”。\n\n后续有具体问题，就整理并答复；明确延期，就更新安排；仍没回复，就保留未知原因，再决定等待、适当确认或暂停。每种选择写明理由，自己的检查日不要写成对方承诺日。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 两种情形的跟进目的和消息不同，分别针对评估安排和是否收到。\n- [ ] 时间安排有理由，自己的检查计划与客户实际约定分开，没有提前判定评估结果。\n- [ ] 两种情形都写了三种回复状态的下一步；未回复时没有编造客户动机。\n\n## 6. 下次不看笔记再试一次\n\n客户已说下周二评估，今天是周一。你是先准备补充材料、现在联系还是等待？选一个，并说明什么信息会让你改变安排。\n\n[上一课](L17-把技术结论反馈给客户.md) · [目录](../README.md) · [下一课](L19-处理价格异议与有条件谈判.md)\n",

      "content": "# L19 处理价格异议与有条件谈判\n\n模块：M5 推进与衔接｜建议：40 分钟｜前置：L18｜交付物：O19 异议分析与谈判准备\n\n学习目标：客户说“你太贵了”时，能先问清他在比较什么，再说明哪些调整可以请内部评估，哪些价格或交期还不能答应。\n\n本课做到这里就够了：先写好核实问题和回应草稿，不要求当场降价、送样或谈成订单。\n\n原图依据：谈判、价值销售、报价策略及促销构思。辅助阅读：[速查表](../../../crm/三层理解与运用速查表.md)第 7 节。材料：[S4—S5](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n先把“贵”的原话记下，再看对方比较的是不是同一件事：相同图纸、材料要求、数量、费用范围和交期吗？客户可能最在意总支出，也可能最在意何时收到，先问清才能决定查什么。\n\n准备两个可以讨论的方向，并写明要找谁评估、需要什么条件。比如按真实数量重新测算，或重新核对交付安排。讨论方向并不代表你已经有权给折扣，也不能靠悄悄改要求来降低数字。\n\n免费样品也是一个带成本和条件的方案。先弄清样品要验证什么、谁承担费用、怎样验收、何时交付，再判断是否适合当前合作。原图列出促销办法，是供分析的选择。\n\n## 2. 案例拆解\n\n客户说“比另一家大约高 8%”，但比较口径未知。先了解差异与最关注的问题，再准备方案。客户还提出 20 个自然日内收到，时间要求可能同样关键。\n\n若机械把 5,000 元降 8%，会得到 4,600 元，恰等于本例已列内部费用，尚未覆盖未列费用。这个算式只说明盲目让价的问题，不能据此反推出竞争对手价格，因为比较基数不同且原话只是“大约”。\n\n## 3. 照着做一次\n\n用 S4—S5 完成 **O19 异议分析与谈判准备**：\n\n1. 抄下客户关于价格和 20 个自然日收货的原话，列三个需要核对的比较问题。\n2. 写两个可请内部评估的调整方向，每个注明找谁、需要什么条件；再写目前不能直接答应的内容。\n3. 算 5,000 元降低 8% 后是多少，解释它与已列内部费用的关系，以及为什么不能据此认定竞争对手价格。\n4. 写一条回应草稿，先承接关注点，再提出核实安排。最后为“免费样品”列至少三类讨论前需要确认的条件。\n\n用到真实工作时：先弄清客户想解决的具体问题，再回内部核算。未经确认的降价或到货日，不放进答复当成已经可执行的方案。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n三个比较问题可围绕：是否为同一版本和数量；包装、运输等费用范围是否一致；技术要求与收货条件是否相同。先理解客户最想解决的差异，不要求对方提供他人的保密报价文件。\n\n调整方向可请工厂按确认数量重测，或核对交付安排是否有其他可行选择。回应可写：“了解您同时关注价格和 20 个自然日收货。想先确认比较范围及收货要求，我会据此复核费用和交付条件，再反馈可讨论的方案。”\n\n5,000 × 92% = 4,600 元，只说明机械降价后等于本例已列费用，尚有未列支出；不能用这个数认定对手价格。免费样品应核实成本承担、样品要求与验收、运输时间等条件，不能先承诺免费再倒推。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 三个比较问题能帮助核对相同条件，回应同时关注价格和收货要求。\n- [ ] 两个调整方向各有确认方及所需条件，没有擅自承诺降价、改技术要求或 20 天到货。\n- [ ] 算出降价后 4,600 元并解释其局限；免费样品至少列出三类需要核实的条件。\n\n## 6. 下次不看笔记再试一次\n\n两个客户都说贵：一个没看见单列费用，一个急着赶项目节点。你分别先确认什么？为什么下一步可能不同？\n\n[上一课](L18-安排报价后的有效跟进.md) · [目录](../README.md) · [下一课](L20-衔接样品和订单前的确认.md)\n",

      "content": "# L20 衔接样品和订单前的确认\n\n模块：M5 推进与衔接｜建议：40 分钟｜前置：L17—L19｜交付物：O20 试单交接与待确认事项\n\n学习目标：客户说“先做一批试试”时，能分清哪些只是意向、哪些已经确认，并列出交给工厂前还缺的条件。\n\n本课做到这里就够了：先完成一份清楚的试单准备记录；当前练习条件不足，不把记录当成开工指令。\n\n原图依据：购买承诺、图纸要求、数量、交期、验收与报价条件。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 6.6—6.8 节。材料：[S6](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n听到“可以先试”时，先保留这句话表达的意向，再核对技术、数量、价格和交付条件确认到哪一步。愿意尝试，不会自动补齐新图纸评估、付款和验收要求。\n\n试单还要知道准备验证什么：装配、功能、外观，还是别的内容？由谁判断、按什么要求给反馈？不知道就写成问题。试单之后可能有下一批，也要等新的确认，不能把预测量算作现成订单。\n\n把有关条件放到同一页，检查是不是同一个版本、同一次数量和同一套费用范围。旧报价与新图纸混在一起时，先写清哪些内容要重评，再安排确认。\n\n## 2. 案例拆解\n\nS6 中客户表示 100 件可先试，却要求按 C 版重新确认。C 版变化未核实，技术、价格、交期和部分商务条件未定，因此当前可以做准备与澄清，不能把 B 版报价和 C 版图纸混合作为明确执行依据。\n\n对工厂的交接应清楚标出“待评估/待确认”，不要只转发一句“客户同意了，开工”。\n\n## 3. 照着做一次\n\n用 S6 和 O17—O19 完成 **O20 试单交接与待确认事项**：\n\n1. 一页写清：项目与试单目的、C 版资料、100 件意向、技术评估、价格范围、付款、生产与收货、包装运输、验收和联系人。\n2. 每项标“已知什么—还缺什么—找谁确认”。B 版报价若被提及，注明不能直接视为 C 版价格。\n3. 列当前可安排的三件事，再列仍不能认定已完成的两件事。\n4. 对照 O17—O19，检查变更、20 个自然日的期望和价格反馈有没有被漏掉或误写成已同意的条件。\n\n用到真实工作时：交给工厂前先读一遍这一页，确认接手人看得出哪些是评估任务、哪些有明确确认依据。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n记录可写：“客户有 100 件试单意向，要求按 C 版重新确认；装配验证用途已知，具体验收仍待确认；C 版技术、价格与交期尚未完成重评。”数量意向和执行确认分开写。\n\n当前可安排三件事：核对 C/B 差异；请工厂重评技术与费用时间；向客户澄清付款、验收等未决条件。仍不能认定 C 版技术已获接受，也不能认定原价格和交期继续成立。\n\n回看前课，客户提出过的价格比较和 20 个自然日收货仍只是需要处理的信息。如果后续改变，应记录新的确认依据，不能无声地变成工厂承诺。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 能把试单意向、技术评估、商务确认分别说明，预测 500 件没有变成已确认数量。\n- [ ] 交接页的版本与价格、交期状态对应，待确认事项和负责角色看得见。\n- [ ] 列出三件可做和两件未完成的事，保留本模块变更与谈判信息，没有下未经确认的生产指令。\n\n## 6. 下次不看笔记再试一次\n\n客户说“和上次一样，再做一批”。除数量外，你还会核对哪三类内容，才能知道旧条件是否适用？\n\n[上一课](L19-处理价格异议与有条件谈判.md) · [目录](../README.md) · [下一课](L21-从成单丢单中分析原因.md)\n",

      "content": "# L21 从成单丢单中分析原因\n\n模块：M6 复盘与运用｜建议：35 分钟｜前置：L20｜交付物：O21 结果复盘\n\n学习目标：一单成交或没成交后，能说出“结果有什么证据、原因知道多少、下次具体保留或改变哪一个动作”。\n\n本课做到这里就够了：先从案例里找出一条能改进自己工作的办法，不要求凭一单总结所有客户的规律。\n\n原图依据：报价结果、成单/丢单、GRAI 与 KISS 复盘。辅助阅读：[案例填写示例](../../../crm/真实客户案例填写示例.md)第 9—10 节。材料：[S7-A、S7-B](../案例包.md)，两种结局分别分析。\n\n## 1. 先把问题想清楚\n\n先写“本来想做到什么”和“后来实际怎样”，再讨论原因。客户明确说了什么、记录中发生了什么、你猜测什么，分开写。这样能避免把一个完整故事误当成完整证据。\n\n成交时不必把一切归功于自己的某句话；丢单时也不必立刻认定是价格或个人能力。客户给出的理由可以作为重要信息，但没有解释的部分仍要保留未知。\n\n最后只选一个值得保留的动作、一个值得改进的动作。把“提高专业度”换成“下次客户说四周收货时，先问具体日期、地点和起算条件”。做完后能看见是否更早发现时间冲突，比写一句口号有用。\n\n## 2. 案例拆解\n\nS7-A 客户表示版本与问题说明清楚，是愿意试单的重要原因。这支持保留清晰反馈的做法，但不证明价格、其他供应商或关系因素完全无关。\n\nS7-B 客户说明本地供应方交付更符合计划，记录又显示早期没有问清时间。可以总结“下次更早确认刚性收货要求”，不能因此断言所有本地供应商都更快。\n\n## 3. 照着做一次\n\n把 S7-A、S7-B 当作两个不同结局，分别完成 **O21 结果复盘**：\n\n1. 各写原目标、实际结果，以及支持结果的客户回复或记录。\n2. 各写一句“目前有依据的原因是……”和一句“仍不知道的是……”，不把两种结局拼在一起。\n3. 各选一个保留动作、一个改进动作。每个补全：“下次遇到……时，我会……；做完后检查……”。\n4. 把“客户只看价格”“我讲清版本所以一定成交”等概括改成与给定证据相符的话。\n\n用到真实工作时：即使客户没说明原因，也能先检查自己的记录、答复和遗漏。暂时没有真实成单或丢单，就用这两个模拟分支练习。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\nA 结局有 100 件试单和客户关于版本说明的反馈，可以支持“清楚解释问题是客户提到的重要原因”。保留动作可写：“下次改图时，继续按版本列明问题和确认状态。”其他因素影响多大，仍不知道。\n\nB 结局的依据是客户表示本地供应方交付更符合计划，以及自己早期未问清时间的记录。改进动作可写：“下次客户提出收货期限时，先明确日期、地点和起算条件；详细报价前检查是否已有无法满足的时间要求。”\n\n每个分支还需按自己的分析补上另一项保留或改进动作。检查办法可以是下次记录是否更早暴露时间冲突，不必承诺这种改进一定让客户下单。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 两个结局分别记录了目标和结果依据，没有合并成同一项目经历。\n- [ ] 每个原因判断都能指向客户说法或过程记录，并留下一项仍不知道的内容。\n- [ ] 保留和改进动作都写清何时使用、具体做什么、做完检查什么，没有用空泛口号代替。\n\n## 6. 下次不看笔记再试一次\n\n客户只说“暂时不做了”，没解释原因。你可以复查自己的哪两件事？哪些客户动机现在还不能写成结论？\n\n[上一课](L20-衔接样品和订单前的确认.md) · [目录](../README.md) · [下一课](L22-把资料和经验变成可复用知识.md)\n",

      "content": "# L22 把资料和经验变成可复用知识\n\n模块：M6 复盘与运用｜建议：30 分钟｜前置：L21｜交付物：O22 一张知识卡\n\n学习目标：学到一个方法或经历一次问题后，能留下一张以后找得到、看得懂、知道什么时候用的笔记。\n\n本课做到这里就够了：先做一张能指导下一次动作的知识卡，不要求把所有资料重新整理成大型知识库。\n\n原图依据：DIKW 知识管理、原始数据、信息、知识与判断。辅助阅读：[个人自测](../../../crm/个人理解练习与掌握自测.md)第 5 节。材料：自己的 O21 与[案例包 S7](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n一份资料被收藏了，不代表下次会用。试着把一条经验写成：“遇到……时，先做……，因为这次……”。再保留原记录位置，方便回来核对它是怎样得出的。\n\n原图的 DIKW 可以理解成四步：留下原始记录，整理发生的情境，提出经验，再判断新情境是否适用。先会做这四件事，比先背字母更有帮助。\n\n给经验再加一句“这个办法不能保证什么”或“什么时候不用重复做”。例如问清收货日期能帮助发现冲突，却不能解决所有产能问题。以后发现不适用，就补上新条件，别把一次经历写成普遍规则。\n\n## 2. 案例拆解\n\n原始记录：“客户希望四周内收到”；整理信息：“没有明确起算点、地点及刚性程度”；经验假设：“早期区分生产与收货时间，有助于更早发现安排冲突”。\n\n适用边界：它帮助澄清信息，但不保证解决产能或运输限制，也不保证取得订单。下一次通过是否更早识别冲突来检验。\n\n## 3. 照着做一次\n\n从 O21 选一个动作，完成 **O22 一张知识卡**：\n\n1. 标题写成以后会搜索的问题，例如“客户说四周收货，先确认什么”。\n2. 按七行写：原始证据及位置、当时情境、得到的经验、何时可用、不能保证什么、下次具体动作、怎么检查是否有帮助。\n3. 再写一个不能直接照搬的情况，并说明应该怎样调整。\n4. 合上原案例，只看知识卡，检查自己是否能说出下一次具体要问的话；若仍只有“重视交期”，继续改细。\n\n用到真实工作时：先从最常忘的一件事开始。以后遇到相似情况，打开这一张就能用，同时仍能回到原记录核对。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n知识卡标题：“客户说四周内收到，先问什么。”原始依据指向 S3 的原话和 S7-B 的复盘；当时缺少起算点和刚性程度等信息。\n\n经验可写：“收货表达模糊时，先确认日期、地点、起算条件，再与生产安排比较。”下次触发时直接使用这些问题，检查是否在详细报价前发现时间冲突。局限是澄清信息不等于解决产能或运输问题。\n\n不适合原样照搬的情况：客户已经把这些条件写清。此时先核对和评估能否满足，而不是把同样问题再问一遍。只有一个案例支持时，可标为“待验证经验”。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 笔记能找到原始案例依据，并说清当时为什么产生这条经验。\n- [ ] 写了适用情况、局限和一个不宜照搬的情形，没有把一次经历变成普遍定律。\n- [ ] 只看知识卡就能说出下一次具体动作，并知道怎样检查它是否有帮助。\n\n## 6. 下次不看笔记再试一次\n\n客户已经明确给出收货日期、地点和起算条件，你还照抄原卡的所有补问吗？说出保留哪一步、调整哪一步。\n\n[上一课](L21-从成单丢单中分析原因.md) · [目录](../README.md) · [下一课](L23-安排个人目标与每日动作.md)\n",

      "content": "# L23 安排个人目标与每日动作\n\n模块：M6 复盘与运用｜建议：35 分钟｜前置：L22｜交付物：O23 一周个人工作计划\n\n学习目标：一天事情很多时，能排出“今天先做哪几件、每件做到什么算完成、等别人回复时还能做什么”。\n\n本课做到这里就够了：先排一份做得完的日计划和三个周目标，不以客户必须回复或下单作为自己当天完成的标准。\n\n原图依据：个人目标、行动计划、任务分解、时间安排和复盘。辅助阅读：[每周业务检查表](../../../crm/每周业务检查表.md)第 3、5 节，改为个人自问使用。\n\n## 1. 先把问题想清楚\n\n先把任务改写成有结束点的动作。“找客户”可写成“完成一家企业的事实、匹配理由和待查问题”；“学习资料”可写成“做完 L01 的九句话”。这样你知道什么时候算完成，也更容易估计所需时间。\n\n再区分自己能安排的工作与需要等人的结果。你可以准备问题、发出确认、查看回复，但不能让客户按你的日程下单。等待时保留检查时间，同时准备一项不依赖这条回复的工作。\n\n排顺序时先看已作出的承诺和当前卡点，再给持续开发、学习留时间。某件事做起来舒服，不代表它最值得先做；已经没有时间的事，就说明推迟什么，而不是压缩估计假装都能完成。\n\n## 2. 案例拆解\n\n新增独立模拟情境：今天可用 180 分钟，有四项任务。已答应客户今天整理技术问题约需 40 分钟；联系工厂核实约需 30 分钟；筛选新线索约需 70 分钟；美化公司介绍约需 120 分钟。这些仅是本题给定估计。\n\n总量超过可用时间。可以优先履行承诺和核实卡点，再安排线索任务或其一部分，给信息变化留余地；美化资料若不影响当日任务，可另排。不能通过把任务时间写短来假装全部能完成。\n\n## 3. 照着做一次\n\n完成 **O23 一周个人工作计划**：\n\n1. 按你当前“消化资料、寻找客户”的阶段写三个周目标，每个配具体任务、为什么做、计划时间、是否要等人、完成后留下什么。数量由自己设定，注明是个人计划。\n2. 另做下面这个有在谈项目的独立练习：一天只有 180 分钟，按本课案例的 40、30、70、120 分钟四项任务排一次顺序，写出延后哪项及理由。不要把这组情境当成你已经有的真实客户。\n3. 为“工厂到检查时间还没回复”写一个等待处理动作和一个可先做的替代任务。\n4. 检查计划里有没有“客户必须回”“今天必须成交”，改成自己能完成的动作与独立记录的结果。\n\n用到真实工作时：每天先选出最需要完成的几件事，结束时看具体产物和卡点。当前可把本课程的一课练习本身安排成一件任务。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n当前阶段的周目标可以是：完成一课并改好作业；用两家模拟企业练匹配判断；从自己的资料中列出三个供应能力待核实问题。数量和时间是练习安排，可以按实际精力调整。每个目标都留下具体文字，不要求本周一定得到客户回复。\n\n180 分钟独立练习中，可安排 40 分钟完成已承诺的技术问题整理、30 分钟联系工厂核实、70 分钟筛选线索，留下 40 分钟处理回复或变化；120 分钟的资料美化另排。不同顺序也可以，但要说明依赖和承诺如何处理。\n\n工厂没回复时，记录仍缺的结论，按已有约定向客户说明当前情况，再做不依赖该结论的线索或资料任务。不能把“联系工厂核实用了 30 分钟”写成“工厂已给出结论”。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 三个周目标贴合当前学习和找客户阶段，每个都能说清具体任务、安排和完成后留下什么。\n- [ ] 独立情境中的任务总时间不超过 180 分钟，写明推迟哪项、为什么，没有随意缩短题目估时。\n- [ ] 对未回复有检查、沟通或调整动作，也有能先做的替代任务，没有把他人的结果当作自己可保证的完成项。\n\n## 6. 下次不看笔记再试一次\n\n今天没收到任何客户回复，但你完成了调查和补问草稿。哪些工作已经完成，哪些结果仍在等待，明天先检查什么？\n\n[上一课](L22-把资料和经验变成可复用知识.md) · [目录](../README.md) · [下一课](L24-完成一次独立业务分析.md)\n",

      "content": "# L24 完成一次独立业务分析\n\n模块：M6 复盘与运用｜建议：90 分钟｜前置：L01—L23｜交付物：O24 综合业务分析包\n\n学习目标：遇到一个没练过的客户和询盘时，能独立说清“值不值得继续了解、先问什么、找谁评估、现在怎么回复、下一步做什么”；条件变化后能改对自己的记录。\n\n本课做到这里就够了：完成一份可解释的模拟处理稿，并找出、改正自己的遗漏；不要求给条件不足的项目硬报价格或作交期承诺。\n\n依据：综合运用原图的匹配、角色、需求、技术协同、报价条件、反馈与复盘。材料：[案例包 S8](../案例包.md)。本课不照搬 A 客户的结论；先独立作答，再看参考。\n\n## 1. 先把自己放进这个场景\n\n今天收到一条陌生询盘：客户要不锈钢外壳，希望月底收到，还要求今天给价格。你目前掌握的只是铝件资源，条件也不完整。现在先决定怎样处理这条消息，再逐步检查自己有没有遗漏。\n\n只读案例包 S8，已知供应条件回看 S0。先合上本课参考，用前面练过的方法动手。遇到不知道的地方，写清缺什么、找谁问；不需要为了让稿子完整而猜出一个答案。\n\n七项练习可以连续写在一份文档里，不需要七张表。每项都围绕一个实际问题，最后检查它们有没有互相矛盾。\n\n## 2. 照着处理这条询盘\n\n把处理稿存为 **O24 综合业务分析包**。建议按顺序回答以下七个问题；前五项完成后才打开变化卡。\n\n1. **这家公司值得继续了解吗？约 10 分钟。** 写“我看到……，所以值得核实……”。接着指出我方哪项资源还没证据支持。既不要见到询盘就认定能做，也不要因为未知就直接放弃。\n2. **不同问题分别找谁？约 5 分钟。** 写清许先生、陈女士和质量角色目前负责什么；列出尚不清楚由谁确认的决定。\n3. **先问什么、交给工厂什么？约 15 分钟。** 先复述已知要求，再选三个优先补问，各说明用途。最后写给工厂的评估任务，标出当前 R1 资料及信息缺口。\n4. **现在怎样回复客户？约 10 分钟。** 写一条草稿，说清已收到什么、为什么还需确认、自己准备怎么推进。说明今天能先做的事，不能凭空补一个价格或保证月底到货。\n5. **这份金额有没有问题？约 10 分钟。** 单独检查 S8 最后一段的算术材料，写正确合计、错误位置和未计费用，再说明它为什么不能用来报这个不锈钢项目。\n6. **收到变化后改哪里？约 15 分钟。** 打开变化卡，至少找出四处需要更新或重评的内容。保留原判断，在旁边写新信息及影响，避免只替换版本号和数量。\n7. **明天怎样接着做？约 10 分钟。** 列下一步找谁、处理什么、自己何时检查。再指出一种你容易犯的错误，写成“下次遇到……先……”的提醒，并说清适用条件。\n\n最后预留约 15 分钟，用下面的检查表给自己评分并修订。可以分两次完成；重点是判断清楚，不是赶在规定分钟内交卷。\n\n<details><summary>完成前五项后，再打开变化卡</summary>\n\n新增模拟信息：许先生发来 R2 版三维资料，说“数量可能改为 100 件，最终由采购确认，外观要求稍后补充”。R2 与 R1 的差异还未列出，具体收货日期和材料要求仍没有补齐。\n\n请标出至少四处需要更新或重新确认的内容。不要删除原记录后假装一开始就已知道 R2 或 100 件。\n\n</details>\n\n## 3. 参考思路与错误定位\n\n<details><summary>全部作答后展开参考</summary>\n\n**客户与能力：**公开信息和回复支持进一步了解，但我方已确认的是 S0 的铝件项目评估资源，尚未确认该不锈钢外壳能力。需要核实工厂是否匹配；若不匹配，可如实说明或另评估合适资源，不硬接。\n\n**角色与阶段：**许先生是项目工程师，陈女士负责采购，质量人员可能参与验收。当前是需求与可行性评估，不能写成订单批准。\n\n**补问：**可优先问材料要求、关键尺寸/图纸资料、准确收货日期与地点；外观要求同样重要，应请相关方说明怎样判定“不能有明显划痕”。三个问题的选择可不同，但要说明影响，不重复把未知当成已知。\n\n**交接：**初始基准为已收到的 R1；只有三维资料且关键要求不全。工厂已经说今天可以列问题，价格和交期不能确定。可以把“整理并反馈问题”作为自己的计划，不能改写成今天一定正式报价。\n\n**回应示例：**“已收到外壳资料，了解本次先评估 30 件及月底收货的期望。为确认可行性，需要补充材料要求、关键尺寸/相关图纸、外观验收口径和具体收货日期地点。我会先协调技术整理问题，价格与交期将在必要条件确认后反馈。”实际使用时按你已能做到的回复时间补充安排。\n\n**算术：**60 × 30 + 120 = 1,920 元，原合计漏了包装费；运费未计。该组数据是独立核对题，与 S8 无关联，不能给不锈钢项目报 1,920 元。\n\n**变化：**R2 差异待核实、数量 100 仍属可能且需采购确认、外观标准待补、技术/成本/交期均需评估影响。保留 R1 和 30 件的历史状态，不把“最新文件名”视为完整确认。\n\n**复盘：**例如记录“收到新材料或新版本时，不沿用旧项目的能力与报价结论”；适用范围是提醒重新核实，不能证明新项目一定不能做。\n\n</details>\n\n## 4. 评分方法\n\n每个维度四个检查点，每满足一点记 1 分，总分 20 分。先自己核对，也可以将作业交给助手或有经验的人点评。\n\n| 维度 | 四个得分点 |\n| --- | --- |\n| 客户与证据 | 事实和推测分开；指出不锈钢能力未确认；不把询盘等同订单；角色信息有依据 |\n| 需求与技术 | 资料基准明确；识别关键缺口；补问说明用途；技术任务与确认方明确 |\n| 沟通与行动 | 回应不空泛；不虚构价格交期；个人安排与他人承诺分开；有下一步检查动作 |\n| 报价核对 | 合计 1,920 正确；指出包装遗漏；标明运费未计；没有把独立算术数据用于 S8 |\n| 变化与复盘 | 识别 R2 需核对；数量可能性保留；重评影响范围完整；经验带有证据与边界 |\n\n本次练习以 **至少 16 分，且无下列关键错误** 为达标：编造已确认的加工能力；承诺未经确认的价格或交期；混用独立算术材料报价；将未确认版本和条件当成可执行生产要求。出现关键错误时，先修改相关判断，再重评。\n\n这是课程练习标准，不是职业资格或真实业务能力认证。\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 七项练习都有内容，自己能解释依据在哪里、缺什么；没有把旧铝件经验或独立算术数据套给新项目。\n- [ ] 按五个方面至少得到 16/20 分，检查后写出改了哪处、为什么；若无需修改，说明重点复核了什么。\n- [ ] 没有第 4 节列出的关键错误，并能解释自己的下一步为什么合理；参考答案措辞不同也能说明理由。\n\n## 6. 下次不看笔记再试一次\n\n隔一段时间，只读 S8，重新说出“哪项能力未知、先问哪三个问题、现在怎样回复”。再对照第一次作业，看看这次是否更能解释为什么这样做，而不只是记住参考句子。\n\n将来收到真实询盘时，从这七个问题里选当前需要处理的部分。先用真实资料核实；模拟题中能答对，只代表你已能练习这套判断方法。\n\n[上一课](L23-安排个人目标与每日动作.md) · [返回完整课程](../README.md)\n",

    "personal/course/lessons/L01-从精密制造能力到目标客户.md": "# L01 从精密制造能力到目标客户\n\n模块：M1 能力与方向｜建议：30 分钟｜前置：无｜交付物：O01 客户匹配判断\n\n学习目标：看到一家企业时，能说出“为什么可能适合我、依据是什么、还需要验证什么”。\n\n本课做到这里就够了：先判断它值不值得继续了解，不要求立刻选定行业或发送开发信。\n\n原图依据：业务开发的价值主张、资源配置；客户背景调查的行业匹配、我方定位与供应体系。辅助阅读：[速查表](../../../crm/三层理解与运用速查表.md)第 3 节。练习材料：[案例包 S0](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n打开一家公司的介绍，你最先要回答的是：它做的事情，与你能协调的制造资源有没有交集？先找“它做什么”的原话，再想可能需要什么，最后留下一个需要验证的问题。不要一开始就给它贴上“好客户”的标签。\n\n把笔记写成三句话：“我看到……”“所以我猜它可能……”“但还要确认……”。第一句是资料里能找到的事实；第二句是你的推测；第三句决定下一步查什么。推测可以有价值，只要没有写成已经发生的采购。\n\n比如“有设备研发与装配业务”能支持继续了解零件需求，却还不能证明对方会外包、正在采购或愿意换供应商。你这一课的进步，是能说清为什么值得看下去。\n\n## 2. 案例拆解\n\nS0 中，A 展示设备研发与装配，我方有可对接的小批量铝件资源，两者存在值得验证的交集。但网站没有证明 A 一定外包，也没证明当前需要铝件。\n\nB 规模较大，只看到整机代理和售后介绍。规模本身不能证明与定制零件能力匹配。可以继续调查，但当前支持“优先了解”的证据少于 A。\n\nC 有研发活动，但供应商评估要求不清楚。它也可能匹配，下一步需确认需求范围及进入条件，不能因为信息不全就断言不合适。\n\n## 3. 照着做一次\n\n拿出案例包 S0，只看 A、B、C 的介绍和我方资源。把以下内容存为 **O01 客户匹配判断**：\n\n1. 每家各写三句话：“资料里写了……”“这可能与我的……资源有关”“还需要确认……”。一共九句话即可。\n2. 圈出最想继续了解的一家，用两句话解释：它哪条信息与你的资源有关；为什么暂时排在另外两家前面。\n3. 检查自己有没有写“一定需要”“马上会下单”。有的话，回到材料找依据；找不到就改成推测或问题。\n\n用到真实工作时：打开你手边一家企业的介绍，也先写这三句话。只看到公司规模或漂亮产品图时，可以写“暂时还找不到匹配依据”，再确定要补看哪一页。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n一种够用的写法如下；先读出每行三句话的区别。\n\n| 企业 | 资料里的事实 | 我的推测 | 下一步要验证 |\n| --- | --- | --- | --- |\n| A | 展示设备研发和装配 | 可能涉及与我方铝件评估资源有关的需求 | 是否有相关外协零件需求？ |\n| B | 介绍整机代理和售后 | 可能有备件采购，但现在不能确定 | 是否自行采购定制零件？ |\n| C | 展示仪器研发和供应商评估程序 | 可能需要相关零件，也可能有我方尚未满足的要求 | 采购哪些零件，评估需要哪些条件？ |\n\n选择 A 可以这样解释：“设备研发和装配与定制零件存在值得调查的联系，我方又能协调小批量铝件评估，所以先了解 A 的外协范围。B 的定制零件采购还不明确，C 的零件类别和评估条件也需继续查。”\n\n选择 C 也可能合理，关键是能用材料解释，并留下具体问题。这只是当前练习的顺序，不是判断哪种企业普遍更容易成交。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] A、B、C 各有三句话，能分别指出资料原话、自己的推测、还要确认的问题。\n- [ ] 选出一家继续了解的企业，并能指着它的具体业务信息解释原因。\n- [ ] 没有把可能的零件需求写成现成订单；下一步问题能帮助判断是否匹配。\n\n## 6. 下次不看笔记再试一次\n\n重新看 A 的介绍，不看作业，用一分钟说出“为什么可能适合我、依据是什么、还缺什么”。再解释：即使它值得继续了解，为什么还不能说它现在要买？\n\n[课程目录](../README.md) · [下一课](L02-梳理供应资源与承诺边界.md)\n",
    "personal/course/lessons/L02-梳理供应资源与承诺边界.md": "# L02 梳理供应资源与承诺边界\n\n模块：M1 能力与方向｜建议：35 分钟｜前置：L01｜交付物：O02 能力与待确认清单\n\n学习目标：客户问“你能做什么”时，能说清自己能负责什么、合作工厂确认过什么、哪些事情要看过具体要求才能答复。\n\n本课做到这里就够了：写出一段自己敢负责的能力介绍；还没有核实的资源，可以明确记为待确认。\n\n原图依据：供应体系、技术/服务团队、资源配置、可控能力。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 4、6.5 节。材料：[S0](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n新手容易把“我认识这家工厂”写成“我们什么都能做”。先把你自己的工作和工厂的工作分开：你可以整理客户要求、核对资料、协调答复；是否能加工、怎样检验、多少钱、何时交货，要有负责人的具体答复。\n\n拿一张纸分三栏：“我能负责”“已有资料或回复支持”“还要按项目确认”。把你准备说给客户听的话逐句放进去。放不进去的，通常是含糊宣传，或者你还没核实的事情。\n\n例如，一份样件报告能让人看到那件样件查了什么、结果怎样。它不能替另一张新图纸作保证。能力介绍应让客户知道你能提供什么帮助，也让你自己知道下一步该找谁。\n\n## 2. 案例拆解\n\nS0 已确认两份资料可对外使用，也确认了工厂对接人。可以说“可提供相关匿名加工与检验案例，并就新图纸组织评估”。不能说“所有精密件都能做”“任意公差都能达到”。\n\n当客户问交期，你可以负责组织并及时反馈评估；在工厂尚未核实排产前，不能用自己的回复速度替代生产承诺。\n\n## 3. 照着做一次\n\n用 S0 完成 **O02 能力与待确认清单**：\n\n1. 按材料/零件范围、技术评估、检验、资料授权、价格、交期列六行。每行写“目前知道什么—依据在哪—还要问谁”。\n2. 用不同标记区分自己的工作、工厂已答复的事项、具体项目仍需确认的事项；没有姓名时写角色即可。\n3. 把“我们拥有完整能力，任何精密件都可快速交付”改成两三句客户能听懂的话。逐句检查是否有上面六行的支持。\n\n用到真实工作时：先查自己已有的工厂回复和获准使用的资料。没有就写“待核实”，不要把模拟工厂甲的条件当成你的真实资源。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\nS0 能支持的写法可以很简单：\n\n| 事项 | 目前能说什么 | 还要确认什么、问谁 |\n| --- | --- | --- |\n| 材料/零件范围 | 工厂愿意接收铝件小批量资料作评估 | 具体要求能否满足，问技术联系人 |\n| 技术评估 | 有技术对接人 | 本项目还缺什么、何时反馈，向技术确认 |\n| 检验 | 有对应样件报告可参考 | 新零件检验要求及能否满足，找客户相关人员和工厂确认 |\n| 资料授权 | 两份资料已获对外使用授权 | 若换成其他资料，重新确认授权 |\n| 价格 | 有报价联系人 | 具体版本和数量的方案，向报价联系人确认 |\n| 交期 | 还没有项目交期结论 | 起算条件与排产，协调工厂相关负责人确认 |\n\n能力介绍可写：“我负责整理要求、核对资料并协调答复。目前可对接小批量铝件项目评估，也有获授权的加工与检验案例供参考。具体加工要求、价格和交期要按项目确认。”\n\n自己的真实资源少于案例时，就按实际情况写。知道还没核实什么，本身就是这份清单的作用。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 六类事项都写出目前依据或要找谁核实，空缺没有被填成“没问题”。\n- [ ] 能力介绍说得出自己负责的工作，也说得出哪些结论要由工厂确认。\n- [ ] 没有把一份样件报告、一个联系人或一种设备说成所有项目都能承接的证明。\n\n## 6. 下次不看笔记再试一次\n\n客户问“这份报告很好，我的新零件也能保证一样吗？”不用“可以”或“不可以”抢答，先说你要收什么资料、找谁确认、再反馈什么。\n\n[上一课](L01-从精密制造能力到目标客户.md) · [目录](../README.md) · [下一课](L03-把能力变成客户听得懂的价值.md)\n",
    "personal/course/lessons/L03-把能力变成客户听得懂的价值.md": "# L03 把能力变成客户听得懂的价值\n\n模块：M1 能力与方向｜建议：30 分钟｜前置：L02｜交付物：O03 有依据的价值说明\n\n学习目标：介绍自己的资源时，能让对方听懂“你可能在哪件事上帮到我、拿什么说明、还需要了解什么”。\n\n本课做到这里就够了：为两类潜在客户各写一小段有针对性的介绍，先练清楚表达，不要求写出完整宣传册。\n\n原图依据：价值主张、解决客户问题、专业服务、客户原则。辅助阅读：[理解与落地手册](../../../crm/业务管理系统理解与团队落地手册.md)第 2.1 节。材料：[S0](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n“我有加工资源”只是说明你有什么。客户更容易理解的是：“如果你正在评估小批量零件，我可以帮你整理要求、协调工厂答复。”把资源放进对方可能遇到的事情里，才知道这段介绍为什么与他有关。\n\n先写客户情境，再写你能做的动作，最后写可提供的依据。还不知道客户是否有这个需要，就用“如果你们正在……”开头。这样既能提出相关帮助，也没有替客户编造需求。\n\n“质量好、服务好”太宽。试着把它换成客户看得见的事情：提供一份获授权案例、把版本问题列清、协调技术回复。说到哪一步，资料和实际能力就要支持到哪一步。\n\n## 2. 案例拆解\n\n面向有设备验证需求的潜在客户，可以表达：“若项目需要小批量铝件评估，我们可以根据图纸整理待确认项，协调工厂评估，并提供获授权的加工与检验案例供参考。”\n\n这里没有保证客户能降本多少，也没有保证比所有供应商快。它说明了具体场景、工作与可提供的证据，客户可以据此判断是否相关。\n\n## 3. 照着做一次\n\n用 S0 和 O02 完成 **O03 有依据的价值说明**：\n\n1. 给 A 写一段不超过 120 字的介绍，按“看到的业务—可能遇到的事—我能做的动作—可提供的依据”组织。\n2. 给 C 另写一段。先考虑它提到的供应商评估，把还不知道的零件类型或评估要求留成问题。\n3. 在两段里标出场景、帮助、证据和待确认条件。再写一句你原本可能使用的空泛宣传语，并说明为什么改掉。\n\n用到真实工作时：先改好你最常说的一句自我介绍。读完后问自己：对方能不能知道，具体发生哪件事时可以找我？\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n给 A 的示例：“看到贵司开展设备研发与装配。如果有小批量铝件需要评估，我可以整理图纸问题、协调工厂答复，并提供获授权的匿名加工和检验案例；具体能否满足要求需按项目确认。”\n\n给 C 的示例：“看到贵司有仪器开发和供应商评估程序。如果评估范围涉及小批量铝件，我可以先按要求准备获授权的相关案例；还需了解零件类型与评估条件，再确认是否匹配。”\n\nA 的重点是可能的零件评估，C 的重点是先了解评估要求。“任何精密件都能快速交付”既缺证据，也没说清适用情况，不能用它替代具体帮助。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] A、C 两段各不超过 120 字，区别来自业务信息，而不是只换公司名。\n- [ ] 每段都写出一个自己能做的具体动作，以及支持它的资料或待确认条件。\n- [ ] 能把一句“质量好、什么都能做”之类的宣传改成有依据、可理解的表达。\n\n## 6. 下次不看笔记再试一次\n\n有人问“你对我有什么帮助？”选 A 或 C，用三句话回答；不要只报设备、工艺名称或形容词。\n\n[上一课](L02-梳理供应资源与承诺边界.md) · [目录](../README.md) · [下一课](L04-建立目标客户画像与筛选依据.md)\n",
    "personal/course/lessons/L04-建立目标客户画像与筛选依据.md": "# L04 建立目标客户画像与筛选依据\n\n模块：M1 能力与方向｜建议：40 分钟｜前置：L01—L03｜交付物：O04 三类客户筛选与验证计划\n\n学习目标：同时看到几家企业时，能决定先了解哪家，并说出“我看中了什么、先查什么、什么新信息会让我改主意”。\n\n本课做到这里就够了：形成一版可以调整的筛选条件，不要求一次定死行业、国家或客户名单。\n\n原图依据：客户细分、行业匹配、客户价值、竞争与资源分析。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 6.2、6.4 节。材料：[S0](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n“客户画像”在这里就是：你准备优先了解什么样的企业。先用一句日常表达写出来，例如“有设备研发活动，值得进一步核实小批量零件需求的企业”。其中哪部分是已看到的，哪部分还要问清楚，要分开。\n\n筛选时看三件事：对方业务与你的资源有没有交集；现在有哪些证据；哪条未知最影响继续投入时间。没查到某条信息，可以先记为未知。只有取得不匹配的证据，才有理由据此降低优先顺序。\n\n排序是为了决定先做哪一步，并不预测谁一定成交。给你的首选加一句：“如果查到……，我就调整顺序。”这能提醒你根据新信息改判断。\n\n## 2. 案例拆解\n\n“有设备研发活动、可能存在小批量零件需求、允许评估新供应方”可作为本案例的候选画像。前两项仍需具体核实，第三项尚无信息。\n\nA 值得优先调查；B 先核对业务范围；C 先核对供应商要求。可以形成不同的验证任务，不必用没有依据的 90 分、70 分把不确定性伪装成精确结论。\n\n## 3. 照着做一次\n\n拿出 O01—O03，完成 **O04 三类客户筛选与验证计划**：\n\n1. 用不超过 150 字写出现在想先了解的企业特征。至少有一条是能从业务介绍中寻找的线索。\n2. 给 A、B、C 各写“目前放在什么位置—最想确认什么—准备到哪里找或向什么角色问”。允许把两家并列。\n3. 写一个会改变排序的具体情况，例如某家原本不明确的定制零件采购职责得到确认。\n4. 回看前三课：选的客户是否与 O02 的资源有关？O03 有没有说过头？发现冲突就在原句旁改正。\n\n用到真实工作时：每次新增一家公司，先用这几条条件判断是否值得继续查。不要为了凑名单而收进完全说不出理由的企业。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n初步筛选条件可写：“先了解有设备研发或仪器开发业务、值得核实小批量铝件需求的企业；实际外协范围、是否评估新供应方仍需确认。”\n\nA 先查外协范围，可从业务页面与合适的咨询方向继续核实；B 先查是否采购定制备件，避免只因规模大就投入大量时间；C 先查零件类别和供应商要求，可从其评估说明寻找线索。\n\n可能改变排序的信息是：“B 明确确认负责定制备件采购，范围与我的已核实资源相符。”此时值得重新比较，而不是坚持最初排序。回看 O03，若把待确认能力写成保证，就按 O02 改回有条件的表述。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 筛选条件写的是能查找的业务特征，没有把未知需求写成已确定。\n- [ ] 三家各有一条最重要的待确认问题，并写清准备怎么找答案。\n- [ ] 能举出改变排序的新信息，并检查客户选择、能力介绍和价值说明是否相互支持。\n\n## 6. 下次不看笔记再试一次\n\n假如 B 确认自己采购定制备件，你会怎样调整原先判断？说出要改变的一项判断，以及仍需核实的一项条件。\n\n[上一课](L03-把能力变成客户听得懂的价值.md) · [目录](../README.md) · [下一课](L05-选择开发渠道与寻找线索.md)\n",
    "personal/course/lessons/L05-选择开发渠道与寻找线索.md": "# L05 选择开发渠道与寻找线索\n\n模块：M2 线索与客户｜建议：35 分钟｜前置：L04｜交付物：O05 一次线索寻找方案\n\n学习目标：准备开始找客户时，能说出“我要找什么样的企业、先从哪里找、找到后看什么决定留下”。\n\n本课做到这里就够了：先设计并演练一次有目的的寻找过程，不要求收集大量名单或立即联系。\n\n原图依据：业务开发中的开发工具、开发信、电话、社媒、线下和平台。辅助阅读：[原图解读](../../PDF原图解读与文档校准.md)第 3 节。材料：[S0—S1](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n开始搜索前，先把 O04 变成一个问题：“哪里能找到做这类业务的企业？”可以从搜索结果、展会目录、行业资料或企业公开页面获得线索，但每次先选一种发现方式，再选一种核实方式，避免不停换渠道。\n\n发现企业、核实业务、找到合适联系入口，是三步不同的工作。出现在某份目录里，只说明你找到了它；要不要留下，仍要看业务介绍是否与你的资源相关。\n\n写搜索思路时，用你要找的客户业务来描述，例如“自动化设备研发与装配企业”，而不是只写“精密加工客户”。目标地区已明确时再加地区。搜索词只是起点，结果仍需逐个判断；真实平台的具体操作另按当时情况核对。\n\n## 2. 案例拆解\n\nS1 中 A 的公开业务入口可用于确认联系方向，网站资料页可用于了解业务。网站发布新设备新闻，只能形成调查线索，不能直接认定公司急需零件。\n\n二手消息说 A“肯定缺供应商”，其来源和时效未知，应放入待核实项。它可以提示一个问题，但不适合直接写进开发消息作为既定事实。\n\n## 3. 照着做一次\n\n用 O04 和 S1 演练，完成 **O05 一次线索寻找方案**：\n\n1. 写一句寻找对象，再写两种搜索表达或目录查找思路；每种说明希望看到什么类型的企业。\n2. 选一个发现入口和一个核实入口，分别写准备看什么。再指出在哪里寻找对方公开的业务联系入口。\n3. 用 A 做一条示范记录：公司、来源位置、观察日期、看到的匹配线索、还要确认的问题。案例没有真实网址和日期，直接标“模拟材料，未提供”。\n4. 写一句停止继续搜名单的条件，例如已经找到一家有具体匹配线索的企业，接下来先把它查清楚。\n\n用到真实工作时：可以先做一次短时间的小范围搜索，只留下能说清理由的线索。练习本身用 S1 即可完成，不需要联网或发送消息。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n例如，寻找对象写“有设备研发与装配业务、值得核实定制零件需求的企业”。两种寻找思路可以是“自动化设备研发装配企业”和“仪器开发企业供应商评估说明”，再判断搜到的企业是否与你的画像相符。\n\n可从搜索结果或相关目录发现企业，再到企业官网核实业务，并查看公开业务咨询入口。A 的示范记录写：公司 A；来源为 S1 模拟官网摘述；真实链接和日期未提供；有设备设计装配信息；外协范围待确认。\n\n停止无目的扩充名单的条件可以是：“找到一个有具体匹配线索、且有进一步核实入口的对象后，先完成它的背景简报。”这是一种练习安排，不是每天必须找到多少家的规定。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 寻找对象与 O04 对得上，两种搜索思路都说明了想找哪类企业。\n- [ ] 能分别指出在哪里发现公司、核实业务、寻找公开联系入口。\n- [ ] A 的记录有匹配理由和待查问题；缺失网址、日期没有编造，并知道何时转入进一步调查。\n\n## 6. 下次不看笔记再试一次\n\n你搜到一家公司和一条扩张新闻。现在先留下哪条依据、再打开哪类页面、还不能下什么结论？各说一句。\n\n[上一课](L04-建立目标客户画像与筛选依据.md) · [目录](../README.md) · [下一课](L06-做有目的的客户背景调查.md)\n",
    "personal/course/lessons/L06-做有目的的客户背景调查.md": "# L06 做有目的的客户背景调查\n\n模块：M2 线索与客户｜建议：35 分钟｜前置：L05｜交付物：O06 客户背景简报\n\n学习目标：查过一家企业后，能用一页说清“它做什么、我为什么想继续了解、哪些信息靠得住、下一步查什么”。\n\n本课做到这里就够了：让这一页帮助你作出一个下一步决定，不要求把企业所有背景查全。\n\n原图依据：官方信息、行业信息、公司信息、业务范围与客户需求。辅助阅读：[结构化需求](../../../crm/业务管理系统结构化需求.md)第 6.2 节。材料：[S1](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n客户背景调查不是把公司介绍抄一遍。你现在最需要知道的是：它做什么，这与你有什么关系，值得继续查还是先放下。每准备记一条信息，都问自己“这条信息会改变我的哪个判断？”\n\n记录时把原话和自己的解释分开，再写来源与看到的时间。官网内容可以说明企业如何介绍自己；联系人回复可以说明他这次说了什么；二手消息则需要另找依据。三者不要抄进同一栏后都变成“已证实”。\n\n遇到互相矛盾的信息，先保留两种说法与时间，再判断该向谁核实。写“暂时不知道”比补一段看起来完整的故事更能帮助下一步行动。\n\n## 2. 案例拆解\n\nA 的资料可整理为：“网站展示设备研发与装配；有新设备介绍；存在公开业务咨询入口。外协采购范围未明。”据此，初步判断是值得进一步了解。\n\n“订单多所以一定缺供应商”来自二手消息，不能成为确定需求。可以转化为更中性的验证问题：是否有外协零件需求，以及是否接受新供应资源评估。\n\n## 3. 照着做一次\n\n只用 S1，为 A 写 **O06 客户背景简报**，控制在一页：\n\n1. 用两句话说明公司做什么、为什么与你可能相关。\n2. 选三条观察到的信息，各写原意、来源类型、你据此能判断什么。材料未给日期或链接时标明未提供。\n3. 列最重要的两个未知，并选一个先核实，说明去看哪类资料或找哪个职责方向。\n4. 改写“公司有研发新闻，因此下个月一定会下单”，保留其中能被材料支持的部分。\n\n用到真实工作时：再次打开这份记录，你应能直接接着查，而不用从头重读所有页面。存网址是为了找回依据，不是为了让简报显得丰富。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\nA 的简报可先写：“企业公开介绍设备设计与装配，可能与我方协调的零件评估资源有关，值得继续核实外协范围。”\n\n三条观察可分别选：网站业务介绍、新设备研发新闻、公开业务咨询入口。来源都保留为 S1 的模拟公开信息，不补真实网址和日期。二手消息“订单多，肯定缺供应商”另列待核实，不把它改写成需求。\n\n两个重要未知可以是“是否采购相关外协零件”“是否接受新供应资源评估”。下一步先从公开业务入口确认负责方向。“有研发新闻”可以支持继续调查，不能支持“下个月一定下单”。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 一页里看得出 A 做什么、为什么值得继续了解，三条观察都标了来源。\n- [ ] 没有把“订单很多”的二手消息或研发新闻写成已经确认的采购计划。\n- [ ] 列出两个关键未知，并明确选了一个下一步调查动作及其理由。\n\n## 6. 下次不看笔记再试一次\n\n合上简报，用一分钟介绍 A。说到“我觉得它可能……”时，接着说出依据和仍需核实的地方。\n\n[上一课](L05-选择开发渠道与寻找线索.md) · [目录](../README.md) · [下一课](L07-识别联系人与采购角色.md)\n",
    "personal/course/lessons/L07-识别联系人与采购角色.md": "# L07 识别联系人与采购角色\n\n模块：M2 线索与客户｜建议：30 分钟｜前置：L06｜交付物：O07 角色与问题对应表\n\n学习目标：收到一位联系人的回复时，能分清“这件事该问他什么、哪些问题要请谁参与、哪些决定还不知道由谁拍板”。\n\n本课做到这里就够了：先理清当前这次沟通涉及的几个人，不要求画完整组织架构或马上找到最高负责人。\n\n原图依据：角色权责、关注点、决策者、影响者、使用者，以及工程和采购等岗位。辅助阅读：[信息采集问卷](../../../crm/真实客户信息采集问卷.md)第 3 节。材料：[S2](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n联系人有岗位名称，不代表他能替所有人作决定。先从这次回复里找：他自述负责什么，希望收到什么资料，哪些问题提到了其他同事。暂时没提到的批准权限，就保留未知。\n\n接下来把问题分给能回答它的角色：采购安排问负责采购的人，图纸要求请技术人员确认，检验资料请相关质量人员说明。实际分工仍以对方确认的安排为准。\n\n你可以请当前联系人帮助明确协作方式。这样能让他拿到适合本轮评估的资料，也避免自己猜流程、反复把同一个问题发给不合适的人。\n\n## 2. 案例拆解\n\nS2 中林女士自述负责机械外协采购；周工程师看技术要求；吴女士可能参与质量资料。最终批准人仍未知，不能因林女士要求发资料就认定她已经批准采购。\n\n可以向林女士确认本轮希望评估哪些内容；技术问题请她协调周工程师确认；质量资料范围有需要时再请相关人员说明。问题应对应职责，避免所有事项都问同一个人并假定其回答覆盖全部。\n\n## 3. 照着做一次\n\n读 S2 的完整回复，完成 **O07 角色与问题对应表**：\n\n1. 给林女士、周工程师、吴女士各写一行：“目前知道他/她负责什么—哪些权限还不知道”。\n2. 每人配一个适合的问题和一项准备提供的资料；没有现成资料时写“需整理”或“待取得”，不写成已经备齐。\n3. 写一句发给林女士的协作确认草稿，让她能告诉你技术和质量问题怎样对接。只写草稿。\n\n用到真实工作时：每收到新回复，先更新这一行职责。对方要求发资料时，问清本轮看什么，别直接把“愿意评估”理解成“已经批准”。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n林女士负责机械外协采购，可以问“本轮想先看哪些供应资源资料”，准备相关案例说明；周工程师看技术要求，可以请其确认关键资料，准备已知要求和问题清单；吴女士可能参与质量资料，可以在需要时确认资料范围，准备对应样件报告。三人的最终批准权限均未确定。\n\n协作消息可写：“为按本轮评估重点准备资料，想请您确认优先需要哪些内容；技术和质量问题我们应按什么方式与相关同事对接？”\n\n这里是在请林女士说明协作安排。并未假设你已经可以直接联系其他两人，也没有把索要资料理解成采购批准。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 三个人的已知职责来自 S2，最终批准权限没有凭岗位名称猜定。\n- [ ] 每人对应的问题和准备材料能帮助其处理当前职责范围内的事。\n- [ ] 协作确认消息能让林女士说明如何对接，没有把索要资料说成已经采购。\n\n## 6. 下次不看笔记再试一次\n\n周工程师说技术方案看起来可以，你还不能据此认定哪些事情已完成？说两件，并分别指出要找谁确认。\n\n[上一课](L06-做有目的的客户背景调查.md) · [目录](../README.md) · [下一课](L08-区分采购阶段与销售进度.md)\n",
    "personal/course/lessons/L08-区分采购阶段与销售进度.md": "# L08 区分采购阶段与销售进度\n\n模块：M2 线索与客户｜建议：40 分钟｜前置：L05—L07｜交付物：O08 采购阶段判断与下一步\n\n学习目标：发过资料或收到客户回复后，能说清“我做完了什么、客户正在考虑什么、下一步做哪件事才有帮助”。\n\n本课做到这里就够了：用现有回复描述进度即可，不要求给每个客户套上精确阶段标签或判断成交概率。\n\n原图依据：客户采购流程表——发现需求、内部酝酿、采购设计、评估比较、购买承诺、使用维护。辅助阅读：[原图解读](../../PDF原图解读与文档校准.md)第 3 节。材料：[S1—S2](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n“我已发资料”说明你的动作完成了；“客户决定采购”需要对方的明确依据。把这两件事分开，才能避免忙了很多天后，以为客户已经走到了你期待的位置。\n\n看客户回复时，找他正在处理的具体问题：先看供应资源、确认技术、讨论数量，还是安排内部评估？原图的采购流程可以提醒你提问，但现实中这些事情可能交叉，也可能因改图退回重评。\n\n下一步围绕尚未解决的问题来定。客户想先看案例，你先确认和准备相关资料；数量未定，就了解本轮按什么数量评估。消息发了几次，不是采购进度的证据。\n\n## 2. 案例拆解\n\n林女士要求先看案例和检验资料，说明愿意做初步评估。她同时说没有最终数量，因此不能把它写成订单确认。\n\n我方可以记录“准备并发送相关资料”；客户侧记录“供应资源/项目初步评估，具体采购阶段待进一步确认”。阶段不够明确时，允许保留这种描述，不必强塞一个精确标签。\n\n## 3. 照着做一次\n\n完成 **O08 采购阶段判断与下一步**：\n\n1. 对“要求发资料”“技术认可但数量未定”“通知内部评估日期”三种练习情形，各写四句：“我方已知动作是……”“客户可能在处理……”“仍不知道……”“下一步准备……”。\n2. 情形没有说明你已经做过的动作时，写“未提供”，把准备做的事另写为计划。\n3. 拿 O05—O07，用两分钟介绍 A：从哪得到线索、谁回复了什么、现在缺什么、为什么选这个下一步。最后回看是否把推测说成了事实。\n\n用到真实工作时：每次跟进前先补全“这条消息想帮助确认……”；答不出来，就先重新看客户上一条回复。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n“要求发资料”：客户愿意先看相关内容；我方是否已发送要看实际记录。还不知道评估结果，下一步是确认要看什么并准备资料。\n\n“技术认可但数量未定”：某项技术问题有了答复，采购条件还未完整。先明确认可的是哪个要求，再了解本轮数量如何确定。“通知内部评估日期”：知道了对方的一项安排，仍不知道结果，可按安排准备所需材料。\n\n两分钟介绍可以按“从哪里看到 A—林女士说了什么—当前还缺什么—为什么先做这一步”组织。缺失的我方动作写未提供，不能用“我已发资料”给故事补进度。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 三种情形都把自己的动作、客户正在处理的事和仍未知的内容分开。\n- [ ] 下一步能对应当前缺口，没有因为发过资料或技术认可就直接认定成交。\n- [ ] 两分钟介绍能连起线索来源、联系人回复和下一步理由，缺失信息没有补造。\n\n## 6. 下次不看笔记再试一次\n\n你已发三次资料，客户只说“会内部看一下”。现在你知道什么、还不知道什么、下一条消息准备确认什么？\n\n[上一课](L07-识别联系人与采购角色.md) · [目录](../README.md) · [下一课](L09-写清第一次接触的目的.md)\n",
    "personal/course/lessons/L09-写清第一次接触的目的.md": "# L09 写清第一次接触的目的\n\n模块：M3 沟通与需求｜建议：35 分钟｜前置：L08｜交付物：O09 首次接触消息草稿\n\n学习目标：准备第一次联系一家企业时，能写清“为什么找你、我可能帮上什么、这次只想请你回答哪一个问题”。\n\n本课做到这里就够了：先写出两条能说明来意的中文草稿，不要求立即发送，也不把拿到询盘当成本课完成条件。\n\n原图依据：开发信、建立联系、客户关注点与价值主张。辅助阅读：[原图解读](../../PDF原图解读与文档校准.md)的业务开发部分。材料：[S0—S1](../案例包.md)，本课先不用 S2 的后续回复。\n\n## 1. 先把问题想清楚\n\n打开空白消息框前，先写一句给自己看的目的：“这次我只想确认……”。例如确认外协零件由哪个职责方向评估，或确认供应商资料需要准备什么。目的越清楚，越容易删掉与这次联系无关的介绍。\n\n消息可以按四步写：看到对方哪条业务信息；这为什么与你有关；你能提供什么有依据的帮助；请对方回答一个明确问题。读完最后一句，对方应知道怎样回复，而不是面对一长串索取资料的要求。\n\n先用中文把业务意思写顺。此时尚未收到 S2 的回复，不能提前称呼已知采购负责人或假装知道对方正在做设备验证。后续真实使用，再按实际语言和渠道检查措辞。\n\n## 2. 案例拆解\n\n对 A 的草稿：“看到贵司介绍定制设备研发与装配业务，想了解相关外协零件是否由贵部门评估。我目前可协调小批量铝件项目评估，并有获授权的匿名加工与检验案例。请问贵司相关外协零件由哪个职责方向负责评估？”\n\n这条草稿只请对方回答负责方向；相关业务与案例说明是提出这个问题的理由。没有假定 A 正在缺供应商，也没有一次要求对方交出图纸、预算和全年采购量。\n\n## 3. 照着做一次\n\n只用 S0—S1 和 O02，完成 **O09 首次接触消息草稿**：\n\n1. 分别给 A、C 写一个主要目的，先不写正文。比如 A 确认负责方向，C 确认资料评估要求。\n2. 各写一条 80—150 字的中文草稿。开头说联系依据，中间说相关帮助，结尾保留一个容易回答的问题。\n3. 划出支撑能力说明的 O02 内容；找不到支持的句子先改掉。\n4. 删除或缩短一句不影响来意的话，说明删掉后对方仍能回答什么问题。两条草稿都保留在作业里，无需发送。\n\n用到真实工作时：先检查公司事实和联系对象，再读一遍最后一句。把“请给图纸、预算、全年采购量”这类多重请求拆到后续真正需要时。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\nA 的主要问题可以只问“相关外协零件由哪个职责方向负责评估”；C 可以只问“供应商资料评估需要先准备哪些内容”。前面的公司事实和能力介绍，都是为了让这一个问题有来由。\n\n删除内容时，优先找“听说你们订单很多所以急需我们”这类无依据判断，或与当前目标无关的长篇工艺清单。删掉后，对方仍知道为什么收到消息、你能提供什么和该答什么，草稿就更清楚了。\n\n如果一句话已经承担必要说明，不必为了满足字数机械删掉。可以缩短重复形容词，并说明为什么保留核心信息。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] A、C 各有一个明确目的和一条草稿，结尾能看出希望对方回答的一个问题。\n- [ ] 联系依据只用 S0—S1 已有信息，能力说明能在 O02 找到支持。\n- [ ] 能说明删掉哪句多余介绍；草稿没有一次索取完整项目条件，也没有虚构后续回复。\n\n## 6. 下次不看笔记再试一次\n\n把草稿只留最后一句：别人知道要回答什么吗？再加回必要的联系理由，看看整条消息是否仍围绕同一个目的。\n\n[上一课](L08-区分采购阶段与销售进度.md) · [目录](../README.md) · [下一课](L10-用真实资料建立专业信任.md)\n",
    "personal/course/lessons/L10-用真实资料建立专业信任.md": "# L10 用真实资料建立专业信任\n\n模块：M3 沟通与需求｜建议：30 分钟｜前置：L09｜交付物：O10 能力证明与问题回应\n\n学习目标：客户让你发资料或问“你能做好吗”时，能选出相关资料，并说清“它能说明什么、我的项目还要确认什么”。\n\n本课做到这里就够了：练会配资料、写说明和回应问题；先不用制作厚宣传册，也不要求作出加工保证。\n\n原图依据：专业形象、以文件和数据说话、遵守承诺、降低客户疑虑。辅助阅读：[速查表](../../../crm/三层理解与运用速查表.md)的业务判断问题。材料：[S0、S2](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n客户想看资料，先问自己他准备判断什么。想看相关加工经历，就找对应案例；想了解怎样检查，就找与样件对应的检验报告。两份资料回答的问题可能不同，不必把所有文件一次发过去。\n\n在每份资料旁写两句：“这能说明……”“但还不能证明……”。匿名案例可以展示案例中做过的工作；报告可以展示对应样件的检查内容。新项目能否满足要求，还要结合它自己的图纸和条件评估。\n\n可靠的说明不需要把未知藏起来。可以告诉客户已经有什么资料、还需收什么要求、会找谁确认。对外使用前也要知道资料是否获准分享；本案例 S0 已给出两份资料的授权。\n\n## 2. 案例拆解\n\n林女士想看加工和检验资料。你可先提供 S0 的授权案例及对应报告，并说明资料与本次需求的相关性和限制，再询问本轮还有哪些评估重点。\n\n“这份报告证明我们所有项目都没有质量问题”超出了材料范围；“报告展示该样件的检验项目和结果，新项目将根据图纸确认检验要求”则保留了正确边界。\n\n## 3. 照着做一次\n\n用 S0、S2 完成 **O10 能力证明与问题回应**：\n\n1. 给匿名加工案例、对应样件检验报告各写四句：“想回答客户什么问题—资料能说明什么—还说明不了什么—是否获准分享”。\n2. 写一条随资料附上的说明，点明两份资料分别用来参考什么。材料只作文字模拟，不需要伪造报告或附件。\n3. 再回应：“你们能保证所有关键要求吗？”先承接客户关心的问题，再说明需要哪些具体要求、由谁评估、将怎样反馈。\n\n用到真实工作时：发送一份资料前，先确认它对应本次客户的哪个问题。没有证据的能力，写进待评估事项，而不是补进宣传句。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n加工案例可回答“有没有相关工作可参考”；对应报告可回答“这件样件检查了什么、结果怎样记录”。两者都不能证明所有新图纸都能做。S0 已说明获准使用；你尚未看到真实附件，不能补写报告里的具体数字。\n\n随附说明可写：“以下为获授权的匿名加工案例及对应样件检验资料，供本轮评估参考。新项目仍需按具体图纸确认加工和检验要求。”\n\n保证问题可回应：“理解您关心关键要求能否落实。请提供对应图纸和要求，我会协调技术人员逐项评估，再反馈已经确认的结论和仍需澄清的内容。”这里没有把组织评估写成保证通过。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 两份资料各有明确用途，并同时说清能说明什么、不能证明什么和分享依据。\n- [ ] 随附说明能帮助客户知道先看什么，没有把匿名案例写成品牌客户背书。\n- [ ] 面对保证问题，能提出取得要求和组织评估的下一步，没有直接保证所有项目都满足。\n\n## 6. 下次不看笔记再试一次\n\n客户看完样件报告，问新零件是否也可以。用三句话答复：已有依据是什么、还缺什么、下一步怎么确认。\n\n[上一课](L09-写清第一次接触的目的.md) · [目录](../README.md) · [下一课](L11-倾听和补问真实需求.md)\n",
    "personal/course/lessons/L11-倾听和补问真实需求.md": "# L11 倾听和补问真实需求\n\n模块：M3 沟通与需求｜建议：35 分钟｜前置：L10｜交付物：O11 需求摘要与三项补问\n\n学习目标：收到一句简短询盘时，能先复述客户已经说清的内容，再问出最影响当前判断的三个问题，并说明为什么问。\n\n本课做到这里就够了：先把需求听准、问清重点，不要求一次问完所有条件或马上给出价格。\n\n原图依据：挖掘需求、仔细聆听、问题引导、项目背景与零件用途。辅助阅读：[业务员操作清单](../../../crm/业务管理系统理解与团队落地手册.md)第 3.2 节。材料：[S3](../案例包.md)，暂不读取 S4 的澄清结果。\n\n## 1. 先把问题想清楚\n\n拿到询盘先做“原话整理”，暂时不急着答。把产品、数量、要求、时间分别圈出来，再保留“可能”“最好”这类词。它们决定了这句话是确定要求、期望还是预测。\n\n然后找三种问题：没说清的，例如只写“铝”；互相冲突的，例如二维和三维版本不同；容易误解的，例如“四周内收到”从何时起算、到哪里。不要重复问材料里已经明确写出的数量。\n\n优先问什么，取决于答案会影响哪个决定。可以用“为了……，请确认……”组织问题。如果自己还不知道某项技术信息会影响什么，先请技术人员说明，不假装已经懂得全部图纸。\n\n## 2. 案例拆解\n\nS3 已知本次先看 100 件，黑色阳极氧化，希望四周内收到，可能有后续 500 件。版本冲突、材料牌号与收货条件尚未明确。\n\n“尽快回复”可能指报价时间，不等于交货期限；“可能 500 件”不等于确定批量。应保留客户原话，并把这两类时间、两种数量分别记录。\n\n## 3. 照着做一次\n\n只读 S3，先不要看 S4。完成 **O11 需求摘要与三项补问**：\n\n1. 用不超过 120 字复述询盘，保留本次 100 件、未来可能 500 件和希望四周收到之间的区别。\n2. 列三个优先问题。每个写两句：“我准备这样问……”“得到答案后，可以帮助判断……”。\n3. 再记两项后续要向客户或技术方确认的内容，不必塞进第一条消息。\n4. 对照 S3 检查：是否把未知材料写成了具体牌号？是否自己选了图纸版本？有就退回待确认。\n\n用到真实工作时：先把客户原话留下，再发出简短补问。客户答“还没定”也有用，你就知道当前不能按确定条件往下传。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n摘要示例：“客户希望先按 100 件铝支架看价格，要求黑色阳极氧化，最好四周内收到，后续可能有 500 件。收到的二维为 A、三维为 B，当前版本和具体材料要求未明确。”\n\n前三问可以这样写：“为了按同一套资料评估，请确认以哪个版本为准”；“为了核实材料条件，请说明材料牌号和状态要求”；“为了判断时间是否可行，请明确期望收货日期、地点和起算条件”。\n\n后续可继续核实关键位置的技术及检验要求、表面处理验收细节。你选择不同的优先顺序也可以，但要说清当前为什么更需要那个答案；不要把 S4 已给出的 6061-T6 倒填回本课。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 摘要没有漏掉本次数量、后续预测与收货期望之间的区别，也没使用 S4 的后续答案。\n- [ ] 三个问题都写成客户或技术人员能回答的句子，并各自解释要解决什么判断。\n- [ ] 另列两项后续核实内容；版本冲突、模糊条件没有被自己补成答案。\n\n## 6. 下次不看笔记再试一次\n\n客户说“和上次一样，尽快做”。先复述你实际知道的内容，再提出三个补问，不把“上次”直接当成本次全部条件。\n\n[上一课](L10-用真实资料建立专业信任.md) · [目录](../README.md) · [下一课](L12-把询盘整理成可推进的项目.md)\n",
    "personal/course/lessons/L12-把询盘整理成可推进的项目.md": "# L12 把询盘整理成可推进的项目\n\n模块：M3 沟通与需求｜建议：40 分钟｜前置：L09—L11｜交付物：O12 项目摘要与行动安排\n\n学习目标：面对几段聊天、几份资料时，能整理出“这是什么项目、现在卡在哪里、下一步找谁做什么”，让自己第二天能接着推进。\n\n本课做到这里就够了：先做一页能接着用的记录和三条行动，不要求填写完整系统字段，也不把询盘认定为订单。\n\n原图依据：了解项目背景、订单/项目真实性、行动计划与任务责任。辅助阅读：[信息采集问卷](../../../crm/真实客户信息采集问卷.md)、[个人客户推进卡](../../个人客户推进卡.md)。材料：[S2—S3](../案例包.md)。\n\n## 1. 先把问题想清楚\n\n聊天记录保存了发生过什么，却不一定告诉你明天做什么。把它压成一页：客户与联系人、在评估的零件、已知数量和要求、收到的资料、最影响下一步的缺口。以后先看这一页，再按需要找原记录。\n\n动作要写成能开始做的句子。“跟进客户”可以改成“把版本冲突整理成一个问题，请林女士协调确认”。再写自己的计划时间，以及做完后留下什么，例如问题草稿、已发记录或收到的回复。\n\n把“我发出问题”和“对方给出答案”分开。你能安排前者，后者要如实记录。如果还在等，就给自己留一个检查时间和未回复时的下一步，而不是把计划日期当成对方承诺。\n\n## 2. 案例拆解\n\n可以记录“设备验证用铝支架，先评估 100 件；版本和材料等条件待确认；林女士负责采购沟通，技术问题由周工程师参与”。\n\n“继续跟进”不能指导明天做什么。改成“在自行计划的时间前发出版本确认问题；到检查时间核对回复，仍未得到答案则记录并决定下一步”。计划日期需标为你的安排，而非客户承诺。\n\n## 3. 照着做一次\n\n用 S2—S3 和 O11 完成 **O12 项目摘要与行动安排**：\n\n1. 写一页摘要：客户和角色、零件与本次评估数量、已收到的资料、已知要求、关键缺口、当前在做什么。未来 500 件单独写为预测。\n2. 列三条行动，每条写“找谁—具体问/做什么—自己计划何时做—做完后留下什么”。至少一条找客户，一条找工厂或技术人员。\n3. 给一条等待答复的行动补上：“到我的检查时间仍没回复，我先……”。\n4. 回看 O09—O11，找一处容易混淆的地方并写清：比如“已发案例”不等于“项目已获批准”。\n\n用到真实工作时：每天结束前更新这一页的下一步。第二天只看行动句，就应知道先打开哪份资料、联系谁、处理哪个问题。\n\n## 4. 参考思路\n\n<details><summary>做完后展开</summary>\n\n摘要中可以写：“A 的林女士就设备验证相关铝支架询价，先按 100 件评估，后续 500 件只是可能；版本和材料待确认，技术由周工程师参与。”资料依据指向 S2—S3，而不是把它写成订单。\n\n三条行动示例：向林女士提出版本确认问题；把已知要求交技术人员请其列资料缺口；到自己安排的检查时间查看回复、更新摘要。计划时间由自己设定并注明。记录“问题已发出”，仍可同时保留“版本尚未解决”。\n\n等不到答复时，可以先检查有没有遗漏附件说明、整理可独立处理的资料，再决定后续联系。不要把“明天收到客户答案”当成自己一定能完成的动作。\n\n</details>\n\n## 5. 做到这些，就完成了本课\n\n- [ ] 只读这一页，就能说出评估什么、有哪些人参与、当前缺哪条重要信息；预测数量没有写成订单。\n- [ ] 三条行动都能直接开始做，自己的时间安排与客户或工厂的承诺分开。\n- [ ] 有未回复时的处理办法，并指出、修正了一处本模块容易混淆的判断。\n\n## 6. 下次不看笔记再试一次\n\n把“明天继续跟进”改成一条具体行动。再分别说出，什么记录能证明问题发出了，什么记录能证明问题已解决。\n\n[上一课](L11-倾听和补问真实需求.md) · [目录](../README.md) · [下一课](L13-核对图纸版本并交接技术问题.md)\n",
